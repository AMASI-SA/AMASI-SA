# REVIEW EXAMPLE ONLY. Not included by any deployment or application config.
# Place map/log_format in http context; validate nginx -t in an isolated image.
# Explicit constant groups only: never log uri/request/query/address/headers.
map $uri $phase1_route {
    default other;
    /api/live health;
    /health health;
    ~^/api/preparation-work-v1/assembly/pieces/[^/]+/ready$ ready;
    ~^/api/supplier-receiving-v1/ supplier_invoice;
    ~^/api/purchase-invoices/ supplier_invoice;
}
log_format phase1 escape=json '{"at":"$time_iso8601","route":"$phase1_route",'
    '"status":$status,"request_seconds":"$request_time",'
    '"upstream_seconds":"$upstream_response_time",'
    '"upstream_connect_seconds":"$upstream_connect_time",'
    '"upstream_header_seconds":"$upstream_header_time"}';
# Future reviewed server context example only:
# access_log /var/log/nginx/phase1.jsonl phase1 buffer=32k flush=5s;
# Do NOT enable until external bounded log shipping/rotation has been validated.
