name: Google linked campaign evidence
on:
  push:
    branches: [codex/google-cross-platform-evidence-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_linked_campaign_*.py
      - backend/integrations_control_center/campaign_product_associations.py
      - backend/snapchat_v2/committed_totals.py
      - backend/snapchat_v2/total_facts.py
      - backend/tests/test_google_linked_campaign_*.py
      - .github/workflows/google-linked-campaign-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1 cryptography==50.0.2
          python-multipart==0.0.32 PyJWT==2.15.1 bcrypt==4.1.3
          python-dotenv==1.2.4 pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable loopback replica
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name google-linked-campaign-rs -p 127.0.0.1:27477:27477 mongo:8.0.26 --port 27477 --replSet gLinkedCampaign --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-linked-campaign-rs mongosh --port 27477 --quiet --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-linked-campaign-rs mongosh --port 27477 --quiet --eval 'if(rs.initiate({_id:"gLinkedCampaign",members:[{_id:0,host:"127.0.0.1:27477"}]}).ok !== 1) quit(1)'
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-linked-campaign-rs mongosh --port 27477 --quiet --eval 'const h=db.hello(); if(h.setName !== "gLinkedCampaign" || h.isWritablePrimary !== true || !Number.isInteger(h.logicalSessionTimeoutMinutes)) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Test saved linked campaign context against replica
        env:
          GOOGLE_LINKED_CAMPAIGN_TEST_MONGO_URI: mongodb://127.0.0.1:27477/
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -Werror --junitxml=linked-campaign-results.xml backend/tests/test_google_linked_campaign_evidence.py backend/tests/test_google_linked_campaign_reader.py backend/tests/test_google_linked_campaign_routes.py backend/tests/test_google_linked_campaign_mongo.py
          python - <<'PYGATE'
          import xml.etree.ElementTree as ET
          cases=ET.parse('linked-campaign-results.xml').getroot().findall('.//testcase')
          replica=[c for c in cases if c.attrib.get('classname','').endswith('test_google_linked_campaign_mongo')]
          assert len(cases) == 40 and len(replica) == 9
          assert any(c.attrib.get('name') == 'test_actual_graph_and_committed_writers_native_bson_context' for c in replica)
          assert any(c.attrib.get('name') == 'test_actual_standalone_owner_route_saved_scope_and_revision' for c in replica)
          assert not [c for c in cases if any(c.find(x) is not None for x in ('skipped','failure','error'))]
          print('Verified',len(cases),'tests including',len(replica),'real Mongo replica tests, zero skips')
          PYGATE
      - name: Remove disposable replica
        if: always()
        run: docker rm -f google-linked-campaign-rs
