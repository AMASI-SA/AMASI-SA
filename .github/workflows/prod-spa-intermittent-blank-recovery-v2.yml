name: Production SPA Blank Screen Recovery V2

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "frontend/src/index.js"
      - "frontend/src/spaRuntimeRecovery.js"
      - "frontend/src/spaRuntimeRecovery.test.js"
      - "frontend/src/components/AppCrashBoundary.jsx"
      - "frontend/src/components/AppCrashBoundary.test.jsx"
      - ".github/workflows/prod-spa-intermittent-blank-recovery-v2.yml"

permissions:
  contents: read

jobs:
  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test crash boundary and navigation watchdog
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/spaRuntimeRecovery.test.js
          src/components/AppCrashBoundary.test.jsx
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce bounded recovery contract
        working-directory: .
        run: |
          INDEX=frontend/src/index.js
          RUNTIME=frontend/src/spaRuntimeRecovery.js
          BOUNDARY=frontend/src/components/AppCrashBoundary.jsx
          grep -q 'AppCrashBoundary' "$INDEX"
          grep -q 'installSpaRuntimeRecovery' "$INDEX"
          grep -q 'data-mezan-crash-recovery' "$BOUNDARY"
          grep -q 'RECOVERY_COOLDOWN_MS = 15 \* 60 \* 1000' "$RUNTIME"
          grep -q 'blank_application_shell' "$RUNTIME"
          grep -q 'unhandledrejection' "$RUNTIME"
          grep -q 'MutationObserver' "$RUNTIME"
          ! grep -Eq '(api|axios)\.(post|put|patch|delete)\(' "$RUNTIME" "$BOUNDARY"
