name: Production Ads Performance Chart V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "frontend/src/pages/MarketingPlatformWorkspace.jsx"
      - "frontend/src/components/marketing/AdsPerformanceExplorer.jsx"
      - "frontend/src/components/marketing/AdsPerformanceExplorer.test.jsx"
      - "frontend/src/components/marketing/ArabicDateRangePicker.jsx"
      - "frontend/src/components/marketing/ArabicDateRangePicker.test.jsx"
      - ".github/workflows/prod-ads-performance-chart-v1.yml"

permissions:
  contents: read

jobs:
  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test chart cards and Arabic date picker
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/AdsPerformanceExplorer.test.jsx
          src/components/marketing/ArabicDateRangePicker.test.jsx
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce interactive chart contract
        working-directory: .
        run: |
          WORKSPACE=frontend/src/pages/MarketingPlatformWorkspace.jsx
          CHART=frontend/src/components/marketing/AdsPerformanceExplorer.jsx
          DATE=frontend/src/components/marketing/ArabicDateRangePicker.jsx
          grep -q 'AdsPerformanceExplorer' "$WORKSPACE"
          grep -q 'ArabicDateRangePicker' "$WORKSPACE"
          grep -q 'ads-performance-metric-' "$CHART"
          grep -q 'toggleMetricVisibility' "$CHART"
          grep -q 'data-mezan-native-date' "$DATE"
          grep -q 'حفظ وتطبيق' "$DATE"
          grep -q 'آخر 7 أيام' "$DATE"
          grep -q 'sm:grid-cols-2' "$DATE"
          ! grep -Eq '(api|axios)\.(post|put|patch|delete)\(' "$CHART" "$DATE"
