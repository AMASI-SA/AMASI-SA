name: Apply Supplier Service Permanence

on:
  push:
    branches:
      - fix/supplier-invoice-service-permanence

permissions:
  contents: write

concurrency:
  group: apply-supplier-service-permanence
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone feature branch
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" workspace

      - name: Decode and apply reviewed patch
        run: |
          set -euo pipefail
          cat > /tmp/supplier_service_patch.b64 <<'PATCH_B64'
          
          PATCH_B64
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('/tmp/supplier_service_patch.b64').read_text().strip()
          content = gzip.decompress(base64.b64decode(encoded))
          target = Path('workspace/scripts/apply_supplier_invoice_service_eligibility.py')
          target.write_bytes(content)
          PY
          cd workspace
          python scripts/apply_supplier_invoice_service_eligibility.py
          rm scripts/apply_supplier_invoice_service_eligibility.py

      - name: Compile changed boundary
        working-directory: workspace
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/supplier_receiving_routes.py \
            backend/preparation_piece_operations.py \
            backend/tests/test_supplier_invoice_service_eligibility.py

      - name: Commit generated source changes
        working-directory: workspace
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/supplier_receiving_routes.py \
            backend/preparation_piece_operations.py \
            backend/tests/test_supplier_invoice_service_eligibility.py
          if git diff --cached --quiet; then
            echo "Patch already applied; nothing to commit."
            exit 0
          fi
          git commit -m "fix(receiving): keep supplier invoice services optional and permanent"
          git push origin "HEAD:${GITHUB_REF_NAME}"
