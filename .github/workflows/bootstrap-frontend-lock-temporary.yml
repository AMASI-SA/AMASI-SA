name: Temporary Frontend Lock Bootstrap

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - ".github/workflows/bootstrap-frontend-lock-temporary.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Generate lockfile
        run: yarn install --non-interactive
      - name: Commit generated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/yarn.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(frontend): add generated Yarn lockfile"
          git push origin "HEAD:\${{ github.event.pull_request.head.ref }}"
