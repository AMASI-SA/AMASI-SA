name: Apply Updated Supplier Receiving Contracts

on:
  push:
    branches:
      - fix/supplier-invoice-service-eligibility
    paths:
      - scripts/update_supplier_receiving_legacy_tests.py
      - .github/workflows/apply-supplier-receiving-test-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: backend
    steps:
      - name: Clone repair branch
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" workspace
      - name: Apply intentional contract update
        working-directory: workspace
        run: |
          python scripts/update_supplier_receiving_legacy_tests.py
          python -m py_compile backend/tests/test_supplier_receiving.py
          git diff --check
      - name: Install production fulfillment test dependencies
        working-directory: workspace
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Run supplier receiving contracts
        working-directory: workspace
        run: >-
          python -m pytest -q
          backend/tests/test_supplier_receiving.py
          backend/tests/test_supplier_invoice_service_eligibility.py
          backend/tests/test_supplier_invoice_service_candidates.py
          backend/tests/test_preparation_piece_operations.py
          --tb=short
      - name: Commit updated contract
        working-directory: workspace
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No test changes were required."
            exit 0
          fi
          git config user.name "AMASI Supplier Contract Bot"
          git config user.email "supplier-contract-bot@users.noreply.github.com"
          git add backend/tests/test_supplier_receiving.py
          git commit -m "test(receiving): align contracts with optional supplier services"
          git push origin HEAD:${GITHUB_REF_NAME}
