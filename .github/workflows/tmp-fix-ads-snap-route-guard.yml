name: Generate Fixed Ads Manager Workflow

on:
  push:
    branches:
      - fix/ads-manager-snap-route-guard-baseline
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: generate-fixed-ads-manager-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ads-manager-snap-route-guard-baseline
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate, verify, and persist result
        run: |
          set +e
          mkdir -p scripts

          python - <<'PY' >/tmp/generate.log 2>&1
          from pathlib import Path

          source_path = Path('.github/workflows/ads-manager-readonly.yml')
          target_path = Path('scripts/ads-manager-readonly.fixed.yml')
          source = source_path.read_text(encoding='utf-8')
          old = '''              current_routes = current["routes"]
              if path == "backend/snapchat_routes.py":
                  legacy_route = (
                      "Call(func=Attribute(value=Name(id='router', "
                      "ctx=Load()), attr='post', ctx=Load()), "
                      "args=[Constant(value='/sync-all-accounts')], "
                      "keywords=[])"
                  )
                  deprecated_adapter = (
                      "Call(func=Attribute(value=Name(id='router', "
                      "ctx=Load()), attr='post', ctx=Load()), "
                      "args=[Constant(value='/sync-all-accounts')], "
                      "keywords=[keyword(arg='deprecated', "
                      "value=Constant(value=True))])"
                  )
                  current_routes = sorted(
                      legacy_route if route == deprecated_adapter else route
                      for route in current_routes
                  )
              if current_routes != baseline["routes"]:
                  errors.append(f"{path}: route declarations changed")
'''
          new = '''              baseline_routes = baseline["routes"]
              current_routes = current["routes"]
              if path == "backend/snapchat_routes.py":
                  legacy_route = (
                      "Call(func=Attribute(value=Name(id='router', "
                      "ctx=Load()), attr='post', ctx=Load()), "
                      "args=[Constant(value='/sync-all-accounts')], "
                      "keywords=[])"
                  )
                  deprecated_adapter = (
                      "Call(func=Attribute(value=Name(id='router', "
                      "ctx=Load()), attr='post', ctx=Load()), "
                      "args=[Constant(value='/sync-all-accounts')], "
                      "keywords=[keyword(arg='deprecated', "
                      "value=Constant(value=True))])"
                  )
                  baseline_routes = sorted(
                      legacy_route if route == deprecated_adapter else route
                      for route in baseline_routes
                  )
                  current_routes = sorted(
                      legacy_route if route == deprecated_adapter else route
                      for route in current_routes
                  )
              if current_routes != baseline_routes:
                  errors.append(f"{path}: route declarations changed")
'''
          if source.count(old) != 1:
              raise SystemExit(
                  f'Expected one stale route-normalization block, found {source.count(old)}'
              )
          target_path.write_text(source.replace(old, new, 1), encoding='utf-8')
          print('GENERATE_OK')
          PY
          GENERATE_STATUS=$?

          VERIFY_STATUS=99
          if [ "$GENERATE_STATUS" -eq 0 ]; then
            python -m pip install --disable-pip-version-check -q PyYAML \
              >/tmp/install.log 2>&1
            INSTALL_STATUS=$?
            if [ "$INSTALL_STATUS" -eq 0 ]; then
              python - <<'PY' >/tmp/verify.log 2>&1
          from pathlib import Path
          import yaml

          path = Path('scripts/ads-manager-readonly.fixed.yml')
          source = path.read_text(encoding='utf-8')
          required = (
              'baseline_routes = baseline["routes"]',
              'current_routes = current["routes"]',
              'for route in baseline_routes',
              'for route in current_routes',
              'if current_routes != baseline_routes:',
          )
          missing = [marker for marker in required if source.count(marker) != 1]
          if missing:
              raise SystemExit(f'Symmetric guard contract missing: {missing}')
          if 'if current_routes != baseline["routes"]:' in source:
              raise SystemExit('Stale one-sided route comparison remains')

          legacy = 'route:/sync-all-accounts'
          deprecated = 'route:/sync-all-accounts:deprecated'

          def normalize(routes):
              return sorted(legacy if route == deprecated else route for route in routes)

          if normalize([legacy]) != normalize([deprecated]):
              raise SystemExit('Equivalent route adapter forms must match')
          if normalize([deprecated, 'route:/new']) == normalize([deprecated]):
              raise SystemExit('A genuine new route must remain detectable')

          payload = yaml.safe_load(source)
          if not isinstance(payload, dict) or 'jobs' not in payload:
              raise SystemExit('Invalid workflow structure')
          print('FIXED_ADS_MANAGER_WORKFLOW_OK')
          PY
              VERIFY_STATUS=$?
            else
              VERIFY_STATUS=98
            fi
          else
            INSTALL_STATUS=99
          fi

          {
            echo "GENERATE_STATUS=$GENERATE_STATUS"
            echo "INSTALL_STATUS=$INSTALL_STATUS"
            echo "VERIFY_STATUS=$VERIFY_STATUS"
            echo
            for log in generate install verify; do
              echo "=== $log ==="
              if [ -f "/tmp/$log.log" ]; then
                tail -n 100 "/tmp/$log.log"
              else
                echo "not_run"
              fi
              echo
            done
          } > scripts/tmp_ads_snap_guard_status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/tmp_ads_snap_guard_status.txt
          if [ "$GENERATE_STATUS" -eq 0 ] && [ "$VERIFY_STATUS" -eq 0 ]; then
            git add scripts/ads-manager-readonly.fixed.yml
            git commit -m 'ci: generate fixed Ads Manager workflow blob'
          else
            git commit -m 'ci: record Ads Manager guard generation failure'
          fi
          git push origin HEAD:fix/ads-manager-snap-route-guard-baseline
          exit 0
