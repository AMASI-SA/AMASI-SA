name: One-way V5 operator handoff safety (offline)
on:
  push:
    branches:
      - ops/whatsapp-oneway-v5-verified-handoff-20261128
  pull_request:
    branches:
      - ops/whatsapp-oneway-v5-isolated-rehearsal-20261128
permissions:
  contents: read
jobs:
  handoff-offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify code syntax, dedicated offline rollback and owner files guard
        run: |
          python -B -c 'from pathlib import Path; import ast; ast.parse(Path("ops/mezan_whatsapp_oneway_v5_promote_verified_artifacts.py").read_text()); print("SHA_BOUND_V5_HANDOFF_SYNTAX_PASS")'
          python -B -m unittest -v ops.test_mezan_whatsapp_oneway_v5_handoff
          echo V5_HANDOFF_OFFLINE_ROLLBACK_TESTS_PASS
