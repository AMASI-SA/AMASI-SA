name: Temporary Port Dashboard V2 Ad Fees

on:
  push:
    branches:
      - feat/prod-dashboard-v2-ad-fx-payment-fees-v2

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prod-dashboard-v2-ad-fx-payment-fees-v2
          fetch-depth: 0
      - name: Port tested files over latest Production
        run: |
          git fetch origin feat/prod-dashboard-v2-ad-fx-payment-fees-v1
          git checkout origin/feat/prod-dashboard-v2-ad-fx-payment-fees-v1 -- \
            backend/dashboard_v2_ad_costs.py \
            backend/dashboard_v2_routes.py \
            backend/tests/test_dashboard_v2_ad_account_costs.py \
            frontend/src/components/ProfitSummaryCard.jsx \
            frontend/src/components/ProfitSummaryCard.paymentFees.test.jsx \
            frontend/src/pages/Dashboard.jsx
      - name: Validate port
        run: |
          python -m py_compile \
            backend/dashboard_v2_ad_costs.py \
            backend/dashboard_v2_routes.py \
            backend/tests/test_dashboard_v2_ad_account_costs.py
          grep -q 'merge_ad_bank_fees_into_dashboard' backend/dashboard_v2_routes.py
          grep -q 'profit-line-payment-fees' frontend/src/components/ProfitSummaryCard.jsx
          test -f frontend/src/components/marketing/CampaignManagerTable.jsx
      - name: Commit port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/dashboard_v2_ad_costs.py \
            backend/dashboard_v2_routes.py \
            backend/tests/test_dashboard_v2_ad_account_costs.py \
            frontend/src/components/ProfitSummaryCard.jsx \
            frontend/src/components/ProfitSummaryCard.paymentFees.test.jsx \
            frontend/src/pages/Dashboard.jsx
          if git diff --cached --quiet; then
            echo "PORT_ALREADY_PRESENT"
            exit 0
          fi
          git commit -m "feat(dashboard-v2): apply ad FX and bank fees to profit summary"
          git push origin HEAD:feat/prod-dashboard-v2-ad-fx-payment-fees-v2
