name: Shipping Print Boundary
on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final, codex/review-completion-resumable]
    paths:
      - backend/salla_shipping.py
      - backend/fulfillment_carrier_label.py
      - backend/preparation_piece_operations.py
      - backend/tests/test_shipping_snapshot_bootstrap.py
      - backend/order_engine/shipping_label_service.py
      - backend/tests/test_shipping_print_boundary.py
      - backend/tests/test_shipping_label_current_guard.py
      - backend/operational_atomic.py
      - .github/workflows/shipping-print-boundary.yml
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      run_shipping: ${{ steps.scope.outputs.run_shipping }}
      bootstrap_required: ${{ steps.scope.outputs.bootstrap_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Classify Shipping scope at the exact PR HEAD
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          changed = set(subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", os.environ["BASE_SHA"] + "...HEAD"
          ], text=True).splitlines())
          owned = {
              "backend/salla_shipping.py",
              "backend/order_engine/shipping_label_service.py",
              "backend/fulfillment_carrier_label.py",
              "backend/preparation_piece_operations.py",
              "backend/operational_atomic.py",
              ".github/workflows/shipping-print-boundary.yml",
          }
          shipping_tests = {name for name in changed if name.startswith((
              "backend/tests/test_shipping_", "backend/tests/test_salla_current_shipping",
              "backend/tests/test_fulfillment_carrier_label"))}
          affected = bool(changed & owned or shipping_tests)
          bootstrap = bool(changed & {
              "backend/salla_shipping.py", "backend/tests/test_shipping_snapshot_bootstrap.py"
          })
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run_shipping={str(affected).lower()}\n")
              output.write(f"bootstrap_required={str(bootstrap).lower()}\n")
          print("Shipping/shared boundary or workflow affected:", affected)
          print("Snapshot bootstrap test required by changed scope:", bootstrap)
          PY
  shipping-mongo:
    needs: scope
    if: needs.scope.outputs.run_shipping == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:backend/tests
      BOOTSTRAP_REQUIRED: ${{ needs.scope.outputs.bootstrap_required }}
      BUILD37_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=mz2test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native receiving contract dependencies
        run: >-
          python -m pip install fastapi==0.141.1 pydantic==2.13.5
          pymongo==4.18.1 motor==3.7.1 pytest==9.0.3 pytest-asyncio==1.3.0
          httpx==0.28.1 openpyxl==3.1.5 bcrypt==4.1.3 PyJWT==2.15.0
          python-multipart==0.0.20 python-dotenv==1.2.3 cryptography==50.0.0
          reportlab==4.5.1 pillow==12.3.0 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 qrcode==8.2 mongomock-motor==0.0.36
      - name: Start disposable replica set
        run: |
          docker run -d --name c2-mongo -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet mz2test --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec c2-mongo mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec c2-mongo mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"mz2test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if docker exec c2-mongo mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
      - name: Shipping, replacement, concurrency and transaction regression
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          tests = [
              "backend/tests/test_shipping_print_boundary.py",
              "backend/tests/test_shipping_label_current_guard.py",
              "backend/tests/test_fulfillment_carrier_label.py",
              "backend/tests/test_salla_current_shipping.py",
              "backend/tests/test_recipient_delivery_projection.py",
              "backend/tests/test_order_engine_mapper.py",
              "backend/tests/test_order_engine_repository.py",
              "backend/tests/test_fulfillment_v2_contract.py",
              "backend/tests/test_store_courier_dispatch.py",
          ]
          bootstrap = "backend/tests/test_shipping_snapshot_bootstrap.py"
          if Path(bootstrap).is_file():
              tests.append(bootstrap)
          elif os.environ["BOOTSTRAP_REQUIRED"] == "true":
              raise SystemExit("Shipping snapshot scope changed but its required test is missing")
          else:
              print("Snapshot bootstrap test not applicable: absent at tested HEAD and its owned scope is unchanged", flush=True)
          missing = [name for name in tests if not Path(name).is_file()]
          if missing:
              raise SystemExit(f"Required Shipping regression files missing: {missing}")
          subprocess.run([sys.executable, "-m", "pytest", "--noconftest", "--asyncio-mode=auto", "-q", "-ra", *tests], check=True)
          PY
