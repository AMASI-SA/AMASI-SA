name: Assembly Direct Preparation Receipt

on:
  pull_request:
    paths:
      - "backend/preparation_piece_operations.py"
      - "backend/tests/test_assembly_direct_preparation_receipt.py"
      - ".github/workflows/assembly-direct-preparation-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Direct preparation handoff before Ready
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused backend dependencies
        run: >-
          python -m pip install
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0
          mongomock-motor==0.0.36 httpx pytest pytest-asyncio
          openpyxl cryptography reportlab python-multipart pymupdf pillow
          qrcode arabic-reshaper python-bidi PyJWT python-dotenv
      - name: Compile backend
        run: python -m py_compile preparation_piece_operations.py tests/test_assembly_direct_preparation_receipt.py
      - name: Existing preparation/assembly tests and new direct handoff
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q --tb=short
          tests/test_assembly_direct_preparation_receipt.py
          tests/test_preparation_piece_operations.py
          tests/test_preparation_receiving_custody.py
