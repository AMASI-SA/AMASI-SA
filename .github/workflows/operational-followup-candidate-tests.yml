name: Operational Follow-up Candidate Tests

on:
  push:
    branches: [fix/operational-financial-followup-20261101]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/operational-followup-candidate-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-followup-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.ref == 'refs/heads/fix/operational-financial-followup-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:backend/tests
      OPERATIONAL_TEST_MONGO_URI: mongodb://127.0.0.1:27305/?replicaSet=operationalprojection
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27305/?replicaSet=operationalprojection
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify checked-out source and whitespace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          git rev-parse HEAD > operational-followup-source-sha.txt
      - name: Install isolated test dependencies
        run: >-
          python -m pip install pytest==9.1.1 fastapi==0.142.2 pydantic==2.13.5
          httpx==0.28.1 motor==3.7.1 pymongo==4.18.2 python-multipart==0.0.32
          cryptography==50.0.0 reportlab==4.5.1 PyMuPDF==1.28.2 qrcode==8.2
          bcrypt==4.1.3 PyJWT==2.15.0 mongomock==4.3.0 mongomock-motor==0.0.36
      - name: Start this job's disposable Mongo replica set
        run: |
          set -euo pipefail
          docker run -d --name operational-followup-rs -p 127.0.0.1:27305:27305 mongo:8.0.12 --port 27305 --replSet operationalprojection --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec operational-followup-rs mongosh --port 27305 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec operational-followup-rs mongosh --port 27305 --quiet --eval 'rs.initiate({_id:"operationalprojection",members:[{_id:0,host:"127.0.0.1:27305"}]})'
          for attempt in $(seq 1 40); do
            if docker exec operational-followup-rs mongosh --port 27305 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec operational-followup-rs mongosh --port 27305 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'
      - name: Run combined operational, supplier and shipping contracts
        run: >-
          python -B -m pytest --noconftest -q backend/tests/test_operational_balance*.py
          backend/tests/test_operational_supplier_invoice_cutover.py
          backend/tests/test_dashboard_shipping_ssot.py backend/tests/test_mz2_shipping_calculator.py
          --tb=short --junitxml=operational-followup.xml
      - name: Reject missing, skipped or failed acceptance
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('operational-followup.xml').findall('.//testcase')
          assert len(cases) >= 730, 'Operational collection unexpectedly incomplete'
          assert not any(c.find(tag) is not None for c in cases for tag in ('skipped', 'failure', 'error'))
          assert len([c for c in cases if 'salary_start_mongo' in c.get('classname', '')]) == 5
          print('Verified', len(cases), 'testcases without skips, including all five real Mongo payroll acceptance cases')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-followup-results-${{ github.sha }}
          path: |
            operational-followup.xml
            operational-followup-source-sha.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove this job's disposable database container
        if: always()
        run: docker rm --force operational-followup-rs

  frontend:
    if: github.ref == 'refs/heads/fix/operational-financial-followup-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install locked test dependencies
        run: |
          corepack enable && corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
      - name: Test payroll UI with existing operational and supplier pages
        env:
          CI: 'true'
        run: >-
          node node_modules/react-scripts/bin/react-scripts.js test --watchAll=false --runInBand
          --testMatch '**/src/pages/operational/**/*.test.{js,jsx,ts,tsx}'
          '**/MezanSuppliersV2.test.jsx' '**/OperationalSupplierAccount.test.jsx'
          '**/mezanSuppliersV2.test.js' '**/SupplierPaymentWorkspace.test.jsx'
          '**/MezanV2NavigationShell.test.jsx' '**/MezanV2NavigationShell.employees.test.jsx'
          --json --outputFile=../operational-followup-frontend.json
      - name: Require new payroll cases and reject incomplete frontend acceptance
        run: |
          node - <<'JS'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('../operational-followup-frontend.json', 'utf8'));
          if (!data.success || data.numFailedTests || data.numPendingTests || data.numFailedTestSuites || data.numPendingTestSuites) throw Error('Frontend acceptance incomplete');
          for (const name of ['SalaryStart.test.jsx', 'salaryStartApi.test.js']) {
            const suite = data.testResults.find(r => r.name.endsWith('/' + name));
            if (!suite || !suite.assertionResults.length || suite.assertionResults.some(r => r.status !== 'passed')) throw Error('Payroll acceptance missing: ' + name);
          }
          console.log('Verified', data.numPassedTests, 'frontend tests in', data.numPassedTestSuites, 'suites');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-followup-frontend-${{ github.sha }}
          path: operational-followup-frontend.json
          if-no-files-found: error
          retention-days: 14

# No production environment, application startup, credentials, release build,
# financial backfill, shared workspace, lease, branch write or deployment.
