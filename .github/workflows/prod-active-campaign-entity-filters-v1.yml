name: Production Active Campaign Entity Filters V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/snapchat_active_campaign_filtering.py"
      - "backend/integrations_control_center/snapchat_account_timezone_manager.py"
      - "backend/integrations_control_center/snapchat_adsquad_performance.py"
      - "backend/integrations_control_center/snapchat_ad_performance.py"
      - "backend/tests/test_snapchat_active_campaign_entity_filters_v1.py"
      - "frontend/src/pages/MarketingPlatformWorkspace.jsx"
      - "frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx"
      - "frontend/src/components/marketing/AdSquadSortControls.jsx"
      - "frontend/src/components/marketing/AdSquadManagerTable.jsx"
      - "frontend/src/components/marketing/AdManagerTable.jsx"
      - "frontend/src/components/marketing/ActiveCampaignEntityFilters.test.jsx"
      - "frontend/src/services/marketingPerformance.js"
      - "frontend/src/services/snapchatAdSquadPerformance.js"
      - "frontend/src/services/snapchatAdPerformance.js"
      - ".github/workflows/prod-active-campaign-entity-filters-v1.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx pytest pytest-asyncio openpyxl cryptography bcrypt PyJWT
          reportlab python-multipart
      - name: Compile active Campaign filtering
        run: >-
          python -m py_compile
          integrations_control_center/snapchat_active_campaign_filtering.py
          integrations_control_center/snapchat_account_timezone_manager.py
          integrations_control_center/snapchat_adsquad_performance.py
          integrations_control_center/snapchat_ad_performance.py
      - name: Run focused Backend tests
        run: >-
          python -m pytest -q --tb=short
          tests/test_snapchat_active_campaign_entity_filters_v1.py
          tests/test_snapchat_adsquad_performance_v1.py
          tests/test_snapchat_ad_performance_v1.py
      - name: Enforce pre-pagination filtering
        working-directory: .
        run: |
          grep -q 'active_campaigns_only: bool = Query(default=True)' backend/integrations_control_center/snapchat_account_timezone_manager.py
          grep -q 'active_campaigns_only: bool = Query(default=True)' backend/integrations_control_center/snapchat_adsquad_performance.py
          grep -q 'active_campaigns_only: bool = Query(default=True)' backend/integrations_control_center/snapchat_ad_performance.py
          grep -q 'filtered_totals = aggregate_entity_rows(rows)' backend/integrations_control_center/snapchat_adsquad_performance.py
          grep -q 'filtered_totals = aggregate_entity_rows(rows)' backend/integrations_control_center/snapchat_ad_performance.py
          ! grep -Eq 'provider_write_reached.*True|campaign_write_reached.*True|accounting_write_reached.*True|qoyod_write_reached.*True' backend/integrations_control_center/snapchat_active_campaign_filtering.py

  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test active Campaign filters and sorting
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/ActiveCampaignEntityFilters.test.jsx
          src/components/marketing/AdSquadManagerTable.test.jsx
          src/components/marketing/AdManagerTable.test.jsx
          src/components/marketing/AdsEntityLevelWorkspace.test.jsx
          src/services/snapchatAdSquadPerformance.test.js
          src/services/snapchatAdPerformance.test.js
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce native filter controls
        working-directory: .
        run: |
          grep -q 'data-testid="active-campaign-filter"' frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx
          grep -q 'الأكثر طلبًا' frontend/src/components/marketing/AdSquadSortControls.jsx
          grep -q 'active_campaigns_only: activeCampaignsOnly' frontend/src/services/marketingPerformance.js
          grep -q 'sort_by: sortBy' frontend/src/services/snapchatAdSquadPerformance.js
          grep -q 'sort_by: sortBy' frontend/src/services/snapchatAdPerformance.js
