name: MZ2 Supplier Payments V2
on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/accounting_supplier_payments_v2.py
      - backend/supplier_identity_service.py
      - backend/accounting_onboarding_identities.py
      - backend/accounting_ledger_v2.py
      - backend/accounting_financial_accounts.py
      - backend/tests/test_accounting_opening_categories.py
      - backend/tests/test_accounting_onboarding.py
      - backend/mezan_supplier_management_routes.py
      - backend/tests/test_mz2_supplier*.py
      - frontend/src/components/suppliers/**
      - frontend/src/pages/MezanSuppliersV2*
      - frontend/src/services/mezanSuppliersV2*
      - .github/workflows/mz2-supplier-payments-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supplier-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=mz2test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated contract dependencies
        run: >-
          python -m pip install fastapi==0.141.1 pydantic==2.13.5
          pymongo==4.18.1 motor==3.7.1 pytest==9.0.3 pytest-asyncio==1.3.0
          mongomock-motor==0.0.36 httpx==0.28.1 openpyxl==3.1.5
          bcrypt==4.1.3 PyJWT==2.15.0 python-multipart==0.0.20
          python-dotenv==1.2.3 cryptography==50.0.0
      - name: Start synthetic Mongo replica set
        run: |
          docker run -d --name supplier-contract -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet mz2test --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec supplier-contract mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec supplier-contract mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"mz2test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if docker exec supplier-contract mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
      - name: Verify native supplier payments and identity
        run: >-
          python -m pytest -q backend/tests/test_mz2_supplier_payments_v2.py
          backend/tests/test_mz2_supplier_identity.py backend/tests/test_accounting_ledger_v2.py
          backend/tests/test_mezan_supplier_management.py
          backend/tests/test_accounting_opening_categories.py
          backend/tests/test_accounting_onboarding.py
