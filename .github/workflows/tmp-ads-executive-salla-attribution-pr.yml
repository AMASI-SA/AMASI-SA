name: Temporary Ads Executive Salla Attribution On PR

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prod-ads-executive-salla-attribution-v1
          fetch-depth: 0

      - name: Extract and apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/tmp-ads-executive-salla-attribution.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          body = []
          capture = False
          for line in lines:
              if line.strip() == "python - <<'PY'":
                  capture = True
                  continue
              if capture and line.strip() == "PY":
                  break
              if capture:
                  body.append(line[10:] if line.startswith("          ") else line)
          if not body:
              raise RuntimeError("patch body not found")

          patch = "\n".join(body) + "\n"
          correct_anchor = '''ads_anchor = \'\'\'        ads = await build_mezan_v2_ads(
            db,
            user_id,
            from_date=from_date,
            to_date=to_date,
        )
        totals = response["totals"]
\'\'\''''
          correct_replacement = '''ads_replacement = \'\'\'        ads = await build_mezan_v2_ads(
            db,
            user_id,
            from_date=from_date,
            to_date=to_date,
        )
        ads["executive_breakdown"] = build_salla_ads_executive_breakdown(
            orders,
            ads,
        )
        totals = response["totals"]
\'\'\''''
          patch, anchor_count = re.subn(
              r"ads_anchor = '''[\s\S]*?'''",
              lambda _match: correct_anchor,
              patch,
              count=1,
          )
          patch, replacement_count = re.subn(
              r"ads_replacement = '''[\s\S]*?'''",
              lambda _match: correct_replacement,
              patch,
              count=1,
          )
          if anchor_count != 1 or replacement_count != 1:
              raise RuntimeError(
                  f"could not normalize dashboard anchors: {anchor_count}/{replacement_count}"
              )
          Path("/tmp/ads_executive_patch.py").write_text(
              patch,
              encoding="utf-8",
          )
          PY
          python /tmp/ads_executive_patch.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/dashboard_v2_routes.py \
            backend/tests/test_dashboard_v2_salla_ads_executive.py \
            frontend/src/components/ProfitSummaryCard.jsx \
            frontend/src/components/ProfitSummaryCard.adsExecutive.test.jsx \
            frontend/src/pages/Dashboard.jsx
          git commit -m "feat(prod-dashboard): use Salla attribution in ads executive table"
          git push origin HEAD:feat/prod-ads-executive-salla-attribution-v1
