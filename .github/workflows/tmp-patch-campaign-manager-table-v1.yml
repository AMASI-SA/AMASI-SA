name: Temporary Campaign Manager Workspace Patch

on:
  push:
    branches:
      - feat/prod-campaign-manager-table-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prod-campaign-manager-table-v1
          fetch-depth: 0

      - name: Patch marketing workspace
        run: python scripts/patch_campaign_manager_table_v1.py

      - name: Validate integration
        run: |
          grep -q 'CampaignManagerTable' frontend/src/pages/MarketingPlatformWorkspace.jsx
          grep -q 'campaigns={data?.campaigns || \[\]}' frontend/src/pages/MarketingPlatformWorkspace.jsx
          test -f frontend/src/components/marketing/CampaignManagerTable.jsx

      - name: Commit workspace integration
        run: |
          if git diff --quiet -- frontend/src/pages/MarketingPlatformWorkspace.jsx; then
            echo "No workspace patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/MarketingPlatformWorkspace.jsx
          git commit -m "feat(marketing): use campaign manager table in platform workspace"
          git push origin HEAD:feat/prod-campaign-manager-table-v1
