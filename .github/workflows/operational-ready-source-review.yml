name: Operational Ready Source Review
on:
  push:
    branches: [integration/operational-balances-unified-20261102]
    paths: [.github/workflows/operational-ready-source-review.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 411e9cad8f6e2049e263074e794d80d052603d04
          persist-credentials: false
      - name: Export pinned source for isolated review only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 411e9cad8f6e2049e263074e794d80d052603d04
          git rev-parse HEAD > source-sha.txt
          git rev-parse HEAD^{tree} > root-tree.txt
          git ls-tree -r HEAD > source-tree.txt
          git archive --format=tar.gz HEAD > source.tar.gz
          sha256sum source.tar.gz > archive-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: operational-ready-source-411e9cad
          path: |
            source.tar.gz
            source-sha.txt
            root-tree.txt
            source-tree.txt
            archive-sha256.txt
          retention-days: 7
          if-no-files-found: error
