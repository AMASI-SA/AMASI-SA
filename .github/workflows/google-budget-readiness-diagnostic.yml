name: Google budget readiness diagnostic
on:
  push:
    branches: [codex/google-budget-diagnostic-wip-20261026]
permissions:
  contents: read
jobs:
  replica:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      GOOGLE_ADS_TEST_MONGO_URI: mongodb://127.0.0.1:27472/?replicaSet=gBudgetGuard&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1
          python-multipart==0.0.32 cryptography==50.0.2
          PyJWT==2.15.1 bcrypt==4.1.3 python-dotenv==1.2.4
          pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable loopback-only Mongo replica set
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name google-budget-guard-rs \
            -p 127.0.0.1:27472:27472 mongo:8.0.26 \
            --port 27472 --replSet gBudgetGuard --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-budget-guard-rs mongosh --port 27472 --quiet \
              --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-budget-guard-rs mongosh --port 27472 --quiet \
            --eval 'const result=rs.initiate({_id:"gBudgetGuard",members:[{_id:0,host:"127.0.0.1:27472"}]}); if(result.ok !== 1) quit(1)'
          primary=0
          for attempt in $(seq 1 60); do
            if docker exec google-budget-guard-rs mongosh --port 27472 --quiet \
              --eval 'const hello=db.hello(); if(hello.setName !== "gBudgetGuard" || hello.isWritablePrimary !== true || !Number.isInteger(hello.logicalSessionTimeoutMinutes)) quit(1)'; then
              primary=1
              break
            fi
            sleep 1
          done
          test "$primary" -eq 1
      - name: Verify snapshot diagnostics and enforce real replica tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --junitxml=/tmp/google-budget-readiness.xml \
            backend/tests/test_google_budget_readiness_diagnostic.py \
            backend/tests/test_google_budget_readiness_diagnostic_mongo.py
          python - <<'END'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/google-budget-readiness.xml').findall('.//testcase')
          replica = [c for c in cases if 'diagnostic_mongo' in c.get('classname', '')]
          assert len(cases) == 10 and len(replica) == 2
          assert not any(c.find(t) is not None for c in cases for t in ('failure', 'error', 'skipped'))
          END
      - name: Remove disposable replica
        if: always()
        run: docker rm -f google-budget-guard-rs
