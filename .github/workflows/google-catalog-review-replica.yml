name: Google catalog review replica
on:
  push:
    branches: [codex/google-catalog-review-wip-20261026]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_product_catalog_*.py
      - backend/integrations_control_center/google_ads_routes.py
      - backend/tests/test_google_product_catalog_*.py
      - .github/workflows/google-catalog-review-replica.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1 cryptography==50.0.2
          python-multipart==0.0.32 PyJWT==2.15.1 bcrypt==4.1.3
          python-dotenv==1.2.4 pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable loopback replica
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name google-catalog-rs -p 127.0.0.1:27474:27474 mongo:8.0.26 --port 27474 --replSet gCatalogTest --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-catalog-rs mongosh --port 27474 --quiet --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-catalog-rs mongosh --port 27474 --quiet --eval 'if(rs.initiate({_id:"gCatalogTest",members:[{_id:0,host:"127.0.0.1:27474"}]}).ok !== 1) quit(1)'
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-catalog-rs mongosh --port 27474 --quiet --eval 'const h=db.hello(); if(h.setName !== "gCatalogTest" || h.isWritablePrimary !== true || !Number.isInteger(h.logicalSessionTimeoutMinutes)) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Test scoped catalog read against replica
        env:
          GOOGLE_CATALOG_TEST_MONGO_URI: mongodb://127.0.0.1:27474/
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --junitxml=catalog-results.xml backend/tests/test_google_product_catalog_reader.py backend/tests/test_google_product_catalog_reader_mongo.py backend/tests/test_google_product_catalog_routes.py backend/tests/test_google_product_catalog_routes_mongo.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases=ET.parse('catalog-results.xml').getroot().findall('.//testcase')
          replica=[c for c in cases if c.attrib.get('classname','').endswith(('test_google_product_catalog_reader_mongo','test_google_product_catalog_routes_mongo'))]
          assert len(cases) >= 21 and len(replica) == 5
          assert not [c for c in cases if any(c.find(x) is not None for x in ('skipped','failure','error'))]
          print('Verified',len(cases),'tests including',len(replica),'real Mongo replica tests, zero skips')
          PY
      - name: Remove disposable replica
        if: always()
        run: docker rm -f google-catalog-rs
