name: Supplier Receiving Confirmed Direct Assignment

on:
  pull_request:
    paths:
      - "backend/supplier_receiving_routes.py"
      - "backend/supplier_receiving_direct_assignment.py"
      - "backend/supplier_receipt_employee_custody.py"
      - "backend/tests/test_supplier_receiving_direct_assignment.py"
      - ".github/workflows/supplier-receiving-direct-assignment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Confirmed supplier draft assignment and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test requirements
        run: >-
          python -m pip install
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          mongomock-motor==0.0.36
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
          PyJWT
          python-dotenv
      - name: Python syntax and import gate
        run: python -m py_compile supplier_receiving_direct_assignment.py supplier_receiving_routes.py supplier_receipt_employee_custody.py tests/test_supplier_receiving_direct_assignment.py
      - name: Direct assignment and core receiving regression
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q --tb=short
          tests/test_supplier_receiving_direct_assignment.py
          tests/test_supplier_receiving.py
