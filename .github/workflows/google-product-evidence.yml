name: Google product evidence contract
on:
  push:
    branches: [codex/google-product-evidence-wip-20261026]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_product_evidence.py
      - backend/integrations_control_center/google_commercial_plan.py
      - backend/tests/test_google_product_evidence.py
      - backend/tests/test_google_commercial_plan.py
      - backend/accounting_currency.py
      - backend/accounting_currency_codes.json
      - .github/workflows/google-product-evidence.yml
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1 cryptography==50.0.2
          python-multipart==0.0.32 PyJWT==2.15.1 bcrypt==4.1.3
          python-dotenv==1.2.4 pillow==12.3.0 openai==1.99.9
          google-ads==33.0.0 openpyxl==3.1.5
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Verify separate product evidence and commercial plan contracts
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest --noconftest -q
          backend/tests/test_google_product_evidence.py
          backend/tests/test_google_commercial_plan.py
          backend/tests/test_accounting_currency.py
      - name: Check whitespace
        run: git diff --check
