name: Google funded preparation internal auth replica
on:
  push:
    branches: [codex/google-funded-preparation-producer-wip-20261030]
    paths:
      - backend/integrations_control_center/google_ads_funded_creation_preparation.py
      - backend/integrations_control_center/google_ads_automation_budget_guard.py
      - backend/integrations_control_center/google_ads_funded_creation_authority.py
      - backend/integrations_control_center/google_ads_funded_creation_grants.py
      - backend/tests/test_google_ads_funded_creation_preparation.py
      - backend/tests/test_google_ads_funded_creation_preparation_mongo.py
      - .github/workflows/google-funded-preparation-producer.yml
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_ads_funded_creation_preparation.py
      - backend/integrations_control_center/google_ads_automation_budget_guard.py
      - backend/integrations_control_center/google_ads_funded_creation_authority.py
      - backend/integrations_control_center/google_ads_funded_creation_grants.py
      - backend/tests/test_google_ads_funded_creation_preparation.py
      - backend/tests/test_google_ads_funded_creation_preparation_mongo.py
      - .github/workflows/google-funded-preparation-producer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-replica:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      GOOGLE_FUNDED_PREPARATION_TEST_MONGO_URI: mongodb://127.0.0.1:27476/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused compatible dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1
          python-multipart==0.0.32 cryptography==50.0.2
          PyJWT==2.15.1 bcrypt==4.1.3 python-dotenv==1.2.4
          pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start own authenticated loopback replica with TEST ONLY credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name funded-preparation-test-rs -p 127.0.0.1:27476:27476 \
            --entrypoint bash mongo:8.0.26 -lc \
            'printf testOnlyReplicaKeyFileForFundedPreparation1234567890 > /tmp/funded-test-key; chmod 400 /tmp/funded-test-key; exec mongod --port 27476 --replSet fundedPreparation --bind_ip_all --auth --keyFile /tmp/funded-test-key --setParameter enableTestCommands=1'
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec funded-preparation-test-rs mongosh --port 27476 --quiet --eval 'if(db.adminCommand({ping:1}).ok!==1)quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec funded-preparation-test-rs mongosh --port 27476 --quiet --eval 'const r=rs.initiate({_id:"fundedPreparation",members:[{_id:0,host:"127.0.0.1:27476"}]});if(r.ok!==1)quit(1)'
          primary=0
          for attempt in $(seq 1 60); do
            if docker exec funded-preparation-test-rs mongosh --port 27476 --quiet --eval 'if(db.hello().isWritablePrimary!==true)quit(1)'; then primary=1; break; fi
            sleep 1
          done
          test "$primary" -eq 1
          docker exec funded-preparation-test-rs mongosh --port 27476 --quiet --eval 'db.getSiblingDB("admin").createUser({user:"funded_test_root",pwd:"DisposablePreparationTestsOnly123",roles:["root"]})'
      - name: Run actual internal helper units and authenticated replica acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/funded-preparation-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/funded-preparation-proof/source-sha.txt"
          python -m pytest --noconftest -p no:cacheprovider -q -s --durations=5 -W error --tb=short \
            backend/tests/test_google_ads_funded_creation_preparation.py \
            backend/tests/test_google_ads_funded_creation_preparation_mongo.py \
            --junitxml="$RUNNER_TEMP/funded-preparation-proof/junit.xml"
      - name: Reject missing units, replica cases, errors or skipped evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          output=Path(os.environ['RUNNER_TEMP'])/'funded-preparation-proof'
          cases=list(ET.parse(output/'junit.xml').getroot().iter('testcase'))
          unit=[c for c in cases if c.get('classname','').endswith('test_google_ads_funded_creation_preparation')]
          mongo=[c for c in cases if c.get('classname','').endswith('test_google_ads_funded_creation_preparation_mongo')]
          bad=[c for c in cases if any(c.find(t) is not None for t in ('failure','error','skipped'))]
          proof={'source_sha':(output/'source-sha.txt').read_text().strip(),'new_units':len(unit),'authenticated_replica_tests':len(mongo),'failure_error_skip':len(bad),'provider_paid_writes':0,'production_changed':False}
          (output/'summary.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          assert len(unit)==34 and len(mongo)==15
          assert not bad
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funded-preparation-auth-proof
          path: ${{ runner.temp }}/funded-preparation-proof
      - name: Remove only own disposable replica
        if: always()
        run: docker rm -f funded-preparation-test-rs || true
