name: Patch app manager mobile permission management

on:
  push:
    branches:
      - fix/app-manager-mobile-permission-management

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-manager-mobile-permission-management
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch manager authorization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/employees_v2_routes.py')
          s = p.read_text()
          old = '''    MOBILE_APP_CLIENT,\n'''
          if '    MOBILE_APP_MANAGER,\n' not in s:
              s = s.replace(old, old + '    MOBILE_APP_MANAGER,\n', 1)

          old_get = '''    @router.get("/management")\n    async def management_workspace(\n        user: dict = Depends(current_user),\n    ) -> dict[str, Any]:\n        _require_owner(user)\n        return await _employee_management_response(\n            db,\n            owner_id=_text(user.get("id")),\n        )\n'''
          new_get = '''    @router.get("/management")\n    async def management_workspace(\n        user: dict = Depends(current_user),\n    ) -> dict[str, Any]:\n        role = _text(user.get("role")).casefold()\n        is_owner = role == "owner" or user.get("is_owner") is True\n        if is_owner:\n            owner_id = _text(user.get("id"))\n        else:\n            if user.get("_session_client") != MOBILE_APP_CLIENT:\n                raise HTTPException(status_code=403, detail={"code": "owner_required"})\n            actor_access = await mobile_app_access_for_user(db, user)\n            if MOBILE_APP_MANAGER not in set(actor_access.get("permissions") or []):\n                raise HTTPException(status_code=403, detail={"code": "mobile_app_manager_required"})\n            owner_id = _text(user.get("created_by"))\n        if not owner_id:\n            raise HTTPException(status_code=403, detail={"code": "mobile_app_owner_scope_required"})\n        return await _employee_management_response(db, owner_id=owner_id)\n'''
          if old_get not in s:
              raise SystemExit('management workspace block not found')
          s = s.replace(old_get, new_get, 1)

          marker = '''    @router.put("/management/employees/{employee_id}/mobile-app-permissions")\n    async def assign_employee_mobile_app_permissions(\n        employee_id: str,\n        payload: dict[str, Any] = Body(...),\n        user: dict = Depends(current_user),\n    ) -> dict[str, Any]:\n        _require_owner(user)\n'''
          replacement = '''    @router.put("/management/employees/{employee_id}/mobile-app-permissions")\n    async def assign_employee_mobile_app_permissions(\n        employee_id: str,\n        payload: dict[str, Any] = Body(...),\n        user: dict = Depends(current_user),\n    ) -> dict[str, Any]:\n        role = _text(user.get("role")).casefold()\n        is_owner = role == "owner" or user.get("is_owner") is True\n        actor_is_app_manager = False\n        if not is_owner:\n            if user.get("_session_client") != MOBILE_APP_CLIENT:\n                raise HTTPException(status_code=403, detail={"code": "owner_required"})\n            actor_access = await mobile_app_access_for_user(db, user)\n            actor_is_app_manager = MOBILE_APP_MANAGER in set(actor_access.get("permissions") or [])\n            if not actor_is_app_manager:\n                raise HTTPException(status_code=403, detail={"code": "mobile_app_manager_required"})\n'''
          if marker not in s:
              raise SystemExit('permission route marker not found')
          s = s.replace(marker, replacement, 1)

          old_owner = '        owner_id = _text(user.get("id"))\n        employee = _require_managed_employee(await db[EMPLOYEES].find_one(\n'
          new_owner = '        owner_id = _text(user.get("id")) if is_owner else _text(user.get("created_by"))\n        employee = _require_managed_employee(await db[EMPLOYEES].find_one(\n'
          route_start = s.index('@router.put("/management/employees/{employee_id}/mobile-app-permissions")')
          route_end = s.index('@router.put("/management/employees/{employee_id}/role")', route_start)
          part = s[route_start:route_end]
          if old_owner not in part:
              raise SystemExit('owner id line not found in permission route')
          part = part.replace(old_owner, new_owner, 1)

          old_validate = '''        try:\n            selected_permissions = validate_mobile_app_permissions(\n                payload.get("permissions")\n            )\n        except ValueError as exc:\n'''
          new_validate = '''        try:\n            selected_permissions = validate_mobile_app_permissions(\n                payload.get("permissions")\n            )\n        except ValueError as exc:\n'''
          # insert manager restrictions immediately after validation exception block
          needle = '''            ) from exc\n\n        before = await find_mobile_app_access(\n'''
          insert = '''            ) from exc\n\n        before = await find_mobile_app_access(\n            db,\n            owner_user_id=owner_id,\n            user_id=account_id,\n        )\n        if actor_is_app_manager:\n            if MOBILE_APP_MANAGER in set(selected_permissions):\n                raise HTTPException(\n                    status_code=403,\n                    detail={"code": "mobile_app_manager_grant_requires_owner_console"},\n                )\n            if MOBILE_APP_MANAGER in set((before or {}).get("permissions") or []):\n                raise HTTPException(\n                    status_code=403,\n                    detail={"code": "mobile_app_manager_changes_require_owner_console"},\n                )\n\n        before = await find_mobile_app_access(\n'''
          if needle not in part:
              raise SystemExit('before access insertion point not found')
          part = part.replace(needle, insert, 1)
          # remove duplicated first lookup introduced by insertion
          duplicate = '''        before = await find_mobile_app_access(\n            db,\n            owner_user_id=owner_id,\n            user_id=account_id,\n        )\n        now = _now()\n'''
          first = part.find(duplicate)
          second = part.find(duplicate, first + 1) if first >= 0 else -1
          if second >= 0:
              part = part[:second] + '        now = _now()\n' + part[second + len(duplicate):]
          s = s[:route_start] + part + s[route_end:]
          p.write_text(s)
          PY
      - name: Compile patched backend
        run: python -m py_compile backend/mobile_app_permissions.py backend/employees_v2_routes.py
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/patch-app-manager-mobile-permissions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/employees_v2_routes.py
          git commit -m "feat: let AMASI app managers administer app permissions"
          git push origin HEAD:fix/app-manager-mobile-permission-management
