name: Held products history contracts
on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - 'backend/held_products_history.py'
      - 'backend/fulfillment_experiment_routes.py'
      - 'backend/order_tracking_notes_routes.py'
      - 'backend/tests/test_held_products_history.py'
      - 'backend/tests/test_order_tracking_revision_hold.py'
      - '.github/workflows/held-products-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          pymongo==4.18.2 motor==3.7.1 httpx==0.28.1
          mongomock-motor==0.0.36 pytest pytest-asyncio python-multipart
          openpyxl python-dotenv cryptography requests PyJWT reportlab pillow
          qrcode arabic-reshaper python-bidi pymupdf
      - name: Verify stop history and existing stop lifecycle
        env:
          PYTHONPATH: backend:backend/tests
        run: >-
          python -m pytest -q backend/tests/test_held_products_history.py
          backend/tests/test_order_tracking_revision_hold.py
          backend/tests/test_fulfillment_experiment_routes.py
          backend/tests/test_order_tracking_notes.py
