name: P02 disposable offline test tools

on:
  push:
    branches: [chatgpt/mz2-p02-shipping-cod-ledger-20260921]
    paths: [.github/workflows/mz2-p02-source-inspection.yml]
permissions:
  contents: read
jobs:
  test-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download public pinned test dependencies, no application or runtime data
        run: |
          mkdir -p /tmp/p02-test-tools/wheels /tmp/p02-test-tools/mongo
          python -m pip download --only-binary=:all: --dest /tmp/p02-test-tools/wheels \
            mongomock-motor==0.0.36 pymongo==4.18.1 \
            fastapi==0.141.1 pydantic==2.13.5 httpx==0.28.1 \
            bcrypt==4.1.3 PyJWT==2.13.0 openpyxl==3.1.5 \
            python-multipart==0.0.20 python-dotenv==1.2.3 \
            cryptography==50.0.0 pytest==9.0.3 pytest-asyncio email-validator
          curl --fail --show-error --silent --location --retry 2 \
            https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-8.0.12.tgz \
            --output /tmp/mongo.tgz
          tar -xzf /tmp/mongo.tgz --strip-components=1 -C /tmp/p02-test-tools/mongo
          cd /tmp/p02-test-tools
          find . -type f -exec sha256sum '{}' + > /tmp/P02-TOOLS-SHA256.txt
          cp /tmp/P02-TOOLS-SHA256.txt .
          tar -czf /tmp/p02-test-tools.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: p02-disposable-test-tools
          path: /tmp/p02-test-tools.tgz
          retention-days: 1
          if-no-files-found: error
