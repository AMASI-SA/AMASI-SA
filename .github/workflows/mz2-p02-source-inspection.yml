name: P02 disposable offline test tools

on:
  push:
    branches: [chatgpt/mz2-p02-shipping-cod-ledger-20260921]
    paths: [.github/workflows/mz2-p02-source-inspection.yml]
permissions:
  contents: read
jobs:
  test-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Download public test dependencies only, no application or runtime data
        run: |
          mkdir -p /tmp/p02-runtime-tools/wheels /tmp/p02-runtime-tools/js
          python -m pip download --only-binary=:all: --dest /tmp/p02-runtime-tools/wheels \
            mongomock-motor==0.0.36 pymongo==4.18.1 \
            fastapi==0.141.1 pydantic==2.13.5 httpx==0.28.1 \
            bcrypt==4.1.3 PyJWT==2.13.0 openpyxl==3.1.5 \
            python-multipart==0.0.20 python-dotenv==1.2.3 \
            cryptography==50.0.0 pytest==9.0.3 pytest-asyncio email-validator
          npm install --ignore-scripts --package-lock=false --prefix /tmp/p02-runtime-tools/js \
            react@19.0.0 react-dom@19.0.0 sonner@2.0.3 @phosphor-icons/react@2.1.10 \
            jest@27.5.1 babel-jest@27.5.1 @babel/core@7 @babel/preset-env@7 @babel/preset-react@7
          cd /tmp/p02-runtime-tools
          find . -type f -exec sha256sum '{}' + > /tmp/P02-RUNTIME-TOOLS-SHA256.txt
          cp /tmp/P02-RUNTIME-TOOLS-SHA256.txt .
          tar -czf /tmp/p02-runtime-tools.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: p02-runtime-test-tools
          path: /tmp/p02-runtime-tools.tgz
          retention-days: 1
          if-no-files-found: error
