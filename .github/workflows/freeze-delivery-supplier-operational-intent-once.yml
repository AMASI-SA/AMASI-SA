name: Freeze courier supplier operational reviewed intent once

on:
  push:
    branches:
      - automation/freeze-delivery-supplier-operational-intent-20260930

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source A
        uses: actions/checkout@v4
        with:
          ref: integration/delivery-supplier-operational-reviewed-b-20260930
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b0466515ed5827dfc78b483c9ec3fa9d7c37f81b"
          test "$(git rev-parse HEAD^{tree})" = "a983a65c560ad228f9fa134eb275f41009ae8bde"
          test -z "$(git status --short)"

      - name: Download exact Source-A reviewed intent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intent"
          gh run download 36752730735             --repo AMASI-SA/AMASI-SA             --name release-v5-reviewed-intent-candidate             --dir "$RUNNER_TEMP/intent"
          test -s "$RUNNER_TEMP/intent/release-intent-v5.json"
          echo "4cc2b7ed1225396354a89775217304d0a93943290d7bd3b0b078caa400013931  $RUNNER_TEMP/intent/release-intent-v5.json" | sha256sum -c -

      - name: Validate exact provenance
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/intent/release-intent-v5.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["schema_version"] == 2
          assert p["protocol_version"] == 5
          assert p["source_git_sha"] == "b0466515ed5827dfc78b483c9ec3fa9d7c37f81b"
          assert p["source_base_git_sha"] == "728730366cfee6c906172c7c14a2a67251ed1065"
          assert p["branch"] == "hotfix/prod-snap-meta-final"
          assert p["runtime_identity"]["release_id"] == "rg5-d0193742f50c60900eb02c87d789773b4410932834e0a055ac887c5027840bfb"
          PY

      - name: Commit intent-only reviewed B
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/intent/release-intent-v5.json" release/release-intent-v5.json
          test "$(git diff --name-only)" = "release/release-intent-v5.json"
          git diff --quiet b0466515ed5827dfc78b483c9ec3fa9d7c37f81b -- . ':(exclude)release/release-intent-v5.json'
          ! git diff --quiet b0466515ed5827dfc78b483c9ec3fa9d7c37f81b -- release/release-intent-v5.json
          git config user.name "ChatGPT Release Integrator"
          git config user.email "noreply@openai.com"
          git add release/release-intent-v5.json
          git commit -m "chore(release): freeze courier supplier operational intent"
          test "$(git rev-parse HEAD^)" = "b0466515ed5827dfc78b483c9ec3fa9d7c37f81b"
          test "$(git diff --name-only HEAD^ HEAD)" = "release/release-intent-v5.json"
          git diff --quiet HEAD^ HEAD -- . ':(exclude)release/release-intent-v5.json'
          git push origin HEAD:integration/delivery-supplier-operational-reviewed-b-20260930
