name: Finalize Mezan AI incomplete-response hotfix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/finalize-mezan-ai-hotfix.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/mezan-ai-incomplete-response'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mezan-ai-incomplete-response
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Repair regression test expectations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_ai_analysis_routes.py")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "from fastapi import FastAPI\n",
                  "from fastapi import FastAPI, HTTPException\n",
              ),
              (
                  'assert fake.responses.kwargs["max_output_tokens"] == 1200',
                  'assert fake.responses.kwargs["max_output_tokens"] == 2400',
              ),
              (
                  '    assert "نتيجة غير صالحة" in response.json()["detail"]\n',
                  '    detail = response.json()["detail"]\n'
                  '    assert detail["code"] == "ai_analysis_schema_invalid"\n'
                  '    assert "لا تطابق عقد ميزان" in detail["message"]\n',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"Expected test block not found: {old!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          Path(".github/workflows/finalize-mezan-ai-hotfix.yml").unlink()
          PY

          python -m py_compile \
            backend/ai_analysis_routes.py \
            backend/tests/test_ai_analysis_routes.py \
            backend/tests/test_ai_analysis_async_routes.py
          git diff --check
      - name: Install targeted test dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          httpx==0.28.1
          motor==3.3.1
          openai==1.99.9
          openpyxl==3.1.5
          pydantic==2.13.4
          pymongo==4.5.0
          pytest==9.0.3
          pytest-asyncio
      - name: Run analyzer regression suite
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_ai_analysis_routes.py
          tests/test_ai_analysis_async_routes.py
          -q
          --tb=short
      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ai): validate incomplete-response handling"
          git push origin HEAD:fix/mezan-ai-incomplete-response
