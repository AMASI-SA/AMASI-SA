name: Supplier cost report performance
on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/supplier_invoice_reporting_costs.py
      - backend/accounting_ledger_v2.py
      - backend/preparation_piece_operations.py
      - backend/supplier_receiving_routes.py
      - backend/server.py
      - backend/dashboard_v2_routes.py
      - backend/sold_products_report_v2.py
      - backend/operational_balance_sources.py
      - backend/supplier_native_invoice_v2.py
      - backend/tests/test_supplier_invoice_report_performance.py
      - backend/tests/test_supplier_invoice_reporting_indexes.py
      - backend/tests/test_supplier_invoice_reporting_reuse.py
      - scripts/testing/supplier_cost_reporting/**
      - .github/workflows/supplier-cost-report-performance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-heavy-monthly-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend:backend/tests
      PYTHONDONTWRITEBYTECODE: '1'
      MEZAN_CGROUP_ROOT: /nonexistent-mezan-test-cgroup
      SUPPLIER_REPORT_PERF_MONGO_URI: mongodb://127.0.0.1:27018/?directConnection=true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact report contract dependencies
        run: >-
          python -m pip install fastapi==0.141.1 pydantic==2.13.5
          pymongo==4.18.1 motor==3.7.1 pytest==9.0.3 pytest-asyncio==1.3.0
          httpx==0.28.1 openpyxl==3.1.5 bcrypt==4.1.3 PyJWT==2.15.0
          python-multipart==0.0.20 python-dotenv==1.2.3 cryptography==50.0.0
          reportlab==4.5.1 pillow==12.3.0 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 qrcode==8.2 mongomock-motor==0.0.36
      - name: Check synthetic oracle and index contracts
        run: >-
          python -B -m pytest -q
          backend/tests/test_supplier_invoice_report_performance.py
          backend/tests/test_supplier_invoice_reporting_indexes.py
          backend/tests/test_supplier_invoice_reporting_reuse.py
      - name: Start disposable loopback Mongo
        run: |
          docker run -d --name supplier-report-mongo -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --bind_ip_all
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec supplier-report-mongo mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Compare monthly and two-month received-invoice reports
        run: >-
          python -B scripts/testing/supplier_cost_reporting/benchmark.py
          --orders 6000 --history 6000 --repeats 5
          --output artifacts/supplier-report-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-report-performance-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/supplier-report-performance.json
          if-no-files-found: error
      - name: Stop disposable Mongo
        if: always()
        run: docker rm -f supplier-report-mongo || true
