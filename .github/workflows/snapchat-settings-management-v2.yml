name: Snapchat Settings Management V2

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: snapchat-settings-management-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope-guard:
    name: Fail-closed settings and multi-account scope guard
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject changes outside the approved settings and multi-account surfaces
        id: scope
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PULL_REQUEST_BASE_SHA:-}" || -z "${PULL_REQUEST_HEAD_SHA:-}" ]]; then
            echo "::error::Pull-request base and head SHAs are required for the fail-closed scope check."
            exit 1
          fi

          if ! git cat-file -e "${PULL_REQUEST_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${PULL_REQUEST_BASE_SHA}"
          fi
          if ! git cat-file -e "${PULL_REQUEST_HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${PULL_REQUEST_HEAD_SHA}"
          fi

          changed_paths_nul="${RUNNER_TEMP}/snapchat-settings-changed-paths.nul"
          changed_paths_file="${RUNNER_TEMP}/snapchat-settings-changed-paths.txt"
          git diff --name-only -z --no-renames --diff-filter=ACDMRT \
            "${PULL_REQUEST_BASE_SHA}...${PULL_REQUEST_HEAD_SHA}" > "${changed_paths_nul}"
          mapfile -d '' -t changed_paths < "${changed_paths_nul}"
          printf '%s\n' "${changed_paths[@]}" > "${changed_paths_file}"

          if [[ "${#changed_paths[@]}" -eq 0 ]]; then
            echo "::error::The pull request has no changed paths to validate."
            exit 1
          fi

          owned_changed=false
          for changed_path in "${changed_paths[@]}"; do
            case "${changed_path}" in
              backend/integrations_control_center/snapchat_entity_settings.py|\
              backend/integrations_control_center/snapchat_campaign_management.py|\
              backend/integrations_control_center/snapchat_campaign_publication.py|\
              backend/tests/test_snapchat_campaign_publication.py|\
              frontend/src/components/marketing/SnapchatCampaignPublicationPanel.jsx|\
              frontend/src/components/marketing/SnapchatCampaignPublicationPanel.test.jsx|\
              frontend/src/services/snapchatCampaignPublication.js|\
              frontend/src/services/snapchatCampaignPublication.test.js|\
              .github/workflows/snapchat-campaign-publication.yml|\
              docs/operations/SNAP-COMPLETION-20261025/PUBLICATION.md|\
              backend/integrations_control_center/snapchat_media_upload.py|\
              backend/integrations_control_center/snapchat_readiness_provenance.py|\
              backend/tests/test_snapchat_readiness_provenance.py|\
              .github/workflows/snapchat-readiness-provenance-v1.yml|\
              backend/integrations_control_center/__init__.py|\
              backend/tests/test_snapchat_media_upload.py|\
              frontend/src/components/marketing/SnapchatMediaUploadPanel.jsx|\
              frontend/src/components/marketing/SnapchatMediaUploadPanel.test.jsx|\
              frontend/src/services/snapchatMediaUpload.js|\
              frontend/src/services/snapchatMediaUpload.test.js|\
              docs/operations/SNAP-COMPLETION-20261025/MEDIA-UPLOAD.md|\
              docs/operations/SNAP-COMPLETION-20261025/MEDIA-RECOVERY.md|\
              docs/operations/SNAP-COMPLETION-20261025/PROVENANCE.md|\
              backend/tests/test_snapchat_entity_settings_v1.py|\
              backend/tests/test_snapchat_campaign_management_v1.py|\
              backend/tests/test_snapchat_management_execution_hardening_v1.py|\
              backend/tests/test_snapchat_management_safety_regressions_v1.py|\
              frontend/src/pages/SnapchatV2Page.jsx|\
              frontend/src/pages/SnapchatV2Page.test.jsx|\
              frontend/src/components/marketing/MarketingDecisionReadiness.jsx|\
              frontend/src/components/marketing/SnapchatDecisionReadiness.jsx|\
              frontend/src/components/marketing/SnapchatDecisionReadiness.test.jsx|\
              frontend/src/components/marketing/SnapchatCampaignManagementPanel.jsx|\
              frontend/src/components/marketing/SnapchatCampaignManagementPanel.test.jsx|\
              frontend/src/components/marketing/SnapchatEntitySettingsTable.jsx|\
              frontend/src/components/marketing/SnapchatInlineSettings.jsx|\
              frontend/src/components/marketing/SnapchatInlineSettings.test.jsx|\
              frontend/src/components/marketing/UnifiedMarketingEntityTable.jsx|\
              frontend/src/components/marketing/UnifiedMarketingEntityTable.test.jsx|\
              frontend/src/components/marketing/SnapchatEntitySettingsTable.test.jsx|\
              frontend/src/services/snapchatCampaignManagement.js|\
              frontend/src/services/snapchatCampaignManagement.test.js|\
              .github/workflows/snapchat-settings-management-v2.yml)
                owned_changed=true
                ;;
            esac
          done

          if [[ "${owned_changed}" != "true" ]]; then
            echo "run_tests=false" >> "${GITHUB_OUTPUT}"
            echo "No Snapchat settings-management files changed; this dedicated suite is not applicable."
            exit 0
          fi

          rejected=0
          for changed_path in "${changed_paths[@]}"; do
            case "${changed_path}" in
              backend/integrations_control_center/snapchat_entity_settings.py|\
              backend/integrations_control_center/snapchat_campaign_management.py|\
              backend/integrations_control_center/snapchat_campaign_publication.py|\
              backend/tests/test_snapchat_campaign_publication.py|\
              frontend/src/components/marketing/SnapchatCampaignPublicationPanel.jsx|\
              frontend/src/components/marketing/SnapchatCampaignPublicationPanel.test.jsx|\
              frontend/src/services/snapchatCampaignPublication.js|\
              frontend/src/services/snapchatCampaignPublication.test.js|\
              .github/workflows/snapchat-campaign-publication.yml|\
              docs/operations/SNAP-COMPLETION-20261025/PUBLICATION.md|\
              backend/integrations_control_center/snapchat_media_upload.py|\
              backend/integrations_control_center/snapchat_readiness_provenance.py|\
              backend/tests/test_snapchat_readiness_provenance.py|\
              .github/workflows/snapchat-readiness-provenance-v1.yml|\
              backend/integrations_control_center/__init__.py|\
              backend/tests/test_snapchat_media_upload.py|\
              frontend/src/components/marketing/SnapchatMediaUploadPanel.jsx|\
              frontend/src/components/marketing/SnapchatMediaUploadPanel.test.jsx|\
              frontend/src/services/snapchatMediaUpload.js|\
              frontend/src/services/snapchatMediaUpload.test.js|\
              docs/operations/SNAP-COMPLETION-20261025/MEDIA-UPLOAD.md|\
              docs/operations/SNAP-COMPLETION-20261025/MEDIA-RECOVERY.md|\
              docs/operations/SNAP-COMPLETION-20261025/PROVENANCE.md|\
              backend/tests/test_snapchat_entity_settings_v1.py|\
              backend/tests/test_snapchat_campaign_management_v1.py|\
              backend/tests/test_snapchat_management_execution_hardening_v1.py|\
              backend/tests/test_snapchat_management_safety_regressions_v1.py|\
              frontend/src/pages/SnapchatV2Page.jsx|\
              frontend/src/pages/SnapchatV2Page.test.jsx|\
              frontend/src/components/marketing/MarketingDecisionReadiness.jsx|\
              frontend/src/components/marketing/SnapchatDecisionReadiness.jsx|\
              frontend/src/components/marketing/SnapchatDecisionReadiness.test.jsx|\
              frontend/src/components/marketing/SnapchatCampaignManagementPanel.jsx|\
              frontend/src/components/marketing/SnapchatCampaignManagementPanel.test.jsx|\
              frontend/src/components/marketing/SnapchatEntitySettingsTable.jsx|\
              frontend/src/components/marketing/SnapchatInlineSettings.jsx|\
              frontend/src/components/marketing/SnapchatInlineSettings.test.jsx|\
              frontend/src/components/marketing/UnifiedMarketingEntityTable.jsx|\
              frontend/src/components/marketing/UnifiedMarketingEntityTable.test.jsx|\
              frontend/src/components/marketing/SnapchatEntitySettingsTable.test.jsx|\
              frontend/src/services/snapchatCampaignManagement.js|\
              frontend/src/services/snapchatCampaignManagement.test.js|\
              backend/campaign_ai_funnel_evidence_v3.py|\
              backend/campaign_ai_snapchat_autonomy.py|\
              backend/campaign_ai_monitor.py|\
              backend/campaign_ai_monitor_legacy.py|\
              backend/ads_manager/__init__.py|\
              backend/tests/test_campaign_ai_snapchat_autonomy.py|\
              backend/tests/test_campaign_ai_snapchat_autonomy_mongo.py|\
              backend/tests/test_campaign_ai_snapchat_autonomy_transport.py|\
              backend/tests/test_campaign_ai_snap_budget_drift_p0_5.py|\
              frontend/src/components/marketing/SnapchatAutonomyPanel.jsx|\
              frontend/src/components/marketing/SnapchatAutonomyPanel.test.jsx|\
              frontend/src/services/snapchatAutonomy.js|\
              frontend/src/services/snapchatAutonomy.test.js|\
              frontend/src/pages/CampaignRecommendations.jsx|\
              .github/workflows/snapchat-ai-autonomy-v1.yml|\
              docs/operations/SNAP-COMPLETION-20261025/AUTONOMY.md|\
              backend/campaign_ai_product_intelligence_v3.py|\
              backend/campaign_ai_temporal_evidence_v3.py|\
              backend/campaign_ai_unified_execution_evidence.py|\
              backend/campaign_ai_unified_source.py|\
              backend/decision_intelligence/evidence_adapter.py|\
              backend/decision_intelligence/phase5.py|\
              backend/decision_intelligence/routes.py|\
              backend/snapchat_v2/accounts.py|\
              backend/snapchat_v2/connection.py|\
              backend/snapchat_v2/routes.py|\
              backend/snapchat_v2/scheduler.py|\
              backend/snapchat_v2/status.py|\
              backend/snapchat_v2/salla_outcomes.py|\
              backend/tests/test_snapchat_salla_account_scope.py|\
              backend/tests/test_campaign_ai_multi_account.py|\
              backend/tests/test_campaign_ai_unified_cutover.py|\
              backend/tests/test_campaign_ai_unified_execution_evidence.py|\
              backend/tests/test_multi_account_readiness_routes.py|\
              backend/tests/test_snapchat_multi_account_routes.py|\
              backend/tests/test_snapchat_period_diagnostics_route.py|\
              backend/tests/test_snapchat_reporting_v2_headline_total.py|\
              backend/tests/test_snapchat_reporting_v2_multi_account_sync.py|\
              backend/tests/test_snapchat_reporting_v2_refresh_visibility.py|\
              backend/tests/test_snapchat_reporting_v2_scheduler.py|\
              backend/tests/test_unified_marketing_multi_account_dashboard.py|\
              backend/tests/test_unified_marketing_snapchat_range_proof.py|\
              backend/tests/test_unified_marketing_snapchat_readiness.py|\
              backend/unified_marketing/gateway.py|\
              backend/unified_marketing/providers.py|\
              backend/unified_marketing/readers/dashboard_portfolio.py|\
              backend/unified_marketing/readers/snapchat_v2.py|\
              backend/unified_marketing/readers/snapchat_v2_decision_evidence.py|\
              backend/unified_marketing/readiness.py|\
              docs/operations/SNAP-MULTI-ACCOUNT-20261016/STATUS.json|\
              scripts/emergent_deployment_adapter.py|\
              backend/tests/test_emergent_deployment_adapter_v5.py|\
              .github/workflows/mezan-production-release.yml|\
              release/release-intent-v5.json|\
              docs/operations/SNAP-SETTINGS-RECOVERY-20260916.md|\
              docs/operations/SNAP-INLINE-SETTINGS-20260916.md|\
              docs/operations/snap-ai-gates-panel-20260917.md|\
              .github/workflows/snapchat-reporting-v2.yml|\
              .github/workflows/snapchat-settings-management-v2.yml)
                ;;
              *)
                echo "::error file=${changed_path}::Path is outside the approved Snapchat settings and multi-account allowlist."
                rejected=1
                ;;
            esac
          done

          if [[ "${rejected}" -ne 0 ]]; then
            echo "Only the exact reviewed settings and multi-account integration files are allowed; all other paths remain forbidden."
            exit 1
          fi

          echo "run_tests=true" >> "${GITHUB_OUTPUT}"

          {
            echo "### Snapchat settings and multi-account integration diff scope"
            echo
            echo '```text'
            cat "${changed_paths_file}"
            echo '```'
            echo
            echo "### git diff --stat"
            echo
            echo '```text'
            git diff --stat --no-renames \
              "${PULL_REQUEST_BASE_SHA}...${PULL_REQUEST_HEAD_SHA}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  backend-tests:
    name: Backend settings and zero-write regressions
    needs: scope-guard
    if: needs.scope-guard.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: snapchat-settings-management-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted test dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          httpx==0.28.1
          pydantic==2.13.4
          pytest==9.0.3
          pytest-asyncio
          pymongo==4.6.3
          bcrypt==4.1.3
          PyJWT==2.13.0
          openai==1.99.9
          cryptography==48.0.0
          openpyxl==3.1.5
      - name: Compile settings and management surfaces
        run: |
          python -m py_compile \
            integrations_control_center/snapchat_entity_settings.py \
            integrations_control_center/snapchat_campaign_management.py \
            integrations_control_center/snapchat_campaign_publication.py \
            tests/test_snapchat_campaign_publication.py \
            integrations_control_center/snapchat_media_upload.py \
            tests/test_snapchat_media_upload.py \
            tests/test_snapchat_entity_settings_v1.py \
            tests/test_snapchat_campaign_management_v1.py \
            tests/test_snapchat_management_safety_regressions_v1.py
      - name: Run settings, mapping, freshness, audit, and no-write tests
        run: >-
          python -m pytest
          tests/test_snapchat_entity_settings_v1.py
          tests/test_snapchat_campaign_management_v1.py
          tests/test_snapchat_campaign_publication.py
          tests/test_snapchat_media_upload.py
          tests/test_snapchat_management_execution_hardening_v1.py
          tests/test_snapchat_management_safety_regressions_v1.py
          -q
          --tb=short

  frontend-tests:
    name: Frontend Snapchat settings tests and build
    needs: scope-guard
    if: needs.scope-guard.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run Snapchat service, table, panel, and page tests
        run: >-
          CI=true yarn test
          --watchAll=false
          --runInBand
          src/services/snapchatCampaignManagement.test.js
          src/services/snapchatCampaignPublication.test.js
          src/components/marketing/SnapchatCampaignPublicationPanel.test.jsx
          src/services/snapchatMediaUpload.test.js
          src/components/marketing/SnapchatMediaUploadPanel.test.jsx
          src/components/marketing/SnapchatEntitySettingsTable.test.jsx
          src/components/marketing/SnapchatInlineSettings.test.jsx
          src/components/marketing/UnifiedMarketingEntityTable.test.jsx
          src/components/marketing/SnapchatCampaignManagementPanel.test.jsx
          src/pages/SnapchatV2Page.test.jsx
      - name: Build frontend
        run: CI=false yarn build
