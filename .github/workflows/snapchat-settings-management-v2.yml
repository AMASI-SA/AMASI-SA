name: Snapchat Settings Management V2

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: snapchat-settings-management-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope-guard:
    name: Fail-closed settings/perf-UI scope guard
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject changes outside the approved settings-management surface
        id: scope
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PULL_REQUEST_BASE_SHA:-}" || -z "${PULL_REQUEST_HEAD_SHA:-}" ]]; then
            echo "::error::Pull-request base and head SHAs are required for the fail-closed scope check."
            exit 1
          fi

          if ! git cat-file -e "${PULL_REQUEST_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${PULL_REQUEST_BASE_SHA}"
          fi
          if ! git cat-file -e "${PULL_REQUEST_HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${PULL_REQUEST_HEAD_SHA}"
          fi

          changed_paths_nul="${RUNNER_TEMP}/snapchat-settings-changed-paths.nul"
          changed_paths_file="${RUNNER_TEMP}/snapchat-settings-changed-paths.txt"
          git diff --name-only -z --no-renames --diff-filter=ACDMRT \
            "${PULL_REQUEST_BASE_SHA}...${PULL_REQUEST_HEAD_SHA}" > "${changed_paths_nul}"
          mapfile -d '' -t changed_paths < "${changed_paths_nul}"
          printf '%s\n' "${changed_paths[@]}" > "${changed_paths_file}"

          if [[ "${#changed_paths[@]}" -eq 0 ]]; then
            echo "::error::The pull request has no changed paths to validate."
            exit 1
          fi

          owned_changed=false
          for changed_path in "${changed_paths[@]}"; do
            case "${changed_path}" in
              backend/integrations_control_center/snapchat_entity_settings.py|\
              backend/integrations_control_center/snapchat_campaign_management.py|\
              backend/tests/test_snapchat_entity_settings_v1.py|\
              backend/tests/test_snapchat_campaign_management_v1.py|\
              backend/tests/test_snapchat_management_safety_regressions_v1.py|\
              frontend/src/pages/SnapchatV2Page.jsx|\
              frontend/src/pages/SnapchatV2Page.test.jsx|\
              frontend/src/components/marketing/SnapchatCampaignManagementPanel.jsx|\
              frontend/src/components/marketing/SnapchatCampaignManagementPanel.test.jsx|\
              frontend/src/components/marketing/SnapchatEntitySettingsTable.jsx|\
              frontend/src/components/marketing/SnapchatEntitySettingsTable.test.jsx|\
              frontend/src/services/snapchatCampaignManagement.js|\
              frontend/src/services/snapchatCampaignManagement.test.js|\
              .github/workflows/snapchat-settings-management-v2.yml)
                owned_changed=true
                ;;
            esac
          done

          if [[ "${owned_changed}" != "true" ]]; then
            echo "run_tests=false" >> "${GITHUB_OUTPUT}"
            echo "No Snapchat settings-management files changed; this dedicated suite is not applicable."
            exit 0
          fi

          perf_ui_mode=true
          for required_path in \
            docs/fixes/SNAP-V2-PERF-UI-1.md \
            backend/snapchat_v2/entity_pagination.py \
            backend/scripts/benchmark_snapchat_v2_full_request.py \
            backend/tests/test_snapchat_v2_server_pagination.py \
            backend/tests/test_snapchat_v2_mongo_integration.py \
            frontend/src/components/marketing/SnapchatFinancialEntityTable.jsx \
            frontend/src/components/marketing/SnapchatFinancialEntityTable.test.jsx
          do
            if ! grep -Fqx "${required_path}" "${changed_paths_file}"; then
              perf_ui_mode=false
            fi
          done

          rejected=0
          for changed_path in "${changed_paths[@]}"; do
            case "${changed_path}" in
              backend/integrations_control_center/snapchat_entity_settings.py|\
              backend/integrations_control_center/snapchat_campaign_management.py|\
              backend/tests/test_snapchat_entity_settings_v1.py|\
              backend/tests/test_snapchat_campaign_management_v1.py|\
              backend/tests/test_snapchat_management_safety_regressions_v1.py|\
              frontend/src/pages/SnapchatV2Page.jsx|\
              frontend/src/pages/SnapchatV2Page.test.jsx|\
              frontend/src/components/marketing/SnapchatCampaignManagementPanel.jsx|\
              frontend/src/components/marketing/SnapchatCampaignManagementPanel.test.jsx|\
              frontend/src/components/marketing/SnapchatEntitySettingsTable.jsx|\
              frontend/src/components/marketing/SnapchatEntitySettingsTable.test.jsx|\
              frontend/src/services/snapchatCampaignManagement.js|\
              frontend/src/services/snapchatCampaignManagement.test.js|\
              .github/workflows/snapchat-settings-management-v2.yml)
                ;;
              backend/server.py|\
              backend/integrations_control_center/snapchat_campaign_profitability.py|\
              backend/scripts/benchmark_snapchat_v2_full_request.py|\
              backend/scripts/benchmark_snapchat_v2_pagination.py|\
              backend/decision_intelligence/evidence_adapter.py|\
              backend/snapchat_v2/entity_pagination.py|\
              backend/snapchat_v2/entities.py|\
              backend/snapchat_v2/read_indexes.py|\
              backend/snapchat_v2/read_timing.py|\
              backend/snapchat_v2/routes.py|\
              backend/snapchat_v2/salla_outcomes.py|\
              backend/snapchat_v2/status.py|\
              backend/unified_marketing/commerce_carts.py|\
              backend/unified_marketing/readers/snapchat_v2.py|\
              backend/tests/test_decision_intelligence_phase5.py|\
              backend/tests/test_snapchat_entity_settings_bounded_page.py|\
              backend/tests/test_snapchat_reporting_v2_entity_performance.py|\
              backend/tests/test_snapchat_v2_bounded_salla.py|\
              backend/tests/test_snapchat_v2_mongo_integration.py|\
              backend/tests/test_snapchat_v2_read_performance_contract.py|\
              backend/tests/test_snapchat_v2_server_pagination.py|\
              docs/fixes/SNAP-V2-PERF-UI-1.md|\
              frontend/src/components/marketing/SnapchatFinancialEntityTable.jsx|\
              frontend/src/components/marketing/SnapchatFinancialEntityTable.test.jsx|\
              frontend/src/services/snapchatV2EntityReads.js|\
              frontend/src/services/snapchatV2EntityReads.test.js)
                if [[ "${perf_ui_mode}" != "true" ]]; then
                  echo "::error file=${changed_path}::Expanded path requires the complete SNAP-V2-PERF-UI-1 contract and regression set."
                  rejected=1
                fi
                ;;
              *)
                echo "::error file=${changed_path}::Path is outside the approved Snapchat settings-management allowlist."
                rejected=1
                ;;
            esac
          done

          if [[ "${rejected}" -ne 0 ]]; then
            echo "Forbidden scope includes unrelated reporting/hourly facts, scheduler, reconciliation, Provider TOTAL, Dashboard spend, OAuth, timezone, other Salla/Unified Marketing paths, and other Decision Intelligence paths."
            exit 1
          fi

          echo "run_tests=true" >> "${GITHUB_OUTPUT}"

          {
            echo "### Snapchat settings-management diff scope"
            echo
            echo "SNAP-V2-PERF-UI-1 expanded mode: ${perf_ui_mode}"
            echo
            echo '```text'
            cat "${changed_paths_file}"
            echo '```'
            echo
            echo "### git diff --stat"
            echo
            echo '```text'
            git diff --stat --no-renames \
              "${PULL_REQUEST_BASE_SHA}...${PULL_REQUEST_HEAD_SHA}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  backend-tests:
    name: Backend settings and zero-write regressions
    needs: scope-guard
    if: needs.scope-guard.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: snapchat-settings-management-test-secret
      SNAPCHAT_V2_TEST_MONGO_URL: mongodb://127.0.0.1:27017
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted test dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          httpx==0.28.1
          pydantic==2.13.4
          pytest==9.0.3
          pytest-asyncio
          pymongo==4.6.3
          motor==3.3.1
          bcrypt==4.1.3
          PyJWT==2.13.0
          openai==1.99.9
          cryptography==48.0.0
          openpyxl==3.1.5
          reportlab==4.5.1
      - name: Compile settings and management surfaces
        run: |
          python -m py_compile \
            integrations_control_center/snapchat_entity_settings.py \
            integrations_control_center/snapchat_campaign_management.py \
            decision_intelligence/evidence_adapter.py \
            snapchat_v2/entity_pagination.py \
            snapchat_v2/entities.py \
            snapchat_v2/read_indexes.py \
            snapchat_v2/read_timing.py \
            scripts/benchmark_snapchat_v2_full_request.py \
            tests/test_snapchat_entity_settings_v1.py \
            tests/test_snapchat_entity_settings_bounded_page.py \
            tests/test_snapchat_campaign_management_v1.py \
            tests/test_decision_intelligence_phase5.py \
            tests/test_snapchat_management_safety_regressions_v1.py \
            tests/test_snapchat_reporting_v2_entity_performance.py \
            tests/test_snapchat_v2_bounded_salla.py \
            tests/test_snapchat_v2_mongo_integration.py \
            tests/test_snapchat_v2_read_performance_contract.py \
            tests/test_snapchat_v2_server_pagination.py
      - name: Run settings, mapping, freshness, audit, and no-write tests
        run: >-
          python -m pytest
          tests/test_snapchat_entity_settings_v1.py
          tests/test_snapchat_entity_settings_bounded_page.py
          tests/test_snapchat_campaign_management_v1.py
          tests/test_snapchat_management_safety_regressions_v1.py
          tests/test_decision_intelligence_phase5.py
          tests/test_snapchat_reporting_v2_entity_performance.py
          tests/test_snapchat_v2_bounded_salla.py
          tests/test_snapchat_v2_read_performance_contract.py
          tests/test_snapchat_v2_server_pagination.py
          -q
          --tb=short
      - name: Run production pipeline and route contracts on isolated MongoDB
        run: >-
          python -m pytest
          tests/test_snapchat_v2_mongo_integration.py
          -q
          -s
          --tb=short
      - name: Benchmark full Campaign request chain on isolated MongoDB
        run: python scripts/benchmark_snapchat_v2_full_request.py

  frontend-tests:
    name: Frontend Snapchat settings tests and build
    needs: scope-guard
    if: needs.scope-guard.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run Snapchat service, table, panel, and page tests
        run: >-
          CI=true yarn test
          --watchAll=false
          --runInBand
          src/services/snapchatCampaignManagement.test.js
          src/components/marketing/SnapchatEntitySettingsTable.test.jsx
          src/components/marketing/SnapchatCampaignManagementPanel.test.jsx
          src/components/marketing/SnapchatFinancialEntityTable.test.jsx
          src/pages/SnapchatV2Page.test.jsx
          src/services/snapchatV2EntityReads.test.js
      - name: Build frontend
        run: CI=false yarn build
