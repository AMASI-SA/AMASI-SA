name: Mezan Special Orders Core
on:
  pull_request:
    paths:
      - 'backend/mezan_special_orders/**'
      - 'backend/order_engine/models.py'
      - 'backend/order_engine/repository.py'
      - 'backend/order_engine/service.py'
      - 'backend/order_item_engine/models.py'
      - 'backend/order_option_cost_snapshot_routes.py'
      - '.github/workflows/mezan-special-orders-core.yml'
  push:
    branches: ['feature/mezan-special-orders-core-20260927']
    paths:
      - 'backend/mezan_special_orders/**'
      - 'backend/order_engine/**'
      - 'backend/order_item_engine/models.py'
      - 'backend/order_option_cost_snapshot_routes.py'
      - '.github/workflows/mezan-special-orders-core.yml'
permissions:
  contents: read
jobs:
  isolated-core-and-mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1cbeccd84d58fb3397dcd42822d5feb92de06275
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies for source and ordinary-order regression tests
        run: |
          python - <<'PYTESTDEPS'
          from pathlib import Path
          names = {'pydantic', 'fastapi', 'httpx', 'pytest', 'motor', 'pymongo', 'cryptography', 'requests', 'reportlab', 'pillow', 'python-multipart', 'python-dotenv', 'openpyxl', 'python-dateutil', 'pyjwt', 'pandas'}
          rows = [r for r in Path('backend/requirements.txt').read_text().splitlines() if r.split('==')[0].casefold() in names]
          assert len(rows) == len(names), 'Every application dependency must have its exact repository pin'
          rows.append('pytest-asyncio==1.3.0')
          Path('/tmp/special-order-test-requirements.txt').write_text('\n'.join(rows) + '\n')
          PYTESTDEPS
          python -m pip install -r /tmp/special-order-test-requirements.txt
      - name: Frozen ordinary-order baseline
        working-directory: baseline/backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_order_engine_models.py tests/test_order_engine_mapper.py tests/test_order_engine_repository.py tests/test_order_engine_service.py tests/test_order_item_engine_models.py tests/test_order_item_engine_mapper.py tests/test_order_option_cost_snapshots.py tests/test_product_option_shared_cost_engine.py --junitxml=../../special-order-baseline-tests.xml
      - name: Candidate core, actual source adapters and disposable Mongo database
        working-directory: backend
        env:
          PYTHONPATH: .
          MEZAN_SPECIAL_TEST_MONGO_URI: mongodb://127.0.0.1:27017
        run: |
          python -m compileall -q mezan_special_orders order_engine order_item_engine
          python -m pytest -q mezan_special_orders/tests tests/test_order_engine_models.py tests/test_order_engine_mapper.py tests/test_order_engine_repository.py tests/test_order_engine_service.py tests/test_order_item_engine_models.py tests/test_order_item_engine_mapper.py tests/test_order_option_cost_snapshots.py tests/test_product_option_shared_cost_engine.py --junitxml=../special-order-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mezan-special-order-test-results
          path: |
            special-order-tests.xml
            special-order-baseline-tests.xml
