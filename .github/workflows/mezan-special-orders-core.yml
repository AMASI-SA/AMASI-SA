name: Mezan Special Orders Core
on:
  pull_request:
    paths:
      - 'backend/mezan_special_orders/**'
      - '.github/workflows/mezan-special-orders-core.yml'
  push:
    branches: ['feature/mezan-special-orders-core-20260927']
    paths:
      - 'backend/mezan_special_orders/**'
      - '.github/workflows/mezan-special-orders-core.yml'
permissions:
  contents: read
jobs:
  isolated-core-and-mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only nucleus test dependencies from the repository lock
        run: |
          python - <<'PY'
          from pathlib import Path
          names = {'pydantic', 'fastapi', 'httpx', 'pytest', 'motor', 'pymongo'}
          rows = [r for r in Path('backend/requirements.txt').read_text().splitlines() if r.split('==')[0] in names]
          assert len(rows) == len(names), 'Required exact pins must exist in backend/requirements.txt'
          Path('/tmp/special-order-test-requirements.txt').write_text('\n'.join(rows) + '\n')
          PY
          python -m pip install -r /tmp/special-order-test-requirements.txt
      - name: Compile and test isolated core plus disposable Mongo database
        env:
          PYTHONPATH: backend
          MEZAN_SPECIAL_TEST_MONGO_URI: mongodb://127.0.0.1:27017
        run: |
          python -m compileall -q backend/mezan_special_orders
          python -m pytest -q backend/mezan_special_orders/tests --junitxml=special-order-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mezan-special-order-test-results
          path: special-order-tests.xml
      - name: Retain pinned tracked source for isolated integration audit
        if: github.head_ref == 'feature/mezan-special-orders-core-20260927' || github.ref_name == 'feature/mezan-special-orders-core-20260927'
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, zipfile
          from pathlib import Path
          paths = subprocess.check_output(['git', 'ls-files', '-z', 'backend', 'AGENTS.md', 'docs/MEZAN_OS_ARCHITECTURE.md', 'docs/PROJECT_DECISIONS.md', 'docs/ORDER_CAPABILITY_AUDIT.md']).decode().split('\0')
          paths = [p for p in paths if p and (p.endswith(('.py', '.md')) or p == 'backend/requirements.txt') and '/.env' not in p]
          manifest = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'files': {}}
          with zipfile.ZipFile('special-order-backend-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in paths:
                  data = Path(path).read_bytes()
                  manifest['files'][path] = hashlib.sha256(data).hexdigest()
                  archive.writestr(path, data)
              archive.writestr('SOURCE_MANIFEST.json', json.dumps(manifest, sort_keys=True, indent=2))
          print('Tracked backend source files:', len(paths))
          PY
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'feature/mezan-special-orders-core-20260927' || github.ref_name == 'feature/mezan-special-orders-core-20260927'
        with:
          name: mezan-special-order-pinned-backend-source
          path: special-order-backend-source.zip
          retention-days: 3
