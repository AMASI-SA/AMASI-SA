name: Qoyod rounding LRM tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/integrations/qoyod_manual/**'
      - 'backend/tests/test_qoyod_rounding_lrm.py'
      - '.github/workflows/qoyod-rounding-lrm-tests.yml'
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install -q pytest pytest-asyncio mongomock-motor motor==3.3.1 pymongo==4.5.0 fastapi==0.110.1 python-dotenv cryptography python-jose passlib bcrypt httpx requests
      - name: Compile changed modules
        run: |
          python -m py_compile \
            backend/integrations/qoyod_manual/__init__.py \
            backend/integrations/qoyod_manual/rounding_lrm.py
      - name: Run focused rounding tests
        env:
          PYTHONPATH: backend
        run: |
          set +e
          pytest -q --tb=short backend/tests/test_qoyod_rounding_lrm.py > pytest-output.txt 2>&1
          code=$?
          echo '===== PYTEST RESULT ====='
          cat pytest-output.txt
          echo "$code" > pytest-exit-code.txt
          exit $code
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoyod-rounding-pytest-output
          path: |
            pytest-output.txt
            pytest-exit-code.txt
