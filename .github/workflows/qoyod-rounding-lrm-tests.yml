name: Qoyod rounding LRM tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/integrations/qoyod_manual/**'
      - 'backend/tests/test_qoyod_rounding_lrm.py'
      - 'backend/tests/qoyod_pending_clock_harness.py'
      - 'backend/tests/test_qoyod_manual_send_plan_b.py'
      - 'backend/tests/test_plan_b_payment_path_fix.py'
      - 'backend/tests/test_pending_cross_tab_dedupe.py'
      - 'backend/tests/test_plan_b_cross_trace_dedupe.py'
      - 'backend/tests/test_pending_limit_and_status_filter_ordering.py'
      - '.github/workflows/qoyod-rounding-lrm-tests.yml'
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [latest-production, candidate]
    steps:
      - uses: actions/checkout@v4
      - name: Retain the same candidate-owned clock isolation harness
        run: cp backend/tests/qoyod_pending_clock_harness.py "$RUNNER_TEMP/qoyod_pending_clock_harness.py"
      - name: Select exact latest Production for baseline comparison
        if: matrix.source == 'latest-production'
        run: |
          git fetch origin fab6ce6bb4f533683d414ffec2289b0b976f386f
          git checkout --detach fab6ce6bb4f533683d414ffec2289b0b976f386f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install -q pytest pytest-asyncio mongomock-motor motor==3.3.1 pymongo==4.5.0 fastapi==0.110.1 python-dotenv cryptography python-jose passlib bcrypt httpx requests openpyxl reportlab==4.5.1
      - name: Compile changed modules
        run: |
          python -m py_compile \
            backend/integrations/qoyod_manual/__init__.py \
            backend/integrations/qoyod_manual/rounding_lrm.py
      - name: Run rounding and Plan-B regression tests
        env:
          PYTHONPATH: backend:${{ runner.temp }}
          QOYOD_TOKEN_ENC_KEY: v1Guxdh8dNuwTcKgGBozqhu6aivwDfoBS9-i6XEmapA=
          QOYOD_API_BASE: https://api.qoyod.com
        run: |
          set +e
          pytest -p qoyod_pending_clock_harness -q --tb=short --junitxml=pytest-results.xml \
            backend/tests/test_qoyod_rounding_lrm.py \
            backend/tests/test_qoyod_manual_send_plan_b.py \
            backend/tests/test_plan_b_payment_path_fix.py \
            backend/tests/test_pending_cross_tab_dedupe.py \
            backend/tests/test_plan_b_cross_trace_dedupe.py \
            backend/tests/test_pending_limit_and_status_filter_ordering.py \
            > pytest-output.txt 2>&1
          code=$?
          echo '===== PYTEST RESULT ====='
          cat pytest-output.txt
          echo "$code" > pytest-exit-code.txt
          exit $code
      - name: Require all 77 tests without failures, errors, or skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tests = list(ET.parse('pytest-results.xml').getroot().iter('testcase'))
          assert len(tests) == 77, f'Expected 77 tests, got {len(tests)}'
          assert all(test.find(tag) is None for test in tests for tag in ('failure', 'error', 'skipped'))
          print('77 tests passed; zero failures/errors/skips')
          PY
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoyod-rounding-${{ matrix.source }}-pytest-output
          path: |
            pytest-output.txt
            pytest-exit-code.txt
            pytest-results.xml
