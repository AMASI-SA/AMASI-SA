name: Qoyod rounding LRM tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/integrations/qoyod_manual/**'
      - 'backend/tests/test_qoyod_rounding_lrm.py'
      - '.github/workflows/qoyod-rounding-lrm-tests.yml'
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio mongomock-motor motor==3.3.1 pymongo==4.5.0 fastapi==0.110.1 python-dotenv cryptography python-jose passlib bcrypt httpx requests
      - name: Compile changed modules
        run: |
          python -m py_compile \
            backend/integrations/qoyod_manual/__init__.py \
            backend/integrations/qoyod_manual/rounding_lrm.py
      - name: Run focused rounding tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q backend/tests/test_qoyod_rounding_lrm.py
