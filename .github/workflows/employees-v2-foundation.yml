name: Employees V2 Foundation

# Keep this workflow eligible for required-status evaluation on maintenance PRs.
# Maintenance route validation trigger.
on:
  pull_request:
    paths:
      - "backend/employees_v2_routes.py"
      - "backend/auth.py"
      - "backend/ai_store_access_contract.py"
      - "backend/ai_store_access_control.py"
      - "backend/ai_store_operations_foundation.py"
      - "backend/tests/test_employees_v2_foundation.py"
      - "backend/tests/test_employees_v2_management.py"
      - "backend/tests/test_employee_account_access_revocation.py"
      - "backend/tests/test_supplier_management_import_boot.py"
      - "backend/server.py"
      - "frontend/src/App.js"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/components/MezanV2NavigationShell.jsx"
      - "frontend/src/components/MezanV2NavigationShell.test.jsx"
      - "frontend/src/components/MezanV2NavigationShell.employees.test.jsx"
      - "frontend/src/pages/EmployeesV2.jsx"
      - "frontend/src/pages/EmployeesV2Management.jsx"
      - "frontend/src/pages/EmployeesV2Management.test.jsx"
      - "frontend/src/pages/EmployeesV2.test.jsx"
      - "frontend/src/services/employeesV2.js"
      - "frontend/src/services/employeesV2.test.js"
      - ".github/workflows/employees-v2-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install targeted dependencies
        run: >-
          python -m pip install -q
          bcrypt==4.1.3
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          PyJWT==2.13.0
          pytest==9.0.3
          openpyxl==3.1.5
      - name: Validate Employees V2 migration contract and supplier boot import
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q --tb=short
          backend/tests/test_employees_v2_foundation.py
          backend/tests/test_employees_v2_management.py
          backend/tests/test_employee_account_access_revocation.py
          backend/tests/test_supplier_management_import_boot.py

  frontend-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        working-directory: frontend
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive
      - name: Validate employee workspace and navigation
        working-directory: frontend
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/services/employeesV2.test.js
          src/pages/EmployeesV2.test.jsx
          src/pages/EmployeesV2Management.test.jsx
          src/components/MezanV2NavigationShell.employees.test.jsx
          src/components/MezanV2NavigationShell.test.jsx
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: "false"
        run: yarn build
