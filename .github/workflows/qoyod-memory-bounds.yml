name: Qoyod Unsent Orders Memory Bounds

on:
  push:
    branches:
      - hotfix/qoyod-unsent-orders-memory-bounds
  pull_request:
    paths:
      - "backend/integrations/qoyod/candidate_orders.py"
      - "backend/integrations/qoyod/unsent_orders.py"
      - "backend/qoyod_auto_unified/queue_api.py"
      - "backend/qoyod_auto_unified/queue_counts.py"
      - "backend/tests/test_qoyod_unsent_memory_bounds.py"
      - "backend/tests/qoyod_unsent_memory_benchmark.py"
      - "frontend/src/components/QoyodUnsentHeaderAlert.jsx"
      - "frontend/src/pages/QoyodUnsentOrders.jsx"
      - "frontend/src/lib/qoyodUnsentOrdersClient.js"
      - "frontend/src/lib/qoyodUnsentOrdersClient.test.js"
      - "frontend/src/qoyodUnsentHeaderAlert.test.js"
      - "frontend/src/pages/QoyodUnsentOrders.test.jsx"
      - ".github/workflows/qoyod-memory-bounds.yml"
  workflow_dispatch:

jobs:
  backend-combined-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest pytest-asyncio mongomock-motor
      - name: Run prior and Qoyod memory regressions together
        shell: bash
        run: |
          set +e
          python -m pytest             tests/test_resource_governor.py             tests/test_mongo_observability.py             tests/test_memory_boot_policy.py             tests/test_memory_bounded_workers.py             tests/test_dashboard_memory_admission.py             tests/test_snapchat_memory_ordering.py             tests/test_startup_guard.py             tests/test_scheduler_readiness_gate.py             tests/test_qoyod_unsent_memory_bounds.py             tests/test_qoyod_unsent_range_counts.py             tests/test_qoyod_unsent_report_eligibility.py             tests/test_qoyod_reconciliation_v2.py             -q --tb=short > /tmp/qoyod-memory-tests.log 2>&1
          status=$?
          cat /tmp/qoyod-memory-tests.log
          exit $status
      - name: Run isolated before/after benchmark
        if: success()
        run: python tests/qoyod_unsent_memory_benchmark.py | tee /tmp/qoyod-memory-benchmark.json
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoyod-memory-backend-evidence
          path: |
            /tmp/qoyod-memory-tests.log
            /tmp/qoyod-memory-benchmark.json
          if-no-files-found: ignore

  frontend-coalescing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --ignore-engines
      - name: Run Qoyod polling and coalescing regressions
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand
          src/lib/qoyodUnsentOrdersClient.test.js
          src/qoyodUnsentHeaderAlert.test.js
          src/pages/QoyodUnsentOrders.test.jsx
