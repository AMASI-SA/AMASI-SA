name: Warehouse Cabinet Archive

on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - 'backend/warehouse_*.py'
      - 'backend/inventory_receipt_service.py'
      - 'backend/inventory_stocktake_service.py'
      - 'backend/opening_inventory_service.py'
      - 'backend/operational_opening_inventory.py'
      - 'backend/operational_purchase_metadata.py'
      - 'backend/accounting_onboarding_domains.py'
      - 'backend/product_inventory_receipt_routes.py'
      - 'backend/purchase_invoices_routes.py'
      - 'backend/purchase_receiving_service.py'
      - 'backend/stock_preparation_order_routes.py'
      - 'backend/bundle_catalog_v2.py'
      - 'backend/bundle_fulfillment_v2.py'
      - 'backend/fulfillment_v2_routes.py'
      - 'backend/stock_component_consumption_service.py'
      - 'backend/operational_atomic.py'
      - 'backend/tests/test_warehouse_cabinet_*.py'
      - 'backend/tests/demand_read_mongo_fixture.py'
      - 'frontend/src/pages/WarehouseHierarchyWorkspace*.jsx'
      - 'frontend/src/pages/warehouseHierarchy.css'
      - '.github/workflows/warehouse-cabinet-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-cabinet-archive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Cabinet archive atomic contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:backend/tests
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: >-
          python -m pip install pytest==9.1.1 pytest-asyncio==1.3.0
          fastapi==0.142.2 pydantic==2.13.5 httpx==0.28.1
          motor==3.7.1 pymongo==4.18.3 python-multipart==0.0.32
          cryptography==50.0.0 reportlab==4.5.1 PyMuPDF==1.28.2 qrcode==8.2
          bcrypt==4.1.3 PyJWT==2.15.0 openpyxl==3.1.5
          email-validator==2.3.0 python-dotenv==1.2.2
      - name: Install pinned test MongoDB binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cabinet-mongo"
          curl --fail --location --retry 2 \
            https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.14.tgz \
            --output "$RUNNER_TEMP/cabinet-mongo/mongo.tgz"
          MONGO_TEST_ARCHIVE="$RUNNER_TEMP/cabinet-mongo/mongo.tgz" python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['MONGO_TEST_ARCHIVE'])
          expected = 'b4cf8caae108785135ecc8b86ad8ed6df5d6efb84b9b95a50ecba2fc246ce084'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, 'MongoDB archive checksum mismatch'
          PY
          tar -xzf "$RUNNER_TEMP/cabinet-mongo/mongo.tgz" -C "$RUNNER_TEMP/cabinet-mongo"
          echo "DEMAND_READ_TEST_MONGOD=$RUNNER_TEMP/cabinet-mongo/mongodb-linux-x86_64-ubuntu2204-7.0.14/bin/mongod" >> "$GITHUB_ENV"
      - name: Run archive, restore and numbering contracts
        shell: bash
        run: |
          set -euo pipefail
          env -u MONGO_URL -u MONGODB_URI -u DEMAND_READ_TEST_MONGO_URI \
            python -B -m pytest --noconftest -p pytest_asyncio.plugin --asyncio-mode=auto \
            -q --tb=short --junitxml=cabinet-archive-results.xml \
            backend/tests/test_warehouse_cabinet_*.py
          python - <<'PY'
          from xml.etree import ElementTree as ET
          cases = ET.parse('cabinet-archive-results.xml').getroot().findall('.//testcase')
          assert cases and any('archive' in case.get('classname', '') for case in cases), 'Archive tests did not execute'
          assert not any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error')), 'Cabinet contract did not pass'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cabinet-archive-results
          path: cabinet-archive-results.xml
          if-no-files-found: error

  frontend:
    name: Cabinet archive interface contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Enable repository Yarn version
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frozen frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run warehouse interface contracts
        working-directory: frontend
        env:
          CI: 'true'
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/pages/WarehouseHierarchyWorkspace.test.jsx
          src/pages/WarehouseHierarchyWorkspace.archive.test.jsx
