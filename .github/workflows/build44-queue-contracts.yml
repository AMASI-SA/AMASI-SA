name: Build44 queue and courier contracts
on:
  push:
    branches: [codex/build44-queue-backend]
permissions:
  contents: read
jobs:
  synthetic-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0.12
        ports: ['27464:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: backend:backend/tests
      PYTHONDONTWRITEBYTECODE: '1'
      WAITING_TEST_MONGO_URL: mongodb://127.0.0.1:27464
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install focused isolated test dependencies
        run: >-
          python -m pip install
          arabic-reshaper==3.0.1 bcrypt==4.1.3 cryptography==50.0.0
          email-validator==2.3.0 fastapi==0.140.0 httpx==0.28.1
          mongomock-motor==0.0.36 motor==3.7.1 openpyxl==3.1.5
          pillow==12.3.0 pydantic==2.13.4 PyJWT==2.15.0 pymongo==4.18.2
          PyMuPDF==1.28.2 pytest==9.0.3 pytest-asyncio==1.3.0
          python-bidi==0.6.10 python-dateutil==2.9.0.post0 python-dotenv==1.2.2
          python-multipart==0.0.31 qrcode==8.2 reportlab==4.5.1
          requests==2.34.2 tzdata==2026.2 webauthn==2.7.1
      - name: Queue pagination, tenant isolation and idempotent courier handover
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q
          backend/tests/test_mobile_review_queue_contract.py
          backend/tests/test_courier_manual_handover_contract.py
          --junitxml=queue-contracts.xml
      - name: Employee monitoring parity
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q
          backend/tests/test_mobile_operations_monitoring.py
          -k monitoring_live_stages_equal_employee_workspace
          --junitxml=monitoring-parity.xml
      - name: Retain contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build44-queue-${{ github.sha }}
          path: '*-*.xml'
          retention-days: 14
          if-no-files-found: error
  review-source-refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:backend/tests
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27466/?replicaSet=reviewrefresh&directConnection=true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install focused isolated test dependencies
        run: >-
          python -m pip install
          arabic-reshaper==3.0.1 bcrypt==4.1.3 cryptography==50.0.0
          email-validator==2.3.0 fastapi==0.140.0 httpx==0.28.1
          mongomock-motor==0.0.36 motor==3.7.1 openpyxl==3.1.5
          pillow==12.3.0 pydantic==2.13.4 PyJWT==2.15.0 pymongo==4.18.2
          PyMuPDF==1.28.2 pytest==9.0.3 pytest-asyncio==1.3.0
          python-bidi==0.6.10 python-dateutil==2.9.0.post0 python-dotenv==1.2.2
          python-multipart==0.0.31 qrcode==8.2 reportlab==4.5.1
          requests==2.34.2 tzdata==2026.2 webauthn==2.7.1
      - name: Start synthetic loopback-only Mongo replica
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name review-refresh-rs -p 127.0.0.1:27466:27466 mongo:8.0.12 --port 27466 --replSet reviewrefresh --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec review-refresh-rs mongosh --port 27466 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec review-refresh-rs mongosh --port 27466 --quiet --eval 'rs.initiate({_id:"reviewrefresh",members:[{_id:0,host:"127.0.0.1:27466"}]})'
          for attempt in $(seq 1 40); do
            if docker exec review-refresh-rs mongosh --port 27466 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec review-refresh-rs mongosh --port 27466 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'
      - name: Refresh options, permissions, no financial side effects and completion race fences
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q
          backend/tests/test_mobile_review_refresh_contract.py
          backend/tests/test_order_engine_salla_refresh.py
          backend/tests/test_review_attempt_closure.py
          backend/tests/test_review_readback_v2.py
          backend/tests/test_order_review_export_controls.py
          --junitxml=review-refresh.xml
      - name: Retain refresh contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build44-review-refresh-${{ github.sha }}
          path: review-refresh.xml
          retention-days: 14
          if-no-files-found: error
      - name: Remove synthetic Mongo container
        if: always()
        run: docker rm -f review-refresh-rs
