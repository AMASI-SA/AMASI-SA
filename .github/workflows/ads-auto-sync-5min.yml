name: Ads Auto Sync 5 Minutes

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/ads_auto_sync_scheduler.py"
      - "backend/integrations_control_center/__init__.py"
      - "backend/tests/test_ads_auto_sync_scheduler_v2.py"
      - ".github/workflows/ads-auto-sync-5min.yml"

jobs:
  scheduler-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          pip install pytest fastapi "pydantic>=2" httpx pymongo motor
          cryptography openpyxl
      - name: Compile scheduler and integration router
        working-directory: backend
        run: |
          python -m py_compile \
            integrations_control_center/ads_auto_sync_scheduler.py \
            integrations_control_center/__init__.py
      - name: Run focused scheduler tests
        working-directory: backend
        run: pytest -q tests/test_ads_auto_sync_scheduler_v2.py
      - name: Enforce provider-only isolation
        run: |
          FILE=backend/integrations_control_center/ads_auto_sync_scheduler.py
          ! grep -q 'general_ledger' "$FILE"
          ! grep -q 'daily_costs' "$FILE"
          ! grep -q 'meta_ads_daily' "$FILE"
          ! grep -q 'snapchat_daily_stats' "$FILE"
          ! grep -q '/meta/sync\|/snapchat/daily-spend' "$FILE"
