name: Store Delivery V1

on:
  pull_request:
    paths:
      - "backend/store_delivery_*.py"
      - "backend/tests/test_store_delivery_*.py"
      - "backend/order_engine/__init__.py"
      - "frontend/src/pages/AmasiDeliveryApp.jsx"
      - "frontend/src/pages/StoreDriver*.jsx"
      - "frontend/src/pages/StoreDelivery*.jsx"
      - "frontend/src/components/BarcodeCameraScanner.jsx"
      - "frontend/src/components/ProtectedRoute.jsx"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/components/MezanV2NavigationShell.jsx"
      - "frontend/src/services/storeDelivery.js"
      - ".github/workflows/store-delivery-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Store Delivery Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused backend test dependencies
        run: >-
          pip install
          pytest
          fastapi==0.140.0
          pydantic
          pymongo
          bcrypt==4.1.3
          PyJWT
          email-validator
      - name: Compile delivery modules
        run: python -m py_compile store_delivery_*.py order_engine/__init__.py
      - name: Run delivery tests
        run: pytest -q tests/test_store_delivery_domain.py tests/test_store_delivery_driver_security.py tests/test_store_delivery_handover_routes.py tests/test_store_delivery_payment_evidence.py tests/test_store_delivery_reminders.py

  frontend:
    name: Store Delivery Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: yarn install --ignore-engines
      - name: Build frontend
        run: yarn build
