name: Store Delivery V1

on:
  pull_request:
    paths:
      - "backend/store_delivery_*.py"
      - "backend/tests/test_store_delivery_*.py"
      - "backend/order_engine/__init__.py"
      - "frontend/src/pages/AmasiDeliveryApp.jsx"
      - "frontend/src/pages/StoreDriver*.jsx"
      - "frontend/src/pages/StoreDelivery*.jsx"
      - "frontend/src/components/BarcodeCameraScanner.jsx"
      - "frontend/src/components/ProtectedRoute.jsx"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/components/MezanV2NavigationShell.jsx"
      - "frontend/src/services/storeDelivery.js"
      - ".github/workflows/store-delivery-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Store Delivery Backend
    runs-on: ubuntu-latest
    env:
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=mz2test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused backend test dependencies
        run: >-
          pip install
          pytest
          pytest-asyncio
          mongomock_motor
          fastapi==0.140.0
          pydantic
          pymongo
          motor==3.7.1
          bcrypt==4.1.3
          PyJWT
          email-validator
          openpyxl==3.1.5
      - name: Start disposable transaction-capable Mongo
        run: |
          docker run -d --name store-delivery-rs -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet mz2test --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec store-delivery-rs mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec store-delivery-rs mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"mz2test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if docker exec store-delivery-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
      - name: Compile delivery modules
        run: python -m py_compile store_delivery_*.py order_engine/__init__.py
      - name: Run delivery tests
        run: pytest -q tests/test_store_delivery_accounting.py tests/test_store_delivery_domain.py tests/test_store_delivery_driver_security.py tests/test_store_delivery_handover_routes.py tests/test_store_delivery_payment_evidence.py tests/test_store_delivery_reminders.py

  frontend:
    name: Store Delivery Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build frontend
        run: yarn build:release
