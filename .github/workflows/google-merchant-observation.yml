name: Google Merchant bounded observation
on:
  push:
    branches: [codex/google-merchant-observation-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_merchant_product_observation.py
      - backend/integrations_control_center/google_ads_reporting.py
      - backend/tests/test_google_merchant_product_observation.py
      - backend/tests/test_google_bound_read_session*.py
      - .github/workflows/google-merchant-observation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned production-compatible dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1 cryptography==50.0.2
          python-multipart==0.0.32 PyJWT==2.15.1 bcrypt==4.1.3
          python-dotenv==1.2.4 pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable loopback replica
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name google-bound-read-rs -p 127.0.0.1:27486:27486 mongo:8.0.26 --port 27486 --replSet gBoundReadTest --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-bound-read-rs mongosh --port 27486 --quiet --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-bound-read-rs mongosh --port 27486 --quiet --eval 'if(rs.initiate({_id:"gBoundReadTest",members:[{_id:0,host:"127.0.0.1:27486"}]}).ok !== 1) quit(1)'
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-bound-read-rs mongosh --port 27486 --quiet --eval 'const h=db.hello(); if(h.setName !== "gBoundReadTest" || h.isWritablePrimary !== true) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Test bounded observer and real credential races
        env:
          GOOGLE_BOUND_READ_TEST_MONGO_URI: mongodb://127.0.0.1:27486/
          GOOGLE_REFRESH_CAS_TEST_MONGO_URI: mongodb://127.0.0.1:27486/
          PYTHONPATH: backend
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -W error --junitxml=merchant-results.xml backend/tests/test_google_merchant_product_observation.py backend/tests/test_google_bound_read_session.py backend/tests/test_google_bound_read_session_mongo.py backend/tests/test_google_ads_reporting_v1.py backend/tests/test_google_credential_refresh_cas.py backend/tests/test_google_credential_refresh_cas_mongo.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases=ET.parse('merchant-results.xml').getroot().findall('.//testcase')
          native=[c for c in cases if c.attrib.get('classname','').endswith('test_google_bound_read_session_mongo')]
          old_cas=[c for c in cases if c.attrib.get('classname','').endswith('test_google_credential_refresh_cas_mongo')]
          assert len(cases) == 248 and len(native) == 10 and len(old_cas) == 21
          assert not [c for c in cases if any(c.find(x) is not None for x in ('skipped','failure','error'))]
          assert any(c.attrib.get('name') == 'test_real_refresh_commit_lost_ack_never_opens_read_session_or_retries' for c in native)
          print('Verified248 tests including10 bound-read and21 existing refresh Mongo cases; zero skips')
          PY
      - name: Remove disposable replica
        if: always()
        run: docker rm -f google-bound-read-rs
