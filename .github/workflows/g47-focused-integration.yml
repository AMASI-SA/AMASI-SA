name: G47 Focused Integration

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
      - codex/review-completion-resumable
      - chatgpt/mz2-ad-financial-accounts-opening-balances-20260922
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/benchmark_order_cost_authority.py"
      - "scripts/repair_order_cost_reporting.py"
      - "scripts/repair_bundle_base_definition.py"
      - "scripts/repair_salla_products_projection.py"
      - ".github/workflows/g47-focused-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g47-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: G47 real Mongo purchase, payment, opening and component lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=g47test
      MZ2_TEST_STANDALONE_URI: mongodb://127.0.0.1:27019/?directConnection=true
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1 pydantic==2.13.5 pymongo==4.18.2 motor==3.7.1
          pytest==9.0.3 pytest-asyncio==1.3.0 httpx==0.28.1
          openpyxl==3.1.5 python-dotenv==1.2.3 cryptography==50.0.0
          bcrypt==4.1.3 PyJWT==2.13.0 python-multipart==0.0.20
          mongomock-motor==0.0.36 reportlab==5.0.1 Pillow==12.3.0
          qrcode==8.2 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 tzdata==2026.4
      - name: Start ephemeral loopback-only Mongo fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name g47-rs -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet g47test --bind_ip_all --setParameter transactionLifetimeLimitSeconds=5
          docker run -d --name g47-standalone -p 127.0.0.1:27019:27019 mongo:8.0.12 --port 27019 --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec g47-rs mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec g47-rs mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"g47test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 40); do
            if docker exec g47-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec g47-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'
          docker exec g47-standalone mongosh --port 27019 --quiet --eval 'const h=db.hello(); if(h.setName || !h.isWritablePrimary){quit(1)}'
      - name: Verify current Salla products projection and bounded repair
        env:
          PYTHONPATH: ".:tests"
        run: |
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short \
            tests/test_salla_products_projection.py \
            tests/test_salla_products_projection_integration.py \
            tests/test_salla_products_projection_repair.py \
            tests/test_salla_order_items_snapshot.py \
            tests/test_salla_raw_snapshot_preservation.py \
            tests/test_salla_single_order_status_resync.py \
            tests/test_order_engine_salla_refresh.py \
            tests/test_salla_scheduled_reconciliation.py \
            tests/test_salla_sync_component_snapshot.py \
            tests/test_sold_product_cost_details.py \
            tests/test_report_raw_option_recovery.py \
            tests/test_report_option_identity.py \
            --junitxml="$RUNNER_TEMP/salla-products-projection.xml"
      - name: Require Salla projection transactions to execute without skips
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ["RUNNER_TEMP"]) / "salla-products-projection.xml"
          cases = list(ET.parse(report).iter("testcase"))
          assert cases, "No Salla projection tests executed"
          rejected = [(row.get("classname"), row.get("name")) for row in cases
                      if any(row.find(tag) is not None for tag in ("skipped", "failure", "error"))]
          assert not rejected, f"Salla projection skipped or failed: {rejected}"
          expected = {"test_salla_products_projection", "test_salla_products_projection_integration",
                      "test_salla_products_projection_repair", "test_salla_order_items_snapshot",
                      "test_salla_sync_component_snapshot"}
          observed = {part for row in cases for part in row.get("classname", "").split(".")}
          assert expected <= observed, f"Missing suites: {sorted(expected - observed)}"
          print(f"Salla projection: {len(cases)} executed cases, zero skips/failures/errors")
          PY
      - name: Retain Salla projection and transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salla-products-projection-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/salla-products-projection.xml
          if-no-files-found: error
      - name: Run all G47 acceptance suites with real transactions
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/test_g47_opening_inventory.py
          test -f tests/test_g47_supplier_payment_integration.py
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short \
            tests/test_g47*.py tests/test_stock_component_consumption.py \
            tests/test_bundle_catalog_v2.py tests/test_bundle_fulfillment_v2.py tests/test_sold_bundles_v2.py \
            tests/test_product_bundle_policy.py tests/test_bundle_composition_lifecycle.py \
            tests/test_bundle_composition_acceptance.py \
            --junitxml="$RUNNER_TEMP/g47-backend.xml"
      - name: Require executed passing tests with no skips
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ["RUNNER_TEMP"]) / "g47-backend.xml"
          cases = list(ET.parse(report).iter("testcase"))
          assert cases, "No G47 tests executed"
          rejected = [(row.attrib.get("classname"), row.attrib.get("name")) for row in cases
                      if any(row.find(tag) is not None for tag in ("skipped", "failure", "error"))]
          assert not rejected, f"G47 skipped or failed cases: {rejected}"
          expected = {path.stem for path in Path("tests").glob("test_g47*.py")} | {"test_stock_component_consumption"}
          expected |= {"test_bundle_catalog_v2", "test_bundle_fulfillment_v2", "test_sold_bundles_v2"}
          expected |= {"test_product_bundle_policy", "test_bundle_composition_lifecycle"}
          expected |= {"test_bundle_composition_acceptance"}
          observed = {part for row in cases for part in row.attrib.get("classname", "").split(".")}
          assert expected <= observed, f"Suites without executed cases: {sorted(expected - observed)}"
          print(f"G47: {len(cases)} executed test cases, zero skips/failures/errors")
          PY
      - name: Retain G47 backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g47-backend-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/g47-backend.xml
          if-no-files-found: error
      - name: Run unified bundle cost and historical reporting acceptance
        shell: bash
        env:
          PYTHONPATH: ".:tests"
        run: |
          set -euo pipefail
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short \
            tests/test_order_cost_authority.py \
            tests/test_bundle_reporting_financial.py \
            tests/test_bundle_reporting_cost_policy.py \
            tests/test_bundle_financial_lifecycle.py \
            tests/test_order_cost_identity_projection.py \
            tests/test_authority_review_regressions.py \
            tests/test_order_cost_final_review.py \
            tests/test_order_cost_authority_mongo.py \
            tests/test_order_option_cost_snapshots.py \
            tests/test_dashboard_bundle_cost_authority.py \
            tests/test_dashboard_v2_product_cost.py \
            tests/test_sold_products_report_v2.py \
            tests/test_order_currency_accounting.py \
            tests/test_order_cost_reporting_repair.py \
            tests/test_order_cost_financial_readers.py \
            tests/test_customer_cohort_profit_report.py \
            tests/test_mezan_attribution_profit_bridge.py \
            tests/test_mezan_attribution_owner_routes.py \
            tests/test_bundle_base_definition_repair.py \
            tests/test_snapchat_bundle_cost_authority.py \
            tests/test_snapchat_campaign_profitability_exact_reuse_v2.py \
            tests/test_snapchat_campaign_created_order_semantics_v1.py \
            tests/test_snapchat_campaign_current_catalog_cost_v1.py \
            tests/test_snapchat_profitability_cache_scope_v1.py \
            tests/test_marketing_bundle_cost_authority.py \
            tests/test_marketing_report_orders.py \
            tests/test_marketing_reports.py \
            --junitxml="$RUNNER_TEMP/g47-order-cost.xml"
      - name: Require executed cost acceptance and real Mongo tests without skips
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ["RUNNER_TEMP"]) / "g47-order-cost.xml"
          cases = list(ET.parse(report).iter("testcase"))
          assert cases, "No order cost acceptance tests executed"
          rejected = [(row.attrib.get("classname"), row.attrib.get("name")) for row in cases
                      if any(row.find(tag) is not None for tag in ("skipped", "failure", "error"))]
          assert not rejected, f"Order cost skipped or failed cases: {rejected}"
          expected = {
              "test_order_cost_authority", "test_order_cost_identity_projection",
              "test_bundle_reporting_financial", "test_bundle_reporting_cost_policy", "test_bundle_financial_lifecycle",
              "test_authority_review_regressions", "test_order_cost_final_review",
              "test_order_cost_authority_mongo", "test_order_option_cost_snapshots",
              "test_dashboard_bundle_cost_authority", "test_dashboard_v2_product_cost",
              "test_sold_products_report_v2", "test_order_currency_accounting",
              "test_order_cost_reporting_repair", "test_bundle_base_definition_repair",
              "test_order_cost_financial_readers", "test_customer_cohort_profit_report",
              "test_mezan_attribution_profit_bridge",
              "test_mezan_attribution_owner_routes",
              "test_snapchat_bundle_cost_authority", "test_snapchat_campaign_profitability_exact_reuse_v2",
              "test_snapchat_campaign_created_order_semantics_v1", "test_snapchat_campaign_current_catalog_cost_v1",
              "test_snapchat_profitability_cache_scope_v1", "test_marketing_bundle_cost_authority",
              "test_marketing_report_orders", "test_marketing_reports",
          }
          observed = {part for row in cases for part in row.attrib.get("classname", "").split(".")}
          assert expected <= observed, f"Cost suites without executed cases: {sorted(expected - observed)}"
          print(f"Order cost: {len(cases)} executed cases, zero skips/failures/errors")
          PY
      - name: Retain unified order cost test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g47-order-cost-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/g47-order-cost.xml
          if-no-files-found: error
      - name: Remove only this job's ephemeral Mongo fixtures
        if: always()
        run: docker rm --force g47-rs g47-standalone

  frontend-test-and-build:
    name: G47 purchase and receiving UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install locked frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test purchase approval, supplier payment and inventory receiving UI
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/pages/PurchaseInvoices.test.jsx src/pages/InventoryReceivingWorkspace.test.jsx
          src/services/productBundles.test.js
          src/components/products/BundleEditor.test.jsx
          src/components/products/BundleProductPolicy.test.jsx
          src/components/products/BundleCostPolicy.test.jsx
          src/components/products/BundleReportPanel.test.jsx
          src/components/products/ProductCreationPanel.test.jsx
          src/components/orders/BundleOperationalPanel.test.jsx
          src/pages/OrderDetailsV2.shippingIdentity.test.jsx
          --json --outputFile="$RUNNER_TEMP/g47-frontend.json"
      - name: Require executed UI tests with no skips
        if: always()
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'g47-frontend.json'), 'utf8'));
          if (!report.success || !report.numPassedTests || report.numPendingTests || report.numTodoTests || report.numFailedTests) {
            throw new Error('G47 UI requires passing executed tests and zero skips/todos/failures');
          }
          console.log(`G47 UI: ${report.numPassedTests} passed, zero skips`);
          JS
      - name: Retain G47 UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g47-frontend-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/g47-frontend.json
          if-no-files-found: error
      - name: Build current source through the existing GitHub entry point
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: https://mezansalla.com
        run: yarn build
