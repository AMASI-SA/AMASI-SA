name: Temporary Fix Salla Snapchat Totals

on:
  push:
    branches:
      - feat/prod-snapchat-results-source-toggle-v1
    paths:
      - ".github/workflows/tmp-fix-salla-snapchat-totals.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prod-snapchat-results-source-toggle-v1
          fetch-depth: 0
      - name: Separate platform totals from campaign attribution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/integrations_control_center/snapchat_campaign_result_source_routes.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("async def _salla_outcomes(")
          end = text.index("\n\ndef _native_summary", start)
          replacement = '''async def _salla_outcomes(
              db: Any,
              user_id: str,
              *,
              date_from: str,
              date_to: str,
              identities: list[dict[str, Any]],
          ) -> tuple[dict[tuple[str, str], dict[str, Any]], dict[str, dict[str, Any]], dict[str, dict[str, Any]], dict[str, Any]]:
              from dashboard_v2_routes import _filtered_orders

              orders = await _filtered_orders(
                  db,
                  user_id,
                  from_date=date_from,
                  to_date=date_to,
                  payment_methods=None,
                  shipping_companies=None,
              )
              id_lookup = _unique_lookup(identities, "campaign_id")
              name_lookup = _unique_lookup(identities, "campaign_name")
              by_campaign: dict[tuple[str, str], dict[str, Any]] = defaultdict(
                  lambda: {"orders": 0, "sales_sar": 0.0}
              )
              by_account: dict[str, dict[str, Any]] = defaultdict(
                  lambda: {"orders": 0, "sales_sar": 0.0}
              )
              # Daily and headline totals include every financially included
              # Salla order proven to be Snapchat, even when Salla omitted the
              # campaign identity. Campaign/account rows remain exact-match only.
              by_date: dict[str, dict[str, Any]] = defaultdict(
                  lambda: {"orders": 0, "sales_sar": 0.0}
              )
              source_total = {"orders": 0, "sales_sar": 0.0}
              matched_by_id = 0
              matched_by_name = 0
              matched_sales_sar = 0.0
              ambiguous = 0
              ambiguous_sales_sar = 0.0
              unmatched_snapchat = 0
              unmatched_snapchat_sales_sar = 0.0

              for order in orders:
                  key, match_kind = _match_order_campaign(
                      order,
                      id_lookup=id_lookup,
                      name_lookup=name_lookup,
                  )
                  amount = _number(order.get("total_amount") or order.get("total")) or 0.0
                  order_date = _text(order.get("order_date"))[:10]
                  source_is_snapchat = _source_is_snapchat(order)
                  belongs_to_snapchat = key is not None or source_is_snapchat

                  if belongs_to_snapchat:
                      source_total["orders"] += 1
                      source_total["sales_sar"] += amount
                      if order_date:
                          by_date[order_date]["orders"] += 1
                          by_date[order_date]["sales_sar"] += amount

                  if key is None:
                      if match_kind.startswith("ambiguous"):
                          ambiguous += 1
                          ambiguous_sales_sar += amount
                      elif source_is_snapchat:
                          unmatched_snapchat += 1
                          unmatched_snapchat_sales_sar += amount
                      continue

                  if match_kind == "campaign_id":
                      matched_by_id += 1
                  elif match_kind == "campaign_name":
                      matched_by_name += 1
                  matched_sales_sar += amount
                  by_campaign[key]["orders"] += 1
                  by_campaign[key]["sales_sar"] += amount
                  by_account[key[0]]["orders"] += 1
                  by_account[key[0]]["sales_sar"] += amount

              for container in (by_campaign, by_account, by_date):
                  for value in container.values():
                      value["sales_sar"] = round(float(value["sales_sar"]), 2)
              source_total["sales_sar"] = round(float(source_total["sales_sar"]), 2)
              coverage = {
                  "eligible_salla_orders": len(orders),
                  "salla_snapchat_orders": int(source_total["orders"]),
                  "salla_snapchat_sales_sar": source_total["sales_sar"],
                  "matched_orders": matched_by_id + matched_by_name,
                  "matched_sales_sar": round(matched_sales_sar, 2),
                  "matched_by_campaign_id": matched_by_id,
                  "matched_by_campaign_name": matched_by_name,
                  "ambiguous_orders": ambiguous,
                  "ambiguous_sales_sar": round(ambiguous_sales_sar, 2),
                  "unattributed_snapchat_orders": unmatched_snapchat,
                  "unattributed_snapchat_sales_sar": round(unmatched_snapchat_sales_sar, 2),
                  "provider_conversion_sales_excluded": True,
              }
              return dict(by_campaign), dict(by_account), dict(by_date), coverage
          '''
          # Strip the indentation introduced by this workflow's Python block.
          import textwrap
          replacement = textwrap.dedent(replacement)
          text = text[:start] + replacement + text[end:]
          old_totals = '''    if result_source == RESULT_SOURCE_SALLA:
                  total_orders = sum(int(value.get("orders") or 0) for value in salla_by_campaign.values())
                  total_sales = round(sum(float(value.get("sales_sar") or 0) for value in salla_by_campaign.values()), 2)
          '''
          old_totals = textwrap.dedent(old_totals)
          new_totals = '''    if result_source == RESULT_SOURCE_SALLA:
                  total_orders = int(coverage.get("salla_snapchat_orders") or 0)
                  total_sales = round(float(coverage.get("salla_snapchat_sales_sar") or 0), 2)
          '''
          new_totals = textwrap.dedent(new_totals)
          if old_totals not in text:
              raise SystemExit("totals anchor not found")
          text = text.replace(old_totals, new_totals, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify totals contract
        run: |
          python -m py_compile backend/integrations_control_center/snapchat_campaign_result_source_routes.py
          grep -q 'salla_snapchat_orders' backend/integrations_control_center/snapchat_campaign_result_source_routes.py
          grep -q 'salla_snapchat_sales_sar' backend/integrations_control_center/snapchat_campaign_result_source_routes.py
          grep -q 'belongs_to_snapchat = key is not None or source_is_snapchat' backend/integrations_control_center/snapchat_campaign_result_source_routes.py
      - name: Commit totals fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/integrations_control_center/snapchat_campaign_result_source_routes.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(prod-snap): include unattributed Salla Snapchat orders in totals"
          git push origin HEAD:feat/prod-snapchat-results-source-toggle-v1
