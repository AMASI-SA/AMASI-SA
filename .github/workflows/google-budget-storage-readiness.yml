name: Google budget storage diagnostic
on:
  push:
    branches: [codex/google-budget-storage-readiness-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_ads_budget_storage_readiness.py
      - backend/tests/test_google_ads_budget_storage_readiness*.py
      - .github/workflows/google-budget-storage-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      GOOGLE_ADS_TEST_MONGO_URI: mongodb://127.0.0.1:27472/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused production-compatible test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 starlette==1.3.1 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 dnspython==2.9.0 httpx==0.28.1
          python-multipart==0.0.31 cryptography==50.0.0
          PyJWT==2.15.0 bcrypt==4.1.3 python-dotenv==1.2.2
          pillow==13.0.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.0.3 pytest-asyncio==1.4.0
      - name: Start disposable loopback-only Mongo replica set
        shell: bash
        run: |
          set -euo pipefail
          uname -r
          docker run -d --name google-budget-guard-rs \
            -p 127.0.0.1:27472:27472 mongo:8.0.26 \
            --port 27472 --replSet gBudgetGuard --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-budget-guard-rs)" != true ]; then
              docker logs google-budget-guard-rs
              exit 1
            fi
            if docker exec google-budget-guard-rs mongosh --port 27472 --quiet \
              --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-budget-guard-rs mongosh --port 27472 --quiet \
            --eval 'const result=rs.initiate({_id:"gBudgetGuard",members:[{_id:0,host:"127.0.0.1:27472"}]}); if(result.ok !== 1) quit(1)'
          primary=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-budget-guard-rs)" != true ]; then
              docker logs google-budget-guard-rs
              exit 1
            fi
            if docker exec google-budget-guard-rs mongosh --port 27472 --quiet \
              --eval 'const hello=db.hello(); if(hello.setName !== "gBudgetGuard" || hello.isWritablePrimary !== true || !Number.isInteger(hello.logicalSessionTimeoutMinutes)) quit(1)'; then
              primary=1
              break
            fi
            sleep 1
          done
          test "$primary" -eq 1
      - name: Verify diagnostic and unchanged policy contracts
        run: |
          python -m pytest --noconftest -q --junitxml=storage-readiness.xml \
            backend/tests/test_google_ads_budget_storage_readiness.py \
            backend/tests/test_google_ads_budget_storage_readiness_mongo.py \
            backend/tests/test_google_ads_automation_policy.py \
            backend/tests/test_google_ads_automation_creation_policy.py
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse('storage-readiness.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) >= 107
          assert not root.findall('.//skipped') and not root.findall('.//failure') and not root.findall('.//error')
          assert any('readiness_mongo' in case.get('classname','') for case in cases)
          print({'tests':len(cases),'failures_errors_skips':0})
          PYCODE
      - name: Remove disposable replica container
        if: always()
        run: docker rm -f google-budget-guard-rs || true
