name: Apply Snapchat OAuth Stability Fix V2

on:
  push:
    branches:
      - fix/snapchat-oauth-stability-v2
    paths:
      - .github/workflows/apply-snapchat-oauth-stability-v2.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/snapchat-oauth-stability-v2
          fetch-depth: 0
      - name: Apply focused OAuth stability fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/integrations_control_center/snapchat_native_data_common.py')
          text = path.read_text()

          get_start = text.index('    async def get_json(')
          access_start = text.index('\n    async def access_token(', get_start)
          get_method = r'''    async def get_json(self, client: httpx.AsyncClient, url: str, *,
                       headers: dict[str, str], params: dict[str, Any] | None = None) -> dict:
        async def request(active_headers: dict[str, str]) -> httpx.Response:
            self.provider_calls += 1
            if self.provider_calls > MAX_PROVIDER_CALLS:
                raise SnapchatNativeSyncError(
                    "snapchat_provider_call_budget_exceeded",
                    f"Snapchat sync exceeded the {MAX_PROVIDER_CALLS} call budget.",
                    status_code=400,
                )
            try:
                return await client.get(url, headers=active_headers, params=params)
            except httpx.HTTPError as exc:
                raise SnapchatNativeSyncError(
                    "snapchat_provider_network_error", "Snapchat provider request failed.",
                    status_code=502, retryable=True,
                ) from exc

        response = await request(headers)
        if response.status_code == 401:
            fresh_access = await self.access_token(force_refresh=True)
            retry_headers = dict(headers)
            retry_headers["Authorization"] = f"Bearer {fresh_access}"
            response = await request(retry_headers)
        if response.status_code == 401:
            raise SnapchatNativeSyncError(
                "snapchat_needs_reauth", "Snapchat authorization must be renewed.",
                status_code=409, result={"needs_reauth": True},
            )
        if response.status_code >= 400:
            try:
                provider_payload = response.json() or {}
            except (TypeError, ValueError):
                provider_payload = {}
            detail = _safe_provider_error_detail(provider_payload)
            provider_code = detail.get("provider_error_code", "")
            provider_message = detail.get("provider_error_message", "")
            safe_suffix = ": ".join(
                part for part in (provider_code, provider_message) if part
            )
            message = "Snapchat rejected a read-only data request."
            if safe_suffix:
                message = f"{message} Provider: {safe_suffix}"
            raise SnapchatNativeSyncError(
                f"snapchat_provider_http_{response.status_code}",
                message,
                status_code=502,
                retryable=response.status_code >= 500 or response.status_code == 429,
                result=detail,
            )
        try:
            payload = response.json() or {}
        except (TypeError, ValueError) as exc:
            raise SnapchatNativeSyncError(
                "snapchat_provider_invalid_json", "Snapchat returned an invalid response.",
                status_code=502, retryable=True,
            ) from exc
        if not isinstance(payload, dict):
            raise SnapchatNativeSyncError(
                "snapchat_provider_invalid_payload", "Snapchat returned an invalid response.",
                status_code=502, retryable=True,
            )
        request_status = str(payload.get("request_status") or "").upper()
        if "FAIL" in request_status or "ERROR" in request_status:
            raise SnapchatNativeSyncError(
                "snapchat_provider_request_failed",
                "Snapchat reported a failed read-only request.", status_code=502, retryable=True,
            )
        return payload
'''
          text = text[:get_start] + get_method + text[access_start:]

          access_start = text.index('    async def access_token(')
          to_sar_start = text.index('\n    async def to_sar(', access_start)
          access_method = r'''    async def access_token(self, *, force_refresh: bool = False) -> str:
        credentials = await _collection(self.db, SNAPCHAT_CREDENTIALS_COLLECTION).find_one(
            {"user_id": self.user_id, "provider": SNAPCHAT_PROVIDER_ID},
            {"_id": 0, "access_token_ciphertext": 1, "refresh_token_ciphertext": 1,
             "access_token_expires_at": 1, "scope": 1},
        )
        if not credentials:
            raise SnapchatNativeSyncError(
                "snapchat_not_connected", "Snapchat is not connected through Mezan V2.",
                status_code=409,
            )
        try:
            access = decrypt_snapchat_token(credentials.get("access_token_ciphertext"))
            refresh = decrypt_snapchat_token(credentials.get("refresh_token_ciphertext"))
        except ValueError as exc:
            raise SnapchatNativeSyncError(
                "snapchat_credential_decryption_failed",
                "Snapchat credentials could not be decrypted.", status_code=500,
            ) from exc
        if not refresh:
            raise SnapchatNativeSyncError(
                "snapchat_needs_reauth", "Snapchat authorization must be renewed.",
                status_code=409, result={"needs_reauth": True},
            )
        expires_at = credentials.get("access_token_expires_at")
        if isinstance(expires_at, str):
            expires_at = _parse_datetime(expires_at)
        if (
            not force_refresh
            and access
            and isinstance(expires_at, datetime)
            and expires_at.astimezone(timezone.utc)
            > self.now().astimezone(timezone.utc) + timedelta(seconds=120)
        ):
            return access

        client_id = os.environ.get("SNAPCHAT_MARKETING_CLIENT_ID", "").strip()
        client_secret = os.environ.get("SNAPCHAT_MARKETING_CLIENT_SECRET", "").strip()
        if not client_id or not client_secret:
            raise SnapchatNativeSyncError(
                "snapchat_oauth_not_configured",
                "Snapchat platform OAuth settings are incomplete.", status_code=503,
            )

        async def refresh_request(refresh_value: str) -> httpx.Response:
            data = {
                "refresh_token": refresh_value,
                "client_id": client_id,
                "client_secret": client_secret,
                "grant_type": "refresh_token",
            }
            try:
                async with httpx.AsyncClient(timeout=25.0) as client:
                    response = await client.post(SNAPCHAT_TOKEN_URL, data=data)
                    if response.status_code == 400 and "invalid_client" in (response.text or "").lower():
                        response = await client.post(
                            SNAPCHAT_TOKEN_URL,
                            data={"refresh_token": refresh_value, "grant_type": "refresh_token"},
                            auth=(client_id, client_secret),
                        )
                    return response
            except httpx.HTTPError as exc:
                raise SnapchatNativeSyncError(
                    "snapchat_token_refresh_failed", "Snapchat token refresh failed.",
                    status_code=502, retryable=True,
                ) from exc

        response = await refresh_request(refresh)
        if response.status_code >= 400:
            try:
                error_payload = response.json() or {}
            except (TypeError, ValueError):
                error_payload = {}
            combined_error = " ".join(
                [
                    str(error_payload.get("error") or "").lower(),
                    str(error_payload.get("error_description") or "").lower(),
                    (response.text or "").lower(),
                ]
            )
            if "invalid_grant" in combined_error:
                latest = await _collection(self.db, SNAPCHAT_CREDENTIALS_COLLECTION).find_one(
                    {"user_id": self.user_id, "provider": SNAPCHAT_PROVIDER_ID},
                    {"_id": 0, "refresh_token_ciphertext": 1},
                )
                try:
                    latest_refresh = decrypt_snapchat_token(
                        (latest or {}).get("refresh_token_ciphertext")
                    )
                except ValueError:
                    latest_refresh = ""
                if latest_refresh and latest_refresh != refresh:
                    refresh = latest_refresh
                    response = await refresh_request(refresh)
                    if response.status_code >= 400:
                        try:
                            retry_error_payload = response.json() or {}
                        except (TypeError, ValueError):
                            retry_error_payload = {}
                        combined_error = " ".join(
                            [
                                str(retry_error_payload.get("error") or "").lower(),
                                str(retry_error_payload.get("error_description") or "").lower(),
                                (response.text or "").lower(),
                            ]
                        )
                if response.status_code >= 400 and "invalid_grant" in combined_error:
                    raise SnapchatNativeSyncError(
                        "snapchat_needs_reauth", "Snapchat authorization must be renewed.",
                        status_code=409, result={"needs_reauth": True},
                    )
            if response.status_code >= 400:
                if "invalid_client" in combined_error:
                    raise SnapchatNativeSyncError(
                        "snapchat_oauth_not_configured",
                        "Snapchat OAuth client credentials were rejected.",
                        status_code=503,
                    )
                raise SnapchatNativeSyncError(
                    "snapchat_token_refresh_rejected",
                    "Snapchat temporarily rejected the token refresh.",
                    status_code=502,
                    retryable=response.status_code >= 500 or response.status_code == 429,
                )
        try:
            payload = response.json() or {}
        except (TypeError, ValueError) as exc:
            raise SnapchatNativeSyncError(
                "snapchat_token_refresh_invalid_json", "Snapchat token response was invalid.",
                status_code=502, retryable=True,
            ) from exc
        access = str(payload.get("access_token") or "").strip()
        if not access:
            raise SnapchatNativeSyncError(
                "snapchat_token_missing", "Snapchat token response was incomplete.",
                status_code=502, retryable=True,
            )
        refresh = str(payload.get("refresh_token") or refresh).strip()
        expires_in = int(payload.get("expires_in") or 3600)
        now = self.now().astimezone(timezone.utc)
        await _collection(self.db, SNAPCHAT_CREDENTIALS_COLLECTION).update_one(
            {"user_id": self.user_id, "provider": SNAPCHAT_PROVIDER_ID},
            {"$set": {
                "access_token_ciphertext": encrypt_snapchat_token(access),
                "refresh_token_ciphertext": encrypt_snapchat_token(refresh),
                "access_token_expires_at": now + timedelta(seconds=expires_in),
                "scope": payload.get("scope") or credentials.get("scope")
                         or list(SNAPCHAT_REQUESTED_SCOPES),
                "last_refresh_success_at": now,
                "updated_at": now,
            }},
        )
        return access
'''
          text = text[:access_start] + access_method + text[to_sar_start:]
          path.write_text(text)

          test = Path('backend/tests/test_snapchat_oauth_stability_contract.py')
          test.write_text(r'''from pathlib import Path

SOURCE = Path("backend/integrations_control_center/snapchat_native_data_common.py")


def source():
    return SOURCE.read_text()


def test_401_refreshes_once_before_reauth():
    text = source()
    assert "if response.status_code == 401:" in text
    assert "self.access_token(force_refresh=True)" in text
    assert 'retry_headers["Authorization"] = f"Bearer {fresh_access}"' in text


def test_403_does_not_disconnect_entire_snapchat_grant():
    text = source()
    assert 'f"snapchat_provider_http_{response.status_code}"' in text
    get_json = text[text.index("    async def get_json("):text.index("    async def access_token(")]
    assert 'if response.status_code in {401, 403}' not in get_json


def test_only_explicit_invalid_grant_marks_refresh_as_needing_reauth():
    text = source()
    access = text[text.index("    async def access_token("):text.index("    async def to_sar(")]
    assert '"invalid_grant" in combined_error' in access
    assert '"invalid_client" in combined_error' in access
    assert "last_refresh_success_at" in access
    assert "latest_refresh != refresh" in access
''')
          PY

          python -m py_compile backend/integrations_control_center/snapchat_native_data_common.py
          python -m pytest -q backend/tests/test_snapchat_oauth_stability_contract.py backend/tests/test_snapchat_native_data_sync_v2.py backend/tests/test_snapchat_native_tracking_diagnostics_v2.py

          git config user.name "mezan"
          git config user.email "amasi.jewelery@gmail.com"
          git add backend/integrations_control_center/snapchat_native_data_common.py backend/tests/test_snapchat_oauth_stability_contract.py
          git commit -m "fix(snapchat): keep OAuth grant stable across token refreshes" || exit 0
          git push origin HEAD:fix/snapchat-oauth-stability-v2
