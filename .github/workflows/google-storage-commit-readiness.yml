name: Google storage commit preflight
on:
  push:
    branches: [codex/google-storage-commit-readiness-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_ads_storage_commit_readiness.py
      - backend/tests/test_google_ads_storage_commit_readiness*.py
      - .github/workflows/google-storage-commit-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      GOOGLE_ADS_TEST_MONGO_URI: mongodb://127.0.0.1:27472/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused production-compatible test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 starlette==1.3.1 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 dnspython==2.9.0 httpx==0.28.1
          python-multipart==0.0.31 cryptography==50.0.0
          PyJWT==2.15.0 bcrypt==4.1.3 python-dotenv==1.2.2
          pillow==13.0.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.0.3 pytest-asyncio==1.4.0
      - name: Start disposable loopback-only Mongo replica set
        shell: bash
        run: |
          set -euo pipefail
          uname -r
          docker run -d --name google-commit-preflight-rs \
            -p 127.0.0.1:27472:27472 mongo:8.0.26 \
            --port 27472 --replSet gBudgetGuard --bind_ip_all --setParameter enableTestCommands=1
          ready=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-commit-preflight-rs)" != true ]; then
              docker logs google-commit-preflight-rs
              exit 1
            fi
            if docker exec google-commit-preflight-rs mongosh --port 27472 --quiet \
              --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-commit-preflight-rs mongosh --port 27472 --quiet \
            --eval 'const result=rs.initiate({_id:"gBudgetGuard",members:[{_id:0,host:"127.0.0.1:27472"}]}); if(result.ok !== 1) quit(1)'
          primary=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-commit-preflight-rs)" != true ]; then
              docker logs google-commit-preflight-rs
              exit 1
            fi
            if docker exec google-commit-preflight-rs mongosh --port 27472 --quiet \
              --eval 'const hello=db.hello(); if(hello.setName !== "gBudgetGuard" || hello.isWritablePrimary !== true || !Number.isInteger(hello.logicalSessionTimeoutMinutes)) quit(1)'; then
              primary=1
              break
            fi
            sleep 1
          done
          test "$primary" -eq 1
      - name: Prove commit readback cleanup and preserved handlers
        run: |
          python -m pytest --noconftest -q -s -W error --durations=5 --junitxml=commit-preflight.xml \
            backend/tests/test_google_ads_storage_commit_readiness.py \
            backend/tests/test_google_ads_storage_commit_readiness_mongo.py \
            backend/tests/test_google_ads_automation_policy.py \
            backend/tests/test_google_ads_automation_creation_policy.py
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root=ET.parse('commit-preflight.xml').getroot()
          cases=root.findall('.//testcase')
          assert len(cases)>=117
          assert not root.findall('.//skipped') and not root.findall('.//failure') and not root.findall('.//error')
          assert sum('readiness_mongo' in case.get('classname','') for case in cases)==6
          print({'tests':len(cases),'actual_replica_tests':6,'failures_errors_skips':0})
          PYCODE
      - name: Remove disposable replica
        if: always()
        run: docker rm -f google-commit-preflight-rs || true
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Governed toolchain
        run: python scripts/frontend_release_toolchain.py ensure
      - name: Frozen install
        run: python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend install --frozen-lockfile --non-interactive
      - name: Test explicit diagnostic and workspace compatibility
        env:
          CI: "true"
        run: >-
          python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/GoogleStorageCommitReadiness.test.jsx
          src/components/marketing/GoogleAdsWorkspace.test.jsx
      - name: Build current reviewed checkout
        env:
          REACT_APP_BACKEND_URL: https://mezansalla.com
        run: python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend build
