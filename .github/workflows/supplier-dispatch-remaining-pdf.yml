name: Supplier dispatch remaining PDF

on:
  pull_request:
    paths:
      - "backend/supplier_dispatch_pdf.py"
      - "backend/tests/test_supplier_dispatch_remaining_pdf.py"
      - ".github/workflows/supplier-dispatch-remaining-pdf.yml"

permissions:
  contents: read

jobs:
  remaining-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install isolated PDF test dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          motor==3.3.1
          pytest
          openpyxl
          cryptography
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Compile remaining PDF boundary
        run: >-
          python -m py_compile
          backend/supplier_dispatch_pdf.py
          backend/tests/test_supplier_dispatch_remaining_pdf.py
      - name: Run remaining PDF selection tests
        run: >-
          python -m pytest -q
          backend/tests/test_supplier_dispatch_remaining_pdf.py
          --tb=short
