name: One-time V5 PR1711 reviewed intent builder
on:
  push:
    branches:
      - codex/mezan-v5-1711-intent-builder-20261104

permissions:
  contents: write

concurrency:
  group: v5-pr1711-one-time-intent
  cancel-in-progress: false

jobs:
  build-intent-only:
    name: Reproduce and publish reviewed B only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      REACT_APP_BACKEND_URL: https://mezansalla.com
      SOURCE_A: 26b92e50e2b07dd3deb7f82cabc4c78c36760729
      BASE_J: e01d4d3920fc5bf4a7280757ca2030c30b4be9c8
      PROD_BRANCH: hotfix/prod-snap-meta-final
      TARGET_BRANCH: release/salla-recipient-1711-v5-isolated-20261103
      EXPECTED_RELEASE_ID: rg5-2e3b4536268f92dee87e7bf11938f07ab274300d69ea679b6d1dcffc6854ee04
      EXPECTED_FRONTEND_SHA256: 075582b39ff48961ab88290862a50c8f5feecb3388681b24abfbaf5e38abde29
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Assert exact production source and unchanged target, then checkout A
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$PROD_BRANCH:refs/remotes/origin/$PROD_BRANCH" \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "origin/$PROD_BRANCH")" = "$SOURCE_A"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$SOURCE_A"
          git checkout --detach "$SOURCE_A"
          test "$(git rev-parse HEAD^1)" = "$BASE_J"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git diff --name-only "$BASE_J" "$SOURCE_A" -- release/release-intent-v5.json)"
          python3 -B scripts/production_release_guard.py status | python3 -c 'import json,sys; v=json.load(sys.stdin); assert not v.get("active")'
      - name: Reproducible frontend and candidate freeze on exact A
        shell: bash
        env:
          MEZAN_RELEASE_BOOTSTRAP_INTENT: "1"
        run: |
          set -euo pipefail
          # Build source A from the checked-out Git SHA, not the helper
          # workflow event SHA, as the official V5 adapter requires.
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_WORKSPACE GITHUB_EVENT_NAME GITHUB_EVENT_PATH
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(node --version)" = "v22.23.2"
          test "$(yarn --version)" = "1.22.22"
          yarn --cwd frontend install --frozen-lockfile --non-interactive
          yarn --cwd frontend build:release
          python3 -B scripts/verify_frontend_build.py --expected-git-sha "$SOURCE_A" > "$RUNNER_TEMP/frontend-proof.log"
          python3 -B scripts/emergent_deployment_adapter.py freeze-intent \
            --source-git-sha "$SOURCE_A" \
            --source-base-git-sha "$BASE_J" \
            --branch "$PROD_BRANCH" \
            --output "$RUNNER_TEMP/mezan-1711-intent-v5.json" > "$RUNNER_TEMP/freeze.log"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ["RUNNER_TEMP"]+"/mezan-1711-intent-v5.json"))
          assert p["protocol_version"]==5
          assert p["source_git_sha"]==os.environ["SOURCE_A"]
          assert p["source_base_git_sha"]==os.environ["BASE_J"]
          assert p["branch"]==os.environ["PROD_BRANCH"]
          assert p["runtime_identity"]["release_id"]==os.environ["EXPECTED_RELEASE_ID"]
          assert p["frontend_build"]["artifact_tree_sha256"]==os.environ["EXPECTED_FRONTEND_SHA256"]
          print("V5_CANDIDATE_IDENTITY_MATCHES_USER_BUILD")
          PY
          cp "$RUNNER_TEMP/mezan-1711-intent-v5.json" release/release-intent-v5.json
          test "$(git diff --name-only)" = "release/release-intent-v5.json"
          git diff --check
          test -z "$(git diff --cached --name-only)"
          git add -- release/release-intent-v5.json
          test "$(git diff --cached --name-only)" = "release/release-intent-v5.json"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "release(v5): seal PR1711 recipient address reviewed intent"
          test "$(git rev-parse HEAD^1)" = "$SOURCE_A"
          test "$(git diff --name-only "$SOURCE_A" HEAD)" = "release/release-intent-v5.json"
      - name: Official clean governed build and package boundary checks
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_ACTIONS GITHUB_SHA GITHUB_WORKSPACE GITHUB_EVENT_NAME GITHUB_EVENT_PATH
          python3 -B scripts/emergent_deployment_adapter.py build > "$RUNNER_TEMP/governed-build.log" 2>&1 || { tail -n 75 "$RUNNER_TEMP/governed-build.log"; exit 1; }
          python3 -B scripts/emergent_deployment_adapter.py verify-packages > "$RUNNER_TEMP/package-boundaries.log" 2>&1 || { tail -n 75 "$RUNNER_TEMP/package-boundaries.log"; exit 1; }
          python3 -B scripts/verify_frontend_build.py \
            --expected-git-sha "$SOURCE_A" --reviewed-intent-v5 > "$RUNNER_TEMP/reviewed-frontend.log"
          python3 - <<'PY'
          import json,os
          a=json.load(open("release/release-intent-v5.json"))
          b=json.load(open("backend/release_identity.json"))
          assert a["runtime_identity"]==b
          assert b["release_id"]==os.environ["EXPECTED_RELEASE_ID"]
          print("GOVERNED_V5_B_VERIFIED", b["release_id"])
          PY
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retain reviewed V5 intent as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mezan-1711-reviewed-v5-B
          path: release/release-intent-v5.json
          retention-days: 7
          if-no-files-found: error
      - name: Push exact reviewed B into existing target branch, never Production
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$PROD_BRANCH:refs/remotes/origin/$PROD_BRANCH" \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "origin/$PROD_BRANCH")" = "$SOURCE_A"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$SOURCE_A"
          B="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_A"
          test "$(git diff --name-only "$SOURCE_A" "$B")" = "release/release-intent-v5.json"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$B"
          echo "REVIEWED_V5_B_PUSHED=$B"
          echo "RELEASE_ID=$EXPECTED_RELEASE_ID"
          echo "FRONTEND_SHA256=$EXPECTED_FRONTEND_SHA256"
