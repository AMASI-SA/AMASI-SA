name: Dashboard B concurrency correctness gate
on:
  pull_request:
    paths:
      - 'backend/tests/test_dashboard_b_concurrency_gate.py'
      - '.github/workflows/dashboard-b-concurrency.yml'
      - 'docs/DASHBOARD_B_CONCURRENCY_GATE.md'
permissions:
  contents: read
jobs:
  dashboard-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: '.:tests'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      JWT_SECRET: 'isolated-performance-pr1-ci-only'
      MZ2_TEST_MONGO_URI: 'mongodb://127.0.0.1:27450/?replicaSet=performancepr1'
      DASHBOARD_EVIDENCE_PATH: '${{ github.workspace }}/dashboard-b-evidence.json'
      DASHBOARD_CONCURRENCY_EVIDENCE_PATH: '${{ github.workspace }}/dashboard-concurrency-evidence.json'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: >-
          python -m pip install fastapi==0.110.1 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.1 pytest pytest-asyncio httpx
          mongomock-motor openpyxl cryptography reportlab python-multipart
          pymupdf pillow qrcode arabic-reshaper python-bidi python-dotenv
          PyJWT bcrypt email-validator psutil
      - name: Start isolated MongoDB 8.0.12 replica set
        run: |
          docker run -d --name performance-pr1 --network host mongo:8.0.12 --replSet performancepr1 --bind_ip 127.0.0.1 --port 27450
          for attempt in $(seq 1 30); do
            if docker exec performance-pr1 mongosh --port 27450 --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec performance-pr1 mongosh --port 27450 --quiet --eval 'rs.initiate({_id:"performancepr1",members:[{_id:0,host:"127.0.0.1:27450"}]})'
          for attempt in $(seq 1 30); do
            if docker exec performance-pr1 mongosh --port 27450 --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' ; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify mutation schedules and characterize blocked runtime adoption
        working-directory: backend
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q -s
          tests/test_dashboard_b_concurrency_gate.py
          tests/test_dashboard_b_request_scope_mongo.py::test_full_json_equivalence
          tests/test_dashboard_b_request_scope_mongo.py::test_new_request_observes_changed_database
          tests/test_dashboard_v2_product_cost.py
          tests/test_dashboard_v2_arabic_status_normalization.py
          tests/test_dashboard_v2_salla_ads_executive.py
          tests/test_dashboard_v2_ad_account_costs.py
          --junitxml=../dashboard-concurrency-tests.xml
      - name: Require zero skipped tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          assert not ET.parse('dashboard-concurrency-tests.xml').getroot().findall('.//skipped')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-concurrency-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dashboard-concurrency-evidence.json
            dashboard-concurrency-tests.xml
