name: Products V2

on:
  pull_request:
    paths:
      - "backend/product_v2_routes.py"
      - "backend/order_engine/__init__.py"
      - "backend/tests/test_product_v2_routes.py"
      - "frontend/src/pages/MezanProducts.jsx"
      - "frontend/src/services/mezanProductsV2.js"
      - ".github/workflows/products-v2.yml"
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted dependencies
        run: python -m pip install -q fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 httpx pytest openpyxl
      - name: Run Products V2 unit tests
        run: python -m pytest tests/test_product_v2_routes.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Build frontend
        run: yarn build
