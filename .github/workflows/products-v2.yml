name: Products V2

on:
  pull_request:
    paths:
      - "backend/product_v2_routes.py"
      - "backend/product_v2_sync_hotfix.py"
      - "backend/order_engine/__init__.py"
      - "backend/tests/test_product_v2_routes.py"
      - "backend/tests/test_product_v2_sync_hotfix.py"
      - "frontend/src/pages/MezanProducts.jsx"
      - "frontend/src/services/mezanProductsV2.js"
      - ".github/workflows/products-v2.yml"
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted dependencies
        run: python -m pip install -q fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 httpx pytest openpyxl cryptography
      - name: Run Products V2 unit tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_product_v2_routes.py tests/test_product_v2_sync_hotfix.py -q --tb=short > /tmp/products-v2-pytest.log 2>&1
          status=$?
          cat /tmp/products-v2-pytest.log
          exit $status
      - name: Upload Products V2 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-v2-pytest-log
          path: /tmp/products-v2-pytest.log
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Build frontend
        run: yarn build
