      - "backend/tests/test_order_option_cost_snapshots.py"
      - "frontend/src/pages/MezanProducts.jsx"
      - "frontend/src/pages/MezanProductsAutoSync.jsx"
      - "frontend/src/pages/MezanProductsWorkspace.jsx"
      - "frontend/src/pages/ProductIntakeWorkspace.jsx"
      - "frontend/src/pages/StoreOperationsAccessWorkspace.jsx"
      - "frontend/src/pages/MezanComponents.jsx"
      - "frontend/src/pages/MezanComponentsProduction.jsx"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/components/products/ProductControlCenter.jsx"
      - "frontend/src/components/products/ProductControlCenterPanel.jsx"
      - "frontend/src/components/products/ProductGoogleTaxonomyPilotPanel.jsx"
      - "frontend/src/components/products/ProductMediaDraftEditor.jsx"
      - "frontend/src/components/products/ProductMediaAiProposalPanel.jsx"
