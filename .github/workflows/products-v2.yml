      - "frontend/src/lib/productOperationFreeze.test.js"
      - "frontend/src/services/aiStoreOperations.js"
      - "frontend/src/services/mezanProductsV2.js"
      - "frontend/src/services/mezanComponentCatalog.js"
      - ".github/workflows/products-v2.yml"
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted dependencies
        run: python -m pip install -q fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 httpx openai==1.99.9 pytest pytest-asyncio openpyxl cryptography reportlab python-multipart
      - name: Run Products V2 unit tests
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_product_v2_routes.py \
            tests/test_product_v2_sync_hotfix.py \
            tests/test_product_v2_recent_sync_contract.py \
            tests/test_product_v2_workspace_routes.py \
            tests/test_product_v2_full_details.py \
            tests/test_product_v2_source_authority.py \
            tests/test_product_v2_catalog_rank.py \
            tests/test_product_v2_live_salla_order_contract.py \
            tests/test_product_main_image_dedupe.py \
            tests/test_product_category_variant_support.py \
            tests/test_product_category_publish_support.py \
            tests/test_product_google_taxonomy_support.py \
            tests/test_product_google_taxonomy_publish_boundary.py \
            tests/test_product_google_taxonomy_ai_pilot.py \
            tests/test_product_google_taxonomy_ai_calibration.py \
            tests/test_product_images_status_support.py \
            tests/test_product_media_draft_routes.py \
            tests/test_product_media_upload_routes.py \
            tests/test_product_media_ai_routes.py \
            tests/test_product_media_ai_draft_routes.py \
            tests/test_product_media_ai_gpt2_compat.py \
            tests/test_product_field_cost_support.py \
            tests/test_product_sale_schedule.py \
            tests/test_product_control_center_policy.py \
            tests/test_product_publish_reliability.py \
            tests/test_product_option_shared_cost_engine.py \
            tests/test_product_creation_rules.py \
            tests/test_product_fulfillment_rules.py \
            tests/test_ai_store_operations_foundation.py \
            tests/test_product_intelligence_foundation.py \
            tests/test_ai_store_access_control.py \
            tests/test_component_edit_policy.py \
            tests/test_order_option_cost_snapshots.py \
            -q --tb=short > /tmp/products-v2-pytest.log 2>&1
          status=$?
          cat /tmp/products-v2-pytest.log
          exit $status
      - name: Upload Products V2 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-v2-pytest-log
          path: /tmp/products-v2-pytest.log
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Run Products V2 reliability tests
        run: >-
          yarn test --watchAll=false --runInBand
          src/services/mezanProductsV2.test.js
          src/lib/mezanV2CostLinks.test.js
          src/pages/MezanProductsAutoSync.test.jsx
          src/pages/MezanProductsWorkspace.test.jsx
          src/components/products/ProductControlCenterPanel.test.jsx
      - name: Build frontend
        run: yarn build
