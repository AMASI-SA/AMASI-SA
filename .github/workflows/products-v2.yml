      - "backend/tests/test_product_media_ai_draft_routes.py"
      - "backend/tests/test_product_media_ai_gpt2_compat.py"
      - "backend/tests/test_product_field_cost_support.py"
      - "backend/tests/test_product_sale_schedule.py"
      - "backend/tests/test_product_control_center_policy.py"
      - "backend/tests/test_product_publish_reliability.py"
      - "backend/tests/test_product_option_shared_cost_engine.py"
      - "backend/tests/test_product_creation_rules.py"
