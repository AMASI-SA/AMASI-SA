name: Operational Mapping Acceptance Repair
on:
  push:
    branches: [integration/operational-balances-unified-20261102]
    paths: [.github/workflows/operational-mapping-acceptance-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply exact tested application-only delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/integration/operational-balances-unified-20261102
          python - <<'PY'
          import hashlib,pathlib,subprocess
          files={
            'backend/operational_remaining_bundle_sources.py':('2e1076bcfe79f43e250f75bc2b31642db8262736','9dad2e69da837322db11994b62d8395454f25f09'),
            'backend/tests/test_operational_balance_bundle_legacy_receipts.py':('98a1ff19203c6717de7249038b4aa90cc132a7d4','0b4b59a96845921216c708d47c96f6ec3e996bc7'),
            'frontend/src/pages/operational/NativePurchaseReview.test.jsx':('9e874bc53dcba9a660741a9e12dc04d593bd7859','cdf8b574a99d04ffca3bfafe723c1bad0d5a13ac')}
          def blob(p):
              b=p.read_bytes();return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for path,(before,after) in files.items():
              p=pathlib.Path(path);assert not p.is_symlink() and blob(p)==before,path
          p=pathlib.Path('backend/operational_remaining_bundle_sources.py');s=p.read_text()
          old="""        preparation_pieces = await db['mezan_preparation_pieces_v1'].find(
                      {'user_id': owner, 'order_number': {'$in': sorted({k[0] for k in selected})}}, {'_id': 0}
                  ).to_list(length=20001)"""
          # Literal indentation is constructed explicitly rather than inherited from YAML.
          old="        preparation_pieces = await db['mezan_preparation_pieces_v1'].find(\n            {'user_id': owner, 'order_number': {'$in': sorted({k[0] for k in selected})}}, {'_id': 0}\n        ).to_list(length=20001)"
          new="        # Physical-only bundles keep their existing bounded read budget.\n        financial_orders = sorted({key[0] for key, (_, _, record) in selected.items()\n            if 'reporting_cost' in (record.get('bundle_snapshot') or {})})\n        preparation_pieces = []\n        for offset in range(0, len(financial_orders), CHUNK):\n            preparation_pieces.extend(await db['mezan_preparation_pieces_v1'].find(\n                {'user_id': owner, 'order_number': {'$in': financial_orders[offset:offset + CHUNK]}},\n                {'_id': 0}).to_list(length=20001 - len(preparation_pieces)))\n            if len(preparation_pieces) > 20000:\n                raise ValueError('bundle_legacy_piece_read_scope_invalid')"
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          p=pathlib.Path('backend/tests/test_operational_balance_bundle_legacy_receipts.py');s=p.read_text()
          assert s.count('schema=2, created=CREATED):')==1
          s=s.replace('schema=2, created=CREATED):','schema=2, created=CREATED, rose_supplier=False):',1)
          marker="    raw={'id':'order-id'"
          addition="    if rose_supplier:\n        definition = await source[financial.catalog.BUNDLES].find_one({'user_id': OWNER, 'product_id': financial.ROOT})\n        await source.mezan_suppliers_v2.insert_one({'user_id': OWNER, 'id': 'supplier', 'status': 'active'})\n        items = deepcopy(definition['items'])\n        for component in items:\n            if component.get('product_id') == financial.ROSE:\n                component.update(sourcing_mode='supplier', supplier_id='supplier')\n        await financial.catalog.save_bundle(source, OWNER, financial.ROOT,\n            {'expected_revision': definition['revision'], 'schema_version': schema,\n             'product_type': 'composite', 'items': items}, OWNER)\n"
          assert s.count(marker)==1;s=s.replace(marker,addition+marker,1)
          old="        records=await source[collection].find({}).to_list(None)\n        if records:await db[collection].insert_many(deepcopy(records))"
          new="        records=await source[collection].find({}).to_list(None)\n        if collection == 'mezan_suppliers_v2':\n            records = [r for r in records if not await db[collection].find_one(\n                {'user_id': r['user_id'], 'id': r['id']})]\n        if records:await db[collection].insert_many(deepcopy(records))"
          assert s.count(old)==1;s=s.replace(old,new,1);p.write_text(s)
          p=pathlib.Path('frontend/src/pages/operational/NativePurchaseReview.test.jsx');s=p.read_text()
          assert s.count("toContain('1000.00')")==1;s=s.replace("toContain('1000.00')","toContain('1,000.00')");p.write_text(s)
          for path,(before,after) in files.items():assert blob(pathlib.Path(path))==after,path
          subprocess.run(['git','add','--',*files],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(files)
          PY
          git config user.name mezan
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve bounded physical reads and exact combined mapping test fixtures' -m 'All three files are hash-locked to tested bytes. No test removal, runtime financial operation, deployment or workflow modification by this runner. Connector removes this helper afterward.'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          remote=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:"$GITHUB_REF"
          unset auth
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
