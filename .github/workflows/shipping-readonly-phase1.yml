name: Shipping Readonly Phase 1

on:
  pull_request:
    branches:
      - codex/ready-shipping-final-integration
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/**"
      - "docs/operations/READY-CANONICAL-STATUS-RACE/**"
      - ".github/workflows/shipping-readonly-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shipping-readonly-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shipping-contracts:
    name: Shipping readonly / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: phase1-and-outbox
            test_files: >-
              tests/test_shipping_phase1_policy.py
              tests/test_shipping_print_document.py
              tests/test_shipping_read_budget.py
              tests/test_shipping_document_routes.py
              tests/test_shipping_reconciliation_worker.py
              tests/test_assembly_completion_delivery.py
              tests/test_g47_ready_shipping_safety.py
          - suite: original-shipping
            test_files: >-
              tests/test_shipping_print_boundary.py
              tests/test_shipping_print_legacy_path.py
              tests/test_shipping_label_current_guard.py
              tests/test_shipping_snapshot_bootstrap.py
              tests/test_fulfillment_carrier_label.py
              tests/test_salla_current_shipping.py
          - suite: ready-and-review
            test_files: >-
              tests/test_g47_ready_canonical_status_race.py
              tests/test_g47_current_shipping.py
              tests/test_g47_component_lifecycle_integration.py
              tests/test_g47_historical_execution_evidence.py
              tests/test_stock_component_consumption.py
              tests/test_review_local_assembly.py
              tests/test_review_local_completion.py
              tests/test_review_local_downstream.py
              tests/test_preparation_piece_operations.py
              tests/test_assembly_search_instruction_batch.py
              tests/test_review_completion_confirmation.py
              tests/test_review_completion_recovery.py
              tests/test_review_completion_preparation.py
              tests/test_review_completion_business_snapshot.py
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      PYTHONPATH: .:tests
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=shippingphase1
      BUILD37_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=shippingphase1
      TEST_FILES: ${{ matrix.test_files }}
      EVIDENCE_DIR: ${{ runner.temp }}/shipping-phase1-${{ matrix.suite }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require and record exact source HEAD and TREE
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$EVIDENCE_DIR/source.txt"
          printf '%s\n' "$TEST_FILES" > "$EVIDENCE_DIR/suites.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing focused workflow dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1 pydantic==2.13.5 pymongo==4.18.2 motor==3.7.1
          pytest==9.0.3 pytest-asyncio==1.3.0 httpx==0.28.1
          openpyxl==3.1.5 python-dotenv==1.2.3 cryptography==50.0.0
          bcrypt==4.1.3 PyJWT==2.13.0 python-multipart==0.0.20
          mongomock-motor==0.0.36 reportlab==5.0.1 Pillow==12.3.0
          qrcode==8.2 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 tzdata==2026.4
      - name: Start isolated loopback-only Mongo Replica Set
        run: |
          set -euo pipefail
          docker run -d --name shipping-phase1-rs -p 127.0.0.1:27018:27018 mongo:8.0.12 \
            --port 27018 --replSet shippingphase1 --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec shipping-phase1-rs mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec shipping-phase1-rs mongosh --port 27018 --quiet \
            --eval 'rs.initiate({_id:"shippingphase1",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 40); do
            if docker exec shipping-phase1-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec shipping-phase1-rs mongosh --port 27018 --quiet \
            --eval 'const h=db.hello(); if(h.setName!=="shippingphase1" || !h.isWritablePrimary){quit(1)}'
      - name: Run contracts with external network forbidden
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/pytest.log"
          import ipaddress
          import os
          from pathlib import Path
          import socket
          import pytest

          files = os.environ["TEST_FILES"].split()
          assert files and all(Path(name).is_file() for name in files), files
          # Provider HTTP and document download are synthetic fixtures. Only the
          # disposable loopback Mongo is permitted; an unmocked Salla call fails.
          def local(host):
              if host in (None, "localhost", b"localhost"):
                  return True
              try:
                  value = host.decode() if isinstance(host, bytes) else str(host)
                  return ipaddress.ip_address(value).is_loopback
              except ValueError:
                  return False

          original_resolve = socket.getaddrinfo
          def resolve(host, *args, **kwargs):
              if not local(host):
                  raise AssertionError("External DNS/network forbidden in shipping CI")
              return original_resolve(host, *args, **kwargs)
          socket.getaddrinfo = resolve

          def guarded_connect(original):
              def connect(sock, address, *args, **kwargs):
                  if sock.family in (socket.AF_INET, socket.AF_INET6) and not local(address[0]):
                      raise AssertionError("External network forbidden in shipping CI")
                  return original(sock, address, *args, **kwargs)
              return connect
          socket.socket.connect = guarded_connect(socket.socket.connect)
          socket.socket.connect_ex = guarded_connect(socket.socket.connect_ex)
          raise SystemExit(pytest.main([
              "--noconftest", "-p", "no:cacheprovider", "--asyncio-mode=auto",
              "-q", "-ra", "--tb=short", *files,
              "--junitxml=" + str(Path(os.environ["EVIDENCE_DIR"]) / "pytest.xml"),
          ]))
          PY
      - name: Require executed suites and real rollback coverage
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ["EVIDENCE_DIR"])
          cases = list(ET.parse(root / "pytest.xml").iter("testcase"))
          assert cases, "No test cases executed"
          failures = [c.attrib for c in cases if c.find("failure") is not None or c.find("error") is not None]
          assert not failures, failures
          expected = {Path(name).stem for name in os.environ["TEST_FILES"].split()}
          observed = {part for c in cases for part in c.get("classname", "").split(".")}
          assert expected <= observed, f"Missing suites: {sorted(expected - observed)}"
          skipped = [c for c in cases if c.find("skipped") is not None]
          allowed = "test_real_transaction_failure_leaves_no_partial_label[memory]"
          assert all(c.get("name") == allowed and "test_shipping_print_boundary" in c.get("classname", "")
                     for c in skipped), [c.attrib for c in skipped]
          if "test_shipping_print_boundary" in expected:
              mongo = [c for c in cases if c.get("name") == "test_real_transaction_failure_leaves_no_partial_label[mongo]"]
              assert len(mongo) == 1 and mongo[0].find("skipped") is None, "Real Mongo rollback was not executed"
          print(f"{len(cases) - len(skipped)} executed cases; {len(skipped)} redundant memory rollback skip(s); zero failures/errors")
          PY
      - name: Retain exact-source and JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipping-phase1-${{ matrix.suite }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
      - name: Remove this job's disposable Mongo only
        if: always()
        run: docker rm --force shipping-phase1-rs

