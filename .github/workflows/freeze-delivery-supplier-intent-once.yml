name: Freeze delivery supplier reviewed intent once

on:
  push:
    branches:
      - automation/freeze-delivery-supplier-intent-20260930

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source A on reviewed-B target
        uses: actions/checkout@v4
        with:
          ref: integration/delivery-supplier-current-prod-reviewed-b-20260930
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "86d282524785ba7babd662ba1d2eb2250836c0db"
          test "$(git rev-parse HEAD^{tree})" = "c1c1f7eaa35f8706cda71408e10785b86945786e"
          test -z "$(git status --short)"

      - name: Download exact governed intent artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intent"
          gh run download 36727897560             --repo AMASI-SA/AMASI-SA             --name release-v5-reviewed-intent-candidate             --dir "$RUNNER_TEMP/intent"
          test -s "$RUNNER_TEMP/intent/release-intent-v5.json"
          echo "e7d9be78fb7122dfd3243c2c4ce3ed645c71acaebf667370a32908506f034f39  $RUNNER_TEMP/intent/release-intent-v5.json" | sha256sum -c -

      - name: Validate intent provenance
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/intent/release-intent-v5.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["schema_version"] == 2
          assert p["protocol_version"] == 5
          assert p["source_git_sha"] == "86d282524785ba7babd662ba1d2eb2250836c0db"
          assert p["source_base_git_sha"] == "728730366cfee6c906172c7c14a2a67251ed1065"
          assert p["branch"] == "hotfix/prod-snap-meta-final"
          assert p["runtime_identity"]["release_id"] == "rg5-573f5cb98b42f6da12ff9fc2c2ee24ac0f8644a56ed217f2306a5e6efe0532fb"
          PY

      - name: Freeze intent-only reviewed B
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/intent/release-intent-v5.json" release/release-intent-v5.json
          test "$(git diff --name-only)" = "release/release-intent-v5.json"
          git diff --quiet 86d282524785ba7babd662ba1d2eb2250836c0db -- . ':(exclude)release/release-intent-v5.json'
          ! git diff --quiet 86d282524785ba7babd662ba1d2eb2250836c0db -- release/release-intent-v5.json
          git config user.name "ChatGPT Release Integrator"
          git config user.email "noreply@openai.com"
          git add release/release-intent-v5.json
          git commit -m "chore(release): freeze current courier supplier reviewed intent"
          test "$(git rev-parse HEAD^)" = "86d282524785ba7babd662ba1d2eb2250836c0db"
          test "$(git diff --name-only HEAD^ HEAD)" = "release/release-intent-v5.json"
          git diff --quiet HEAD^ HEAD -- . ':(exclude)release/release-intent-v5.json'
          git push origin HEAD:integration/delivery-supplier-current-prod-reviewed-b-20260930
