name: P1253 candidate A warm single capacity sample
on:
  push:
    branches: [codex/p1253-single-capacity]
    paths:
      - .github/workflows/p1253-paired-linux-diagnostic.yml
      - scripts/p1253*.py
      - scripts/test_p1253*.py
      - scripts/P1253.Dockerfile
permissions:
  contents: read
jobs:
  single-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 15f00ff0d072cf8e00b8d642a6390d2ef71c11ac
          path: sources/candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2392ba6b2957cbc820cf7d806288b56589438c0b
          path: environment1276
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Diagnostic contract tests and immutable source proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p1253-results" "$RUNNER_TEMP/p1253-image"
          date +%s > "$RUNNER_TEMP/p1253-results/job-started.txt"
          python -m unittest discover -s diagnostic/scripts -p 'test_p1253*.py' -v 2>&1 | tee "$RUNNER_TEMP/p1253-results/contract-tests.txt"
          test "$(git -C sources/candidate rev-parse HEAD)" = 15f00ff0d072cf8e00b8d642a6390d2ef71c11ac
          git -C diagnostic rev-parse HEAD > "$RUNNER_TEMP/p1253-results/diagnostic-sha.txt"
          sha256sum sources/candidate/backend/tests/benchmark_dashboard_summary_memory.py sources/candidate/backend/tests/dashboard_summary_fixture.py > "$RUNNER_TEMP/p1253-results/frozen-harness.txt"
          cp environment1276/scripts/ci/linux_mongo/requirements.txt "$RUNNER_TEMP/p1253-image/requirements.txt"
          cp diagnostic/scripts/P1253.Dockerfile "$RUNNER_TEMP/p1253-image/Dockerfile"
          docker build -t p1253-diagnostic:local "$RUNNER_TEMP/p1253-image"
          docker pull mongo:8.0.12
      - name: One candidate A warm 100k capacity sample
        timeout-minutes: 55
        run: |
          set -o pipefail
          python diagnostic/scripts/p1253_single_capacity.py --sources "$GITHUB_WORKSPACE/sources" --output "$RUNNER_TEMP/p1253-results" | tee "$RUNNER_TEMP/p1253-results/console.txt"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1253-capacity-${{ github.sha }}
          path: ${{ runner.temp }}/p1253-results
          if-no-files-found: error
