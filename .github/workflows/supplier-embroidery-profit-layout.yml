name: Supplier embroidery and profit layout acceptance (PR only)
on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - "backend/supplier_receiving_routes.py"
      - "backend/product_field_cost_support.py"
      - "backend/acceptance_tests/test_supplier_embroidery_first_scan.py"
      - "frontend/src/index.css"
      - "frontend/src/profitSummarySizeTune.css"
      - "frontend/src/pages/AdvancedDashboard.jsx"
      - "frontend/src/pages/AdvancedDashboard.profitLayout.test.jsx"
      - ".github/workflows/supplier-embroidery-profit-layout.yml"
permissions:
  contents: read
jobs:
  supplier-first-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: backend:backend/tests:backend/acceptance_tests
      BUILD37_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      JWT_SECRET: isolated-embroidery-test-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start disposable replica-set Mongo
        run: |
          set -euo pipefail
          docker run -d --name embroidered-test-mongo -p 127.0.0.1:27017:27017 mongo:7.0.16 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do docker exec embroidered-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break; sleep 1; done
          docker exec embroidered-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 60); do docker exec embroidered-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1 && break; sleep 1; done
          docker exec embroidered-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)'
      - name: Install backend isolated-test dependencies
        run: >-
          python -m pip install
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor==3.3.1
          httpx==0.28.1 openai==1.99.9 pytest==9.0.2 pytest-asyncio==1.3.0
          mongomock-motor==0.0.36 PyJWT python-dotenv bcrypt==4.1.3
          email-validator==2.3.0 requests python-dateutil tzdata webauthn==2.7.1
          openpyxl cryptography reportlab python-multipart arabic-reshaper python-bidi
          Pillow qrcode PyMuPDF
      - name: Verify first scan replay recovery session refresh
        run: >-
          python -B -m pytest -q --tb=short
          backend/acceptance_tests/test_supplier_embroidery_first_scan.py
          --junitxml=supplier-embroidery-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-embroidery-results
          path: supplier-embroidery-results.xml
      - name: Stop disposable Mongo
        if: always()
        run: docker rm -f embroidered-test-mongo || true
  executive-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: >-
          CI=true yarn test --watchAll=false --runInBand --runTestsByPath
          src/pages/AdvancedDashboard.profitLayout.test.jsx
          src/pages/AdvancedDashboard.cardRefresh.test.jsx
