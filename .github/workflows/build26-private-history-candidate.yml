name: Build26 private invoice candidate (no deployment)
on:
  push:
    branches: ['work/build26-private-history-backend-20260928']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      BUILD20_INVOICE_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply exact-base source patch in disposable runner
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.build26-private-history/apply.py" > "$RUNNER_TEMP/apply-private-history.py"
          git checkout --detach 377ff1bef25cd977e09e759f60a69e2a96c05588
          python "$RUNNER_TEMP/apply-private-history.py"
          git diff --check
      - name: Disposable transaction-capable Mongo only
        run: |
          set -euo pipefail
          docker run -d --name invoice-test-mongo -p 127.0.0.1:27017:27017 mongo:7.0.16 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do docker exec invoice-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break; sleep 1; done
          docker exec invoice-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 60); do docker exec invoice-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1 && break; sleep 1; done
          docker exec invoice-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)'
      - name: Isolated test dependencies
        run: >-
          python -m pip install fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor==3.3.1
          httpx==0.28.1 openai==1.99.9 pytest==9.0.2 pytest-asyncio==1.3.0
          openpyxl cryptography reportlab python-multipart arabic-reshaper python-bidi Pillow PyMuPDF qrcode
      - name: New privacy history plus existing supplier regressions
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest tests/test_supplier_invoice_private_history.py tests/test_supplier_receiving.py tests/test_supplier_invoice_financial_integrity.py tests/test_supplier_multi_supplier_lifecycle.py tests/test_supplier_invoice_live_cost_session.py tests/test_supplier_invoice_service_eligibility.py -v --tb=short --junitxml="$RUNNER_TEMP/history-tests.xml"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          cases=list(ET.parse(os.environ['RUNNER_TEMP']+'/history-tests.xml').iter('testcase'))
          assert len([c for c in cases if 'test_supplier_invoice_private_history' in c.attrib.get('classname','')]) >= 13
          assert all(c.find('skipped') is None for c in cases)
          PY
      - name: Push clean source candidate only; cumulative branch unchanged
        run: |
          set -euo pipefail
          git diff --exit-code 377ff1bef25cd977e09e759f60a69e2a96c05588 -- backend/store_delivery_settlement_routes.py
          git add backend/supplier_receiving_routes.py backend/supplier_invoice_history.py backend/tests/test_supplier_receiving.py backend/tests/test_supplier_invoice_private_history.py .github/workflows/build20-invoice-integrity.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git config user.name 'AMASI development'
          git config user.email '288137316+AMASI-SA@users.noreply.github.com'
          git commit -m 'fix(supplier-invoices): private employee history grouped by most recent supplier'
          git push origin "HEAD:refs/heads/candidate/build26-private-history-backend-$GITHUB_RUN_ID"
          echo "CANDIDATE_BRANCH=candidate/build26-private-history-backend-$GITHUB_RUN_ID"
          git rev-parse HEAD HEAD^{tree}
          echo 'MERGE=0 APK=0 OTA=0 PRODUCTION_WRITES=0'
      - name: Stop disposable Mongo
        if: always()
        run: docker rm -f invoice-test-mongo || true
