name: Operational Offline Test Dependencies
on:
  push:
    branches: [integration/operational-balances-unified-20261102]
    paths: [.github/workflows/operational-test-dependency-export.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies in an isolated directory
        run: >-
          python -m pip install --target "$RUNNER_TEMP/operational-test-deps"
          pymongo==4.18.2 motor==3.7.1 mongomock==4.3.0
          mongomock-motor==0.0.36 email-validator==2.3.0
      - name: Archive dependencies and inventory
        run: |
          python --version > "$RUNNER_TEMP/test-dependency-python.txt"
          python -m pip freeze --path "$RUNNER_TEMP/operational-test-deps" > "$RUNNER_TEMP/test-dependency-versions.txt"
          tar -C "$RUNNER_TEMP/operational-test-deps" -czf "$RUNNER_TEMP/operational-test-deps.tar.gz" .
          sha256sum "$RUNNER_TEMP/operational-test-deps.tar.gz" > "$RUNNER_TEMP/test-dependency-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: operational-offline-test-dependencies
          retention-days: 3
          path: |
            ${{ runner.temp }}/operational-test-deps.tar.gz
            ${{ runner.temp }}/test-dependency-versions.txt
            ${{ runner.temp }}/test-dependency-python.txt
            ${{ runner.temp }}/test-dependency-sha256.txt
          if-no-files-found: error
