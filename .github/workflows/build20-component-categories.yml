name: Build20 component category contract (no deployment)

on:
  push:
    branches: [fix/build20-component-category-links-20260926]
  pull_request:
    paths:
      - 'backend/component_*'
      - 'backend/tests/test_component_*'
      - '.github/workflows/build20-component-categories.yml'

permissions:
  contents: read

jobs:
  category-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0.16
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      BUILD20_CATEGORY_TEST_MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor==3.3.1
          httpx==0.28.1 openai==1.99.9 pytest==9.0.2 pytest-asyncio==1.3.0
          openpyxl cryptography reportlab python-multipart
      - name: HTTP and real Mongo category contract plus existing regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/component-category-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/component-category-evidence/identity.txt"
          python -m pytest \
            tests/test_component_edit_category_links.py \
            tests/test_component_categories_groups_v1.py \
            tests/test_component_category_required_group_picker_v2.py \
            tests/test_component_edit_policy.py \
            tests/test_component_status_lifecycle.py \
            tests/test_product_v2_component_workspace_cost.py \
            -v --tb=short \
            --junitxml="$RUNNER_TEMP/component-category-evidence/pytest.xml" \
            2>&1 | tee "$RUNNER_TEMP/component-category-evidence/pytest.log"
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'component-category-evidence/pytest.xml'
          cases = list(ET.parse(report).iter('testcase'))
          new = [c for c in cases if 'test_component_edit_category_links' in c.attrib.get('classname', '')]
          assert len(new) >= 41, 'Missing required HTTP/Mongo cases'
          assert all(c.find('skipped') is None for c in cases), 'Skipped coverage is not a pass'
          PY
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: component-category-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/component-category-evidence
          retention-days: 30
          if-no-files-found: warn
