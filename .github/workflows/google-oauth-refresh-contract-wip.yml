name: Google OAuth refresh contract WIP
on:
  push:
    branches: [codex/google-oauth-dispatch-followup-20261027]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1 cryptography==50.0.2
          python-multipart==0.0.32 PyJWT==2.15.1 bcrypt==4.1.3
          python-dotenv==1.2.4 pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable Mongo replica
        run: |
          set -euo pipefail
          docker run -d --name oauth-wip-rs -p 127.0.0.1:27474:27474 mongo:8.0.26 --port 27474 --replSet oauthWip --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec oauth-wip-rs mongosh --port 27474 --quiet --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec oauth-wip-rs mongosh --port 27474 --quiet --eval 'if(rs.initiate({_id:"oauthWip",members:[{_id:0,host:"127.0.0.1:27474"}]}).ok !== 1) quit(1)'
          primary=0
          for attempt in $(seq 1 60); do
            if docker exec oauth-wip-rs mongosh --port 27474 --quiet --eval 'const h=db.hello(); if(h.setName !== "oauthWip" || h.isWritablePrimary !== true || !Number.isInteger(h.logicalSessionTimeoutMinutes)) quit(1)'; then primary=1; break; fi
            sleep 1
          done
          test "$primary" -eq 1
      - name: Test CAS and real Mongo races
        env:
          PYTHONPATH: backend
          GOOGLE_ADS_TEST_MONGO_URI: mongodb://127.0.0.1:27474/
        run: python -m pytest --noconftest -q backend/tests/test_google_oauth_refresh_contract.py backend/tests/test_google_oauth_refresh_contract_mongo.py backend/tests/test_google_oauth_refresh_transport.py --junitxml=oauth-results.xml
      - name: Require all real Mongo tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('oauth-results.xml').findall('.//testcase')
          replica = [c for c in cases if c.get('classname','').endswith('test_google_oauth_refresh_contract_mongo')]
          assert len(cases) == 27 and len(replica) == 6
          assert not [c for c in cases if any(c.find(x) is not None for x in ('failure','error','skipped'))]
          PY
      - name: Remove replica
        if: always()
        run: docker rm -f oauth-wip-rs
