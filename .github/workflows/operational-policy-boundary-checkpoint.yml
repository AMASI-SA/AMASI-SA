name: Operational Policy Boundary Checkpoint
on:
  push:
    branches: [integration/operational-balances-unified-20261102]
    paths: [.github/workflows/operational-policy-boundary-checkpoint.yml]
permissions:
  contents: write
concurrency:
  group: operational-policy-boundary-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'AMASI-SA/AMASI-SA' && github.ref == 'refs/heads/integration/operational-balances-unified-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply reviewed source only and retain normal task-branch ancestry
        env:
          STAGED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=integration/operational-balances-unified-20261102
          test "$(git rev-parse HEAD)" = "$STAGED_SHA"
          test "$(git rev-parse HEAD^)" = 5f9d28ca36fdbc4a0b03e2b17a38f504120a1fca
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$STAGED_SHA"
          python3 -B docs/operations/OP-UNIFIED-BALANCES-20261102/policy-boundary-stage/apply.py
          git config user.name 'mezan'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'WIP: surface unmapped bundle financial-policy receipt coverage instead of a partial cost' -m 'Preserve newer production79187 and its unchanged services/physical recipe. Financial-only additions cannot be assumed received or counted from physical leaves alone. 72 focused projection tests passed locally including5 boundary cases, not full new-base acceptance. No financial posting or production action; explicit mapping remains a business blocker.'
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$STAGED_SHA"
          git push origin HEAD:refs/heads/$branch
# Source-only temporary handoff; no runtime, data, deployment or financial commands.
