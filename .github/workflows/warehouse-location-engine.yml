name: Warehouse Location Engine

on:
  pull_request:
    paths:
      - "backend/warehouse_location_routes.py"
      - "backend/warehouse_location_v2_routes.py"
      - "backend/warehouse_room_routes.py"
      - "backend/order_engine/__init__.py"
      - "backend/tests/test_warehouse_location_routes.py"
      - "frontend/src/pages/WarehouseLocations.jsx"
      - "frontend/src/pages/WarehouseControlTower.jsx"
      - "frontend/src/components/WarehouseRoomsPanel.jsx"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/pages/OperationsDashboard.jsx"
      - ".github/workflows/warehouse-location-engine.yml"
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted test dependencies
        run: python -m pip install fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 pytest==9.0.3
      - name: Run warehouse unit tests
        run: python -m pytest tests/test_warehouse_location_routes.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Build frontend
        run: yarn build
