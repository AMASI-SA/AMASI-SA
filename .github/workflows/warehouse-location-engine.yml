name: Warehouse Location Engine

on:
  pull_request:
    paths:
      - "backend/warehouse_location_routes.py"
      - "backend/warehouse_location_v2_routes.py"
      - "backend/warehouse_room_routes.py"
      - "backend/warehouse_reset_routes.py"
      - "backend/order_engine/__init__.py"
      - "backend/tests/test_warehouse_location_routes.py"
      - "backend/tests/test_warehouse_reset_routes.py"
      - "frontend/src/pages/WarehouseLocations.jsx"
      - "frontend/src/pages/WarehouseControlTower.jsx"
      - "frontend/src/pages/WarehouseHierarchyWorkspace.jsx"
      - "frontend/src/components/WarehouseRoomsPanel.jsx"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/pages/OperationsDashboard.jsx"
      - ".github/workflows/warehouse-location-engine.yml"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/warehouse_location_routes.py'
              - 'backend/warehouse_location_v2_routes.py'
              - 'backend/warehouse_room_routes.py'
              - 'backend/warehouse_reset_routes.py'
              - 'backend/order_engine/__init__.py'
              - 'backend/tests/test_warehouse_location_routes.py'
              - 'backend/tests/test_warehouse_reset_routes.py'
            frontend:
              - 'frontend/src/pages/WarehouseLocations.jsx'
              - 'frontend/src/pages/WarehouseControlTower.jsx'
              - 'frontend/src/pages/WarehouseHierarchyWorkspace.jsx'
              - 'frontend/src/components/WarehouseRoomsPanel.jsx'
              - 'frontend/src/components/Layout.jsx'
              - 'frontend/src/pages/OperationsDashboard.jsx'
              - '.github/workflows/warehouse-location-engine.yml'

  backend-unit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted test dependencies
        run: python -m pip install -q fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 pytest==9.0.3 openpyxl==3.1.5
      - name: Run warehouse unit tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_warehouse_location_routes.py tests/test_warehouse_reset_routes.py -q --tb=short > /tmp/warehouse-pytest.log 2>&1
          status=$?
          cat /tmp/warehouse-pytest.log
          exit $status
      - name: Upload warehouse test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-pytest-log
          path: /tmp/warehouse-pytest.log
          if-no-files-found: ignore

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Build frontend
        run: yarn build
