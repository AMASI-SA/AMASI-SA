name: Google credential refresh CAS
on:
  push:
    branches: [codex/google-refresh-cas-release-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_credential_refresh_cas.py
      - backend/integrations_control_center/google_ads_reporting.py
      - backend/integrations_control_center/google_analytics_realtime_routes.py
      - backend/integrations_control_center/google_merchant_registration.py
      - backend/integrations_control_center/ads_auto_sync_scheduler.py
      - backend/tests/test_google_credential_refresh_cas*.py
      - .github/workflows/google-credential-refresh-cas.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-cas:
    # Mongo8 startup rejects the new hosted24.04 kernel; runner-images#15005.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production-compatible focused dependencies
        run: >-
          python -m pip install fastapi==0.140.0 starlette==1.3.1 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 dnspython==2.9.0 httpx==0.28.1 cryptography==50.0.0
          python-multipart==0.0.31 PyJWT==2.15.0 bcrypt==4.1.3
          python-dotenv==1.2.2 pillow==13.0.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.0.3 pytest-asyncio==1.4.0
      - name: Start disposable loopback replica
        shell: bash
        run: |
          set -euo pipefail
          uname -r
          docker run -d --name google-refresh-cas -p 127.0.0.1:27481:27481 mongo:8.0.26 --port 27481 --replSet gRefreshCAS --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-refresh-cas)" != true ]; then
              docker logs google-refresh-cas
              exit 1
            fi
            if docker exec google-refresh-cas mongosh --port 27481 --quiet --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-refresh-cas mongosh --port 27481 --quiet --eval 'if(rs.initiate({_id:"gRefreshCAS",members:[{_id:0,host:"127.0.0.1:27481"}]}).ok !== 1) quit(1)'
          ready=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-refresh-cas)" != true ]; then
              docker logs google-refresh-cas
              exit 1
            fi
            if docker exec google-refresh-cas mongosh --port 27481 --quiet --eval 'const h=db.hello(); if(h.setName !== "gRefreshCAS" || h.isWritablePrimary !== true) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Prove actual helpers and real Mongo races without skips
        env:
          GOOGLE_REFRESH_CAS_TEST_MONGO_URI: mongodb://127.0.0.1:27481/
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --junitxml=refresh-cas-results.xml backend/tests/test_google_credential_refresh_cas.py backend/tests/test_google_credential_refresh_cas_mongo.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases=ET.parse('refresh-cas-results.xml').getroot().findall('.//testcase')
          mongo=[case for case in cases if case.attrib.get('classname','').endswith('test_google_credential_refresh_cas_mongo')]
          assert len(cases) >= 69 and len(mongo) >= 21
          assert not [case for case in cases if any(case.find(tag) is not None for tag in ('skipped','failure','error'))]
          print('Verified',len(cases),'tests including',len(mongo),'real replica cases; zero skips')
          PY
      - name: Check existing Google service compatibility
        env:
          GOOGLE_ADS_TEST_MONGO_URI: mongodb://127.0.0.1:27481/
          PYTHONPATH: backend
        run: >-
          python -m pytest --noconftest -q
          backend/tests/test_google_ads_reporting_v1.py
          backend/tests/test_google_analytics_realtime_dashboard_v2.py
          backend/tests/test_google_analytics_source_attribution_v2.py
          backend/tests/test_google_ads_management.py
          backend/tests/test_google_ads_client.py
      - name: Check whitespace
        run: git diff --check
      - name: Remove disposable replica
        if: always()
        run: docker rm -f google-refresh-cas
