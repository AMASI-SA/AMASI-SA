name: Production Snapchat Stale Error Resolution

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/snapchat_operational_error_resolution.py"
      - "backend/integrations_control_center/snapchat_ads_manager_attribution.py"
      - "backend/tests/test_snapchat_operational_error_resolution_v3.py"
      - ".github/workflows/prod-snapchat-stale-error-resolution.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: python -m pip install -q pytest httpx pydantic openpyxl

      - name: Compile focused modules
        run: >-
          python -m py_compile
          integrations_control_center/snapchat_operational_error_resolution.py
          integrations_control_center/snapchat_ads_manager_attribution.py
          tests/test_snapchat_operational_error_resolution_v3.py

      - name: Test stale error resolution
        run: >-
          python -m pytest
          tests/test_snapchat_operational_error_resolution_v3.py
          -q --tb=short

      - name: Enforce read-only card resolution contract
        working-directory: .
        run: |
          MODULE=backend/integrations_control_center/snapchat_operational_error_resolution.py
          grep -q 'resolve_snapchat_stale_operational_state' "$MODULE"
          grep -q 'latest_error' "$MODULE"
          grep -q 'last_sync_at' "$MODULE"
          grep -q 'data_quality' "$MODULE"
          ! grep -q 'delete_one' "$MODULE"
          ! grep -q 'delete_many' "$MODULE"
          ! grep -q 'update_one' "$MODULE"
          ! grep -q 'accounting' "$MODULE"
          ! grep -q 'qoyod' "$MODULE"
