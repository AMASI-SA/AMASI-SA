name: Public Legal Pages Noindex

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "frontend/src/publicLegalNoIndex.js"
      - "frontend/src/publicLegalNoIndex.test.js"
      - "frontend/src/index.js"
      - "frontend/craco.config.js"
      - ".github/workflows/legal-pages-noindex.yml"

jobs:
  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Validate CRACO server configuration
        run: node --check craco.config.js
      - name: Run legal noindex tests
        run: >-
          CI=true yarn test --watchAll=false --runInBand
          src/publicLegalNoIndex.test.js
          src/PublicLegalApp.test.jsx
      - name: Build Production frontend
        run: CI=false yarn build

  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce exact route scope and crawler-visible noindex
        run: |
          META=frontend/src/publicLegalNoIndex.js
          SERVER=frontend/craco.config.js
          INDEX=frontend/src/index.js
          grep -q 'noindex, nofollow, noarchive, nosnippet, noimageindex' "$META"
          grep -q 'applyPublicLegalNoIndex(window.location.pathname)' "$INDEX"
          grep -q 'res.setHeader("X-Robots-Tag", LEGAL_NOINDEX_DIRECTIVES)' "$SERVER"
          grep -q '"/privacy-policy"' "$META" "$SERVER"
          grep -q '"/data-deletion"' "$META" "$SERVER"
          grep -q '"/terms"' "$META" "$SERVER"
          ! grep -q 'Disallow: /privacy-policy\|Disallow: /data-deletion\|Disallow: /terms' frontend/public/robots.txt 2>/dev/null || false
