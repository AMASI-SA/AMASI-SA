name: Fulfillment review pagination bootstrap

on:
  push:
    branches:
      - feat/fulfillment-review-pagination
    paths:
      - "scripts/patch_order_review_pagination.py"
      - ".github/workflows/fulfillment-review-pagination-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fulfillment-review-pagination
          fetch-depth: 0
          show-progress: false

      - name: Apply ten-order cursor pagination
        run: python scripts/patch_order_review_pagination.py

      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile backend/tests/test_fulfillment_v2_contract.py
          grep -q 'export const REVIEW_PAGE_SIZE = 10;' frontend/src/pages/OrderReview.jsx
          grep -q 'aria-label="الصفحة السابقة"' frontend/src/pages/OrderReview.jsx
          grep -q 'aria-label="الصفحة التالية"' frontend/src/pages/OrderReview.jsx
          ! grep -q 'تحميل طلبات إضافية' frontend/src/pages/OrderReview.jsx

      - name: Commit pagination changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Pagination patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/OrderReview.jsx backend/tests/test_fulfillment_v2_contract.py
          git commit -m "feat(fulfillment): paginate review queue by ten orders"
          git push origin HEAD:feat/fulfillment-review-pagination
