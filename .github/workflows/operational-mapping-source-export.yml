name: Operational Mapping Source Export
on:
  push:
    branches: [integration/operational-balances-unified-20261102]
    paths: [.github/workflows/operational-mapping-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2661457ae5c3d29dfd67e15e49f5f065278e8238
          persist-credentials: false
      - name: Archive exact reviewed source without application execution
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 2661457ae5c3d29dfd67e15e49f5f065278e8238
          git rev-parse HEAD > source-sha.txt
          git rev-parse HEAD^{tree} > root-tree.txt
          git ls-tree -r HEAD > source-tree.txt
          git archive --format=tar.gz HEAD > source.tar.gz
          sha256sum source.tar.gz > archive-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: operational-mapping-source-2661457a
          path: |
            source.tar.gz
            source-sha.txt
            root-tree.txt
            source-tree.txt
            archive-sha256.txt
          retention-days: 7
          if-no-files-found: error
