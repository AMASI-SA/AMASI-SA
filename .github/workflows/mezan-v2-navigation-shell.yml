name: Mezan V2 Navigation Shell

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/src/App.js"
      - "frontend/src/components/Sidebar.jsx"
      - "frontend/src/defaultDashboardRoute.test.js"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/components/MezanV2NavigationShell.jsx"
      - "frontend/src/components/MezanV2NavigationShell.test.jsx"
      - "frontend/src/components/GoogleAdsAllPlatformsCard.jsx"
      - "frontend/src/components/GoogleAdsAllPlatformsCard.test.jsx"
      - "frontend/src/pages/MarketingPlatformWorkspace.jsx"
      - "frontend/src/pages/MarketingPlatformWorkspace.test.jsx"
      - "frontend/src/services/marketingPerformance.js"
      - "frontend/src/services/marketingPerformance.test.js"
      - ".github/workflows/mezan-v2-navigation-shell.yml"

jobs:
  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        run: yarn install --non-interactive

      - name: Test navigation and marketing contracts
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/defaultDashboardRoute.test.js
          src/components/MezanV2NavigationShell.test.jsx
          src/components/GoogleAdsAllPlatformsCard.test.jsx
          src/pages/MarketingPlatformWorkspace.test.jsx
          src/services/marketingPerformance.test.js

      - name: Build frontend
        env:
          CI: "false"
        run: yarn build

      - name: Enforce legacy isolation contract
        working-directory: .
        run: |
          APP=frontend/src/App.js
          SIDEBAR=frontend/src/components/Sidebar.jsx
          SHELL=frontend/src/components/MezanV2NavigationShell.jsx
          LAYOUT=frontend/src/components/Layout.jsx
          GOOGLE_CARD=frontend/src/components/GoogleAdsAllPlatformsCard.jsx
          PLATFORM=frontend/src/pages/MarketingPlatformWorkspace.jsx
          SERVICE=frontend/src/services/marketingPerformance.js

          grep -q 'path="/" element={<ProtectedRoute><Navigate to="/dashboard-v2" replace /></ProtectedRoute>}' "$APP"
          grep -q 'path="/legacy-dashboard"' "$APP"
          grep -q 'to: "/legacy-dashboard", label: "لوحة التحكم القديمة"' "$SIDEBAR"
          grep -q 'data-testid="mezan-v2-navigation-shell"' "$SHELL"
          grep -q 'data-testid="mezan-v2-open-all"' "$SHELL"
          grep -q 'provider=google' "$SHELL"
          ! grep -q 'provider=google_ads' "$SHELL"
          grep -q 'workspace=access' "$SHELL"
          grep -q 'isMezanV2Route' "$LAYOUT"
          grep -q 'isMarketingPlatformProvider' "$LAYOUT"
          grep -q 'GoogleAdsAllPlatformsCard' "$LAYOUT"
          grep -q 'data-testid="ads-provider-google"' "$GOOGLE_CARD"
          grep -q 'تقارير الأداء غير مفعّلة بعد' "$GOOGLE_CARD"
          grep -q 'data-testid="marketing-platform-workspace"' "$PLATFORM"
          grep -q '/integrations-v2/snapchat_ads/campaign-report' "$SERVICE"
          grep -q 'campaign_creation_enabled: false' "$SERVICE"
          grep -q 'legacyMenuOpen &&' "$LAYOUT"
          ! grep -q 'lg:ps-64' "$LAYOUT"
