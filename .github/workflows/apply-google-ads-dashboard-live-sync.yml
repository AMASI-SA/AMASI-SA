name: Apply Google Ads Dashboard Live Sync Fix

on:
  push:
    branches:
      - fix/google-ads-dashboard-live-sync
    paths:
      - .github/workflows/apply-google-ads-dashboard-live-sync.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-ads-dashboard-live-sync
          fetch-depth: 0

      - name: Apply focused root fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scheduler_path = Path('backend/integrations_control_center/ads_auto_sync_scheduler.py')
          text = scheduler_path.read_text()

          old = '''from .meta_oauth_security import META_PROVIDER_ID, meta_oauth_configured\nfrom .tiktok_native_reporting import (\n'''
          new = '''from .meta_oauth_security import META_PROVIDER_ID, meta_oauth_configured\nfrom .google_ads_reporting import (\n    GOOGLE_ADS_PROVIDER_ID,\n    GOOGLE_ADS_REPORTING_SOURCE_MODE,\n    GoogleAdsReportingError,\n    google_ads_reporting_enabled,\n    run_google_ads_reporting_sync,\n)\nfrom .google_oauth_security import google_oauth_configured\nfrom .tiktok_native_reporting import (\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''TIKTOK_RUN_TYPE = "tiktok_reporting_async"\nACTIVE_STATUSES = ("queued", "running")\n'''
          new = '''TIKTOK_RUN_TYPE = "tiktok_reporting_async"\nGOOGLE_RUN_TYPE = "google_ads_reporting_async"\nACTIVE_STATUSES = ("queued", "running")\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                META_PROVIDER_ID,\n                SNAPCHAT_PROVIDER_ID,\n                TIKTOK_PROVIDER_ID,\n            ]},\n'''
          new = '''                META_PROVIDER_ID,\n                SNAPCHAT_PROVIDER_ID,\n                TIKTOK_PROVIDER_ID,\n                GOOGLE_ADS_PROVIDER_ID,\n            ]},\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            META_PROVIDER_ID,\n            SNAPCHAT_PROVIDER_ID,\n            TIKTOK_PROVIDER_ID,\n        }:\n'''
          new = '''            META_PROVIDER_ID,\n            SNAPCHAT_PROVIDER_ID,\n            TIKTOK_PROVIDER_ID,\n            GOOGLE_ADS_PROVIDER_ID,\n        }:\n'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''\n\nasync def _refresh_snapchat(\n'''
          assert marker in text
          google_refresh = r'''\n\nasync def _refresh_google(\n    db: Any,\n    *,\n    user_id: str,\n    start_date: date,\n    end_date: date,\n    now: datetime,\n) -> dict[str, Any]:\n    if not google_oauth_configured() or not google_ads_reporting_enabled():\n        return {\n            "provider": GOOGLE_ADS_PROVIDER_ID,\n            "status": "skipped",\n            "reason": "disabled",\n        }\n    active = await _active_run(\n        db, user_id=user_id, provider=GOOGLE_ADS_PROVIDER_ID, now=now\n    )\n    if active:\n        return {\n            "provider": GOOGLE_ADS_PROVIDER_ID,\n            "status": "skipped",\n            "reason": "sync_in_progress",\n            "run_id": active.get("run_id"),\n        }\n    run_id = await _start_run(\n        db,\n        user_id=user_id,\n        provider=GOOGLE_ADS_PROVIDER_ID,\n        run_type=GOOGLE_RUN_TYPE,\n        source_mode=GOOGLE_ADS_REPORTING_SOURCE_MODE,\n        start_date=start_date,\n        end_date=end_date,\n        now=now,\n    )\n    try:\n        result = await run_google_ads_reporting_sync(\n            db,\n            user_id,\n            date_from=start_date.isoformat(),\n            date_to=end_date.isoformat(),\n        )\n        status = str(result.get("status") or "complete")\n        if status not in {"complete", "partial", "failed"}:\n            status = "complete"\n        await _finish_run(\n            db, user_id=user_id, run_id=run_id, status=status, result=result\n        )\n        return {\n            "provider": GOOGLE_ADS_PROVIDER_ID,\n            "run_id": run_id,\n            "status": status,\n            **_safe_summary(result),\n        }\n    except GoogleAdsReportingError as exc:\n        error_id = await _record_error(\n            db,\n            user_id=user_id,\n            provider=GOOGLE_ADS_PROVIDER_ID,\n            run_id=run_id,\n            source_mode=GOOGLE_ADS_REPORTING_SOURCE_MODE,\n            code=exc.code,\n            message=exc.message,\n            retryable=exc.retryable,\n        )\n        await _finish_run(\n            db,\n            user_id=user_id,\n            run_id=run_id,\n            status="failed",\n            result=exc.result,\n            error={\n                "error_id": error_id,\n                "code": exc.code,\n                "message": exc.message,\n                "retryable": exc.retryable,\n            },\n        )\n        if exc.code == "google_ads_needs_reauth":\n            await _mark_needs_reauth(db, user_id, GOOGLE_ADS_PROVIDER_ID)\n        return {\n            "provider": GOOGLE_ADS_PROVIDER_ID,\n            "run_id": run_id,\n            "status": "failed",\n            "code": exc.code,\n        }\n'''
          text = text.replace(marker, google_refresh + marker, 1)

          old = '''            if provider == TIKTOK_PROVIDER_ID:\n                return await _refresh_tiktok(\n                    db,\n                    user_id=user_id,\n                    start_date=start_date,\n                    end_date=end_date,\n                    now=started,\n                )\n            return await _refresh_snapchat(\n'''
          new = '''            if provider == TIKTOK_PROVIDER_ID:\n                return await _refresh_tiktok(\n                    db,\n                    user_id=user_id,\n                    start_date=start_date,\n                    end_date=end_date,\n                    now=started,\n                )\n            if provider == GOOGLE_ADS_PROVIDER_ID:\n                return await _refresh_google(\n                    db,\n                    user_id=user_id,\n                    start_date=start_date,\n                    end_date=end_date,\n                    now=started,\n                )\n            return await _refresh_snapchat(\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                META_PROVIDER_ID,\n                SNAPCHAT_PROVIDER_ID,\n                TIKTOK_PROVIDER_ID,\n            ]},\n        },\n        {"_id": 0},\n    )\n'''
          new = '''                META_PROVIDER_ID,\n                SNAPCHAT_PROVIDER_ID,\n                TIKTOK_PROVIDER_ID,\n                GOOGLE_ADS_PROVIDER_ID,\n            ]},\n        },\n        {"_id": 0},\n    )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          scheduler_path.write_text(text)

          dashboard_path = Path('frontend/src/pages/AdvancedDashboard.jsx')
          dashboard = dashboard_path.read_text()
          old = '''    useEffect(() => {\n        let active = true;\n        const fromDate = filters?.from;\n        const toDate = filters?.to || fromDate;\n        if (!fromDate || !toDate) return () => { active = false; };\n        getDashboardAdsSpend({ dateFrom: fromDate, dateTo: toDate, refresh: false })\n            .then((result) => { if (active) setChartData(result); })\n            .catch(() => { if (active) setChartData(null); });\n        return () => { active = false; };\n    }, [filters?.from, filters?.to]);\n'''
          new = '''    useEffect(() => {\n        let active = true;\n        let timer = null;\n        const fromDate = filters?.from;\n        const toDate = filters?.to || fromDate;\n        if (!fromDate || !toDate) return () => { active = false; };\n        const loadSpend = () => getDashboardAdsSpend({ dateFrom: fromDate, dateTo: toDate, refresh: false })\n            .then((result) => { if (active) setChartData(result); })\n            .catch(() => { if (active) setChartData(null); });\n        loadSpend();\n        timer = window.setInterval(loadSpend, 60_000);\n        return () => {\n            active = false;\n            if (timer) window.clearInterval(timer);\n        };\n    }, [filters?.from, filters?.to]);\n'''
          assert old in dashboard, 'AdvancedDashboard ads spend effect contract changed'
          dashboard = dashboard.replace(old, new, 1)
          dashboard_path.write_text(dashboard)

          test_path = Path('backend/tests/test_google_ads_dashboard_live_sync_contract.py')
          test_path.write_text(r'''from pathlib import Path\n\n\ndef test_google_ads_is_part_of_server_side_ads_scheduler():\n    source = Path("backend/integrations_control_center/ads_auto_sync_scheduler.py").read_text()\n    assert "GOOGLE_ADS_PROVIDER_ID" in source\n    assert "run_google_ads_reporting_sync" in source\n    assert "async def _refresh_google(" in source\n    assert "if provider == GOOGLE_ADS_PROVIDER_ID:" in source\n    assert source.count("GOOGLE_ADS_PROVIDER_ID") >= 8\n\n\ndef test_dashboard_ads_card_reloads_saved_spend_without_manual_page_refresh():\n    source = Path("frontend/src/pages/AdvancedDashboard.jsx").read_text()\n    assert "const loadSpend = () => getDashboardAdsSpend" in source\n    assert "window.setInterval(loadSpend, 60_000)" in source\n    assert "window.clearInterval(timer)" in source\n\n\ndef test_google_reporting_keeps_daily_and_hourly_cost_projection():\n    source = Path("backend/integrations_control_center/google_ads_reporting.py").read_text()\n    assert "segments.date, segments.hour, metrics.cost_micros" in source\n    assert 'provider="google"' in source\n    assert "GOOGLE_ADS_DAILY_COLLECTION" in source\n''')
          PY

      - name: Verify focused Python contracts
        run: |
          python -m compileall -q backend/integrations_control_center/ads_auto_sync_scheduler.py backend/integrations_control_center/google_ads_reporting.py
          python -m pytest -q backend/tests/test_google_ads_dashboard_live_sync_contract.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-google-ads-dashboard-live-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/integrations_control_center/ads_auto_sync_scheduler.py backend/tests/test_google_ads_dashboard_live_sync_contract.py frontend/src/pages/AdvancedDashboard.jsx .github/workflows/apply-google-ads-dashboard-live-sync.yml
          git commit -m "fix(ads): keep Google dashboard spend live"
          git push origin HEAD:fix/google-ads-dashboard-live-sync
