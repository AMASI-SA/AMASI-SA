name: Operational Mapping Source Checkpoint
on:
  push:
    branches: [integration/operational-balances-unified-20261102]
    paths: [.github/workflows/operational-mapping-checkpoint.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.repository == 'AMASI-SA/AMASI-SA'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Apply hash-locked source only on this task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/integration/operational-balances-unified-20261102
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = af4ce7f914354c5c1cbbc511ecb4c69b057ea741
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess,tempfile
          root=pathlib.Path.cwd()
          parts=sorted(root.glob('.ci/op-mapping-checkpoint/*.b64'))
          assert len(parts)==9
          packed=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='19a9225bc1fcfa588b1cb15ed9d4a2c56bb15ba9b91299152ee569e6e5a22b35'
          data=json.loads(gzip.decompress(packed))
          assert data['base']=='2661457ae5c3d29dfd67e15e49f5f065278e8238'
          patch=data['patch'].encode()
          assert hashlib.sha256(patch).hexdigest()==data['patch_sha256']=='9a0fbf37475c4290c8d7fb2451476dd080ad8950038dcbc4ee4d05541a488924'
          allowed=set('''.github/workflows/operational-balance-web.yml
          backend/operational_balance_routes.py
          backend/operational_balance_service.py
          backend/operational_balance_sources.py
          backend/operational_bundle_legacy_receipts.py
          backend/operational_native_purchase_link.py
          backend/operational_native_purchase_link_service.py
          backend/operational_native_purchase_review.py
          backend/operational_open_cost_exposure.py
          backend/operational_remaining_bundle_sources.py
          backend/operational_supplier_invoice_preview.py
          backend/tests/test_operational_balance_bundle_legacy_receipts.py
          backend/tests/test_operational_balance_native_purchase_link.py
          backend/tests/test_operational_balance_native_purchase_link_mongo.py
          docs/operations/OP-UNIFIED-BALANCES-20261102/DELIVERY-REGISTER.md
          docs/operations/OP-UNIFIED-BALANCES-20261102/STATUS.md
          frontend/src/pages/operational/NativePurchaseReview.jsx
          frontend/src/pages/operational/NativePurchaseReview.test.jsx
          frontend/src/pages/operational/OperationalFinancialPosition.jsx
          frontend/src/pages/operational/api.js
          frontend/src/pages/operational/nativePurchaseLinkApi.test.js
          frontend/src/pages/operational/nativePurchaseReview.css'''.splitlines())
          assert len(data['files'])==22 and {v['path'] for v in data['files']}==allowed
          def blob(p):
              b=p.read_bytes();return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for f in data['files']:
              p=root/f['path'];assert not p.is_symlink() and p.resolve().is_relative_to(root)
              assert (blob(p) if p.exists() else None)==f['before'],f['path']
          with tempfile.NamedTemporaryFile() as tmp:
              tmp.write(patch);tmp.flush()
              subprocess.run(['git','apply','--check',tmp.name],check=True)
              subprocess.run(['git','apply',tmp.name],check=True)
          for f in data['files']:
              p=root/f['path'];assert p.is_file() and not p.is_symlink() and blob(p)==f['after'],f['path']
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==allowed,changed
          subprocess.run(['git','rm','--',*[str(p.relative_to(root)) for p in parts],'.github/workflows/operational-mapping-source-export.yml','.github/workflows/operational-mapping-checkpoint.yml'],check=True)
          PY
          git config user.name 'mezan'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'WIP: connect bundle legacy receiving and explicit native purchase balance matching' -m '159 focused backend tests passed locally before final UI/scope changes. Final combined backend/frontend/security and release checks remain. No live financial action, production change, opening reset, dashboard change, /app or release lease. Future approval is explicit and hash-bound; existing debt/payment reuse never executes a bank transfer. See task STATUS/DELIVERY-REGISTER entry 002.'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          remote=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:"$GITHUB_REF"
          unset auth
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
