name: Google live category preview
on:
  push:
    branches: [codex/google-category-enumeration-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_live_category_*.py
      - backend/salla_integration/service.py
      - backend/tests/test_google_live_category_*.py
      - .github/workflows/google-live-category-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1 cryptography==50.0.2
          python-multipart==0.0.32 PyJWT==2.15.1 bcrypt==4.1.3
          python-dotenv==1.2.4 pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable loopback replica
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name google-live-category-rs -p 127.0.0.1:27478:27478 mongo:8.0.26 --port 27478 --replSet gLiveCategory --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-live-category-rs mongosh --port 27478 --quiet --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-live-category-rs mongosh --port 27478 --quiet --eval 'if(rs.initiate({_id:"gLiveCategory",members:[{_id:0,host:"127.0.0.1:27478"}]}).ok !== 1) quit(1)'
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-live-category-rs mongosh --port 27478 --quiet --eval 'const h=db.hello(); if(h.setName !== "gLiveCategory" || h.isWritablePrimary !== true || !Number.isInteger(h.logicalSessionTimeoutMinutes)) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Test live category preview against replica
        env:
          GOOGLE_LIVE_CATEGORY_TEST_MONGO_URI: mongodb://127.0.0.1:27478/
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -Werror --junitxml=live-category-results.xml backend/tests/test_google_live_category_proof.py backend/tests/test_google_live_category_reader.py backend/tests/test_google_live_category_routes.py backend/tests/test_google_live_category_mongo.py
          python - <<'PYGATE'
          import xml.etree.ElementTree as ET
          cases=ET.parse('live-category-results.xml').getroot().findall('.//testcase')
          replica=[c for c in cases if c.attrib.get('classname','').endswith('test_google_live_category_mongo')]
          assert len(cases) == 38 and len(replica) == 7
          assert any(c.attrib.get('name') == 'test_actual_mongo_native_fixture_read_without_scope_or_mutations' for c in replica)
          assert sum(c.attrib.get('name','').startswith('test_actual_plan_and_integration_race_invalidate_fixture_observation') for c in replica) == 4
          assert any(c.attrib.get('name') == 'test_actual_staff_is_not_owner_even_with_ads_read_permission' for c in replica)
          assert not [c for c in cases if any(c.find(x) is not None for x in ('skipped','failure','error'))]
          print('Verified',len(cases),'tests including',len(replica),'real Mongo replica tests, zero skips')
          PYGATE
      - name: Remove disposable replica
        if: always()
        run: docker rm -f google-live-category-rs
