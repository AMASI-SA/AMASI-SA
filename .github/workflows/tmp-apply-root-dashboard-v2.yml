name: Apply Root Dashboard V2 Fix

on:
  pull_request:
    branches:
      - main

concurrency:
  group: root-dashboard-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/root-default-dashboard-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply exact route and sidebar changes
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("frontend/src/App.js")
          sidebar_path = Path("frontend/src/components/Sidebar.jsx")
          test_path = Path("frontend/src/defaultDashboardRoute.test.js")

          app = app_path.read_text(encoding="utf-8")
          replacements = [
              (
                  'if (user) return <Navigate to="/" replace />;',
                  'if (user) return <Navigate to="/dashboard-v2" replace />;',
              ),
              (
                  '<Route path="/" element={<ProtectedRoute><Layout><Dashboard /></Layout></ProtectedRoute>} />',
                  '<Route path="/" element={<ProtectedRoute><Navigate to="/dashboard-v2" replace /></ProtectedRoute>} />\n'
                  '            <Route path="/legacy-dashboard" element={<ProtectedRoute><Layout><Dashboard /></Layout></ProtectedRoute>} />',
              ),
              (
                  '<Route path="*" element={<Navigate to="/" replace />} />',
                  '<Route path="*" element={<Navigate to="/dashboard-v2" replace />} />',
              ),
          ]
          for old, new in replacements:
              if old in app:
                  if app.count(old) != 1:
                      raise SystemExit(f"App.js match duplicated for {old!r}")
                  app = app.replace(old, new, 1)
              elif new not in app:
                  raise SystemExit(f"Neither old nor new App.js contract found: {old!r}")
          app_path.write_text(app, encoding="utf-8")

          sidebar = sidebar_path.read_text(encoding="utf-8")
          old_sidebar = '{ to: "/", label: "لوحة التحكم", icon: House, testid: "nav-dashboard" }'
          new_sidebar = '{ to: "/legacy-dashboard", label: "لوحة التحكم القديمة", icon: House, testid: "nav-dashboard" }'
          if old_sidebar in sidebar:
              if sidebar.count(old_sidebar) != 1:
                  raise SystemExit("Legacy dashboard sidebar entry duplicated")
              sidebar = sidebar.replace(old_sidebar, new_sidebar, 1)
          elif new_sidebar not in sidebar:
              raise SystemExit("Legacy dashboard sidebar contract missing")
          sidebar_path.write_text(sidebar, encoding="utf-8")

          test_path.write_text('''const fs = require("fs");\nconst path = require("path");\n\nfunction read(relativePath) {\n    return fs.readFileSync(path.join(__dirname, "..", relativePath), "utf8");\n}\n\ntest("root and authenticated public redirects land on Mezan 2 dashboard", () => {\n    const app = read("src/App.js");\n    expect(app).toContain('if (user) return <Navigate to="/dashboard-v2" replace />;');\n    expect(app).toContain('<Route path="/" element={<ProtectedRoute><Navigate to="/dashboard-v2" replace /></ProtectedRoute>} />');\n    expect(app).toContain('<Route path="*" element={<Navigate to="/dashboard-v2" replace />} />');\n    expect(app).not.toContain('<Route path="/" element={<ProtectedRoute><Layout><Dashboard /></Layout></ProtectedRoute>} />');\n});\n\ntest("legacy dashboard remains reachable only through its explicit legacy route", () => {\n    const app = read("src/App.js");\n    const sidebar = read("src/components/Sidebar.jsx");\n    expect(app).toContain('<Route path="/legacy-dashboard" element={<ProtectedRoute><Layout><Dashboard /></Layout></ProtectedRoute>} />');\n    expect(sidebar).toContain('{ to: "/legacy-dashboard", label: "لوحة التحكم القديمة", icon: House, testid: "nav-dashboard" }');\n    expect(sidebar).not.toContain('{ to: "/", label: "لوحة التحكم", icon: House, testid: "nav-dashboard" }');\n});\n''', encoding="utf-8")
          PY

      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Test root dashboard and navigation contracts
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/defaultDashboardRoute.test.js
          src/components/MezanV2NavigationShell.test.jsx

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: yarn build

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.js \
                  frontend/src/components/Sidebar.jsx \
                  frontend/src/defaultDashboardRoute.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "ROOT_DASHBOARD_FIX_ALREADY_PRESENT"
            exit 0
          fi
          git commit -m "fix(navigation): open Mezan 2 dashboard at root"
          git fetch origin fix/root-default-dashboard-v2
          git rebase origin/fix/root-default-dashboard-v2
          git push origin HEAD:fix/root-default-dashboard-v2
