name: Temporary supplier audit export fix

on:
  push:
    branches:
      - fix/export-supplier-audit-boot

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow import fix and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wrapper = Path('backend/mezan_supplier_management_routes/__init__.py')
          text = wrapper.read_text(encoding='utf-8')
          export_anchor = 'ensure_mezan_supplier_indexes = _BASE.ensure_mezan_supplier_indexes\n'
          if '_audit = _BASE._audit\n' not in text:
              if export_anchor not in text:
                  raise SystemExit('wrapper export anchor missing')
              text = text.replace(export_anchor, export_anchor + '_audit = _BASE._audit\n', 1)
          all_anchor = '    "ensure_mezan_supplier_indexes",\n'
          if '    "_audit",\n' not in text:
              if all_anchor not in text:
                  raise SystemExit('__all__ anchor missing')
              text = text.replace(all_anchor, '    "_audit",\n' + all_anchor, 1)
          wrapper.write_text(text, encoding='utf-8')

          test = Path('backend/tests/test_supplier_management_import_boot.py')
          test.write_text('''"""Regression test for supplier router import compatibility."""\n\n\ndef test_supplier_management_wrapper_reexports_audit_and_mobile_router_imports():\n    import mezan_supplier_management_routes as routes\n\n    assert callable(routes._audit)\n\n    import supplier_mobile_routes  # noqa: F401\n''', encoding='utf-8')

          workflow = Path('.github/workflows/employees-v2-foundation.yml')
          wf = workflow.read_text(encoding='utf-8')
          path_anchor = '      - "backend/server.py"\n'
          test_path = '      - "backend/tests/test_supplier_management_import_boot.py"\n'
          if test_path not in wf:
              if path_anchor not in wf:
                  raise SystemExit('workflow path anchor missing')
              wf = wf.replace(path_anchor, path_anchor + test_path, 1)
          pytest_anchor = '          backend/tests/test_employee_account_access_revocation.py\n'
          pytest_line = '          backend/tests/test_supplier_management_import_boot.py\n'
          if pytest_line not in wf:
              if pytest_anchor not in wf:
                  raise SystemExit('workflow pytest anchor missing')
              wf = wf.replace(pytest_anchor, pytest_anchor + pytest_line, 1)
          workflow.write_text(wf, encoding='utf-8')
          PY

          rm -f .github/workflows/temp-fix-supplier-audit-export.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/mezan_supplier_management_routes/__init__.py \
                  backend/tests/test_supplier_management_import_boot.py \
                  .github/workflows/employees-v2-foundation.yml \
                  .github/workflows/temp-fix-supplier-audit-export.yml
          git commit -m "fix: restore supplier audit export boot contract"
          git push origin HEAD:fix/export-supplier-audit-boot
