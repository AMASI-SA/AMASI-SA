name: Google Ads full management

on:
  push:
    branches: [codex/google-standing-dispatch-floor-wip-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - "backend/integrations_control_center/google_ads*"
      - "backend/integrations_control_center/google_commercial_plan.py"
      - "backend/product_inventory_proof.py"
      - "backend/product_v2_details_routes.py"
      - "backend/ads_manager/**"
      - "backend/google_ads_automation_*.py"
      - "backend/tests/test_google_ads*"
      - "backend/tests/google_ads_transactional_fake.py"
      - "backend/tests/test_google_commercial_plan.py"
      - "frontend/src/components/marketing/Google*"
      - "frontend/src/components/GoogleAdsAllPlatformsCard*"
      - "frontend/src/pages/MarketingPlatformWorkspace*"
      - "frontend/src/pages/AdsManager*"
      - "frontend/src/pages/AdvancedDashboard*"
      - "frontend/src/services/googleAds*"
      - "frontend/src/services/googleAnalysisAttempts*"
      - "frontend/src/services/googleAutomationPolicy*"
      - "frontend/src/services/googleCreationPolicy*"
      - "frontend/src/services/marketingPerformance*"
      - "frontend/src/services/adsManager*"
      - ".github/workflows/google-ads-full-management.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    # Mongo 8.x cannot start on the current Ubuntu 24.04 hosted kernel.
    # Temporary runner workaround: actions/runner-images#15005.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused production-compatible test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1
          python-multipart==0.0.32 cryptography==50.0.2
          PyJWT==2.15.1 bcrypt==4.1.3 python-dotenv==1.2.4
          pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable loopback-only Mongo replica set
        shell: bash
        run: |
          set -euo pipefail
          uname -r
          docker run -d --name google-full-management-rs \
            -p 127.0.0.1:27473:27473 mongo:8.0.26 \
            --port 27473 --replSet gGoogleFull --bind_ip_all --setParameter enableTestCommands=1
          ready=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-full-management-rs)" != true ]; then
              docker logs google-full-management-rs
              exit 1
            fi
            if docker exec google-full-management-rs mongosh --port 27473 --quiet \
              --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-full-management-rs mongosh --port 27473 --quiet \
            --eval 'const result=rs.initiate({_id:"gGoogleFull",members:[{_id:0,host:"127.0.0.1:27473"}]}); if(result.ok !== 1) quit(1)'
          primary=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-full-management-rs)" != true ]; then
              docker logs google-full-management-rs
              exit 1
            fi
            if docker exec google-full-management-rs mongosh --port 27473 --quiet \
              --eval 'const hello=db.hello(); if(hello.setName !== "gGoogleFull" || hello.isWritablePrimary !== true || !Number.isInteger(hello.logicalSessionTimeoutMinutes)) quit(1)'; then
              primary=1
              break
            fi
            sleep 1
          done
          test "$primary" -eq 1
      - name: Test approved gateway with real Mongo and official v25 schema
        env:
          PYTHONPATH: backend
          GOOGLE_ADS_TEST_MONGO_URI: mongodb://127.0.0.1:27473/
        run: >-
          python -m pytest --noconftest -q --junitxml=google-budget-full-results.xml
          backend/tests/test_google_ads_campaign_builder.py
          backend/tests/test_google_ads_ai.py
          backend/tests/test_google_ads_ai_actions.py
          backend/tests/test_google_ads_ai_route_context.py
          backend/tests/test_google_ads_automation_budget_guard.py
          backend/tests/test_google_ads_automation_budget_guard_mongo.py
          backend/tests/test_google_ads_budget_guard_standing.py
          backend/tests/test_google_ads_guard_integration.py
          backend/tests/test_google_ads_guard_integration_mongo.py
          backend/tests/test_google_ads_legacy_budget_settlement.py
          backend/tests/test_google_ads_legacy_budget_settlement_mongo.py
          backend/tests/test_google_ads_transactional_fake.py
          backend/tests/test_google_ads_automation_policy.py
          backend/tests/test_google_ads_automation_policy_mongo.py
          backend/tests/test_google_ads_autonomy_planner.py
          backend/tests/test_google_ads_automation_plan.py
          backend/tests/test_google_ads_automation_authority.py
          backend/tests/test_google_ads_automation_authority_mongo.py
          backend/tests/test_google_ads_automation_worker.py
          backend/tests/test_google_ads_automation_worker_mongo.py
          backend/tests/test_google_ads_automation_gateway.py
          backend/tests/test_google_ads_automation_gateway_mongo.py
          backend/tests/test_google_ads_automation_activation.py
          backend/tests/test_google_ads_automation_runtime.py
          backend/tests/test_google_ads_automation_cycles.py
          backend/tests/test_google_ads_automation_creation_contract.py
          backend/tests/test_google_ads_creation_inventory.py
          backend/tests/test_google_ads_creation_inventory_mongo.py
          backend/tests/test_google_ads_automation_creation_policy.py
          backend/tests/test_google_ads_automation_creation_policy_mongo.py
          backend/tests/test_google_ads_automation_creation_plan.py
          backend/tests/test_google_ads_creation_budget_reader.py
          backend/tests/test_google_ads_paused_creation_budget.py
          backend/tests/test_google_ads_standing_dispatch_floor.py
          backend/tests/test_google_ads_standing_dispatch_floor_mongo.py
          backend/tests/test_google_ads_paused_dispatch_floor.py
          backend/tests/test_google_ads_paused_dispatch_floor_mongo.py
          backend/tests/test_google_ads_paused_creation_budget_mongo.py
          backend/tests/test_google_ads_automation_creation_authority.py
          backend/tests/test_google_ads_automation_creation_authority_mongo.py
          backend/tests/test_google_ads_automation_creation_gateway.py
          backend/tests/test_google_ads_automation_creation_gateway_mongo.py
          backend/tests/test_google_ads_automation_creation_worker.py
          backend/tests/test_google_ads_automation_creation_worker_mongo.py
          backend/tests/test_google_ads_management.py
          backend/tests/test_google_ads_verification.py
          backend/tests/test_google_ads_client.py
          backend/tests/test_google_ads_reporting_v1.py
          backend/tests/test_google_commercial_plan.py
          backend/tests/test_google_ads_plan_suggestions.py
          backend/tests/test_google_ads_workspace.py
          backend/tests/test_google_ads_overview.py
          backend/tests/test_google_ads_protobuf_contract.py
      - name: Require full backend proof without skipped Mongo acceptance
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          cases=ET.parse('google-budget-full-results.xml').getroot().findall('.//testcase')
          required={
            'test_google_ads_automation_policy_mongo', 'test_google_ads_automation_creation_policy_mongo',
            'test_google_ads_automation_authority_mongo', 'test_google_ads_automation_gateway_mongo',
            'test_google_ads_automation_worker_mongo', 'test_google_ads_automation_creation_authority_mongo',
            'test_google_ads_automation_creation_gateway_mongo', 'test_google_ads_automation_creation_worker_mongo',
            'test_google_ads_automation_budget_guard_mongo', 'test_google_ads_guard_integration_mongo',
            'test_google_ads_legacy_budget_settlement_mongo', 'test_google_ads_creation_inventory_mongo',
            'test_google_ads_paused_creation_budget_mongo', 'test_google_ads_paused_dispatch_floor_mongo', 'test_google_ads_standing_dispatch_floor_mongo',
          }
          present={case.attrib.get('classname','').split('.')[-1] for case in cases}
          assert sum(case.attrib.get('classname','').endswith('test_google_ads_paused_creation_budget_mongo') for case in cases)==8
          assert sum(case.attrib.get('classname','').endswith('test_google_ads_automation_creation_authority_mongo') for case in cases)==9
          assert sum(case.attrib.get('classname','').endswith('test_google_ads_paused_dispatch_floor_mongo') for case in cases)==7
          assert sum(case.attrib.get('classname','').endswith('test_google_ads_standing_dispatch_floor_mongo') for case in cases)==9
          assert len(cases) >= 1000 and required <= present, (len(cases), sorted(required-present))
          assert not [case for case in cases if any(case.find(tag) is not None for tag in ('failure','error','skipped'))]
          print('Verified',len(cases),'backend tests including all required Mongo modules; zero skips')
          PYCODE
      - name: Check source whitespace
        run: git diff --check
      - name: Remove disposable replica container
        if: always()
        run: docker rm -f google-full-management-rs
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare governed frontend toolchain
        run: python scripts/frontend_release_toolchain.py ensure
      - name: Install frozen frontend dependencies
        run: python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend install --frozen-lockfile --non-interactive
      - name: Test native workspace and shared dashboard routes
        env:
          CI: "true"
        run: >-
          python scripts/frontend_release_toolchain.py exec --
          yarn --cwd frontend test --watchAll=false --runInBand --runTestsByPath
          src/services/googleAds.test.js
          src/services/marketingPerformance.test.js
          src/services/adsManager.test.js
          src/components/marketing/GoogleAdsWorkspace.test.jsx
          src/components/marketing/GoogleAnalysisAttempts.test.jsx
          src/components/marketing/GoogleAutomationPolicy.test.jsx
          src/components/marketing/GoogleCreationPolicy.test.jsx
          src/components/marketing/GoogleCommercialPlan.test.jsx src/services/googleCommercialPlanSuggestion.test.js
          src/components/marketing/GooglePinnedCatalogReview.test.jsx
          src/components/marketing/GoogleRecommendationAction.test.jsx
          src/components/marketing/GoogleCampaignComposer.test.jsx
          src/components/marketing/GoogleAdsIntelligenceCard.test.jsx
          src/components/GoogleAdsAllPlatformsCard.test.jsx
          src/components/DashboardAdsSpendCard.test.jsx
          src/pages/MarketingPlatformWorkspace.google.test.jsx
          src/pages/GoogleAccountScope.test.jsx
          src/pages/AdsManager.test.jsx
      - name: Build current reviewed CI checkout
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: https://mezansalla.com
        run: python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend build
