name: Production Snapchat Account Hourly Chart V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/__init__.py"
      - "backend/integrations_control_center/snapchat_account_hourly_chart.py"
      - "backend/tests/test_snapchat_account_hourly_chart_v1.py"
      - "frontend/src/components/marketing/AdsPerformanceExplorer.jsx"
      - "frontend/src/components/marketing/AdsPerformanceExplorer.test.jsx"
      - "frontend/src/services/marketingPerformance.js"
      - "frontend/src/services/marketingPerformanceHourly.test.js"
      - ".github/workflows/prod-snapchat-account-hourly-chart-v1.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          bcrypt
          PyJWT
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Compile hourly chart projection
        run: >-
          python -m py_compile
          integrations_control_center/snapchat_account_hourly_chart.py
          integrations_control_center/__init__.py
          tests/test_snapchat_account_hourly_chart_v1.py
      - name: Run focused backend tests
        run: >-
          python -m pytest
          tests/test_snapchat_account_hourly_chart_v1.py
          tests/test_snapchat_account_timezone_manager_v1.py
          tests/test_snapchat_account_delivery_refresh_v1.py
          -q --tb=short
      - name: Enforce hourly read-only contract
        working-directory: .
        run: |
          MODULE=backend/integrations_control_center/snapchat_account_hourly_chart.py
          INIT=backend/integrations_control_center/__init__.py
          grep -q 'ACCOUNT_LOCAL_HOURLY_SOURCE_MODE' "$MODULE"
          grep -q 'stored_granularity": "ACCOUNT_LOCAL_HOUR"' "$MODULE"
          grep -q 'provider_granularity": "HOUR"' "$MODULE"
          grep -q 'for hour_index in range(24)' "$MODULE"
          grep -q 'install_snapchat_account_hourly_chart' "$INIT"
          ! grep -Eq 'client\.(post|put|patch|delete)\(' "$MODULE"
          ! grep -Eq 'accounting_eligible": True|provider_write_reached": True|qoyod_write_reached": True' "$MODULE"

  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test hourly chart and normalization
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/AdsPerformanceExplorer.test.jsx
          src/services/marketingPerformanceHourly.test.js
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce hourly chart UI contract
        working-directory: .
        run: |
          CHART=frontend/src/components/marketing/AdsPerformanceExplorer.jsx
          SERVICE=frontend/src/services/marketingPerformance.js
          grep -q 'ads-performance-hourly-chart' "$CHART"
          grep -q 'اتجاه الأداء بالساعة' "$CHART"
          grep -q '12 صباحًا إلى 11 مساءً' "$CHART"
          grep -q 'buildAdsHourlyChartInput' "$CHART"
          grep -q 'hourly_available' "$SERVICE"
          grep -q 'hour_index' "$SERVICE"
          ! grep -Eq '(api|axios)\.(post|put|patch|delete)\(' "$CHART" "$SERVICE"
