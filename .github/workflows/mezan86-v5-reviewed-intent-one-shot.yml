name: Mezan86 one-shot reviewed v5 intent B

on:
  push:
    branches:
      - codex/mezan86-v5-intent-build-helper-20261123

permissions:
  contents: write
  actions: read

jobs:
  build-reviewed-intent-b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_A: e9d80ff2e7a3b21fb25221516bb05e02819fd902
      SOURCE_J: 02cd99e5b2b68c95341c87590abcf572c885e697
      TARGET: codex/mezan86-reviewed-v5-intent-20261123
      ARTIFACT_ID: "14777881877"
      INTENT_SHA256: 1652d57d4b7162559f7e7970cc3be9e8251af624fd080c451f6b18bd31e92835
      RELEASE_ID: rg5-9796a26af755f49224fe1787bc922eb669b69f2a63a28192e2a84a0d320fc03f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the exact verified A/B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$SOURCE_A"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/candidate.zip"
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(p/'candidate.zip') as z:
              assert z.namelist()==['release-intent-v5.json']
              b=z.read('release-intent-v5.json')
          assert hashlib.sha256(b).hexdigest()==os.environ['INTENT_SHA256']
          j=json.loads(b)
          assert j['protocol_version']==5 and j['schema_version']==2
          assert j['kind']=='mezan_emergent_release_intent_v1'
          assert j['source_git_sha']==os.environ['SOURCE_A']
          assert j['source_base_git_sha']==os.environ['SOURCE_J']
          assert j['branch']=='hotfix/prod-snap-meta-final'
          assert j['runtime_identity']['release_id']==os.environ['RELEASE_ID']
          (p/'exact-intent.json').write_bytes(b)
          print('ARTIFACT_EXACT_BYTES_PASS')
          PY
      - name: Create intent-only B, validate tracked-Git v5 identity, and push only isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_A"
          test "$(git rev-parse HEAD)" = "$SOURCE_A"
          cp "$RUNNER_TEMP/exact-intent.json" release/release-intent-v5.json
          git add -- release/release-intent-v5.json
          test "$(git diff --cached --name-only)" = 'release/release-intent-v5.json'
          git diff --cached --check
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Freeze Mezan86 verified protocol v5 intent-only commit B'
          test "$(git rev-parse HEAD^)" = "$SOURCE_A"
          test "$(git diff --name-only "$SOURCE_A" HEAD)" = 'release/release-intent-v5.json'
          PYTHONPATH=backend:. python - <<'PY'
          from scripts.emergent_deployment_adapter import load_release_intent, verify_release_intent_git
          intent=load_release_intent()
          verify_release_intent_git(intent)
          print('V5_REVIEWED_B_CONTRACT_PASS')
          PY
          B="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$SOURCE_A"
          git push origin "HEAD:refs/heads/$TARGET"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$B"
          echo "REVIEWED_B_PUSH_PASS=$B"
          echo 'PRODUCTION_NOT_DEPLOYED'
