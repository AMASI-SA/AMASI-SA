name: Operational review auth dependencies
on:
  push:
    branches: [chore/operational-source-review-20261101]
    paths: [.github/workflows/operational-review-auth-deps.yml]
permissions:
  contents: read
jobs:
  public-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          mkdir review-wheels
          python -m pip download --only-binary=:all: --dest review-wheels bcrypt==4.1.3 PyJWT==2.15.0 python-multipart==0.0.32 openpyxl==3.1.5 qrcode==8.2
          cd review-wheels
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: operational-review-auth-dependencies
          path: review-wheels/
          retention-days: 3
          if-no-files-found: error
