name: Production Snapchat Fixed Created Orders V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/__init__.py"
      - "backend/integrations_control_center/snapchat_campaign_created_order_semantics.py"
      - "backend/tests/test_snapchat_campaign_created_order_semantics_v1.py"
      - "frontend/src/marketingCampaignProfitabilityHydration.js"
      - "frontend/src/marketingCampaignProfitabilityHydration.test.js"
      - ".github/workflows/prod-snapchat-fixed-created-orders-v1.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          bcrypt
          PyJWT
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Compile created-order semantics
        run: >-
          python -m py_compile
          integrations_control_center/snapchat_campaign_created_order_semantics.py
          integrations_control_center/__init__.py
          tests/test_snapchat_campaign_created_order_semantics_v1.py
      - name: Run campaign order and profitability tests
        run: >-
          python -m pytest
          tests/test_snapchat_campaign_created_order_semantics_v1.py
          tests/test_snapchat_campaign_profitability_v1.py
          tests/test_snapchat_campaign_profitability_exact_reuse_v2.py
          -q --tb=short
      - name: Enforce stable acquisition semantics
        working-directory: .
        run: |
          MODULE=backend/integrations_control_center/snapchat_campaign_created_order_semantics.py
          INIT=backend/integrations_control_center/__init__.py
          grep -q 'created_orders_all_statuses_fixed_by_creation_time' "$MODULE"
          grep -q 'sales_semantics' "$MODULE"
          grep -q 'profitability_semantics' "$MODULE"
          grep -q 'install_fixed_created_order_semantics' "$INIT"
          grep -q 'created_order_counts_include_cancelled' "$MODULE"
          ! grep -Eq 'client\.(post|put|patch|delete)\(' "$MODULE"
          ! grep -Eq 'provider_write_reached": True|accounting_write_reached": True|qoyod_write_reached": True' "$MODULE"

  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test raw report hydration
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/marketingCampaignProfitabilityHydration.test.js
          src/components/marketing/CampaignManagerTable.test.jsx
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce created/net order hydration
        working-directory: .
        run: |
          HYDRATION=frontend/src/marketingCampaignProfitabilityHydration.js
          grep -q 'created_orders' "$HYDRATION"
          grep -q 'financial_orders' "$HYDRATION"
          grep -q 'cancelled_orders' "$HYDRATION"
          grep -q 'hydrates_created_orders_all_statuses: true' "$HYDRATION"
          ! grep -Eq '(api|axios)\.(post|put|patch|delete)\(' "$HYDRATION"
