name: Orders V2 formatted address bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/add_orders_v2_formatted_address_row.py"
      - ".github/workflows/orders-v2-formatted-address-bootstrap.yml"

permissions:
  contents: write

jobs:
  add-address-row:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orders-v2-address-root-fallback
          fetch-depth: 0
          show-progress: false

      - name: Add complete address row
        run: python scripts/add_orders_v2_formatted_address_row.py

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile backend/tests/test_fulfillment_v2_contract.py
          grep -q '\["العنوان", address.formatted' frontend/src/pages/OrderDetailsV2.jsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/OrderDetailsV2.jsx backend/tests/test_fulfillment_v2_contract.py
          git commit -m "fix(orders-v2): display complete Salla order address"
          git push origin HEAD:fix/orders-v2-address-root-fallback
