name: Production Unified Ads Snapchat Campaign Contract

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/ads_manager/models.py"
      - "backend/ads_manager/service.py"
      - "backend/tests/test_unified_ads_snapchat_campaign_contract_v1.py"
      - "backend/tests/test_unified_ads_manager_phase1.py"
      - "frontend/src/services/adsManager.js"
      - "frontend/src/services/adsManager.snapchatCampaign.test.js"
      - "frontend/src/services/adsManager.test.js"
      - ".github/workflows/prod-unified-ads-snapchat-campaign-contract.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography

      - name: Compile unified ads contract
        run: >-
          python -m py_compile
          ads_manager/models.py
          ads_manager/service.py
          tests/test_unified_ads_snapchat_campaign_contract_v1.py

      - name: Test unified ads manager contract
        run: >-
          python -m pytest
          tests/test_unified_ads_snapchat_campaign_contract_v1.py
          tests/test_unified_ads_manager_phase1.py
          -q --tb=short

      - name: Enforce Snapchat campaign response support
        working-directory: .
        run: |
          grep -q 'provider: Literal\["snapchat", "tiktok", "meta"\]' \
            backend/ads_manager/models.py
          grep -q 'for provider_key in ("snapchat", "tiktok", "meta")' \
            backend/ads_manager/service.py

  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        run: yarn install --non-interactive

      - name: Test Snapchat campaign normalization
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/services/adsManager.snapchatCampaign.test.js
          src/services/adsManager.test.js

      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build

      - name: Enforce common campaign provider allowlist
        working-directory: .
        run: |
          grep -q 'SAFE_CAMPAIGN_PROVIDERS = new Set(ADS_PROVIDER_ORDER)' \
            frontend/src/services/adsManager.js
