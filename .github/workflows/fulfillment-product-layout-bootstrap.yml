name: Fulfillment product layout bootstrap

on:
  push:
    branches:
      - feat/fulfillment-review-pagination
    paths:
      - "scripts/patch_order_review_product_layout.py"
      - ".github/workflows/fulfillment-product-layout-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fulfillment-review-pagination
          fetch-depth: 0
          show-progress: false

      - name: Apply responsive product layout
        run: python scripts/patch_order_review_product_layout.py

      - name: Validate layout contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile backend/tests/test_fulfillment_v2_contract.py
          grep -q 'data-testid="order-review-product-card"' frontend/src/pages/OrderReview.jsx
          grep -q 'data-testid="order-review-product-specs"' frontend/src/pages/OrderReview.jsx
          grep -q 'lg:grid-cols-2 2xl:grid-cols-3' frontend/src/pages/OrderReview.jsx
          grep -q 'md:max-w-7xl' frontend/src/pages/OrderReview.jsx
          ! grep -q 'sm:grid-cols-\[150px_minmax(0,1fr)\]' frontend/src/pages/OrderReview.jsx

      - name: Commit product layout fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Product layout patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/OrderReview.jsx backend/tests/test_fulfillment_v2_contract.py
          git commit -m "fix(fulfillment): keep review product cards readable"
          git push origin HEAD:feat/fulfillment-review-pagination
