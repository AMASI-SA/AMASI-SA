name: Apply Meta Card V2 Patch

on:
  push:
    branches:
      - fix/meta-reporting-control-in-card-v2
    paths:
      - ".github/workflows/apply-meta-card-v2-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meta-reporting-control-in-card-v2
          fetch-depth: 0
      - name: Patch production card and add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          card = Path("frontend/src/components/integrationsV2/IntegrationCardV2.jsx")
          text = card.read_text(encoding="utf-8")

          import_anchor = 'import SnapchatAccountScope from "./SnapchatAccountScope";\n'
          import_line = 'import MetaReportingControl from "./MetaReportingControl";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Meta import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          sync_anchor = '    const showSync = integration.provider === "snapchat_ads";\n'
          meta_flag = '    const showMetaReporting = integration.provider === "meta_ads";\n'
          if meta_flag not in text:
              if sync_anchor not in text:
                  raise SystemExit("showSync anchor not found")
              text = text.replace(sync_anchor, sync_anchor + meta_flag, 1)

          action_anchor = '            <div className={`mt-auto grid grid-cols-2 gap-2 border-t border-slate-100 pt-4 ${\n'
          meta_block = '''            {showMetaReporting && (\n                <div className="mt-4" data-testid="meta-reporting-control-host">\n                    <MetaReportingControl integration={integration} />\n                </div>\n            )}\n\n'''
          if 'data-testid="meta-reporting-control-host"' not in text:
              if action_anchor not in text:
                  raise SystemExit("action grid anchor not found")
              text = text.replace(action_anchor, meta_block + action_anchor, 1)

          card.write_text(text, encoding="utf-8")

          entry = 'export { default } from "./IntegrationCardV2";\n'
          for name in ("IntegrationCard.js", "IntegrationCard.jsx"):
              Path("frontend/src/components/integrationsV2", name).write_text(entry, encoding="utf-8")

          test = Path("frontend/src/components/integrationsV2/IntegrationCardV2MetaControl.test.jsx")
          test.write_text(r'''import React from "react";
          import { render, screen } from "@testing-library/react";
          import IntegrationCardV2 from "./IntegrationCardV2";

          jest.mock("../../services/metaIntegrationsV2", () => ({
              getMetaAccountSelection: jest.fn(() => new Promise(() => {})),
              saveMetaAccountSelection: jest.fn(),
              startMetaReportingSync: jest.fn(),
          }));

          const base = {
              name_ar: "إعلانات ميتا",
              name: "Meta Ads",
              connection_status: "connected",
              connection_provenance: "api_connection",
              accounts: [],
              health: { score: 100, data_quality: "good" },
              permissions: { current: ["ads_read"], missing: [], unknown: false },
              ai: { can: [], cannot: [] },
              actions: {
                  test_connection: { enabled: true },
                  sync_data: { enabled: true },
                  reconnect: { enabled: false },
                  settings: { enabled: false },
              },
          };

          test("renders the Meta account selection and reporting control inside IntegrationCardV2", () => {
              render(
                  <IntegrationCardV2
                      integration={{ ...base, provider: "meta_ads" }}
                      onTest={() => {}}
                      onSync={() => {}}
                      onSettings={() => {}}
                  />,
              );
              expect(screen.getByTestId("meta-reporting-control-host")).toBeInTheDocument();
              expect(screen.getByTestId("meta-reporting-control")).toBeInTheDocument();
          });

          test("does not render the Meta control for Snapchat", () => {
              render(
                  <IntegrationCardV2
                      integration={{ ...base, provider: "snapchat_ads" }}
                      snapchatScope={{ selection: { accounts: [] }, summary: null }}
                      onTest={() => {}}
                      onSync={() => {}}
                      onSettings={() => {}}
                  />,
              );
              expect(screen.queryByTestId("meta-reporting-control-host")).not.toBeInTheDocument();
          });
          ''', encoding="utf-8")

          Path(".github/workflows/apply-meta-card-v2-patch.yml").unlink()
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(meta): mount reporting controls inside IntegrationCardV2"
          git push origin HEAD:fix/meta-reporting-control-in-card-v2
