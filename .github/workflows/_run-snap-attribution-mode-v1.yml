name: Run Snapchat Attribution Mode V1

on:
  push:
    branches:
      - feat/prod-snap-attribution-mode-v1

permissions:
  contents: write

concurrency:
  group: run-snap-attribution-mode-v1
  cancel-in-progress: true

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prod-snap-attribution-mode-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply attribution mode patch
        run: python .github/scripts/apply_snap_attribution_mode_v1.py
      - name: Install backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor
          httpx pytest pytest-asyncio openpyxl cryptography reportlab
          python-multipart PyJWT bcrypt
      - name: Compile and test backend
        working-directory: backend
        run: |
          python -m py_compile \
            integrations_control_center/snapchat_freshness_impl_v6.py \
            integrations_control_center/snapchat_account_timezone_manager.py \
            integrations_control_center/snapchat_platform_source_integrity.py
          python -m pytest -q --tb=short \
            tests/test_snapchat_platform_source_integrity_v1.py \
            tests/test_snapchat_order_source_audit_v1.py \
            tests/test_ads_auto_sync_scheduler_v2.py
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive
      - name: Test frontend contracts
        working-directory: frontend
        env:
          CI: 'true'
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/pages/MarketingPlatformWorkspacePlatformSnapshot.test.js
          src/services/marketingPerformance.test.js
          src/components/marketing/CampaignManagerTable.test.jsx
          src/components/marketing/AdsPerformanceExplorer.test.jsx
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build
      - name: Verify core contracts
        run: |
          grep -q 'ADS_MANAGER_DEFAULT_ACTION_REPORT_TIME: Final\[str\] = "conversion"' backend/integrations_control_center/snapchat_freshness_impl_v6.py
          grep -q 'mezan_snapchat_performance_account_day_v3' backend/integrations_control_center/snapchat_account_timezone_manager.py
          grep -q 'mezan_snapchat_performance_account_total_v2' backend/integrations_control_center/snapchat_platform_source_integrity.py
          grep -q 'snapchat-action-report-time-control' frontend/src/pages/MarketingPlatformWorkspace.jsx
          grep -q 'action_report_time' frontend/src/services/marketingPerformance.js
      - name: Commit tested implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/integrations_control_center/snapchat_freshness_impl_v6.py \
            backend/integrations_control_center/snapchat_account_timezone_manager.py \
            backend/integrations_control_center/snapchat_platform_source_integrity.py \
            backend/tests/test_snapchat_platform_source_integrity_v1.py \
            frontend/src/services/marketingPerformance.js \
            frontend/src/pages/MarketingPlatformWorkspace.jsx \
            frontend/src/pages/MarketingPlatformWorkspacePlatformSnapshot.test.js \
            frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx
          git commit -m "feat(prod-snap): add conversion-time default with impression comparison"
          git push origin HEAD:feat/prod-snap-attribution-mode-v1
