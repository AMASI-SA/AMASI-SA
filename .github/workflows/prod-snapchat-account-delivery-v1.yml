name: Production Snapchat Account Delivery V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/__init__.py"
      - "backend/integrations_control_center/snapchat_account_delivery_refresh.py"
      - "backend/tests/test_snapchat_account_delivery_refresh_v1.py"
      - "frontend/src/marketingCampaignResultSource.js"
      - "frontend/src/marketingCampaignResultSource.test.js"
      - ".github/workflows/prod-snapchat-account-delivery-v1.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          bcrypt
          PyJWT
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Compile account delivery refresh
        run: >-
          python -m py_compile
          integrations_control_center/snapchat_account_delivery_refresh.py
          integrations_control_center/__init__.py
          tests/test_snapchat_account_delivery_refresh_v1.py
      - name: Run focused backend tests
        run: >-
          python -m pytest
          tests/test_snapchat_account_delivery_refresh_v1.py
          tests/test_snapchat_campaign_catalog_refresh_v1.py
          tests/test_snapchat_account_timezone_manager_v1.py
          tests/test_ads_auto_sync_scheduler_v2.py
          -q --tb=short
      - name: Enforce account-payment delivery contract
        working-directory: .
        run: |
          DELIVERY=backend/integrations_control_center/snapchat_account_delivery_refresh.py
          INIT=backend/integrations_control_center/__init__.py
          grep -q 'ACCOUNT_DELIVERY_SOURCE_MODE = "snapchat_ad_account_delivery_5m_v1"' "$DELIVERY"
          grep -q 'INVALID_REMAINING_AD_ACCOUNT_BUDGET' "$DELIVERY"
          grep -q 'ACCOUNT_PAYMENT_BLOCKED' "$DELIVERY"
          grep -q 'GET /adaccounts' "$DELIVERY" || grep -q 'SNAPCHAT_API_BASE}/adaccounts/{account_id}' "$DELIVERY"
          grep -q 'install_snapchat_account_delivery_refresh' "$INIT"
          grep -q 'install_snapchat_effective_delivery_report' "$INIT"
          ! grep -Eq 'client\.(post|put|patch|delete)\(' "$DELIVERY"
          ! grep -Eq 'provider_write_reached": True|campaign_write_reached": True|qoyod_write_reached": True' "$DELIVERY"

  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test effective campaign delivery
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/marketingCampaignResultSource.test.js
          src/components/marketing/CampaignManagerTable.test.jsx
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce payment-block UI contract
        working-directory: .
        run: |
          TRANSPORT=frontend/src/marketingCampaignResultSource.js
          grep -q 'applyEffectiveCampaignDelivery' "$TRANSPORT"
          grep -q 'effective_status.startsWith' "$TRANSPORT" || grep -q 'effective.startsWith("ACCOUNT_")' "$TRANSPORT"
          grep -q 'campaign.status = "PAUSED"' "$TRANSPORT"
          grep -q 'effective_delivery_label' "$TRANSPORT"
          ! grep -Eq '(api|axios)\.(post|put|patch|delete)\(' "$TRANSPORT"
