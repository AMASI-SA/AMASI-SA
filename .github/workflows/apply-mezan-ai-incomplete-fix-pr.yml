name: Apply Mezan AI incomplete-response fix on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-mezan-ai-incomplete-fix.yml"
      - ".github/workflows/apply-mezan-ai-incomplete-fix-pr.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/mezan-ai-incomplete-response'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mezan-ai-incomplete-response
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute the reviewed patch payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          payload_path = Path(
              ".github/workflows/apply-mezan-ai-incomplete-fix.yml"
          )
          payload = payload_path.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          python -m py_compile"
          if start_marker not in payload or end_marker not in payload:
              raise SystemExit("Patch payload markers were not found")
          script = payload.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), str(payload_path), "exec"))

          Path(
              ".github/workflows/apply-mezan-ai-incomplete-fix-pr.yml"
          ).unlink(missing_ok=True)
          PY

          python -m py_compile \
            backend/ai_analysis_routes.py \
            backend/tests/test_ai_analysis_routes.py
          git diff --check
      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): handle incomplete OpenAI responses safely"
          git push origin HEAD:fix/mezan-ai-incomplete-response
