name: Apply Mezan AI incomplete-response fix on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-mezan-ai-incomplete-fix.yml"
      - ".github/workflows/apply-mezan-ai-incomplete-fix-pr.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/mezan-ai-incomplete-response'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mezan-ai-incomplete-response
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute the reviewed patch payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          payload_path = Path(
              ".github/workflows/apply-mezan-ai-incomplete-fix.yml"
          )
          lines = payload_path.read_text(encoding="utf-8").splitlines()

          start = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == "python - <<'PY'"
          ) + 1
          end = next(
              index
              for index in range(start, len(lines))
              if lines[index].strip() == "PY"
          )

          yaml_indent = " " * 10
          extracted = []
          for line in lines[start:end]:
              if not line:
                  extracted.append("")
                  continue
              if not line.startswith(yaml_indent):
                  raise SystemExit(
                      f"Unexpected payload indentation: {line[:40]!r}"
                  )
              extracted.append(line[len(yaml_indent):])

          script = "\n".join(extracted)
          if not script.startswith("from pathlib import Path"):
              raise SystemExit("Unexpected patch payload start")
          exec(compile(script, "ai_incomplete_patch.py", "exec"))

          Path(
              ".github/workflows/apply-mezan-ai-incomplete-fix-pr.yml"
          ).unlink(missing_ok=True)
          PY

          python -m py_compile \
            backend/ai_analysis_routes.py \
            backend/tests/test_ai_analysis_routes.py
          git diff --check
      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): handle incomplete OpenAI responses safely"
          git push origin HEAD:fix/mezan-ai-incomplete-response
