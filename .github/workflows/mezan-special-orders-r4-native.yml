name: Mezan Special Orders R4 Native Acceptance
on:
  push:
    branches: ['feature/mezan-special-orders-core-20260927']
    paths: ['docs/operations/MZ2-SPECIAL-ORDERS-001/R4_NATIVE_TRANSFER/**', '.github/workflows/mezan-special-orders-r4-native.yml']
permissions:
  contents: write
jobs:
  native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1cbeccd84d58fb3397dcd42822d5feb92de06275
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and materialize exact native source checkpoint
        run: python docs/operations/MZ2-SPECIAL-ORDERS-001/R4_NATIVE_TRANSFER/materialize.py apply
      - name: Install pinned native integration prerequisites
        run: |
          python - <<'PY'
          from pathlib import Path
          names={'pydantic','fastapi','httpx','pytest','motor','pymongo','cryptography','requests','reportlab','pillow','python-multipart','python-dotenv','openpyxl','python-dateutil','pyjwt','pandas','pypdf','arabic-reshaper','python-bidi','bcrypt','email-validator','passlib'}
          rows=[r for r in Path('backend/requirements.txt').read_text().splitlines() if r.split('==')[0].casefold() in names]
          assert len(rows)==len(names)
          Path('/tmp/native-tests.txt').write_text('\n'.join(rows+['pytest-asyncio==1.3.0','PyMuPDF==1.28.2','qrcode==8.2'])+'\n')
          PY
          python -m pip install -r /tmp/native-tests.txt
      - name: Start dedicated loopback replica set
        run: |
          docker run -d --rm --name special-test-mongo -p 127.0.0.1:27017:27017 mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca mongod --replSet specialTestRs --bind_ip_all
          python - <<'PY'
          import time
          from pymongo import MongoClient
          c=MongoClient('mongodb://127.0.0.1:27017/?directConnection=true',serverSelectionTimeoutMS=1000)
          for attempt in range(30):
              try: c.admin.command('ping'); break
              except Exception: time.sleep(1)
          else: raise SystemExit('Dedicated Mongo unavailable')
          c.admin.command('replSetInitiate',{'_id':'specialTestRs','members':[{'_id':0,'host':'127.0.0.1:27017'}]})
          for attempt in range(30):
              if c.admin.command('hello').get('isWritablePrimary'): break
              time.sleep(1)
          else: raise SystemExit('Dedicated replica set unavailable')
          c.close()
          PY
      - name: Frozen ordinary-order and native delivery baseline
        working-directory: baseline/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_order_engine_models.py tests/test_order_engine_mapper.py tests/test_order_engine_repository.py tests/test_order_engine_service.py tests/test_order_item_engine_models.py tests/test_order_item_engine_mapper.py tests/test_order_option_cost_snapshots.py tests/test_product_option_shared_cost_engine.py tests/test_store_delivery_accounting.py tests/test_store_delivery_domain.py tests/test_store_delivery_handover_routes.py tests/test_store_delivery_driver_security.py tests/test_store_delivery_payment_evidence.py --junitxml=../../r4-native-baseline.xml
      - name: Native candidate and dedicated real replica-set tests
        working-directory: backend
        env:
          PYTHONPATH: .
          MEZAN_SPECIAL_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=specialTestRs
          MEZAN_SPECIAL_TEST_REPLICA_URI: mongodb://127.0.0.1:27017/?replicaSet=specialTestRs
        run: |
          python -m compileall -q mezan_special_orders order_engine order_item_engine
          python -m pytest -q mezan_special_orders/tests tests/test_order_engine_models.py tests/test_order_engine_mapper.py tests/test_order_engine_repository.py tests/test_order_engine_service.py tests/test_order_item_engine_models.py tests/test_order_item_engine_mapper.py tests/test_order_option_cost_snapshots.py tests/test_product_option_shared_cost_engine.py tests/test_store_delivery_accounting.py tests/test_store_delivery_domain.py tests/test_store_delivery_handover_routes.py tests/test_store_delivery_driver_security.py tests/test_store_delivery_payment_evidence.py --junitxml=../r4-native-candidate.xml
      - name: Export tested source blob identities only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python docs/operations/MZ2-SPECIAL-ORDERS-001/R4_NATIVE_TRANSFER/materialize.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mezan-special-r4-native-results
          path: |
            r4-native-baseline.xml
            r4-native-candidate.xml
            r4-native-blobs.json
      - name: Stop dedicated test database
        if: always()
        run: docker rm -f special-test-mongo >/dev/null 2>&1 || true
