name: Auth Email OTP Security

on:
  pull_request:
    paths:
      - "backend/auth.py"
      - "backend/auth_preview_policy.py"
      - "backend/email_otp_policy.py"
      - "backend/email_otp_security.py"
      - "backend/mfa_security.py"
      - "backend/tests/test_auth_preview_policy.py"
      - "backend/tests/test_email_otp_security_v1.py"
      - "frontend/src/pages/Login.jsx"
      - ".github/workflows/auth-email-otp-security.yml"

permissions:
  contents: read

jobs:
  email-otp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install focused auth dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest==9.0.3" \
            "bcrypt==4.1.3" \
            "cryptography==48.0.0" \
            "fastapi==0.110.1" \
            "openpyxl==3.1.5" \
            "pymongo==4.5.0" \
            "starlette==0.37.2" \
            "PyJWT==2.13.0"
      - name: Compile email OTP modules
        env:
          JWT_SECRET: ci-only-email-otp-secret
          EMAIL_OTP_ENABLED: "0"
        run: |
          PYTHONPATH=backend python -m py_compile \
            backend/auth_preview_policy.py \
            backend/email_otp_policy.py \
            backend/email_otp_security.py \
            backend/mfa_security.py \
            backend/auth.py
      - name: Run email OTP security contracts
        env:
          JWT_SECRET: ci-only-email-otp-secret
          EMAIL_OTP_ENABLED: "0"
        run: |
          PYTHONPATH=backend python -m pytest -q \
            backend/tests/test_auth_preview_policy.py \
            backend/tests/test_email_otp_security_v1.py
