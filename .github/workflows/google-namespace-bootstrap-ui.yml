name: Google namespace bootstrap UI integration
on:
  push:
    branches: [codex/google-namespace-bootstrap-ui-wip-20261030]
    paths:
      - backend/integrations_control_center/google_namespace_bootstrap*.py
      - backend/tests/test_google_namespace_bootstrap*.py
      - .github/workflows/google-namespace-bootstrap-ui.yml
      - backend/integrations_control_center/google_ads_routes.py
      - backend/tests/google_namespace_bootstrap_ui_fixtures.py
      - frontend/src/components/marketing/GoogleNamespaceBootstrap*
      - frontend/src/components/marketing/GoogleAdsWorkspace.jsx
      - frontend/src/services/googleNamespaceBootstrap*
      - frontend/src/services/__fixtures__/googleNamespaceBootstrap.json
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_namespace_bootstrap*.py
      - backend/tests/test_google_namespace_bootstrap*.py
      - .github/workflows/google-namespace-bootstrap-ui.yml
      - backend/integrations_control_center/google_ads_routes.py
      - backend/tests/google_namespace_bootstrap_ui_fixtures.py
      - frontend/src/components/marketing/GoogleNamespaceBootstrap*
      - frontend/src/components/marketing/GoogleAdsWorkspace.jsx
      - frontend/src/services/googleNamespaceBootstrap*
      - frontend/src/services/__fixtures__/googleNamespaceBootstrap.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-replica-capabilities:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      GOOGLE_NAMESPACE_BOOTSTRAP_TEST_ADMIN_URI: mongodb://namespace_admin:ephemeral_fixture_only@127.0.0.1:27483/?authSource=admin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused owner and Mongo dependencies
        run: >-
          python -m pip install motor==3.7.1 pymongo==4.18.3 dnspython==2.9.0
          fastapi==0.140.0 starlette==1.3.1 pydantic==2.13.4 httpx==0.28.1
          PyJWT==2.15.0 bcrypt==4.1.3 python-dotenv==1.2.2
          cryptography==50.0.0 pillow==13.0.0 python-multipart==0.0.31
          openai==1.99.9 google-ads==33.0.0
          pytest==9.0.3 pytest-asyncio==1.4.0
      - name: Start disposable authenticated loopback replica
        shell: bash
        run: |
          set -euo pipefail
          NS_BOOTSTRAP_KEY_DIR="$RUNNER_TEMP/namespace-bootstrap-key"
          mkdir -p "$NS_BOOTSTRAP_KEY_DIR"
          python - "$NS_BOOTSTRAP_KEY_DIR/key" <<'PYCODE'
          import base64,pathlib,secrets,sys
          path=pathlib.Path(sys.argv[1])
          path.write_text(base64.b64encode(secrets.token_bytes(512)).decode())
          path.chmod(0o400)
          PYCODE
          sudo chown 999:999 "$NS_BOOTSTRAP_KEY_DIR/key"
          docker run -d --name namespace-bootstrap-rs -p 127.0.0.1:27483:27483 \
            -e MONGO_INITDB_ROOT_USERNAME=namespace_admin -e MONGO_INITDB_ROOT_PASSWORD=ephemeral_fixture_only \
            -v "$NS_BOOTSTRAP_KEY_DIR/key:/run/namespace-key:ro" mongo:8.0.26 \
            --port 27483 --replSet namespaceBootstrap --keyFile /run/namespace-key --bind_ip_all
          python - <<'PYCODE'
          import os,time
          from pymongo import MongoClient
          client=MongoClient(os.environ['GOOGLE_NAMESPACE_BOOTSTRAP_TEST_ADMIN_URI'],directConnection=True,serverSelectionTimeoutMS=1000)
          for attempt in range(60):
              try:
                  client.admin.command('ping')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('disposable_authenticated_bootstrap_failed')
          try:
              client.admin.command({'replSetInitiate':{'_id':'namespaceBootstrap','members':[{'_id':0,'host':'127.0.0.1:27483'}]}})
              for attempt in range(60):
                  try:
                      if client.admin.command('hello').get('isWritablePrimary') is True:break
                  except Exception:pass
                  time.sleep(1)
              else:raise SystemExit('disposable_primary_unproved')
          except Exception:
              raise SystemExit('disposable_replica_initialization_failed') from None
          finally:client.close()
          PYCODE
      - name: Verify frozen engine and actual full management integration
        run: |
          python -m pytest --noconftest -q -W error --tb=short --junitxml=namespace-bootstrap-integration.xml \
            backend/tests/test_google_namespace_bootstrap.py \
            backend/tests/test_google_namespace_bootstrap_capabilities_mongo.py \
            backend/tests/test_google_namespace_bootstrap_mongo.py \
            backend/tests/test_google_namespace_bootstrap_integration.py \
            backend/tests/test_google_namespace_bootstrap_integration_mongo.py
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root=ET.parse('namespace-bootstrap-integration.xml').getroot();cases=root.findall('.//testcase')
          assert len(cases)==130, len(cases)
          for suffix,count in [('test_google_namespace_bootstrap',47),('test_google_namespace_bootstrap_capabilities_mongo',20),('test_google_namespace_bootstrap_mongo',44),('test_google_namespace_bootstrap_integration',9),('test_google_namespace_bootstrap_integration_mongo',10)]:
              selected=[c for c in cases if c.get('classname','').endswith('.'+suffix)]
              assert len(selected)==count,(suffix,len(selected))
          assert not root.findall('.//failure') and not root.findall('.//error') and not root.findall('.//skipped')
          print('Verified 130 tests, original 111 retained, 74 actual Mongo including 10 actual management-router cases; zero skips')
          PYCODE
      - name: Remove disposable replica
        if: always()
        run: docker rm -f namespace-bootstrap-rs || true
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare governed frontend toolchain
        run: python scripts/frontend_release_toolchain.py ensure
      - name: Install frozen frontend dependencies
        run: python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend install --frozen-lockfile --non-interactive
      - name: Test actual AuthProvider and real API interceptor
        env:
          CI: "true"
        run: |
          python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend test --watchAll=false --runInBand --runTestsByPath src/components/marketing/GoogleNamespaceBootstrap.test.jsx src/components/marketing/GoogleNamespaceBootstrapIntegration.test.jsx src/services/googleNamespaceBootstrap.test.js src/services/googleNamespaceBootstrap.authInterceptor.test.js --json --outputFile=bootstrap-ui-results.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          report=json.loads(Path('frontend/bootstrap-ui-results.json').read_text())
          assert report['success'] is True and report['numTotalTestSuites']==4 and report['numPassedTestSuites']==4
          assert report['numTotalTests']==66 and report['numPassedTests']==66, (report['numTotalTests'],report['numPassedTests'])
          assert report['numPendingTests']==0 and report['numTodoTests']==0
          print('Verified 66 storage-only UI/service/AuthProvider/interceptor tests; zero skips')
          PYCODE
      - name: Build current source in CI
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: https://mezansalla.com
        run: python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend build
      - name: Check source whitespace
        run: git diff --check
