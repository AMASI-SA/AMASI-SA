name: Run Snapchat Direct Account Total V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact All Ads account-total patch
        run: python .github/scripts/patch_snap_direct_account_total.py
      - name: Install focused backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0
          httpx pytest pytest-asyncio openpyxl cryptography reportlab
          python-multipart bcrypt PyJWT
      - name: Compile and test backend
        working-directory: backend
        run: |
          python -m py_compile integrations_control_center/snapchat_platform_source_integrity.py
          python -m pytest -q --tb=short \
            tests/test_snapchat_platform_source_integrity_v1.py \
            tests/test_snapchat_order_source_audit_v1.py
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive
      - name: Test frontend and build
        working-directory: frontend
        env:
          CI: 'false'
        run: |
          CI=true yarn test --watchAll=false --runInBand --runTestsByPath \
            src/marketingCampaignProfitabilityHydration.test.js \
            src/components/marketing/CampaignManagerTable.test.jsx \
            src/components/marketing/SnapchatOrderSourceAudit.test.jsx
          yarn build
      - name: Enforce direct account and campaign separation
        run: |
          grep -q 'fetch_account_total_direct_metrics' backend/integrations_control_center/snapchat_platform_source_integrity.py
          grep -q 'platform_direct_account_total_ready' backend/integrations_control_center/snapchat_platform_source_integrity.py
          grep -q 'account_metrics_available' backend/integrations_control_center/snapchat_platform_source_integrity.py
      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/integrations_control_center/snapchat_platform_source_integrity.py \
            backend/tests/test_snapchat_platform_source_integrity_v1.py
          if git diff --cached --quiet; then
            echo "DIRECT_ACCOUNT_TOTAL_ALREADY_APPLIED"
            exit 0
          fi
          git commit -m "fix(prod-snap): separate All Ads account total from campaign breakdown"
          git push origin HEAD:${{ github.head_ref }}
