name: Apply Partial Receipt Fix

on:
  push:
    branches:
      - fix/partial-receipt-direct-supplier-assignment
    paths:
      - ".github/workflows/export-partial-receipt-source.yml"
      - ".github/patches/partial-receipt-direct-assignment.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate direct receiving assignment
        run: |
          set -euo pipefail
          git apply --check .github/patches/partial-receipt-direct-assignment.patch
          git apply .github/patches/partial-receipt-direct-assignment.patch
          python -m py_compile \
            backend/preparation_supplier_dispatch.py \
            backend/supplier_receiving_routes.py \
            backend/tests/test_preparation_supplier_dispatch.py \
            backend/tests/test_supplier_receiving.py
      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "mezan"
          git config user.email "amasi.jewelery@gmail.com"
          git add \
            backend/preparation_supplier_dispatch.py \
            backend/supplier_receiving_routes.py \
            backend/tests/test_preparation_supplier_dispatch.py \
            backend/tests/test_supplier_receiving.py \
            .github/workflows/supplier-invoice-service-policy.yml
          git commit -m "fix(receiving): assign partial pieces at supplier receipt"
          git push origin HEAD:fix/partial-receipt-direct-supplier-assignment
