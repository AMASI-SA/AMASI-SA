name: Apply Snapchat CAPI Cancellation Safety

on:
  push:
    branches:
      - feat/snapchat-capi-purchase-attribution
    paths:
      - ".github/workflows/_apply-snapchat-capi-cancellation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snapchat-capi-purchase-attribution
          fetch-depth: 0

      - name: Add cancellation and strict provider acknowledgement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/integrations_control_center/snapchat_capi_purchases.py")
          text = path.read_text(encoding="utf-8")

          marker = '''async def _resolve_salla_user_id(db: Any, merchant_id: Any) -> str | None:\n'''
          helper = '''async def cancel_pending_snapchat_purchase_event(\n    db: Any,\n    *,\n    user_id: str,\n    event_id: str,\n    now: datetime | None = None,\n) -> dict[str, Any]:\n    current = (now or _utcnow()).astimezone(timezone.utc)\n    result = await _collection(db, OUTBOX_COLLECTION).update_many(\n        {\n            "user_id": str(user_id),\n            "event_id": str(event_id),\n            "status": {"$in": ["pending", "retry"]},\n        },\n        {"$set": {\n            "status": "cancelled",\n            "payload": None,\n            "payload_redacted_after_cancel": True,\n            "lock_owner": None,\n            "lock_expires_at": None,\n            "last_error": {\n                "code": "source_order_cancelled_before_delivery",\n                "retryable": False,\n            },\n            "purge_at": current + FAILED_RETENTION,\n            "updated_at": current,\n        }},\n    )\n    return {\n        "queued": False,\n        "cancelled_pending": int(getattr(result, "modified_count", 0)),\n        "event_id": str(event_id),\n        "reason": "order_ineligible",\n    }\n\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit("owner marker missing")
              text = text.replace(marker, helper + marker, 1)

          old_webhook = '''    order = {\n        "order_number": raw.get("reference_id") or raw.get("order_number") or raw.get("id"),\n        "order_date_raw": raw.get("created_at") or raw.get("date"),\n        "order_status": status_obj.get("name") or status_obj.get("customized") or status,\n        "order_status_slug": status_obj.get("slug"),\n        "total_amount": _money(total),\n        "currency": _dict(total).get("currency") if isinstance(total, dict) else "SAR",\n        "customer_mobile": customer.get("mobile") or customer.get("phone"),\n        "products": raw.get("items") if isinstance(raw.get("items"), list) else [],\n    }\n    return await enqueue_snapchat_purchase_event(\n'''
          new_webhook = '''    order = {\n        "order_number": raw.get("reference_id") or raw.get("order_number") or raw.get("id"),\n        "order_date_raw": raw.get("created_at") or raw.get("date"),\n        "order_status": status_obj.get("name") or status_obj.get("customized") or status,\n        "order_status_slug": status_obj.get("slug"),\n        "total_amount": _money(total),\n        "currency": _dict(total).get("currency") if isinstance(total, dict) else "SAR",\n        "customer_mobile": customer.get("mobile") or customer.get("phone"),\n        "products": raw.get("items") if isinstance(raw.get("items"), list) else [],\n    }\n    if not _status_eligible(order):\n        event_id = _text(order.get("order_number"))\n        if not event_id:\n            return {"queued": False, "reason": "cancelled_order_id_missing"}\n        return await cancel_pending_snapchat_purchase_event(\n            db,\n            user_id=user_id,\n            event_id=event_id,\n        )\n    return await enqueue_snapchat_purchase_event(\n'''
          if old_webhook in text:
              text = text.replace(old_webhook, new_webhook, 1)
          elif new_webhook not in text:
              raise SystemExit("webhook order block missing")

          old_provider = '''                provider_failed = any(\n                    token in provider_status\n                    for token in ("FAIL", "ERROR", "INVALID", "REJECT")\n                )\n                if 200 <= response.status_code < 300 and not provider_failed:\n'''
          new_provider = '''                provider_failed = any(\n                    token in provider_status\n                    for token in ("FAIL", "ERROR", "INVALID", "REJECT")\n                )\n                provider_accepted = (\n                    provider_status in {"VALID", "SUCCESS", "OK"}\n                    or summary.get("events_received") is not None\n                    or summary.get("events_processed") is not None\n                )\n                if (\n                    200 <= response.status_code < 300\n                    and provider_accepted\n                    and not provider_failed\n                ):\n'''
          if old_provider in text:
              text = text.replace(old_provider, new_provider, 1)
          elif new_provider not in text:
              raise SystemExit("provider acknowledgement block missing")

          old_retry = '''                    retryable = response.status_code == 429 or response.status_code >= 500\n                    await _complete_event(\n'''
          new_retry = '''                    retryable = (\n                        response.status_code == 429\n                        or response.status_code >= 500\n                        or (200 <= response.status_code < 300 and not provider_failed)\n                    )\n                    await _complete_event(\n'''
          if old_retry in text:
              text = text.replace(old_retry, new_retry, 1)
          elif new_retry not in text:
              raise SystemExit("provider retry block missing")

          text = text.replace(
              '''        for status in ("pending", "sending", "retry", "sent", "failed")\n''',
              '''        for status in ("pending", "sending", "retry", "sent", "failed", "cancelled")\n''',
              1,
          )

          export_marker = '''    "build_snapchat_purchase_event",\n'''
          export_line = '''    "cancel_pending_snapchat_purchase_event",\n'''
          if export_line not in text:
              text = text.replace(export_marker, export_marker + export_line, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify cancellation safety
        run: |
          python -m py_compile backend/integrations_control_center/snapchat_capi_purchases.py
          grep -q 'source_order_cancelled_before_delivery' backend/integrations_control_center/snapchat_capi_purchases.py
          grep -q 'provider_status in {"VALID", "SUCCESS", "OK"}' backend/integrations_control_center/snapchat_capi_purchases.py

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-snapchat-capi-cancellation.yml
          git add backend/integrations_control_center/snapchat_capi_purchases.py
          git commit -m "fix(snapchat): cancel pending purchases and require provider acknowledgement"
          git push origin HEAD:feat/snapchat-capi-purchase-attribution
