name: MZ2 Supplier Native Invoice V2
on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/supplier_native_invoice_v2.py
      - backend/supplier_debit_identity_v2.py
      - backend/supplier_debit_setup_atomic.py
      - backend/supplier_receiving_routes.py
      - backend/product_field_cost_support.py
      - backend/supplier_receiving_read_scope.py
      - backend/tests/test_supplier_receiving_read_scope.py
      - backend/tests/test_supplier_native_close_profile.py
      - backend/tests/test_supplier_refresh_wrapper.py
      - backend/supplier_invoice_integrity.py
      - backend/supplier_invoice_images.py
      - backend/supplier_invoice_pdf.py
      - backend/tests/test_supplier_invoice_images.py
      - backend/tests/test_supplier_invoice_save_profile.py
      - backend/order_engine/__init__.py
      - backend/tests/test_supplier_native_invoice_v2.py
      - backend/tests/test_supplier_refresh_safety.py
      - backend/tests/test_supplier_refresh_real_mongo.py
      - backend/acceptance_tests/test_supplier_product_selection.py
      - backend/tests/test_supplier_debit_identity_v2.py
      - backend/tests/test_supplier_debit_setup_atomic.py
      - .github/workflows/mz2-supplier-native-invoice-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:backend/tests
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=mz2test
      BUILD20_INVOICE_TEST_MONGO_URL: mongodb://127.0.0.1:27018/?replicaSet=mz2test
      BUILD37_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=mz2test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native receiving contract dependencies
        run: >-
          python -m pip install fastapi==0.141.1 pydantic==2.13.5
          pymongo==4.18.1 motor==3.7.1 pytest==9.0.3 pytest-asyncio==1.3.0
          httpx==0.28.1 openpyxl==3.1.5 bcrypt==4.1.3 PyJWT==2.15.0
          python-multipart==0.0.20 python-dotenv==1.2.3 cryptography==50.0.0
          reportlab==4.5.1 pillow==12.3.0 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 qrcode==8.2 mongomock-motor==0.0.36
      - name: Start disposable replica set
        run: |
          docker run -d --name c2-mongo -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet mz2test --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec c2-mongo mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec c2-mongo mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"mz2test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if docker exec c2-mongo mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
      - name: Verify mappings, native posting and receiving integrity
        run: >-
          python -m pytest -q backend/tests/test_supplier_debit_identity_v2.py
          backend/tests/test_supplier_debit_setup_atomic.py
          backend/tests/test_supplier_native_invoice_v2.py
          backend/tests/test_supplier_receiving.py
          backend/tests/test_supplier_refresh_safety.py
          backend/tests/test_supplier_refresh_wrapper.py
          backend/tests/test_supplier_receiving_read_scope.py
          backend/tests/test_product_field_cost_support.py
          backend/tests/test_product_v2_routes.py
          backend/tests/test_supplier_invoice_live_cost_session.py
          backend/tests/test_supplier_refresh_real_mongo.py
          backend/acceptance_tests/test_supplier_product_selection.py
          backend/tests/test_supplier_invoice_private_history.py
          backend/tests/test_supplier_invoice_financial_integrity.py
          backend/tests/test_supplier_invoice_images.py
          backend/tests/test_supplier_invoice_save_profile.py
          backend/tests/test_accounting_ledger_v2.py
          backend/tests/test_mz2_write_control.py backend/tests/test_mz2_closed_periods.py
      - name: Verify diverse large invoices and bounded database operations
        env:
          ISOLATED_DIVERSE_PRODUCTS: '1'
          ISOLATED_EXPECT_BOUNDED: '1'
        run: >-
          python -m pytest -q -s
          'backend/tests/test_supplier_native_close_profile.py::test_native_close_profile[17-False]'
          'backend/tests/test_supplier_native_close_profile.py::test_native_close_profile[50-False]'
          'backend/tests/test_supplier_native_close_profile.py::test_native_close_profile[100-False]'
          'backend/tests/test_supplier_native_close_profile.py::test_native_close_profile[150-False]'
          'backend/tests/test_supplier_native_close_profile.py::test_native_close_profile[200-False]'
          'backend/tests/test_supplier_native_close_profile.py::test_native_close_profile[200-True]'
      - name: Verify concurrent 200-piece closes without duplicate invoices
        env:
          ISOLATED_DIVERSE_PRODUCTS: '1'
          ISOLATED_CONCURRENT_CLOSE: '1'
        run: python -m pytest -q 'backend/tests/test_supplier_native_close_profile.py::test_native_close_profile[200-False]'
      - name: Verify two employees closing independent 200-piece sessions
        env:
          ISOLATED_DIVERSE_PRODUCTS: '1'
          ISOLATED_CONCURRENT_CLOSE: two_sessions
        run: python -m pytest -q 'backend/tests/test_supplier_native_close_profile.py::test_native_close_profile[200-False]'
      - name: Verify complete rollback after first 100-piece batch
        env:
          ISOLATED_DIVERSE_PRODUCTS: '1'
          ISOLATED_FAIL_AFTER_BULK: '1'
        run: python -m pytest -q 'backend/tests/test_supplier_native_close_profile.py::test_native_close_profile[200-True]'
