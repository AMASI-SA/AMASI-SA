name: Apply mobile session refresh patch

on:
  push:
    branches:
      - fix/mobile-refresh-session-30d
    paths:
      - .github/workflows/apply-mobile-session-refresh-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-refresh-session-30d
          fetch-depth: 0
      - name: Install native session middleware before auth challenge layers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/auth.py")
          text = path.read_text()

          import_anchor = "    from meta_reviewer_bootstrap import install_meta_reviewer_bootstrap\n"
          import_replacement = (
              import_anchor
              + "    from mobile_session_security import install_mobile_session_security\n"
          )
          if "from mobile_session_security import install_mobile_session_security" not in text:
              if import_anchor not in text:
                  raise SystemExit("mobile session import anchor not found")
              text = text.replace(import_anchor, import_replacement, 1)

          install_anchor = "    install_meta_reviewer_bootstrap(app, db)\n\n    # Order matters."
          install_replacement = (
              "    install_meta_reviewer_bootstrap(app, db)\n"
              "    await install_mobile_session_security(app, db)\n\n"
              "    # Order matters."
          )
          if "await install_mobile_session_security(app, db)" not in text:
              if install_anchor not in text:
                  raise SystemExit("mobile session install anchor not found")
              text = text.replace(install_anchor, install_replacement, 1)

          path.write_text(text)
          Path(".github/workflows/apply-mobile-session-refresh-patch.yml").unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "mezan"
          git config user.email "amasi.jewelery@gmail.com"
          git add backend/auth.py .github/workflows/apply-mobile-session-refresh-patch.yml
          git commit -m "feat(auth): install native 30-day session boundary"
          git push origin HEAD:fix/mobile-refresh-session-30d
