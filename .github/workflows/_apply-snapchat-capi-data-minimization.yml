name: Apply Snapchat CAPI Data Minimization

on:
  push:
    branches:
      - feat/snapchat-capi-purchase-attribution
    paths:
      - ".github/workflows/_apply-snapchat-capi-data-minimization.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snapchat-capi-purchase-attribution
          fetch-depth: 0

      - name: Apply privacy and provider-response fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/integrations_control_center/snapchat_capi_purchases.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              '''Plaintext customer identifiers are never stored in the CAPI\noutbox: email, phone, city, country and external identifiers are normalised and\nSHA-256 hashed before persistence.\n''',
              '''Plaintext customer contact data is never stored in the CAPI outbox:\nemail, phone, city, country, postal code and external identifiers are normalised\nand SHA-256 hashed before persistence.  IP address and User-Agent are deliberately\nexcluded.  Snap click/cookie attribution IDs are sent only when already present.\n''',
          )

          old_ip = '''    client_ip = _text(\n        _walk_key(raw_order, {"client_ip_address", "client_ip", "ip_address", "ip"})\n    )\n    user_agent = _text(\n        _walk_key(raw_order, {"client_user_agent", "user_agent", "useragent"})\n    )\n\n    user_data: dict[str, Any] = {}\n    if email:\n        user_data["em"] = _sha256(email)\n    if phone:\n        user_data["ph"] = _sha256(phone)\n    if client_ip and user_agent:\n        user_data["client_ip_address"] = client_ip[:64]\n        user_data["client_user_agent"] = user_agent[:1000]\n\n    # Snap requires at least one primary match signal.  external_id alone is\n    # supplemental, so fail closed rather than sending an unmatchable event.\n    if not any(key in user_data for key in ("em", "ph", "client_ip_address")):\n        return None\n'''
          new_ip = '''    user_data: dict[str, Any] = {}\n    if email:\n        user_data["em"] = _sha256(email)\n    if phone:\n        user_data["ph"] = _sha256(phone)\n\n    # Data-minimised consent: require a hashed contact signal and deliberately\n    # avoid storing or sending IP address and User-Agent.\n    if not any(key in user_data for key in ("em", "ph")):\n        return None\n'''
          if old_ip in text:
              text = text.replace(old_ip, new_ip, 1)
          elif new_ip not in text:
              raise SystemExit("IP minimization block missing")

          text = text.replace('''        "integration": "mezan_os",\n''', "", 1)

          old_insert = '''    try:\n        result = await _collection(db, OUTBOX_COLLECTION).update_one(\n            {"user_id": str(user_id), "event_id": event_id},\n            {"$setOnInsert": document},\n            upsert=True,\n        )\n    except DuplicateKeyError:\n        result = None\n    return {\n        "queued": bool(result and result.upserted_id is not None),\n        "duplicate": not bool(result and result.upserted_id is not None),\n        "event_id": event_id,\n        "contains_plaintext_pii": False,\n    }\n'''
          new_insert = '''    inserted = False\n    try:\n        result = await _collection(db, OUTBOX_COLLECTION).update_one(\n            {"user_id": str(user_id), "event_id": event_id},\n            {"$setOnInsert": document},\n            upsert=True,\n        )\n        inserted = bool(result and result.upserted_id is not None)\n    except DuplicateKeyError:\n        inserted = False\n\n    enriched = False\n    if not inserted:\n        # Repeated Salla order updates may contain a richer phone, email or\n        # ScCid.  Improve only an unsent event; never reopen a sent purchase.\n        update = await _collection(db, OUTBOX_COLLECTION).update_one(\n            {\n                "user_id": str(user_id),\n                "event_id": event_id,\n                "status": {"$in": ["pending", "retry"]},\n            },\n            {"$set": {\n                "payload": event,\n                "payload_fingerprint": _payload_fingerprint(event),\n                "updated_at": current,\n            }},\n        )\n        enriched = bool(getattr(update, "matched_count", 0))\n    return {\n        "queued": inserted,\n        "duplicate": not inserted,\n        "enriched_pending_event": enriched,\n        "event_id": event_id,\n        "plaintext_customer_contact_stored": False,\n    }\n'''
          if old_insert in text:
              text = text.replace(old_insert, new_insert, 1)
          elif new_insert not in text:
              raise SystemExit("outbox insert block missing")

          old_owner = '''    query = {"store_id": {"$in": values}} if values else {}\n    row = await _collection(db, "salla_integrations").find_one(\n'''
          new_owner = '''    if not values:\n        return None\n    query = {"store_id": {"$in": values}}\n    row = await _collection(db, "salla_integrations").find_one(\n'''
          if old_owner in text:
              text = text.replace(old_owner, new_owner, 1)
          elif new_owner not in text:
              raise SystemExit("owner resolution block missing")

          old_keys = '''        "request_status", "events_received", "events_processed", "event_id",\n        "message", "error", "errors",\n'''
          new_keys = '''        "status", "reason", "request_status", "events_received",\n        "events_processed", "event_id", "message", "error", "errors",\n'''
          if old_keys in text:
              text = text.replace(old_keys, new_keys, 1)
          elif new_keys not in text:
              raise SystemExit("provider summary keys missing")

          old_provider = '''                request_status = str(summary.get("request_status") or "").upper()\n                provider_failed = "FAIL" in request_status or "ERROR" in request_status\n'''
          new_provider = '''                provider_status = str(\n                    summary.get("status") or summary.get("request_status") or ""\n                ).upper()\n                provider_failed = any(\n                    token in provider_status\n                    for token in ("FAIL", "ERROR", "INVALID", "REJECT")\n                )\n'''
          if old_provider in text:
              text = text.replace(old_provider, new_provider, 1)
          elif new_provider not in text:
              raise SystemExit("provider status block missing")

          old_cycle = '''        "contains_plaintext_pii": False,\n        "provider_write_authorized": True,\n'''
          new_cycle = '''        "plaintext_customer_contact_stored": False,\n        "provider_write_authorized": True,\n'''
          if old_cycle in text:
              text = text.replace(old_cycle, new_cycle, 1)

          old_shared = '''            "plain_when_available": ["sc_click_id", "sc_cookie1", "client_ip_address", "client_user_agent"],\n            "plaintext_customer_contact_stored_in_outbox": False,\n'''
          new_shared = '''            "unhashed_attribution_signals_when_available": ["sc_click_id", "sc_cookie1"],\n            "excluded": ["client_ip_address", "client_user_agent"],\n            "plaintext_customer_contact_stored_in_outbox": False,\n'''
          if old_shared in text:
              text = text.replace(old_shared, new_shared, 1)
          elif new_shared not in text:
              raise SystemExit("data sharing block missing")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify minimized module
        run: |
          python -m py_compile backend/integrations_control_center/snapchat_capi_purchases.py
          ! grep -q 'client_ip_address.*=' backend/integrations_control_center/snapchat_capi_purchases.py
          ! grep -q '"integration": "mezan_os"' backend/integrations_control_center/snapchat_capi_purchases.py
          grep -q '"status", "reason", "request_status"' backend/integrations_control_center/snapchat_capi_purchases.py

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-snapchat-capi-data-minimization.yml
          git add backend/integrations_control_center/snapchat_capi_purchases.py
          git commit -m "fix(snapchat): minimize CAPI data and validate provider status"
          git push origin HEAD:feat/snapchat-capi-purchase-attribution
