name: Fix review image contract

on:
  push:
    branches: [feat/review-image-save-modes]
    paths: [.github/workflows/agent-fix-review-image-contract.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/review-image-save-modes
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/OrderReview.jsx')
          t=p.read_text(encoding='utf-8')
          old='''    const openImageDialog = (url) => {\n        setImageDialog(url);'''
          new='''    const openImageDialog = (url) => {\n        setVisibleSelectedImage(url);\n        setImageDialog(url);'''
          if old not in t:
              raise SystemExit('target not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/agent-fix-review-image-contract.yml
          git config user.name "AMASI-SA Agent"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/OrderReview.jsx .github/workflows/agent-fix-review-image-contract.yml
          git commit -m "fix(fulfillment): preserve image preview contract"
          git push origin HEAD:feat/review-image-save-modes
