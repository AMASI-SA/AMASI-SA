name: Apply Meta Hourly Canonical Sync

on:
  push:
    branches:
      - fix/meta-hourly-dashboard-spend
    paths:
      - .github/workflows/apply-meta-hourly-canonical-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meta-hourly-dashboard-spend
          fetch-depth: 0
      - name: Reuse canonical Meta hourly refresh inside the existing 5-minute Meta sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scheduler = Path('backend/integrations_control_center/ads_auto_sync_scheduler.py')
          text = scheduler.read_text()

          old = 'from .meta_oauth_security import META_PROVIDER_ID, meta_oauth_configured\n'
          new = (
              'from .meta_oauth_security import META_PROVIDER_ID, meta_oauth_configured\n'
              'from .dashboard_ads_platform_refresh import _refresh_meta_hourly\n'
          )
          assert old in text, 'Meta import anchor changed'
          text = text.replace(old, new, 1)

          old = '''        status = str(result.get("status") or "complete")\n        if status not in {"complete", "partial"}:\n            status = "complete"\n'''
          new = '''        # Reuse the exact Meta hourly projection already used by the Dashboard\n        # refresh path. This is part of the same canonical Meta scheduler run:\n        # no second scheduler, OAuth flow, or parallel Meta sync pipeline.\n        hourly = await _refresh_meta_hourly(db, user_id, end_date)\n        result = {**result, "hourly": hourly}\n        status = str(result.get("status") or "complete")\n        if status not in {"complete", "partial"}:\n            status = "complete"\n'''
          assert old in text, 'Meta result anchor changed'
          text = text.replace(old, new, 1)
          scheduler.write_text(text)

          test_path = Path('backend/tests/test_meta_dashboard_hourly_canonical_sync.py')
          test_path.write_text('''from pathlib import Path\n\n\ndef test_meta_scheduler_reuses_existing_dashboard_hourly_projection():\n    scheduler = Path("backend/integrations_control_center/ads_auto_sync_scheduler.py").read_text()\n    dashboard_refresh = Path("backend/integrations_control_center/dashboard_ads_platform_refresh.py").read_text()\n\n    assert "from .dashboard_ads_platform_refresh import _refresh_meta_hourly" in scheduler\n    assert "hourly = await _refresh_meta_hourly(db, user_id, end_date)" in scheduler\n    assert "async def _refresh_meta_hourly(" in dashboard_refresh\n    assert "hourly_stats_aggregated_by_advertiser_time_zone" in dashboard_refresh\n    assert "upsert_platform_hour(" in dashboard_refresh\n\n\ndef test_meta_hourly_projection_stays_inside_existing_meta_sync_not_new_scheduler():\n    scheduler = Path("backend/integrations_control_center/ads_auto_sync_scheduler.py").read_text()\n    assert scheduler.count("async def auto_sync_loop(") == 1\n    assert scheduler.count("async def _refresh_meta(") == 1\n    assert "result = {**result, \"hourly\": hourly}" in scheduler\n''')

          precondition = Path('backend/tests/test_meta_hourly_dashboard_precondition.py')
          if precondition.exists():
              precondition.unlink()

          workflow = Path('.github/workflows/apply-meta-hourly-canonical-sync.yml')
          workflow.unlink()
          PY

          git config user.name 'mezan'
          git config user.email 'amasi.jewelery@gmail.com'
          git add -A
          git commit -m 'fix(ads): reuse canonical Meta hourly projection in scheduler'
          git push origin HEAD:fix/meta-hourly-dashboard-spend
