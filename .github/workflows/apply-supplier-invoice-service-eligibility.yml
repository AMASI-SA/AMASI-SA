name: Finalize Supplier Invoice Service Policy

on:
  push:
    branches:
      - fix/supplier-invoice-service-eligibility
    paths:
      - scripts/finalize_supplier_invoice_service_policy.py
      - scripts/finalize_supplier_invoice_service_policy_v2.py
      - .github/workflows/apply-supplier-invoice-service-eligibility.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_BRANCH: ${{ github.ref_name }}
      PYTHONPATH: backend
    steps:
      - name: Clone repair branch
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${TARGET_BRANCH}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" workspace
      - name: Apply final policy corrections
        working-directory: workspace
        run: |
          python scripts/finalize_supplier_invoice_service_policy.py
          python scripts/finalize_supplier_invoice_service_policy_v2.py
          python -m py_compile \
            backend/supplier_receiving_routes.py \
            backend/preparation_piece_operations.py \
            backend/tests/test_supplier_invoice_service_eligibility.py
          git diff --check
      - name: Install focused test dependencies
        working-directory: workspace
        run: |
          python -m pip install -q \
            fastapi==0.110.1 \
            pydantic==2.13.4 \
            pymongo==4.5.0 \
            pytest \
            pytest-asyncio \
            openpyxl \
            cryptography \
            reportlab \
            python-multipart \
            pymupdf \
            pillow \
            qrcode \
            arabic-reshaper \
            python-bidi
      - name: Run supplier policy and piece regression tests
        working-directory: workspace
        run: |
          python -m pytest -q \
            backend/tests/test_supplier_invoice_service_eligibility.py \
            backend/tests/test_preparation_piece_operations.py \
            --tb=short
      - name: Commit final source files
        working-directory: workspace
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes were required."
            exit 0
          fi
          git config user.name "AMASI Service Policy Bot"
          git config user.email "service-policy-bot@users.noreply.github.com"
          git add \
            backend/supplier_receiving_routes.py \
            backend/preparation_piece_operations.py \
            backend/tests/test_supplier_invoice_service_eligibility.py
          git commit -m "fix(receiving): finalize optional and permanent service policy"
          git push origin "HEAD:${TARGET_BRANCH}"
