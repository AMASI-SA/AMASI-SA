name: Production Snapchat Platform Source Isolation V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final

permissions:
  contents: write

concurrency:
  group: prod-snap-platform-source-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Ads Manager impression attribution
        run: python .github/scripts/apply_snap_all_ads_campaign_total_v3.py

      - name: Install focused dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor
          httpx pytest pytest-asyncio openpyxl cryptography reportlab
          python-multipart PyJWT

      - name: Compile and test backend contracts
        working-directory: backend
        run: |
          python -m py_compile \
            integrations_control_center/snapchat_freshness_impl_v6.py \
            integrations_control_center/snapchat_account_hourly_refresh.py \
            integrations_control_center/snapchat_account_timezone_manager.py \
            integrations_control_center/snapchat_account_hourly_chart.py \
            integrations_control_center/snapchat_platform_source_integrity.py \
            integrations_control_center/snapchat_adsquad_performance.py \
            integrations_control_center/snapchat_ad_performance.py \
            integrations_control_center/__init__.py
          python -m pytest -q --tb=short \
            tests/test_snapchat_platform_source_integrity_v1.py \
            tests/test_snapchat_order_source_audit_v1.py \
            tests/test_ads_auto_sync_scheduler_v2.py

      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Test source-isolation UI
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/marketingCampaignProfitabilityHydration.test.js
          src/components/marketing/CampaignManagerTable.test.jsx
          src/components/marketing/SnapchatOrderSourceAudit.test.jsx
          src/pages/MarketingPlatformWorkspacePlatformSnapshot.test.js
          src/pages/MarketingPlatformWorkspacePlatformSnapshot.test.js
          src/pages/MarketingPlatformWorkspacePlatformSnapshot.test.js

      - name: Build Production frontend
        working-directory: frontend
        env:
          CI: "false"
        run: yarn build

      - name: Enforce Ads Manager source contracts
        run: |
          grep -q 'ADS_MANAGER_ACTION_REPORT_TIME: Final\[str\] = "impression"' backend/integrations_control_center/snapchat_freshness_impl_v6.py
          grep -q 'action_report_time or ACTION_REPORT_TIME' backend/integrations_control_center/snapchat_account_hourly_refresh.py
          grep -q 'account_local_action_report_time' backend/integrations_control_center/snapchat_account_timezone_manager.py
          grep -q 'ADS_MANAGER_ACTION_REPORT_TIME' backend/integrations_control_center/snapchat_platform_source_integrity.py
          grep -q 'ADS_MANAGER_ACTION_REPORT_TIME' backend/integrations_control_center/snapchat_adsquad_performance.py
          grep -q 'ADS_MANAGER_ACTION_REPORT_TIME' backend/integrations_control_center/snapchat_ad_performance.py
          grep -q 'legacy_hour_conversions_hidden_while_pending' backend/integrations_control_center/snapchat_platform_source_integrity.py
          grep -q 'snapchat-platform-total-pending' frontend/src/pages/MarketingPlatformWorkspace.jsx

      - name: Commit tested source correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/integrations_control_center/snapchat_freshness_impl_v6.py \
            backend/integrations_control_center/snapchat_account_hourly_refresh.py \
            backend/integrations_control_center/snapchat_account_timezone_manager.py \
            backend/integrations_control_center/snapchat_account_hourly_chart.py \
            backend/integrations_control_center/snapchat_platform_source_integrity.py \
            backend/integrations_control_center/snapchat_adsquad_performance.py \
            backend/integrations_control_center/snapchat_ad_performance.py \
            backend/tests/test_snapchat_platform_source_integrity_v1.py \
            frontend/src/components/marketing/SnapchatOrderSourceAudit.jsx \
            frontend/src/pages/MarketingPlatformWorkspace.jsx \
            frontend/src/pages/MarketingPlatformWorkspacePlatformSnapshot.test.js
          git commit -m "fix(prod-snap): align Ads Manager attribution by impression time"
          git push origin HEAD:${{ github.head_ref }}
