name: Mobile Order Tracking

on:
  pull_request:
    paths:
      - "backend/mobile_order_tracking.py"
      - "backend/mobile_app_permissions.py"
      - "backend/mobile_app_request_context.py"
      - "backend/server.py"
      - "backend/order_tracking_notes_routes.py"
      - "backend/instruction_edit_flow.py"
      - "backend/operational_push.py"
      - "backend/tests/test_instruction_*.py"
      - "backend/tests/test_operational_*.py"
      - "backend/tests/test_instruction_orders_permission.py"
      - "backend/tests/test_instruction_edit_flow.py"
      - "backend/tests/test_operational_instruction_notifications.py"
      - "backend/tests/test_mobile_order_tracking.py"
      - ".github/workflows/mobile-order-tracking.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-mongo-tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .:tests
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=trackingtest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record tested source
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1 pydantic==2.13.5 pymongo==4.18.2 motor==3.7.1
          pytest==9.0.3 pytest-asyncio==1.3.0 httpx==0.28.1
          openpyxl==3.1.5 python-dotenv==1.2.3 cryptography==50.0.0
          bcrypt==4.1.3 PyJWT==2.13.0 python-multipart==0.0.20
          mongomock-motor==0.0.36 reportlab==5.0.1 Pillow==12.3.0
          qrcode==8.2 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 tzdata==2026.4 email-validator==2.3.0
      - name: Start isolated Mongo
        run: |
          set -euo pipefail
          docker run -d --name tracking-rs -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet trackingtest --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec tracking-rs mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec tracking-rs mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"trackingtest",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 40); do
            if docker exec tracking-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec tracking-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'
      - name: Verify real route and permission regressions
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short
          tests/test_mobile_order_tracking.py
          tests/test_mobile_app_request_context.py
          tests/test_mobile_app_manager_role.py
          tests/test_mobile_app_permission_owner_resolution.py
          tests/test_instruction_orders_permission.py
          tests/test_instruction_edit_flow.py
          tests/test_operational_instruction_notifications.py
          tests/test_instruction_product_cards.py
          tests/test_instruction_comments_progress.py
          tests/test_operational_push.py
          tests/test_order_tracking_notes.py
          tests/test_operational_courier_instructions.py
          tests/test_assembly_search_instruction_batch.py
          --junitxml=tracking-results.xml
      - name: Require real tracking tests without skips
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse('tracking-results.xml').getroot()
          tests = [row for row in root.iter('testcase') if 'test_mobile_order_tracking' in row.get('classname', '')]
          assert len(tests) >= 20, len(tests)
          assert all(row.find('skipped') is None for row in tests)
          PY
      - name: Stop isolated Mongo
        if: always()
        run: docker rm -f tracking-rs || true
