name: Temporary Fix Snapchat Native Null Display

on:
  push:
    branches:
      - feat/prod-snapchat-results-source-toggle-v1
    paths:
      - ".github/workflows/tmp-fix-snap-native-null-display.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prod-snapchat-results-source-toggle-v1
          fetch-depth: 0
      - name: Preserve unavailable values
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/marketingAdsManagerWorkspaceEnhancer.js")
          text = path.read_text(encoding="utf-8")
          old = '''function moneyText(value, currency) {
  const parsed = Number(value);
'''
          new = '''function moneyText(value, currency) {
  if (value === null || value === undefined || value === "") return "—";
  const parsed = Number(value);
'''
          if old not in text:
              raise SystemExit("moneyText anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify fix
        run: grep -q 'value === null || value === undefined' frontend/src/marketingAdsManagerWorkspaceEnhancer.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/marketingAdsManagerWorkspaceEnhancer.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(prod-snap): preserve unavailable native currency metrics"
          git push origin HEAD:feat/prod-snapchat-results-source-toggle-v1
