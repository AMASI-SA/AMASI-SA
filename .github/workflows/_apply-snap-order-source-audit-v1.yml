name: Apply Snapchat Order Source Audit V1

on:
  push:
    branches:
      - feat/prod-snap-order-source-audit-v1

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prod-snap-order-source-audit-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply native route and React integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          routes = "backend/integrations_control_center/snapchat_native_tracking_routes.py"
          replace_once(
              routes,
              "from fastapi import APIRouter, Depends, HTTPException\n",
              "from fastapi import APIRouter, Depends, HTTPException, Query\n",
          )
          replace_once(
              routes,
              "from .snapchat_native_data_common import SnapchatNativeSyncError\n",
              "from .snapchat_native_data_common import SnapchatNativeSyncError\n"
              "from .snapchat_order_source_audit import build_snapchat_order_source_audit\n",
          )
          replace_once(
              routes,
              "    install_snapchat_tracking_error_detail_persistence()\n"
              "    install_snapchat_native_tracking_actions()\n\n"
              "    @router.post(\n",
              "    install_snapchat_tracking_error_detail_persistence()\n"
              "    install_snapchat_native_tracking_actions()\n\n"
              "    @router.get(\n"
              "        f\"/{SNAPCHAT_PROVIDER_ID}/order-source-audit\",\n"
              "        name=\"get_snapchat_order_source_audit\",\n"
              "    )\n"
              "    async def get_snapchat_order_source_audit(\n"
              "        account_id: str | None = Query(default=None, max_length=120),\n"
              "        from_date: str | None = Query(default=None),\n"
              "        to_date: str | None = Query(default=None),\n"
              "        user: dict = Depends(current_user),\n"
              "    ) -> dict[str, Any]:\n"
              "        owner = require_owner(user)\n"
              "        try:\n"
              "            return await build_snapchat_order_source_audit(\n"
              "                db,\n"
              "                str(owner[\"id\"]),\n"
              "                account_id=account_id,\n"
              "                from_date=from_date,\n"
              "                to_date=to_date,\n"
              "            )\n"
              "        except SnapchatNativeSyncError as exc:\n"
              "            raise HTTPException(\n"
              "                status_code=exc.status_code,\n"
              "                detail={\n"
              "                    \"code\": exc.code,\n"
              "                    \"message\": exc.message,\n"
              "                    \"retryable\": exc.retryable,\n"
              "                    \"source_only\": True,\n"
              "                    \"provider_write_reached\": False,\n"
              "                    \"campaign_write_reached\": False,\n"
              "                    \"accounting_write_reached\": False,\n"
              "                    \"qoyod_write_reached\": False,\n"
              "                },\n"
              "            ) from exc\n\n"
              "    @router.post(\n",
          )

          workspace = "frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx"
          replace_once(
              workspace,
              "import { hydrateCampaignProfitability } from \"../../marketingCampaignProfitabilityHydration\";\n",
              "import { hydrateCampaignProfitability } from \"../../marketingCampaignProfitabilityHydration\";\n"
              "import SnapchatOrderSourceAudit from \"./SnapchatOrderSourceAudit\";\n",
          )
          replace_once(
              workspace,
              "    platformLabel,\n    entityLevel,\n",
              "    platformLabel,\n"
              "    auditAccountId,\n"
              "    auditDateFrom,\n"
              "    auditDateTo,\n"
              "    entityLevel,\n",
          )
          replace_once(
              workspace,
              "            <EntityTabs platformLabel={platformLabel} entityLevel={entityLevel} onChange={onEntityLevelChange} adSquadsEnabled={adSquadsEnabled} adsEnabled={adsEnabled} />\n"
              "            {platform === \"snapchat\" && (\n",
              "            <EntityTabs platformLabel={platformLabel} entityLevel={entityLevel} onChange={onEntityLevelChange} adSquadsEnabled={adSquadsEnabled} adsEnabled={adsEnabled} />\n"
              "            {platform === \"snapchat\" && entityLevel === \"campaigns\" && (\n"
              "                <SnapchatOrderSourceAudit\n"
              "                    accountId={auditAccountId}\n"
              "                    dateFrom={auditDateFrom}\n"
              "                    dateTo={auditDateTo}\n"
              "                />\n"
              "            )}\n"
              "            {platform === \"snapchat\" && (\n",
          )

          page = "frontend/src/pages/MarketingPlatformWorkspace.jsx"
          replace_once(
              page,
              "                    platform={platform}\n"
              "                    platformLabel={config.label}\n"
              "                    entityLevel={entityLevel}\n",
              "                    platform={platform}\n"
              "                    platformLabel={config.label}\n"
              "                    auditAccountId={selectedAccountId}\n"
              "                    auditDateFrom={appliedRange.dateFrom}\n"
              "                    auditDateTo={appliedRange.dateTo}\n"
              "                    entityLevel={entityLevel}\n",
          )
          PY
      - name: Install Backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0
          httpx pytest pytest-asyncio openpyxl cryptography reportlab
          python-multipart bcrypt PyJWT pymupdf pillow qrcode
          arabic-reshaper python-bidi
      - name: Test Backend audit
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_snapchat_order_source_audit_v1.py
          -q --tb=short
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install Frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive
      - name: Test Frontend audit
        working-directory: frontend
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/SnapchatOrderSourceAudit.test.jsx
          src/components/marketing/AdsEntityLevelWorkspace.test.jsx
      - name: Build Production Frontend
        working-directory: frontend
        env:
          CI: "false"
        run: yarn build
      - name: Commit tested integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/integrations_control_center/snapchat_native_tracking_routes.py \
            frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx \
            frontend/src/pages/MarketingPlatformWorkspace.jsx
          git diff --cached --check
          git commit -m "feat(snap): integrate order-source audit into Ads Manager"
          git push origin HEAD:feat/prod-snap-order-source-audit-v1
