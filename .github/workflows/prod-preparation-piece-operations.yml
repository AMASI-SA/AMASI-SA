name: Production Preparation Piece Operations

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/preparation_piece_operations.py"
      - "backend/preparation_piece_line_services.py"
      - "backend/preparation_piece_execution_guard.py"
      - "backend/preparation_file_failure_safety.py"
      - "backend/order_engine/__init__.py"
      - "backend/tests/test_preparation_piece_operations.py"
      - "backend/tests/test_preparation_piece_line_services.py"
      - "backend/tests/test_preparation_piece_stage_semantics.py"
      - "backend/tests/test_preparation_piece_execution_guard.py"
      - "backend/tests/test_preparation_file_failure_safety.py"
      - "frontend/src/index.js"
      - "frontend/src/reviewPreparationFileMetadataEnhancer.js"
      - "frontend/src/reviewPreparationFileScheduleSync.js"
      - "frontend/src/reviewPreparationFileScheduleSync.test.js"
      - "frontend/src/preparationFileFailureSafetyClient.js"
      - "frontend/src/preparationFileFailureSafetyClient.test.js"
      - "frontend/src/reviewSpecEditVisibilitySafety.js"
      - "frontend/src/reviewSpecEditVisibilitySafety.test.js"
      - "frontend/src/services/preparationWorkService.js"
      - "frontend/src/components/fulfillment/PreparationWorkDashboard.jsx"
      - "frontend/src/components/fulfillment/PreparationWorkDashboard.test.jsx"
      - "frontend/src/pages/FulfillmentV2.jsx"
      - "frontend/src/pages/FulfillmentV2.test.jsx"
      - ".github/workflows/prod-preparation-piece-operations.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install targeted dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi

      - name: Compile piece operations
        run: >-
          python -m py_compile
          backend/preparation_piece_operations.py
          backend/preparation_piece_line_services.py
          backend/preparation_piece_execution_guard.py
          backend/preparation_file_failure_safety.py
          backend/order_engine/__init__.py

      - name: Run focused fulfillment contracts
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_preparation_piece_operations.py
          tests/test_preparation_piece_line_services.py
          tests/test_preparation_piece_stage_semantics.py
          tests/test_preparation_piece_execution_guard.py
          tests/test_preparation_file_failure_safety.py
          tests/test_reviewed_preparation_batches.py
          tests/test_preparation_file_registry.py
          tests/test_fulfillment_v2_contract.py
          -q --tb=short

      - name: Enforce Mezan-only boundary
        run: |
          set -euo pipefail
          for FILE in backend/preparation_piece_operations.py backend/preparation_piece_line_services.py backend/preparation_piece_execution_guard.py backend/preparation_file_failure_safety.py; do
            ! grep -Eq 'call_salla|call_qoyod|requests\.(post|put|patch|delete)|httpx\.(post|put|patch|delete)' "$FILE"
          done
          grep -q 'failed_preparation_request_released' backend/preparation_file_failure_safety.py
          grep -q 'salla_updated.*False' backend/preparation_file_failure_safety.py
          grep -q 'qoyod_updated.*False' backend/preparation_file_failure_safety.py

  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        run: yarn install --non-interactive

      - name: Run preparation work UI contracts
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/fulfillment/PreparationWorkDashboard.test.jsx
          src/reviewPreparationFileScheduleSync.test.js
          src/preparationFileFailureSafetyClient.test.js
          src/reviewSpecEditVisibilitySafety.test.js
          src/pages/FulfillmentV2.test.jsx

      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
