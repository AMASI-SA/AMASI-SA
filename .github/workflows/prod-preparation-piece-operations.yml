name: Production Preparation Piece Operations

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/preparation_piece_operations.py"
      - "backend/order_engine/__init__.py"
      - "backend/tests/test_preparation_piece_operations.py"
      - ".github/workflows/prod-preparation-piece-operations.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install targeted dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi

      - name: Compile piece operations
        run: >-
          python -m py_compile
          backend/preparation_piece_operations.py
          backend/order_engine/__init__.py

      - name: Run focused fulfillment contracts
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_preparation_piece_operations.py
          tests/test_reviewed_preparation_batches.py
          tests/test_preparation_file_registry.py
          tests/test_fulfillment_v2_contract.py
          -q --tb=short

      - name: Enforce Mezan-only boundary
        run: |
          set -euo pipefail
          FILE=backend/preparation_piece_operations.py
          ! grep -Eq 'call_salla|qoyod|requests\.(post|put|patch|delete)|httpx\.(post|put|patch|delete)' "$FILE"
          grep -q 'salla_updated.*False' "$FILE"
          grep -q 'qoyod_updated.*False' "$FILE"
