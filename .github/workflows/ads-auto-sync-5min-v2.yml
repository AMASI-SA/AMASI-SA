name: Ads Auto Sync 5 Minutes V2

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/ads_auto_sync_scheduler.py"
      - "backend/integrations_control_center/snapchat_account_hourly_refresh.py"
      - "backend/integrations_control_center/snapchat_dashboard_summary_routes.py"
      - "backend/integrations_control_center/snapchat_native_data_common.py"
      - "backend/integrations_control_center/__init__.py"
      - "backend/store_delivery_*.py"
      - "backend/dashboard_eligibility_filter.py"
      - "backend/tests/test_dashboard_eligibility_filter.py"
      - "backend/tests/test_ads_auto_sync_scheduler_v2.py"
      - "backend/tests/test_snapchat_account_hourly_refresh_v2.py"
      - "backend/tests/test_snapchat_native_data_sync_v2.py"
      - "backend/tests/test_snapchat_native_tracking_diagnostics_v2.py"
      - "backend/tests/test_snapchat_refresh_token_rotation_race.py"
      - ".github/workflows/ads-auto-sync-5min-v2.yml"

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          pip install pytest pytest-asyncio fastapi "pydantic>=2" httpx pymongo motor
          cryptography openpyxl bcrypt PyJWT reportlab
      - name: Compile scheduler and Snapchat adapters
        working-directory: backend
        run: |
          python -m py_compile \
            integrations_control_center/ads_auto_sync_scheduler.py \
            integrations_control_center/snapchat_account_hourly_refresh.py \
            integrations_control_center/snapchat_dashboard_summary_routes.py \
            integrations_control_center/snapchat_native_data_common.py \
            integrations_control_center/__init__.py
      - name: Run focused tests
        working-directory: backend
        run: >-
          pytest -q
          tests/test_ads_auto_sync_scheduler_v2.py
          tests/test_snapchat_account_hourly_refresh_v2.py
          tests/test_snapchat_dashboard_summary_v2.py
          tests/test_snapchat_native_data_sync_v2.py
          tests/test_snapchat_native_tracking_diagnostics_v2.py::test_optional_signal_readiness_403_is_partial_without_false_zero
          tests/test_snapchat_native_tracking_diagnostics_v2.py::test_required_pixel_401_raises_reauth_and_writes_no_tracking_facts
          tests/test_snapchat_refresh_token_rotation_race.py
      - name: Enforce provider-only isolation
        run: |
          FILE=backend/integrations_control_center/ads_auto_sync_scheduler.py
          ! grep -q 'general_ledger' "$FILE"
          ! grep -q 'daily_costs' "$FILE"
          ! grep -q 'meta_ads_daily' "$FILE"
          ! grep -q 'snapchat_daily_stats' "$FILE"
          ! grep -q '/meta/sync\|/snapchat/daily-spend' "$FILE"
          grep -q 'DEFAULT_INTERVAL_SECONDS = 300' "$FILE"
          grep -q 'runs_without_browser' "$FILE"
          grep -q 'granularity.*"HOUR"' \
            backend/integrations_control_center/snapchat_account_hourly_refresh.py
          grep -q 'day_start.*"00:00"' \
            backend/integrations_control_center/snapchat_dashboard_summary_routes.py
