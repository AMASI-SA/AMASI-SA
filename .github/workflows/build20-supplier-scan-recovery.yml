name: Build20 supplier scan recovery (no deployment)
on:
  push:
    branches: [fix/build20-supplier-scan-recovery-20260926]
  pull_request:
    paths:
      - 'backend/supplier_receiving_routes.py'
      - 'backend/tests/test_supplier_scan_recovery.py'
      - 'backend/tests/test_supplier_optional_unstarted_receipt.py'
      - 'backend/tests/test_supplier_receiving_entry.py'
      - 'backend/preparation_section_reads.py'
      - 'backend/preparation_supplier_dispatch.py'
      - 'backend/mobile_operations_monitoring_routes.py'
      - 'backend/mobile_employee_monitoring_workspace_routes.py'
      - 'backend/reviewed_product_pages.py'
      - 'backend/reviewed_products_catalog.py'
      - 'backend/review_direct_preparation_sync.py'
      - 'backend/order_review_product_defaults.py'
      - 'backend/operational_notification_directory.py'
      - 'backend/preparation_file_images.py'
      - 'backend/reviewed_product_sorting.py'
      - 'backend/tests/test_review_product_defaults_regressions.py'
      - 'backend/tests/test_supplier_receiving.py'
      - 'backend/tests/test_supplier_invoice_financial_integrity.py'
      - '.github/workflows/build20-supplier-scan-recovery.yml'
permissions:
  contents: read
jobs:
  scan-recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:tests
      BUILD20_SCAN_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      BUILD20_INVOICE_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      WAITING_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      JWT_SECRET: isolated-build20-regression-signing-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Start disposable transaction-capable Mongo
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name scan-test-mongo -p 127.0.0.1:27017:27017 mongo:7.0.16 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do docker exec scan-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break; sleep 1; done
          docker exec scan-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 60); do docker exec scan-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1 && break; sleep 1; done
          docker exec scan-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)'
      - name: Install isolated backend test dependencies
        run: >-
          python -m pip install
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor==3.3.1
          httpx==0.28.1 openai==1.99.9 pytest==9.0.2 pytest-asyncio==1.3.0
          mongomock-motor==0.0.36 PyJWT python-dotenv
          bcrypt==4.1.3 email-validator==2.3.0 requests python-dateutil tzdata webauthn==2.7.1
          openpyxl cryptography reportlab python-multipart arabic-reshaper python-bidi Pillow qrcode PyMuPDF
      - name: Scan recovery plus supplier/invoice regressions
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build20-scan-recovery"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/build20-scan-recovery/identity.txt"
          python -m pytest tests/test_supplier_receiving_entry.py tests/test_monitoring_lazy_directory.py tests/test_preparation_lazy_sections.py tests/test_reviewed_product_pages.py -v --tb=short
          python -m pytest tests/test_supplier_receiving_concurrency.py tests/test_review_product_defaults.py tests/test_review_gallery_read_performance.py tests/test_order_review_operational_images.py tests/test_order_review_export_controls.py -v --tb=short
          python -m pytest tests/test_preparation_file_images.py tests/test_preparation_request_outcome.py tests/test_preparation_selected_order_scope.py tests/test_notification_sender_directory.py tests/test_review_direct_preparation_sync.py tests/test_review_product_defaults_regressions.py tests/test_review_readback_v2.py -v --tb=short
          python -m pytest             tests/test_supplier_optional_unstarted_receipt.py             tests/test_supplier_scan_recovery.py             tests/test_supplier_scan_lock.py             tests/test_supplier_scan_approval.py             tests/test_supplier_receiving.py             tests/test_supplier_invoice_financial_integrity.py             tests/test_supplier_multi_supplier_lifecycle.py             tests/test_supplier_invoice_live_cost_session.py             tests/test_supplier_invoice_service_eligibility.py             -v --tb=short --junitxml="$RUNNER_TEMP/build20-scan-recovery/pytest.xml"             2>&1 | tee "$RUNNER_TEMP/build20-scan-recovery/pytest.log"
      - name: Stop disposable Mongo
        if: always()
        run: docker rm -f scan-test-mongo || true
      - name: Retain exact-head synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build20-scan-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/build20-scan-recovery
          retention-days: 30
          if-no-files-found: warn
