name: Review Completion Resumable

on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final, codex/review-completion-resumable, codex/review-acceptance-config-guard]
    paths:
      - "backend/order_review*.py"
      - "backend/review_local_policy.py"
      - "backend/preparation_piece_operations.py"
      - "backend/preparation_route_history.py"
      - "backend/supplier_dispatch_waiting_policy.py"
      - "backend/order_engine/repository.py"
      - "backend/tests/test_review_local_*.py"
      - "backend/tests/review_legacy_contract_fixture.py"
      - "backend/operational_atomic.py"
      - "backend/server.py"
      - "backend/review_acceptance_config_guard.py"
      - "backend/tests/test_review_acceptance_config_guard.py"
      - "backend/fulfillment_v2_routes.py"
      - "backend/tests/test_review_completion_*.py"
      - "backend/tests/test_g47*.py"
      - ".github/workflows/review-completion-resumable.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-mongo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .:tests
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=reviewtest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1 pydantic==2.13.5 pymongo==4.18.2 motor==3.7.1
          pytest==9.0.3 pytest-asyncio==1.3.0 httpx==0.28.1
          openpyxl==3.1.5 python-dotenv==1.2.3 cryptography==50.0.0
          bcrypt==4.1.3 PyJWT==2.13.0 python-multipart==0.0.20
          mongomock-motor==0.0.36 reportlab==5.0.1 Pillow==12.3.0
          qrcode==8.2 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 tzdata==2026.4
      - name: Start isolated real Mongo replica set
        run: |
          set -euo pipefail
          docker run -d --name review-rs -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet reviewtest --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec review-rs mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec review-rs mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"reviewtest",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 40); do
            if docker exec review-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec review-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'
      - name: Run local approval and retained provider contract regressions
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short
          tests/test_review_local_completion.py
          tests/test_review_local_downstream.py
          tests/test_review_local_assembly.py
          tests/test_assignment_salla_in_progress.py
          tests/test_assignment_single_post_transport.py
          tests/test_review_catalog_eligibility.py
          tests/test_review_local_queues.py
          tests/test_review_completion_provider.py
          tests/test_review_completion_confirmation.py
          tests/test_review_completion_recovery.py
          tests/test_review_completion_preparation.py
          tests/test_review_completion_extra.py
          tests/test_review_completion_acceptance.py
          tests/test_review_completion_auto_resume.py
          tests/test_review_completion_business_snapshot.py
          tests/test_review_completion_representation_integration.py
          tests/test_review_approval_scope.py
          tests/test_review_acceptance_config_guard.py
          tests/test_g47_component_lifecycle_integration.py
          tests/test_order_review_stage_one.py
          tests/test_order_review_export_controls.py
          tests/test_order_review_mobile_app_permissions.py
          tests/test_reviewed_products_catalog.py
          --junitxml="${{ runner.temp }}/review-completion.xml"
      - name: Preserve the acceptance configuration conflict guard
        if: ${{ !cancelled() }}
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short
          tests/test_g47_operational_boundary.py::OperationalBoundaryTests::test_config_change_during_provider_call_invalidates_legacy_acceptance
          --junitxml="${{ runner.temp }}/review-acceptance-guard.xml"
      - name: Require executed tests with no failures or skips
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name, minimum in (("review-completion.xml", 174), ("review-acceptance-guard.xml", 1)):
              cases = list(ET.parse(Path(os.environ["RUNNER_TEMP"]) / name).iter("testcase"))
              assert len(cases) >= minimum, (name, "Missing executed tests", len(cases))
              rejected = [row.attrib.get("name") for row in cases
                          if any(row.find(tag) is not None for tag in ("skipped", "failure", "error"))]
              assert not rejected, (name, rejected)
              if name == "review-completion.xml":
                  confirmation = [row for row in cases if row.attrib.get("classname", "").endswith(
                      "test_review_completion_confirmation.ConfirmationTests")]
                  assert len(confirmation) == 19, ("Missing confirmation contracts", len(confirmation))
                  for suite, minimum in (("test_review_local_completion.LocalCompletionTests", 16),
                                         ("test_review_local_downstream.LocalDownstreamTests", 10),
                                         ("test_review_local_assembly.LocalAssemblyTests", 26),
                                         ("test_assignment_salla_in_progress.AssignmentSyncTests", 15),
                                         ("test_assignment_single_post_transport.SinglePostTransportTests", 6),
                                         ("test_assignment_single_post_transport.MongoSinglePostTests", 7),
                                         ("test_review_catalog_eligibility.CatalogEligibilityTests", 11),
                                         ("test_review_local_queues.LocalReviewQueueTests", 3)):
                      executed = [row for row in cases if row.attrib.get("classname", "").endswith(suite)]
                      assert len(executed) >= minimum, ("Missing local contracts", suite, len(executed))
              print(f"{name}: {len(cases)} executed cases; zero skips/failures/errors")
          PY
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-completion-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/review-completion.xml
            ${{ runner.temp }}/review-acceptance-guard.xml
          if-no-files-found: error
      - name: Remove this job's disposable fixture
        if: always()
        run: docker rm --force review-rs
