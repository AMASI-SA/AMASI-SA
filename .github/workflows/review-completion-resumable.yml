      - "backend/tests/test_salla_sync_component_snapshot.py"
      - "backend/order_review*.py"
      - "backend/source_added_item_review.py"
      - "backend/stock_component_consumption_service.py"
      - "backend/tests/test_source_added_item*.py"
      - "backend/tests/test_added_item_component_stock.py"
      - "backend/review_local_policy.py"
      - "backend/review_gift_address.py"
      - "backend/tests/test_review_gift_address.py"
      - "backend/preparation_piece_operations.py"
      - "backend/supplier_receipt_ready_policy.py"
      - "backend/tests/test_supplier_receipt_ready_policy.py"
