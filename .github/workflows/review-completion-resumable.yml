      - "backend/assembly_completion_delivery.py"
      - "backend/assembly_evidence_recovery.py"
      - "backend/tests/test_assembly_evidence_recovery.py"
      - "backend/assembly_print_completion.py"
      - "backend/tests/test_assembly_print_completion.py"
      - "backend/tests/test_unified_completed_carrier_label.py"
      - "backend/assembly_completion_legacy_readback.py"
      - "backend/assembly_completion_v2_readback.py"
      - "backend/assembly_status_policy.py"
      - "backend/salla_integration/auto_sync.py"
      - "backend/salla_integration/cost_option_recovery.py"
      - "backend/tests/test_cost_option_auto_recovery.py"
      - "backend/order_engine/shipping_label_service.py"
      - "backend/tests/test_assembly_completion_delivery.py"
      - "backend/tests/test_assembly_completion_legacy_readback.py"
      - "backend/tests/test_assembly_completion_v2_readback.py"
      - "backend/tests/test_assembly_completion_status_transition.py"
      - "backend/tests/test_assembly_completion_readback_routes.py"
      - "backend/tests/test_shipping_saved_label_print.py"
      - "backend/tests/test_assembly_search_instruction_batch.py"
      - "backend/tests/test_preparation_receiving_custody.py"
      - "backend/order_tracking_notes.py"
      - "backend/preparation_route_history.py"
      - "backend/supplier_dispatch_waiting_policy.py"
      - "backend/order_engine/repository.py"
      - "backend/tests/test_review_local_*.py"
      - "backend/tests/review_legacy_contract_fixture.py"
      - "backend/operational_atomic.py"
      - "backend/server.py"
      - "backend/review_acceptance_config_guard.py"
      - "backend/tests/test_review_acceptance_config_guard.py"
      - "backend/fulfillment_v2_routes.py"
      - "backend/tests/test_review_completion_*.py"
      - "backend/tests/test_g47*.py"
      - ".github/workflows/review-completion-resumable.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-mongo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .:tests
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=reviewtest
      BUILD37_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=reviewtest
      WAITING_TEST_MONGO_URL: mongodb://127.0.0.1:27018/?replicaSet=reviewtest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1 pydantic==2.13.5 pymongo==4.18.2 motor==3.7.1
          pytest==9.0.3 pytest-asyncio==1.3.0 httpx==0.28.1
          openpyxl==3.1.5 python-dotenv==1.2.3 cryptography==50.0.0
          bcrypt==4.1.3 PyJWT==2.13.0 python-multipart==0.0.20 email-validator==2.3.0
          mongomock-motor==0.0.36 reportlab==5.0.1 Pillow==12.3.0
          qrcode==8.2 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 tzdata==2026.4
      - name: Start isolated real Mongo replica set
        run: |
          set -euo pipefail
          docker run -d --name review-rs -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet reviewtest --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec review-rs mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec review-rs mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"reviewtest",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 40); do
            if docker exec review-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec review-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'
      - name: Verify explicit-refresh preparation recovery with real Mongo
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          from pymongo import MongoClient
          uri = os.environ["MZ2_TEST_MONGO_URI"]
          parsed = urlparse(uri)
          assert parsed.scheme == "mongodb" and parsed.hostname == "127.0.0.1"
          assert parsed.username is None and parsed.password is None
          with MongoClient(uri, serverSelectionTimeoutMS=5000) as client:
              hello = client.admin.command("hello")
              version = client.admin.command("buildInfo")["version"]
              assert version == "8.0.12", version
              assert hello.get("setName") == "reviewtest" and hello.get("isWritablePrimary") is True
          print("Preparation recovery fixture: MongoDB 8.0.12, reviewtest primary, loopback only")
          PY
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short \
            tests/test_preparation_refresh_recovery.py \
            tests/test_review_direct_preparation_sync.py \
            --junitxml="$RUNNER_TEMP/preparation-refresh-recovery.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(Path(os.environ["RUNNER_TEMP"]) / "preparation-refresh-recovery.xml").iter("testcase"))
          assert cases, "Missing preparation refresh recovery cases"
          rejected = [row.attrib.get("name") for row in cases
                      if any(row.find(tag) is not None for tag in ("skipped", "failure", "error"))]
          assert not rejected, rejected
          required = {
              "test_preparation_refresh_recovery.ExplicitRefreshContractTests": {
                  "test_mobile_refresh_returns_guarded_preparation_continuation",
                  "test_cached_failed_stale_or_foreign_refresh_never_starts_recovery",
                  "test_pending_recovery_preserves_successful_source_refresh",
                  "test_recovery_read_failure_does_not_erase_applied_source_result",
                  "test_revoked_actor_cannot_start_recovery",
                  "test_late_authorization_denial_is_not_converted_to_pending",
                  "test_owner_refresh_denies_missing_deleted_or_demoted_actor",
              },
              "test_preparation_refresh_recovery.PreparationRefreshRecoveryIntegrationTests": {
                  "test_mobile_orders_refresh_recovers_committed_allocations",
                  "test_mobile_assembly_refresh_recovers_committed_allocations",
                  "test_owner_web_refresh_recovers_committed_allocations",
                  "test_partial_allocation_returns_source_success_and_pending",
                  "test_ineligible_workflows_make_no_extra_provider_read",
                  "test_provider_identity_and_terminal_observations_never_promote",
                  "test_revoked_actor_during_readback_prevents_local_commit",
                  "test_newer_source_during_readback_is_not_overwritten",
                  "test_repeated_explicit_refresh_preserves_approval_and_single_event",
                  "test_confirmed_refresh_source_race_returns_pending",
                  "test_confirmed_refresh_workflow_race_returns_pending",
                  "test_completed_source_refresh_stays_successful_with_recovery_pending",
              },
              "test_review_direct_preparation_sync.DirectPreparationSyncTests": {
                  "test_already_in_progress_confirms_without_post",
                  "test_uncertain_post_is_never_repeated_read_only_reconciliation_confirms",
                  "test_status_get_cannot_dispatch_and_keeps_permission_and_tenant_boundaries",
                  "test_mixed_partial_waits_then_last_supplier_allocation_uses_same_guarded_transition",
              },
          }
          for suite, names in required.items():
              executed = {row.attrib.get("name") for row in cases
                          if row.attrib.get("classname", "").endswith(suite)}
              assert names <= executed, ("Missing preparation recovery contracts", suite, sorted(names - executed))
          print(f"Preparation refresh recovery: {len(cases)} executed cases; named contracts present; zero skips/failures/errors")
          PY
      - name: Verify Android operation recovery with disposable Mongo
        run: |
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short \
            tests/test_mobile_assembly_refresh_actions.py \
            tests/test_mobile_external_label_read_parity.py \
            tests/test_manual_courier_label_refresh_race.py \
            tests/test_manual_label_delivery_overlap.py \
            tests/test_preparation_progress_dates.py \
            tests/test_supplier_progress_files.py \
            tests/test_preparation_lazy_sections.py \
            tests/test_preparation_piece_operations.py \
            tests/test_amasi_shipping_compat.py \
            tests/test_assembly_completion_delivery.py \
            tests/test_assembly_evidence_recovery.py \
            tests/test_assembly_completion_scheduling.py \
            tests/test_assembly_direct_preparation_receipt.py \
            tests/test_mobile_app_request_context.py \
            tests/test_order_review_operational_images.py \
            --junitxml="$RUNNER_TEMP/android-operations.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          cases = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'android-operations.xml').findall('.//testcase')
          assert len(cases) >= 200, ('Missing focused operation cases', len(cases))
          assert not [case.attrib for case in cases if any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error'))]
          print(f'Android operations: {len(cases)} executed cases; zero skips/failures/errors')
          PY
      - name: Run local approval and retained provider contract regressions
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short
          tests/test_source_added_item_review.py
          tests/test_source_added_item_catalog.py
          tests/test_source_added_item_ready_coverage.py
          tests/test_added_item_component_stock.py
          tests/test_review_local_completion.py
          tests/test_review_local_downstream.py
          tests/test_review_local_assembly.py
          tests/test_operational_item_ready_policy.py
          tests/test_supplier_receipt_ready_policy.py
          tests/test_supplier_receipt_delivery_policy.py
          tests/test_supplier_component_consumption_deferral.py
          tests/test_supplier_receipt_bundle_coverage.py
          tests/test_assembly_completion_delivery.py
          tests/test_assembly_print_completion.py
          tests/test_unified_completed_carrier_label.py
          tests/test_assembly_completion_legacy_readback.py
          tests/test_assembly_completion_v2_readback.py
          tests/test_assembly_completion_status_transition.py
          tests/test_assembly_completion_readback_routes.py
          tests/test_shipping_saved_label_print.py
          tests/test_g47_ready_shipping_safety.py
          tests/test_g47_ready_canonical_status_race.py
          tests/test_assembly_search_instruction_batch.py
          tests/test_preparation_receiving_custody.py
          tests/test_assignment_salla_in_progress.py
          tests/test_assignment_single_post_transport.py
          tests/test_review_catalog_eligibility.py
          tests/test_review_local_queues.py
          tests/test_review_completion_provider.py
          tests/test_review_completion_confirmation.py
          tests/test_review_completion_recovery.py
          tests/test_review_completion_preparation.py
          tests/test_review_completion_extra.py
          tests/test_review_completion_acceptance.py
          tests/test_review_completion_auto_resume.py
          tests/test_review_completion_business_snapshot.py
          tests/test_review_completion_representation_integration.py
          tests/test_review_approval_scope.py
          tests/test_review_gift_address.py
          tests/test_review_acceptance_config_guard.py
          tests/test_g47_component_lifecycle_integration.py
          tests/test_component_zero_price_recovery.py
          tests/test_component_option_currency_recovery.py
          tests/test_component_source_detail_recovery.py
          tests/test_component_option_currency_integration.py
          tests/test_assembly_source_pending_message.py
          tests/test_order_review_stage_one.py
          tests/test_order_review_export_controls.py
          tests/test_order_review_mobile_app_permissions.py
          tests/test_reviewed_products_catalog.py
          tests/test_salla_orders_sync_pagination_evidence.py
          tests/test_cost_option_auto_recovery.py
          tests/test_salla_stale_creation_options.py
          --asyncio-mode=auto --junitxml="${{ runner.temp }}/review-completion.xml"
      - name: Verify stranded print snapshot recovery and sync fences
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short
          tests/test_assembly_option_change_notice.py
          tests/test_shipping_catalog_label_recovery.py
          tests/test_shipping_pending_snapshot_recovery.py
          tests/test_salla_sync_component_snapshot.py
          --junitxml="${{ runner.temp }}/source-snapshot.xml"
      - name: Preserve the acceptance configuration conflict guard
        if: ${{ !cancelled() }}
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short
          tests/test_g47_operational_boundary.py::OperationalBoundaryTests::test_config_change_during_provider_call_invalidates_legacy_acceptance
          --junitxml="${{ runner.temp }}/review-acceptance-guard.xml"
      - name: Require executed tests with no failures or skips
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name, minimum in (("review-completion.xml", 256), ("review-acceptance-guard.xml", 1),
                                ("source-snapshot.xml", 7)):
              cases = list(ET.parse(Path(os.environ["RUNNER_TEMP"]) / name).iter("testcase"))
              assert len(cases) >= minimum, (name, "Missing executed tests", len(cases))
              rejected = [row.attrib.get("name") for row in cases
                          if any(row.find(tag) is not None for tag in ("skipped", "failure", "error"))]
              assert not rejected, (name, rejected)
              if name == "source-snapshot.xml":
                  stale_creation = [row for row in cases if row.attrib.get("classname", "").endswith(
                      "test_salla_sync_component_snapshot.StaleCreationOptionsMongoTests")]
                  assert len(stale_creation) >= 7, ("Missing real Mongo stale creation contracts", len(stale_creation))
              if name == "review-completion.xml":
                  confirmation = [row for row in cases if row.attrib.get("classname", "").endswith(
                      "test_review_completion_confirmation.ConfirmationTests")]
                  assert len(confirmation) == 19, ("Missing confirmation contracts", len(confirmation))
                  for suite, minimum in (("test_source_added_item_review.SourceAdditionReviewTests", 16),
                                         ("test_source_added_item_catalog", 9),
                                         ("test_source_added_item_ready_coverage", 18),
                                         ("test_added_item_component_stock", 9),
                                         ("test_review_local_completion.LocalCompletionTests", 16),
                                         ("test_assembly_completion_delivery.DeliveryTests", 11),
                                         ("test_assembly_print_completion.PrintCompletionTests", 15),
                                         ("test_assembly_completion_legacy_readback.LegacyCompletionTests", 28),
                                         ("test_assembly_completion_v2_readback.BlockedCompletionTests", 24),
                                         ("test_assembly_completion_status_transition.StatusTransitionTests", 9),
                                         ("test_assembly_completion_readback_routes.CompletionReadbackRouteTests", 3),
                                         ("test_shipping_saved_label_print", 18),
                                         ("test_g47_ready_shipping_safety.CounterexampleTests", 3),
                                         ("test_g47_ready_shipping_safety.SafetyTests", 10),
                                         ("test_g47_ready_shipping_safety.StatusPolicyTests", 1),
                                         ("test_g47_ready_shipping_safety.ProviderReadbackTests", 1),
                                         ("test_g47_ready_canonical_status_race.CanonicalStatusRaceTests", 3),
                                         ("test_assembly_search_instruction_batch.AssemblySearchInstructionTests", 4),
                                         ("test_preparation_receiving_custody.PreparationCustodyTests", 11),
                                         ("test_review_local_downstream.LocalDownstreamTests", 10),
                                         ("test_review_local_assembly.LocalAssemblyTests", 41),
                                         ("test_supplier_receipt_ready_policy", 82),
                                         ("test_supplier_receipt_delivery_policy", 28),
                                         ("test_supplier_component_consumption_deferral", 35),
                                         ("test_supplier_receipt_bundle_coverage", 39),
                                         ("test_assignment_salla_in_progress.AssignmentSyncTests", 15),
                                         ("test_assignment_single_post_transport.SinglePostTransportTests", 6),
                                         ("test_assignment_single_post_transport.MongoSinglePostTests", 7),
                                         ("test_review_catalog_eligibility.CatalogEligibilityTests", 11),
                                         ("test_review_local_queues.LocalReviewQueueTests", 3),
                                         ("test_component_option_currency_integration.OptionPriceCurrencyTests", 7),
                                         ("test_component_source_detail_recovery.SettledDetailProofTests", 19),
                                         ("test_salla_orders_sync_pagination_evidence", 21)):
                      executed = [row for row in cases if (row.attrib.get("classname", "").endswith(suite)
                          or (suite.count(".") == 0 and suite in row.attrib.get("classname", "").split(".")))]
                      assert len(executed) >= minimum, ("Missing local contracts", suite, len(executed))
              print(f"{name}: {len(cases)} executed cases; zero skips/failures/errors")
          PY
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-completion-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/review-completion.xml
            ${{ runner.temp }}/review-acceptance-guard.xml
            ${{ runner.temp }}/android-operations.xml
            ${{ runner.temp }}/source-snapshot.xml
            ${{ runner.temp }}/preparation-refresh-recovery.xml
          if-no-files-found: error
      - name: Remove this job's disposable fixture
        if: always()
        run: docker rm --force review-rs
