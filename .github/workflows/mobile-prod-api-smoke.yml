name: Mobile Production API Smoke

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - .github/workflows/mobile-prod-api-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production preparation routes without credentials
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"
            url="$2"
            code="$(curl --connect-timeout 10 --max-time 20 --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
            echo "$label=$code"
            if [ "$code" = "404" ]; then
              echo "MISSING:$label"
              return 44
            fi
            case "$code" in
              200|401|403|405|422) return 0 ;;
              *) echo "UNEXPECTED:$label:$code"; return 45 ;;
            esac
          }
          probe REGISTRY_EMPLOYEES 'https://mezansalla.com/api/preparation-file-registry-v1/employees'
          probe REVIEWED_BATCHES 'https://mezansalla.com/api/reviewed-preparation-batches-v1/batches'
          probe REGISTRY_FILES 'https://mezansalla.com/api/preparation-file-registry-v1/files'
          probe MOBILE_EMPLOYEES 'https://mezansalla.com/api/mobile-reviewed-preparation-v1/employees' || true
