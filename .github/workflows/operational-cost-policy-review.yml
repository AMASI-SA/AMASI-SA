name: Operational Cost Policy Review
on:
  push:
    branches: [fix/operational-cost-status-sar-20261101]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve tracked source for offline review
        run: git archive --format=tar.gz -o reviewed-source.tar.gz HEAD
      - name: Fetch isolated test client wheels
        run: python -m pip download --only-binary=:all: --dest review-wheels pymongo==4.18.2 motor==3.7.1
      - uses: actions/upload-artifact@v4
        with:
          name: operational-policy-source
          path: |
            reviewed-source.tar.gz
            review-wheels/
          retention-days: 3
          if-no-files-found: error
