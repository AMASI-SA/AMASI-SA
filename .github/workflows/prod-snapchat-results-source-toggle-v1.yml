name: Production Snapchat Results Source and Account Timezone V2

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/__init__.py"
      - "backend/integrations_control_center/snapchat_campaign_result_source_routes.py"
      - "backend/integrations_control_center/snapchat_salla_campaign_outcomes.py"
      - "backend/integrations_control_center/snapchat_account_timezone_manager.py"
      - "backend/integrations_control_center/snapchat_account_timezone_retention.py"
      - "backend/tests/test_snapchat_campaign_result_source_v1.py"
      - "backend/tests/test_snapchat_account_timezone_manager_v1.py"
      - "frontend/src/index.js"
      - "frontend/src/marketingAdsManagerWorkspaceEnhancer.js"
      - "frontend/src/marketingAdsManagerWorkspaceEnhancer.test.js"
      - "frontend/src/marketingCampaignResultSource.css"
      - "frontend/src/marketingCampaignResultSource.js"
      - "frontend/src/marketingCampaignResultSource.test.js"
      - "frontend/src/marketingSnapchatAccountTimezone.css"
      - "frontend/src/marketingSnapchatAccountTimezoneEnhancer.js"
      - "frontend/src/marketingSnapchatAccountTimezoneEnhancer.test.js"
      - ".github/workflows/prod-snapchat-results-source-toggle-v1.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          bcrypt
          PyJWT
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Compile Snapchat account-timezone routes
        run: >-
          python -m py_compile
          integrations_control_center/snapchat_campaign_result_source_routes.py
          integrations_control_center/snapchat_salla_campaign_outcomes.py
          integrations_control_center/snapchat_account_timezone_manager.py
          integrations_control_center/snapchat_account_timezone_retention.py
          integrations_control_center/__init__.py
          tests/test_snapchat_campaign_result_source_v1.py
          tests/test_snapchat_account_timezone_manager_v1.py
      - name: Run focused backend tests
        run: >-
          python -m pytest
          tests/test_snapchat_campaign_result_source_v1.py
          tests/test_snapchat_campaign_report_route_v1.py
          tests/test_snapchat_account_timezone_manager_v1.py
          tests/test_snapchat_account_hourly_refresh_v2.py
          -q --tb=short
      - name: Enforce account-local Ads Manager and Riyadh isolation
        working-directory: .
        run: |
          ROUTE=backend/integrations_control_center/snapchat_campaign_result_source_routes.py
          OUTCOMES=backend/integrations_control_center/snapchat_salla_campaign_outcomes.py
          LOCAL=backend/integrations_control_center/snapchat_account_timezone_manager.py
          RETENTION=backend/integrations_control_center/snapchat_account_timezone_retention.py
          INIT=backend/integrations_control_center/__init__.py
          grep -q 'RESULT_SOURCE_SALLA = "salla"' "$ROUTE"
          grep -q 'RESULT_SOURCE_PLATFORM = "platform"' "$ROUTE"
          grep -q 'campaign_rows_exact_match_only' "$OUTCOMES"
          grep -q 'SNAPCHAT_ACCOUNT_LOCAL_PERFORMANCE_COLLECTION' "$LOCAL"
          grep -q 'ACCOUNT_LOCAL_DAY' "$LOCAL"
          grep -q 'entity_type="campaign"' "$LOCAL"
          grep -q 'dashboard_accounting_timezone_unchanged' "$LOCAL"
          grep -q 'ACCOUNT_MANAGER_LOCAL_DAYS = 7' "$RETENTION"
          grep -q 'attach_snapchat_account_timezone_campaign_routes' "$INIT"
          grep -q 'install_snapchat_account_timezone_scheduler' "$INIT"
          grep -q 'install_snapchat_account_timezone_retention' "$INIT"
          grep -q 'mezan_snapchat_performance_daily_v2' backend/dashboard_v2_routes.py
          ! grep -Eq 'accounting_eligible": True|qoyod_write_reached": True|provider_write_reached": True' "$LOCAL"
          ! grep -Eq 'client\.(post|put|patch|delete)\(' "$LOCAL"

  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test result source, account timezone UI, and campaign table
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/marketingCampaignResultSource.test.js
          src/marketingSnapchatAccountTimezoneEnhancer.test.js
          src/marketingAdsManagerWorkspaceEnhancer.test.js
          src/components/marketing/CampaignManagerTable.test.jsx
          src/pages/MarketingPlatformWorkspace.test.jsx
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce selected-account native-day UI contract
        working-directory: .
        run: |
          TRANSPORT=frontend/src/marketingCampaignResultSource.js
          ACCOUNT_UI=frontend/src/marketingSnapchatAccountTimezoneEnhancer.js
          ACCOUNT_CSS=frontend/src/marketingSnapchatAccountTimezone.css
          ENHANCER=frontend/src/marketingAdsManagerWorkspaceEnhancer.js
          INDEX=frontend/src/index.js
          grep -q 'result_source: campaignResultsSource("snapchat")' "$TRANSPORT"
          grep -q 'params.account_id = selectedAccountId' "$TRANSPORT"
          grep -q 'delete params.from_date' "$TRANSPORT"
          grep -q 'delete params.to_date' "$TRANSPORT"
          grep -q 'كل حساب بواجهته وتاريخه وتوقيته الأصلي' "$ACCOUNT_UI"
          grep -q 'لوحة التحكم والمحاسبة تبقيان بتوقيت الرياض' "$ACCOUNT_UI"
          grep -q 'تفاصيل الحملات قيد الاستكمال' "$ACCOUNT_UI"
          grep -q 'data-mezan-snapchat-account-switcher' "$ACCOUNT_CSS"
          grep -q 'سلة — النتائج الفعلية' "$ENHANCER"
          grep -q 'الحساب الإعلاني' "$ENHANCER"
          grep -q 'marketingSnapchatAccountTimezone.css' "$INDEX"
          grep -q 'marketingSnapchatAccountTimezoneEnhancer' "$INDEX"
          ! grep -Eq '(api|axios)\.(post|put|patch|delete)\(' "$TRANSPORT" "$ACCOUNT_UI"
          ! grep -Eq 'fetch\(' "$TRANSPORT" "$ACCOUNT_UI"
