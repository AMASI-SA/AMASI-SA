name: Production Snapchat Results Source Toggle V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/__init__.py"
      - "backend/integrations_control_center/snapchat_campaign_result_source_routes.py"
      - "backend/tests/test_snapchat_campaign_result_source_v1.py"
      - "frontend/src/index.js"
      - "frontend/src/marketingAdsManagerWorkspaceEnhancer.js"
      - "frontend/src/marketingAdsManagerWorkspaceEnhancer.test.js"
      - "frontend/src/marketingCampaignResultSource.css"
      - "frontend/src/marketingCampaignResultSource.js"
      - "frontend/src/marketingCampaignResultSource.test.js"
      - ".github/workflows/prod-snapchat-results-source-toggle-v1.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          bcrypt
          PyJWT
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Compile result source route
        run: >-
          python -m py_compile
          integrations_control_center/snapchat_campaign_result_source_routes.py
          integrations_control_center/__init__.py
          tests/test_snapchat_campaign_result_source_v1.py
      - name: Run focused backend tests
        run: >-
          python -m pytest
          tests/test_snapchat_campaign_result_source_v1.py
          tests/test_snapchat_campaign_report_route_v1.py
          -q --tb=short
      - name: Enforce Salla/provider source isolation
        working-directory: .
        run: |
          ROUTE=backend/integrations_control_center/snapchat_campaign_result_source_routes.py
          INIT=backend/integrations_control_center/__init__.py
          grep -q 'RESULT_SOURCE_SALLA = "salla"' "$ROUTE"
          grep -q 'RESULT_SOURCE_PLATFORM = "platform"' "$ROUTE"
          grep -q 'unified_orders:salla_financially_included' "$ROUTE"
          grep -q 'snapchat_conversion_reporting' "$ROUTE"
          grep -q 'spend_native' "$ROUTE"
          grep -q 'display_currency' "$ROUTE"
          grep -q 'attach_snapchat_campaign_result_source_routes' "$INIT"
          grep -q 'attach_snapchat_campaign_report_routes = attach_snapchat_campaign_result_source_routes' "$INIT"
          ! grep -Eq 'update_one|insert_one|delete_one|replace_one|find_one_and_update' "$ROUTE"
          ! grep -Eq 'httpx|requests\.|api\.snapchat|Authorization' "$ROUTE"

  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test result source UI and campaign table
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/marketingCampaignResultSource.test.js
          src/marketingAdsManagerWorkspaceEnhancer.test.js
          src/components/marketing/CampaignManagerTable.test.jsx
          src/pages/MarketingPlatformWorkspace.test.jsx
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce result source UI contract
        working-directory: .
        run: |
          TRANSPORT=frontend/src/marketingCampaignResultSource.js
          ENHANCER=frontend/src/marketingAdsManagerWorkspaceEnhancer.js
          CSS=frontend/src/marketingCampaignResultSource.css
          INDEX=frontend/src/index.js
          grep -q 'result_source: campaignResultsSource("snapchat")' "$TRANSPORT"
          grep -q 'سلة — النتائج الفعلية' "$ENHANCER"
          grep -q 'الحساب الإعلاني' "$ENHANCER"
          grep -q 'campaign.cpa_native' "$ENHANCER"
          grep -q 'campaign.sales_native' "$ENHANCER"
          grep -q 'data-mezan-campaign-result-source' "$CSS"
          grep -q 'marketingCampaignResultSource.css' "$INDEX"
          ! grep -Eq '(api|axios)\.(post|put|patch|delete)\(' "$TRANSPORT"
          ! grep -Eq 'fetch\(' "$TRANSPORT"
