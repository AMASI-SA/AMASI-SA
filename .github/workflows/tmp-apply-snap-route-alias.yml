name: Temporary Apply Snapchat Campaign Route Alias

on:
  push:
    branches:
      - feat/prod-snapchat-results-source-toggle-v1
    paths:
      - ".github/workflows/tmp-apply-snap-route-alias.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prod-snapchat-results-source-toggle-v1
          fetch-depth: 0
      - name: Apply compatibility alias
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/integrations_control_center/__init__.py")
          text = path.read_text(encoding="utf-8")
          anchor = "from .snapchat_campaign_result_source_routes import (\n    attach_snapchat_campaign_result_source_routes,\n)\n"
          replacement = anchor + "\n# Backward-compatible symbol for the original read-only route contract.\nattach_snapchat_campaign_report_routes = attach_snapchat_campaign_result_source_routes\n"
          if "attach_snapchat_campaign_report_routes = attach_snapchat_campaign_result_source_routes" not in text:
              text = text.replace(anchor, replacement, 1)
          text = text.replace(
              "    attach_snapchat_campaign_result_source_routes(\n        router, db, current_user, _require_owner\n    )\n",
              "    attach_snapchat_campaign_report_routes(\n        router, db, current_user, _require_owner\n    )\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify alias
        run: |
          grep -q 'attach_snapchat_campaign_report_routes = attach_snapchat_campaign_result_source_routes' backend/integrations_control_center/__init__.py
          grep -q 'attach_snapchat_campaign_report_routes(' backend/integrations_control_center/__init__.py
      - name: Commit alias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/integrations_control_center/__init__.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(prod-snap): preserve campaign report route alias"
          git push origin HEAD:feat/prod-snapchat-results-source-toggle-v1
