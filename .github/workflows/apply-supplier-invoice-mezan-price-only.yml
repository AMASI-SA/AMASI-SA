name: Apply Supplier Invoice Mezan Price Only

on:
  push:
    branches:
      - fix/supplier-invoice-mezan-price-only
    paths:
      - ".github/workflows/apply-supplier-invoice-mezan-price-only.yml"
      - "scripts/apply_supplier_invoice_mezan_price_only.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-invoice-mezan-price-only
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply and compile Mezan-only pricing boundary
        run: |
          set -euo pipefail
          python scripts/apply_supplier_invoice_mezan_price_only.py
          python -m py_compile \
            backend/supplier_receiving_routes.py \
            backend/tests/test_supplier_receiving.py

      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "mezan"
          git config user.email "amasi.jewelery@gmail.com"
          git add \
            backend/supplier_receiving_routes.py \
            backend/tests/test_supplier_receiving.py
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix(receiving): price supplier products from Mezan only"
          git push origin HEAD:fix/supplier-invoice-mezan-price-only
