name: Apply Snapchat CAPI Safety Patch

on:
  push:
    branches:
      - feat/snapchat-capi-purchase-attribution
    paths:
      - ".github/workflows/_apply-snapchat-capi-safety-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snapchat-capi-purchase-attribution
          fetch-depth: 0

      - name: Patch CAPI safety and registration
        run: |
          python - <<'PY'
          from pathlib import Path

          capi_path = Path("backend/integrations_control_center/snapchat_capi_purchases.py")
          text = capi_path.read_text(encoding="utf-8")

          marker = '''def normalize_phone(value: Any, *, country: Any = None) -> str | None:\n'''
          helper = '''def _country_iso(value: Any) -> str:\n    text = str(value or "").strip().lower()\n    mapping = {\n        "sa": "sa", "sau": "sa", "saudi arabia": "sa",\n        "السعودية": "sa", "المملكة العربية السعودية": "sa",\n        "ye": "ye", "yem": "ye", "yemen": "ye", "اليمن": "ye",\n        "qa": "qa", "qat": "qa", "qatar": "qa", "قطر": "qa",\n        "ae": "ae", "are": "ae", "uae": "ae",\n        "united arab emirates": "ae", "الإمارات": "ae",\n    }\n    return mapping.get(text, text[:2] if len(text) == 2 and text.isascii() else "")\n\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit("normalize_phone marker missing")
              text = text.replace(marker, helper + marker, 1)

          old_country = '''    country = _normalise_hash_text(\n        address.get("country_code") or country_raw\n    )\n'''
          new_country = '''    country = _country_iso(address.get("country_code") or country_raw)\n'''
          if old_country in text:
              text = text.replace(old_country, new_country, 1)
          elif new_country not in text:
              raise SystemExit("country block missing")

          old_hash = '''    if country:\n        user_data["country"] = _sha256(country[:2] if len(country) == 2 else country)\n'''
          new_hash = '''    if country:\n        user_data["country"] = _sha256(country)\n'''
          if old_hash in text:
              text = text.replace(old_hash, new_hash, 1)
          elif new_hash not in text:
              raise SystemExit("country hash block missing")

          old_claim = '''async def _claim_event(db: Any, *, worker_id: str, now: datetime) -> dict[str, Any] | None:\n    return await _collection(db, OUTBOX_COLLECTION).find_one_and_update(\n        {\n            "status": {"$in": list(PENDING_STATUSES)},\n'''
          new_claim = '''async def _claim_event(\n    db: Any,\n    *,\n    user_id: str,\n    worker_id: str,\n    now: datetime,\n) -> dict[str, Any] | None:\n    return await _collection(db, OUTBOX_COLLECTION).find_one_and_update(\n        {\n            "user_id": str(user_id),\n            "status": {"$in": list(PENDING_STATUSES)},\n'''
          if old_claim in text:
              text = text.replace(old_claim, new_claim, 1)
          elif new_claim not in text:
              raise SystemExit("claim signature block missing")

          old_call = '''            event = await _claim_event(db, worker_id=worker_id, now=current)\n'''
          new_call = '''            event = await _claim_event(\n                db,\n                user_id=str(user_id),\n                worker_id=worker_id,\n                now=current,\n            )\n'''
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit("claim call missing")

          capi_path.write_text(text, encoding="utf-8")

          init_path = Path("backend/integrations_control_center/__init__.py")
          init = init_path.read_text(encoding="utf-8")
          import_marker = '''from .snapchat_catalog_native import install_snapchat_native_catalog\n'''
          import_line = '''from .snapchat_capi_purchases import attach_snapchat_capi_purchase_routes\n'''
          if import_line not in init:
              if import_marker not in init:
                  raise SystemExit("init import marker missing")
              init = init.replace(import_marker, import_line + import_marker, 1)

          attach_marker = '''    attach_snapchat_dashboard_summary_routes(router, db, current_user, _require_owner)\n'''
          attach_line = '''    attach_snapchat_capi_purchase_routes(router, db, current_user, _require_owner)\n'''
          if attach_line not in init:
              if attach_marker not in init:
                  raise SystemExit("init attach marker missing")
              init = init.replace(attach_marker, attach_marker + attach_line, 1)

          init_path.write_text(init, encoding="utf-8")
          PY

      - name: Verify patched modules
        run: |
          python -m py_compile \
            backend/integrations_control_center/snapchat_capi_purchases.py \
            backend/integrations_control_center/__init__.py \
            backend/salla_integration/webhook_event_capture.py
          grep -q '"user_id": str(user_id)' backend/integrations_control_center/snapchat_capi_purchases.py
          grep -q 'attach_snapchat_capi_purchase_routes' backend/integrations_control_center/__init__.py

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-snapchat-capi-safety-patch.yml
          git add backend/integrations_control_center/snapchat_capi_purchases.py \
                  backend/integrations_control_center/__init__.py
          git commit -m "fix(snapchat): harden CAPI isolation and register worker"
          git push origin HEAD:feat/snapchat-capi-purchase-attribution
