name: Preparation PDF Media Text Gap V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/preparation_pdf_wrapped_text.py"
      - "backend/preparation_pdf_compact_operational_layout.py"
      - "backend/tests/test_preparation_pdf_media_text_gap.py"
      - ".github/workflows/preparation-pdf-media-text-gap-v1.yml"

permissions:
  contents: read

jobs:
  preparation-pdf-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused PDF dependencies
        run: >-
          python -m pip install -q
          pytest PyMuPDF qrcode pillow reportlab httpx
          arabic-reshaper python-bidi
      - name: Compile changed renderer and test
        run: >-
          python -m py_compile
          preparation_pdf_wrapped_text.py
          preparation_pdf_compact_operational_layout.py
          tests/test_preparation_pdf_media_text_gap.py
      - name: Run media and text geometry tests
        run: >-
          python -m pytest -q --tb=short
          tests/test_preparation_pdf_media_text_gap.py
      - name: Enforce final renderer contract
        working-directory: .
        run: |
          COMPACT=backend/preparation_pdf_compact_operational_layout.py
          WRAPPED=backend/preparation_pdf_wrapped_text.py
          grep -q 'MEDIA_TO_DETAILS_GAP = 4.0 \* mm' "$COMPACT"
          grep -q 'detail_top = compact_detail_top(media_y)' "$COMPACT"
          ! grep -q 'detail_top = media_y - 3.2' "$COMPACT"
          grep -q 'MEDIA_TO_TEXT_GAP = 4.0 \* mm' "$WRAPPED"
