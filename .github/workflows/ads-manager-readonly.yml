name: Unified Ads Manager Read Only

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/ad_spend_reporting.py"
      - "backend/ads_manager/__init__.py"
      - "backend/ads_manager/models.py"
      - "backend/ads_manager/routes.py"
      - "backend/ads_manager/service.py"
      - "backend/ads_v2/models.py"
      - "backend/ads_v2/sync/adapters.py"
      - "backend/ads_v2/sync/core.py"
      - "backend/snapchat_routes.py"
      - "backend/tests/test_snapchat_conversion_quality.py"
      - "backend/tests/test_unified_ads_manager_phase1.py"
      - "backend/server.py"
      - "frontend/src/pages/AdsManager.jsx"
      - "frontend/src/pages/AdsManager.test.jsx"
      - "frontend/src/services/adsManager.js"
      - "frontend/src/services/adsManager.test.js"
      - "frontend/src/App.js"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/components/Sidebar.jsx"
      - "docs/UNIFIED_ADS_MANAGER_READ_ONLY_PHASE1.md"
      - ".github/workflows/ads-manager-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-and-safety-guard:
    name: Strict scope and AST safety guard
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify Ads Manager-owned changes
        id: classify
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          run_full=false
          shared_changed=false

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            run_full=true
          else
            git fetch --no-tags origin main
            comparison_base="${PULL_REQUEST_BASE_SHA:-origin/main}"
            changed_paths_file="${RUNNER_TEMP}/ads-manager-classified-paths.txt"

            git diff --name-only --no-renames --diff-filter=ACDMRT \
              "${comparison_base}...HEAD" > "${changed_paths_file}"

            while IFS= read -r changed_path; do
              [[ -z "${changed_path}" ]] && continue
              case "${changed_path}" in
                backend/ad_spend_reporting.py|\
                backend/ads_manager/__init__.py|\
                backend/ads_manager/models.py|\
                backend/ads_manager/routes.py|\
                backend/ads_manager/service.py|\
                backend/ads_v2/models.py|\
                backend/ads_v2/sync/adapters.py|\
                backend/ads_v2/sync/core.py|\
                backend/snapchat_routes.py|\
                backend/tests/test_snapchat_conversion_quality.py|\
                backend/tests/test_unified_ads_manager_phase1.py|\
                frontend/src/pages/AdsManager.jsx|\
                frontend/src/pages/AdsManager.test.jsx|\
                frontend/src/services/adsManager.js|\
                frontend/src/services/adsManager.test.js|\
                docs/UNIFIED_ADS_MANAGER_READ_ONLY_PHASE1.md|\
                .github/workflows/ads-manager-readonly.yml)
                  run_full=true
                  ;;
                backend/server.py|\
                frontend/src/App.js|\
                frontend/src/components/Layout.jsx|\
                frontend/src/components/Sidebar.jsx)
                  shared_changed=true
                  ;;
              esac
            done < "${changed_paths_file}"
          fi

          {
            echo "run_full=${run_full}"
            echo "shared_changed=${shared_changed}"
          } >> "${GITHUB_OUTPUT}"

          echo "Ads-owned changes: ${run_full}"
          echo "Shared wiring changes: ${shared_changed}"

      - name: Verify persistent Ads Manager shared wiring
        if: >-
          steps.classify.outputs.run_full == 'true' ||
          steps.classify.outputs.shared_changed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import re

          errors = []

          def read(path):
              return pathlib.Path(path).read_text(encoding="utf-8")

          def require_count(source, needle, expected, label):
              actual = source.count(needle)
              if actual != expected:
                  errors.append(
                      f"{label}: expected {expected}, found {actual}"
                  )

          server_path = pathlib.Path("backend/server.py")
          server_source = read(server_path)
          server_tree = ast.parse(server_source, filename=str(server_path))
          ads_imports = [
              node
              for node in ast.walk(server_tree)
              if isinstance(node, ast.ImportFrom)
              and node.module == "ads_manager"
              and any(
                  alias.name == "make_ads_manager_router"
                  for alias in node.names
              )
          ]
          if len(ads_imports) != 1:
              errors.append(
                  "backend/server.py: expected one Ads Manager router import"
              )

          include_calls = []
          router_calls = []
          for node in ast.walk(server_tree):
              if not isinstance(node, ast.Call):
                  continue
              if (
                  isinstance(node.func, ast.Name)
                  and node.func.id == "make_ads_manager_router"
              ):
                  router_calls.append(node)
              if (
                  isinstance(node.func, ast.Attribute)
                  and node.func.attr == "include_router"
                  and node.args
                  and isinstance(node.args[0], ast.Call)
                  and isinstance(node.args[0].func, ast.Name)
                  and node.args[0].func.id == "make_ads_manager_router"
              ):
                  include_calls.append(node)

          if len(router_calls) != 1:
              errors.append(
                  "backend/server.py: expected one Ads Manager router call"
              )
          elif [
              getattr(argument, "id", None)
              for argument in router_calls[0].args
          ] != ["db", "current_user"]:
              errors.append(
                  "backend/server.py: Ads Manager router arguments changed"
              )
          if len(include_calls) != 1:
              errors.append(
                  "backend/server.py: expected one Ads Manager include_router"
              )

          app_source = read("frontend/src/App.js")
          require_count(
              app_source,
              'import AdsManager from "./pages/AdsManager";',
              1,
              "frontend/src/App.js AdsManager import",
          )
          require_count(
              app_source,
              'path="/ads-manager"',
              1,
              "frontend/src/App.js Ads Manager route",
          )
          route_pattern = re.compile(
              r"""
              <Route\s+
              path="/ads-manager"\s+
              element=\{\s*
                <ProtectedRoute>\s*
                  <OwnerOnlyRoute>\s*
                    <Layout>\s*<AdsManager\s*/>\s*</Layout>\s*
                  </OwnerOnlyRoute>\s*
                </ProtectedRoute>\s*
              \}\s*
              />
              """,
              re.DOTALL | re.VERBOSE,
          )
          if len(route_pattern.findall(app_source)) != 1:
              errors.append(
                  "frontend/src/App.js: Ads Manager route must remain "
                  "ProtectedRoute + OwnerOnlyRoute"
              )

          layout_source = read("frontend/src/components/Layout.jsx")
          require_count(
              layout_source,
              '{ to: "/ads-manager", label: "مدير الإعلانات", '
              "Icon: ChartLineUp },",
              1,
              "frontend/src/components/Layout.jsx Ads Manager link",
          )
          is_v2_pattern = re.compile(
              r"const\s+isV2\s*=\s*\[[^\]]*"
              r'"/ads-manager"[^\]]*\]\.some\(',
              re.DOTALL,
          )
          if len(is_v2_pattern.findall(layout_source)) != 1:
              errors.append(
                  "frontend/src/components/Layout.jsx: Ads Manager must "
                  "remain in Mezan V2 routing"
              )

          sidebar_source = read("frontend/src/components/Sidebar.jsx")
          require_count(
              sidebar_source,
              'testid: "nav-mezan-os-ads-manager"',
              1,
              "frontend/src/components/Sidebar.jsx Ads Manager test id",
          )
          sidebar_pattern = re.compile(
              r"""
              \{\s*
                to:\s*"/ads-manager",\s*
                label:\s*"مدير\s+الإعلانات",\s*
                icon:\s*ChartLineUp,\s*
                testid:\s*"nav-mezan-os-ads-manager",\s*
              \}
              """,
              re.DOTALL | re.VERBOSE,
          )
          if len(sidebar_pattern.findall(sidebar_source)) != 1:
              errors.append(
                  "frontend/src/components/Sidebar.jsx: Ads Manager "
                  "navigation contract changed"
              )

          if errors:
              raise SystemExit("\n".join(errors))

          print("Persistent Ads Manager shared wiring passed.")
          PY

      - name: Reject every path outside the approved Phase 1 surface
        if: steps.classify.outputs.run_full == 'true'
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          comparison_base="${PULL_REQUEST_BASE_SHA:-origin/main}"
          changed_paths_file="${RUNNER_TEMP}/ads-manager-changed-paths.txt"
          rejected_paths_file="${RUNNER_TEMP}/ads-manager-rejected-paths.txt"

          git diff --name-only --diff-filter=ACDMRT \
            "${comparison_base}...HEAD" > "${changed_paths_file}"

          while IFS= read -r changed_path; do
            [[ -z "${changed_path}" ]] && continue
            case "${changed_path}" in
              backend/ad_spend_reporting.py|\
              backend/ads_manager/__init__.py|\
              backend/ads_manager/models.py|\
              backend/ads_manager/routes.py|\
              backend/ads_manager/service.py|\
              backend/ads_v2/models.py|\
              backend/ads_v2/sync/adapters.py|\
              backend/ads_v2/sync/core.py|\
              backend/snapchat_routes.py|\
              backend/tests/test_snapchat_conversion_quality.py|\
              backend/tests/test_unified_ads_manager_phase1.py|\
              backend/server.py|\
              frontend/src/pages/AdsManager.jsx|\
              frontend/src/pages/AdsManager.test.jsx|\
              frontend/src/services/adsManager.js|\
              frontend/src/services/adsManager.test.js|\
              frontend/src/App.js|\
              frontend/src/components/Layout.jsx|\
              frontend/src/components/Sidebar.jsx|\
              docs/UNIFIED_ADS_MANAGER_READ_ONLY_PHASE1.md|\
              .github/workflows/ads-manager-readonly.yml)
                ;;
              *)
                printf '%s\n' "${changed_path}" >> "${rejected_paths_file}"
                ;;
            esac
          done < "${changed_paths_file}"

          if [[ -s "${rejected_paths_file}" ]]; then
            echo "::error::The branch exceeds the approved read-only Ads Manager scope."
            sed 's/^/ - /' "${rejected_paths_file}"
            exit 1
          fi

          echo "Strict Phase 1 path allowlist passed."

      - name: Permit only the isolated router wiring in server.py
        if: steps.classify.outputs.run_full == 'true'
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          comparison_base="${PULL_REQUEST_BASE_SHA:-origin/main}"
          COMPARISON_BASE="${comparison_base}" python - <<'PY'
          import os
          import subprocess

          allowed_additions = {
              "",
              "# ── Unified Ads Manager Phase 1 (owner-only, local reads only) ──────",
              "from ads_manager import make_ads_manager_router",
              "api.include_router(make_ads_manager_router(db, current_user))",
          }
          diff = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--unified=0",
                  f"{os.environ['COMPARISON_BASE']}...HEAD",
                  "--",
                  "backend/server.py",
              ],
              text=True,
          )
          errors = []
          for line in diff.splitlines():
              if line.startswith(("---", "+++", "@@")):
                  continue
              if line.startswith("-"):
                  errors.append(f"server.py deletion is forbidden: {line}")
              elif line.startswith("+") and line[1:] not in allowed_additions:
                  errors.append(f"unexpected server.py addition: {line}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("server.py wiring guard passed.")
          PY

      - name: Permit only the reviewed frontend route and navigation wiring
        if: steps.classify.outputs.run_full == 'true'
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          comparison_base="${PULL_REQUEST_BASE_SHA:-origin/main}"
          COMPARISON_BASE="${comparison_base}" python - <<'PY'
          from collections import Counter
          import os
          import subprocess

          expected = {
              "frontend/src/App.js": {
                  "additions": [
                      'import AdsManager from "./pages/AdsManager";',
                      "            <Route",
                      '                path="/ads-manager"',
                      "                element={",
                      "                    <ProtectedRoute>",
                      "                        <OwnerOnlyRoute>",
                      "                            <Layout><AdsManager /></Layout>",
                      "                        </OwnerOnlyRoute>",
                      "                    </ProtectedRoute>",
                      "                }",
                      "            />",
                  ],
                  "deletions": [],
              },
              "frontend/src/components/Layout.jsx": {
                  "additions": [
                      'import { List, MagnifyingGlass, Package, Cube, Warehouse, Plug, Robot, UsersThree, ChartLineUp } from "@phosphor-icons/react";',
                      '    { to: "/ads-manager", label: "مدير الإعلانات", Icon: ChartLineUp },',
                      '    const isV2 = ["/orders-v2", "/products-v2", "/components-v2", "/integrations-v2", "/ads-manager"].some((prefix) => location.pathname.startsWith(prefix));',
                  ],
                  "deletions": [
                      'import { List, MagnifyingGlass, Package, Cube, Warehouse, Plug, Robot, UsersThree } from "@phosphor-icons/react";',
                      '    const isV2 = ["/orders-v2", "/products-v2", "/components-v2", "/integrations-v2"].some((prefix) => location.pathname.startsWith(prefix));',
                  ],
              },
              "frontend/src/components/Sidebar.jsx": {
                  "additions": [
                      "            {",
                      '                to: "/ads-manager",',
                      '                label: "مدير الإعلانات",',
                      "                icon: ChartLineUp,",
                      '                testid: "nav-mezan-os-ads-manager",',
                      "            },",
                  ],
                  "deletions": [],
              },
          }

          errors = []
          for path, contract in expected.items():
              diff = subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--unified=0",
                      f"{os.environ['COMPARISON_BASE']}...HEAD",
                      "--",
                      path,
                  ],
                  text=True,
              )
              additions = []
              deletions = []
              for line in diff.splitlines():
                  if line.startswith(("---", "+++", "@@")):
                      continue
                  if line.startswith("+"):
                      additions.append(line[1:])
                  elif line.startswith("-"):
                      deletions.append(line[1:])
              if not additions and not deletions:
                  continue
              if Counter(additions) != Counter(contract["additions"]):
                  errors.append(
                      f"{path} additions differ from the reviewed wiring contract"
                  )
              if Counter(deletions) != Counter(contract["deletions"]):
                  errors.append(
                      f"{path} deletions differ from the reviewed wiring contract"
                  )

          if errors:
              raise SystemExit("\n".join(errors))
          print("Frontend wiring guard passed.")
          PY

      - name: Constrain operational source-quality changes by AST delta
        if: steps.classify.outputs.run_full == 'true'
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          comparison_base="${PULL_REQUEST_BASE_SHA:-origin/main}"
          COMPARISON_BASE="${comparison_base}" python - <<'PY'
          import ast
          from collections import Counter
          import os
          import pathlib
          import subprocess

          paths = [
              "backend/snapchat_routes.py",
              "backend/ads_v2/models.py",
              "backend/ads_v2/sync/adapters.py",
              "backend/ads_v2/sync/core.py",
          ]
          approved_new_functions = {
              "backend/snapchat_routes.py": {
                  "_parse_snap_conversion_payload",
                  "_fetch_snap_conversion_metrics",
                  "_aggregate_snap_conversion_rows",
                  "_legacy_metric_is_known",
              },
          }
          approved_new_function_network = {
              (
                  "backend/snapchat_routes.py",
                  "_fetch_snap_conversion_metrics",
              ): Counter({"http.get": 1}),
          }
          write_methods = {
              "create_collection",
              "insert_one",
              "insert_many",
              "update_one",
              "update_many",
              "delete_one",
              "delete_many",
              "replace_one",
              "find_one_and_update",
              "find_one_and_delete",
              "find_one_and_replace",
              "bulk_write",
              "create_index",
              "drop_index",
              "drop_indexes",
              "drop",
              "drop_collection",
              "rename",
          }
          route_methods = {
              "get",
              "post",
              "put",
              "patch",
              "delete",
              "api_route",
              "route",
              "websocket",
          }
          network_methods = {
              "get",
              "post",
              "put",
              "patch",
              "delete",
              "request",
              "send",
          }
          network_roots = {
              "aiohttp",
              "client",
              "http",
              "httpx",
              "requests",
              "session",
          }
          network_constructors = {
              "aiohttp.ClientSession",
              "httpx.AsyncClient",
          }

          def dotted_name(node):
              parts = []
              while isinstance(node, ast.Attribute):
                  parts.append(node.attr)
                  node = node.value
              if isinstance(node, ast.Name):
                  parts.append(node.id)
              return ".".join(reversed(parts))

          def snapshot(source, path):
              tree = ast.parse(source, filename=path)
              functions = set()
              classes = set()
              imports = set()
              routes = []
              write_references = Counter()
              network_references = Counter()
              network_constructor_calls = Counter()
              network_aliases = set()
              urls = set()
              dynamic_forbidden = 0
              function_effects = {}
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      functions.add(node.name)
                      function_writes = Counter()
                      function_network = Counter()
                      for child in ast.walk(node):
                          if not isinstance(child, ast.Attribute):
                              continue
                          child_name = dotted_name(child)
                          child_method = child_name.rsplit(".", 1)[-1]
                          child_root = child_name.split(".", 1)[0]
                          if child_method in write_methods:
                              function_writes[child_name] += 1
                          if (
                              child_method in network_methods
                              and child_root in network_roots
                          ):
                              function_network[child_name] += 1
                      function_effects[node.name] = {
                          "writes": function_writes,
                          "network": function_network,
                      }
                      for decorator in node.decorator_list:
                          if not isinstance(decorator, ast.Call):
                              continue
                          name = dotted_name(decorator.func)
                          if name.rsplit(".", 1)[-1] in route_methods:
                              routes.append(ast.dump(
                                  decorator,
                                  include_attributes=False,
                              ))
                  elif isinstance(node, ast.ClassDef):
                      classes.add(node.name)
                  elif isinstance(node, ast.Import):
                      imports.update(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imports.add(node.module or "")
                  elif isinstance(node, ast.Attribute):
                      name = dotted_name(node)
                      method = name.rsplit(".", 1)[-1]
                      root = name.split(".", 1)[0]
                      if method in write_methods:
                          write_references[name] += 1
                      if method in network_methods and root in network_roots:
                          network_references[name] += 1
                  elif isinstance(node, (ast.Assign, ast.AnnAssign, ast.NamedExpr)):
                      value = getattr(node, "value", None)
                      value_name = dotted_name(
                          value.func if isinstance(value, ast.Call) else value
                      )
                      value_root = value_name.split(".", 1)[0]
                      if (
                          value_name in network_constructors
                          or value_root in network_roots
                      ):
                          network_aliases.add(ast.dump(
                              node,
                              include_attributes=False,
                          ))
                  elif isinstance(node, ast.Call):
                      call_name = dotted_name(node.func)
                      if call_name in network_constructors:
                          network_constructor_calls[call_name] += 1
                      if (
                          call_name == "getattr"
                          or call_name.endswith(".__getattribute__")
                      ) and len(node.args) >= (
                          2 if call_name == "getattr" else 1
                      ):
                          method_arg = (
                              node.args[1]
                              if call_name == "getattr"
                              else node.args[0]
                          )
                          try:
                              method = ast.literal_eval(method_arg)
                          except Exception:
                              method = None
                          if method in write_methods or method in network_methods:
                              dynamic_forbidden += 1
                  elif isinstance(node, ast.Constant):
                      if isinstance(node.value, str) and (
                          "http://" in node.value or "https://" in node.value
                      ):
                          urls.add(node.value)
              return {
                  "functions": functions,
                  "classes": classes,
                  "imports": imports,
                  "routes": sorted(routes),
                  "write_references": write_references,
                  "network_references": network_references,
                  "network_constructor_calls": network_constructor_calls,
                  "network_aliases": network_aliases,
                  "urls": urls,
                  "dynamic_forbidden": dynamic_forbidden,
                  "function_effects": function_effects,
              }

          base = os.environ["COMPARISON_BASE"]
          errors = []
          guard_self_test = snapshot(
              """
          async def unsafe(db):
              transport = httpx.AsyncClient()
              await transport.get("relative-path")
              mutate = db.rows.__getattribute__("update_one")
              await mutate({}, {"$set": {"x": 1}})
          """,
              "self-test:operational-aliases",
          )
          if not guard_self_test["network_constructor_calls"]:
              errors.append("operational guard missed a network constructor")
          if not guard_self_test["network_aliases"]:
              errors.append("operational guard missed a network alias")
          if not guard_self_test["dynamic_forbidden"]:
              errors.append("operational guard missed __getattribute__ mutation")

          for path in paths:
              baseline_source = subprocess.check_output(
                  ["git", "show", f"{base}:{path}"],
                  text=True,
              )
              current_source = pathlib.Path(path).read_text(encoding="utf-8")
              baseline = snapshot(baseline_source, f"{base}:{path}")
              current = snapshot(current_source, path)

              if current["routes"] != baseline["routes"]:
                  errors.append(f"{path}: route declarations changed")
              if not current["imports"].issubset(baseline["imports"]):
                  errors.append(
                      f"{path}: new imports are forbidden: "
                      f"{sorted(current['imports'] - baseline['imports'])}"
                  )
              if not current["urls"].issubset(baseline["urls"]):
                  errors.append(f"{path}: new network URL literal is forbidden")
              if current["classes"] - baseline["classes"]:
                  errors.append(f"{path}: new production class is forbidden")
              new_functions = current["functions"] - baseline["functions"]
              unexpected_functions = (
                  new_functions - approved_new_functions.get(path, set())
              )
              if unexpected_functions:
                  errors.append(
                      f"{path}: unexpected production functions: "
                      f"{sorted(unexpected_functions)}"
                  )
              for function_name in new_functions:
                  effects = current["function_effects"][function_name]
                  expected_network = approved_new_function_network.get(
                      (path, function_name),
                      Counter(),
                  )
                  if effects["writes"]:
                      errors.append(
                          f"{path}:{function_name}: new helper may not write"
                      )
                  if effects["network"] != expected_network:
                      errors.append(
                          f"{path}:{function_name}: unexpected network surface "
                          f"{dict(effects['network'])}"
                      )
              for reference, count in current["write_references"].items():
                  if count > baseline["write_references"][reference]:
                      errors.append(
                          f"{path}: new write reference is forbidden: {reference}"
                      )
              for reference, count in current["network_references"].items():
                  if count > baseline["network_references"][reference]:
                      errors.append(
                          f"{path}: new network reference is forbidden: "
                          f"{reference}"
                      )
              if (
                  path == "backend/snapchat_routes.py"
                  and "_fetch_snap_conversion_metrics" in new_functions
                  and current["network_references"]["http.get"]
                  != baseline["network_references"]["http.get"] - 1
              ):
                  errors.append(
                      f"{path}: reviewed http.get relocation changed"
                  )
              for constructor, count in (
                  current["network_constructor_calls"].items()
              ):
                  if (
                      count
                      > baseline["network_constructor_calls"][constructor]
                  ):
                      errors.append(
                          f"{path}: new network client is forbidden: "
                          f"{constructor}"
                      )
              if not current["network_aliases"].issubset(
                  baseline["network_aliases"]
              ):
                  errors.append(f"{path}: new network alias is forbidden")
              if (
                  current["dynamic_forbidden"]
                  > baseline["dynamic_forbidden"]
              ):
                  errors.append(
                      f"{path}: dynamic write/network lookup is forbidden"
                  )

          if errors:
              raise SystemExit("\n".join(errors))
          print("Operational source-quality AST delta guard passed.")
          PY

      - name: Reject writes, provider networking, and non-GET routes by AST
        if: steps.classify.outputs.run_full == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          files = [pathlib.Path("backend/ad_spend_reporting.py")]
          files.extend(sorted(pathlib.Path("backend/ads_manager").rglob("*.py")))
          files = [path for path in files if path.exists()]

          write_methods = {
              "create_collection",
              "insert_one",
              "insert_many",
              "update_one",
              "update_many",
              "delete_one",
              "delete_many",
              "replace_one",
              "find_one_and_update",
              "find_one_and_delete",
              "find_one_and_replace",
              "bulk_write",
              "create_index",
              "drop_index",
              "drop_indexes",
              "drop",
              "drop_collection",
              "rename",
          }
          forbidden_route_methods = {
              "post",
              "put",
              "patch",
              "delete",
              "options",
              "head",
              "trace",
              "websocket",
              "route",
          }
          network_roots = {
              "aiohttp",
              "facebook_business",
              "googleads",
              "googleapiclient",
              "http",
              "httpx",
              "requests",
              "socket",
              "urllib",
              "urllib3",
          }
          provider_module_prefixes = (
              "ads_v2.relink",
              "ads_v2.sync",
              "google.ads",
              "google.oauth2",
              "meta_routes",
              "salla_integration",
              "snapchat_routes",
          )
          network_calls = {
              "open_connection",
              "request",
              "urlopen",
              "create_connection",
          }
          errors = []

          def dotted_name(node):
              parts = []
              while isinstance(node, ast.Attribute):
                  parts.append(node.attr)
                  node = node.value
              if isinstance(node, ast.Name):
                  parts.append(node.id)
              return ".".join(reversed(parts))

          class SafetyVisitor(ast.NodeVisitor):
              def __init__(self, path, findings):
                  self.path = path
                  self.findings = findings
                  self.aliases = {}

              def fail(self, node, message):
                  self.findings.append(f"{self.path}:{node.lineno}: {message}")

              def forbidden_reference(self, name):
                  resolved = self.aliases.get(name, name)
                  method = resolved.rsplit(".", 1)[-1]
                  if method in write_methods:
                      return f"database mutation alias is forbidden: {resolved}"
                  if method in forbidden_route_methods:
                      return f"non-GET route/call alias is forbidden: {resolved}"
                  if method in network_calls:
                      return f"provider/network alias is forbidden: {resolved}"
                  return None

              def bind_alias(self, target, value):
                  if not isinstance(target, ast.Name):
                      return
                  reference = dotted_name(value)
                  if not reference:
                      return
                  resolved = self.aliases.get(reference, reference)
                  if self.forbidden_reference(resolved):
                      self.aliases[target.id] = resolved

              def visit_Assign(self, node):
                  for target in node.targets:
                      self.bind_alias(target, node.value)
                  self.generic_visit(node)

              def visit_AnnAssign(self, node):
                  if node.value is not None:
                      self.bind_alias(node.target, node.value)
                  self.generic_visit(node)

              def visit_NamedExpr(self, node):
                  self.bind_alias(node.target, node.value)
                  self.generic_visit(node)

              def check_import(self, node, module):
                  root = module.split(".", 1)[0]
                  if root in network_roots:
                      self.fail(node, f"network client import is forbidden: {module}")
                  if module.startswith(provider_module_prefixes):
                      self.fail(node, f"provider operational import is forbidden: {module}")

              def visit_Import(self, node):
                  for alias in node.names:
                      self.check_import(node, alias.name)
                  self.generic_visit(node)

              def visit_ImportFrom(self, node):
                  self.check_import(node, node.module or "")
                  self.generic_visit(node)

              def visit_Call(self, node):
                  call_name = dotted_name(node.func)
                  alias_error = self.forbidden_reference(call_name)
                  if call_name in self.aliases and alias_error:
                      self.fail(node, alias_error)
                  method = call_name.rsplit(".", 1)[-1]
                  if method in write_methods:
                      self.fail(node, f"database mutation is forbidden: {call_name}")
                  if method in forbidden_route_methods:
                      self.fail(node, f"non-GET route/call is forbidden: {call_name}")
                  if method in network_calls:
                      self.fail(node, f"provider/network call is forbidden: {call_name}")
                  if (
                      call_name == "getattr"
                      or call_name.endswith(".__getattribute__")
                  ) and len(node.args) >= (2 if call_name == "getattr" else 1):
                      method_arg = (
                          node.args[1]
                          if call_name == "getattr"
                          else node.args[0]
                      )
                      try:
                          dynamic_method = ast.literal_eval(method_arg)
                      except Exception:
                          dynamic_method = None
                      if isinstance(dynamic_method, str) and (
                          dynamic_method in write_methods
                          or dynamic_method in forbidden_route_methods
                          or dynamic_method in network_calls
                      ):
                          self.fail(
                              node,
                              f"dynamic forbidden method lookup: {dynamic_method}",
                          )
                  if method in {"api_route", "add_api_route"}:
                      methods_keyword = next(
                          (
                              keyword.value
                              for keyword in node.keywords
                              if keyword.arg == "methods"
                          ),
                          None,
                      )
                      if methods_keyword is None:
                          self.fail(node, f"{method} must declare methods=['GET']")
                      else:
                          try:
                              methods = ast.literal_eval(methods_keyword)
                          except Exception:
                              self.fail(node, f"{method} methods must be a literal ['GET']")
                          else:
                              normalized = {
                                  str(value).upper() for value in methods
                              }
                              if normalized != {"GET"}:
                                  self.fail(
                                      node,
                                      f"{method} permits non-GET methods: {sorted(normalized)}",
                                  )
                  self.generic_visit(node)

              def visit_Constant(self, node):
                  if node.value in {"$merge", "$out"}:
                      self.fail(node, f"write-capable aggregation stage is forbidden: {node.value}")
                  if isinstance(node.value, str) and (
                      "http://" in node.value or "https://" in node.value
                  ):
                      self.fail(node, "provider/network URL literal is forbidden")

          negative_cases = {
              "write-alias": (
                  "async def f(collection):\n"
                  "    mutate = collection.update_one\n"
                  "    await mutate({}, {})\n"
              ),
              "dynamic-write": (
                  "async def f(collection):\n"
                  "    mutate = getattr(collection, 'update_one')\n"
                  "    await mutate({}, {})\n"
              ),
              "dunder-dynamic-write": (
                  "async def f(collection):\n"
                  "    mutate = collection.__getattribute__('update_one')\n"
                  "    await mutate({}, {})\n"
              ),
              "network-alias": (
                  "async def f(client):\n"
                  "    send = client.request\n"
                  "    await send('GET', '/x')\n"
              ),
          }
          for label, source in negative_cases.items():
              findings = []
              SafetyVisitor(f"self-test:{label}", findings).visit(
                  ast.parse(source)
              )
              if not findings:
                  errors.append(f"guard self-test failed to reject {label}")

          for path in files:
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError as exc:
                  errors.append(f"{path}:{exc.lineno}: syntax error: {exc.msg}")
                  continue
              SafetyVisitor(path, errors).visit(tree)

          if errors:
              print("Read-only AST guard failed:", file=sys.stderr)
              for error in errors:
                  print(f" - {error}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Read-only AST guard passed for {len(files)} production files.")
          PY

  backend-tests:
    name: Hermetic backend safety tests
    needs: scope-and-safety-guard
    if: needs.scope-and-safety-guard.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install isolated test dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          httpx==0.28.1
          pydantic==2.13.4
          pytest==9.0.3
          pytest-asyncio
          openpyxl==3.1.5
      - name: Compile the read-only and source-quality surfaces
        run: |
          python -m compileall -q \
            ad_spend_reporting.py \
            ads_manager \
            ads_v2/models.py \
            ads_v2/sync/adapters.py \
            ads_v2/sync/core.py \
            snapchat_routes.py \
            tests/test_snapchat_conversion_quality.py \
            tests/test_unified_ads_manager_phase1.py
          python -m py_compile server.py
      - name: Run Ads Manager, source-quality, and integration regressions
        run: >-
          python -m pytest
          tests/test_snapchat_conversion_quality.py
          tests/test_unified_ads_manager_phase1.py
          tests/test_mezan_integrations_v2.py
          -q
          --tb=short

  frontend-tests:
    name: Frontend tests and production build
    needs: scope-and-safety-guard
    if: needs.scope-and-safety-guard.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Run the Ads Manager frontend tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ads_manager_tests < <(
            find src -type f \
              \( -iname '*adsmanager*.test.js' \
              -o -iname '*adsmanager*.test.jsx' \) \
              | sort
          )
          if [[ "${#ads_manager_tests[@]}" -eq 0 ]]; then
            echo "::error::No Ads Manager frontend test files were found."
            exit 1
          fi
          CI=true yarn test \
            --watchAll=false \
            --runInBand \
            "${ads_manager_tests[@]}" \
            src/services/integrationsV2.test.js \
            src/components/integrationsV2/IntegrationCard.test.jsx
      - name: Reject frontend write and network escape hatches by AST
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require("fs");
          const parser = require("@babel/parser");

          const files = [
              "src/pages/AdsManager.jsx",
              "src/services/adsManager.js",
          ];
          const forbiddenConstructors = new Set([
              "EventSource",
              "Image",
              "WebSocket",
              "XMLHttpRequest",
          ]);

          function dottedName(node) {
              if (!node) return "";
              if (node.type === "Identifier") return node.name;
              if (
                  node.type === "MemberExpression"
                  || node.type === "OptionalMemberExpression"
              ) {
                  const object = dottedName(node.object);
                  const property = node.computed
                      ? (
                          node.property.type === "StringLiteral"
                              ? node.property.value
                              : ""
                      )
                      : dottedName(node.property);
                  return object && property ? `${object}.${property}` : "";
              }
              return "";
          }

          function stringValue(node) {
              if (!node) return null;
              if (node.type === "StringLiteral") return node.value;
              if (
                  node.type === "TemplateLiteral"
                  && node.expressions.length === 0
              ) {
                  return node.quasis[0]?.value?.cooked ?? "";
              }
              return null;
          }

          function resolveName(name, result) {
              let resolved = name;
              const seen = new Set();
              for (let index = 0; index < 8; index += 1) {
                  if (!resolved || seen.has(resolved)) break;
                  seen.add(resolved);
                  const [root, ...rest] = resolved.split(".");
                  const alias = result.aliases.get(root);
                  if (!alias) break;
                  resolved = [alias, ...rest].filter(Boolean).join(".");
              }
              return resolved;
          }

          function bindAlias(identifier, valueName, result) {
              if (!identifier || identifier.type !== "Identifier") return;
              const resolved = resolveName(valueName, result);
              if (resolved) result.aliases.set(identifier.name, resolved);
          }

          function networkKind(name) {
              const parts = name.split(".");
              const root = parts[0];
              const method = parts[parts.length - 1];
              if (root === "axios") return "axios";
              if (method === "fetch") return "fetch";
              if (method === "sendBeacon") return "sendBeacon";
              if (forbiddenConstructors.has(method)) return method;
              return "";
          }

          function inspect(path, node, result, parent = null) {
              if (!node || typeof node !== "object") return;
              const line = node.loc?.start?.line ?? 0;

              if (node.type === "VariableDeclarator" && node.init) {
                  const valueName = dottedName(node.init);
                  if (node.id.type === "Identifier") {
                      bindAlias(node.id, valueName, result);
                  } else if (
                      node.id.type === "ObjectPattern"
                      && valueName
                  ) {
                      for (const property of node.id.properties) {
                          if (
                              property.type === "ObjectProperty"
                              && property.key.type === "Identifier"
                              && property.value.type === "Identifier"
                          ) {
                              bindAlias(
                                  property.value,
                                  `${resolveName(valueName, result)}.${property.key.name}`,
                                  result,
                              );
                          }
                      }
                  }
              }
              if (
                  node.type === "AssignmentExpression"
                  && node.operator === "="
              ) {
                  bindAlias(node.left, dottedName(node.right), result);
              }

              if (
                  node.type === "StringLiteral"
                  || node.type === "DirectiveLiteral"
              ) {
                  if (/^(?:https?:)?\/\//i.test(node.value)) {
                      result.errors.push(
                          `${path}:${line}: external URL literal is forbidden`
                      );
                  }
              }

              if (
                  node.type === "MemberExpression"
                  || node.type === "OptionalMemberExpression"
              ) {
                  const rawMember = dottedName(node);
                  const member = resolveName(rawMember, result);
                  if (networkKind(member)) {
                      result.errors.push(
                          `${path}:${line}: network escape hatch is forbidden: ${member}`
                      );
                  }
                  if (member === "api" || member.startsWith("api.")) {
                      const approvedDirectGet = (
                          member === "api.get"
                          && rawMember === "api.get"
                          && (
                              parent?.type === "CallExpression"
                              || parent?.type === "OptionalCallExpression"
                          )
                          && parent.callee === node
                      );
                      if (!approvedDirectGet) {
                          result.errors.push(
                              `${path}:${line}: API member may only be the direct approved GET`
                          );
                      }
                  }
                  if (node.computed && !rawMember) {
                      const objectName = resolveName(
                          dottedName(node.object),
                          result,
                      );
                      if (
                          objectName === "api"
                          || objectName.startsWith("api.")
                          || objectName === "axios"
                          || objectName.startsWith("axios.")
                          || objectName.endsWith("navigator")
                          || ["window", "globalThis", "self"].includes(objectName)
                      ) {
                          result.errors.push(
                              `${path}:${line}: dynamic network member is forbidden`
                          );
                      }
                  }
              }

              if (
                  node.type === "CallExpression"
                  || node.type === "OptionalCallExpression"
              ) {
                  const rawCallee = dottedName(node.callee);
                  const callee = resolveName(rawCallee, result);
                  const method = callee.split(".").pop();
                  if (callee === "api.get") {
                      const endpoint = stringValue(node.arguments[0]);
                      if (rawCallee !== "api.get") {
                          result.errors.push(
                              `${path}:${line}: aliased api.get is forbidden`
                          );
                      } else if (endpoint !== "/ads-manager/overview") {
                          result.errors.push(
                              `${path}:${line}: api.get may only read /ads-manager/overview`
                          );
                      } else {
                          result.allowedApiGetCount += 1;
                      }
                  } else if (callee === "api" || callee.startsWith("api.")) {
                      result.errors.push(
                          `${path}:${line}: forbidden API method: ${callee}`
                      );
                  }
                  if (
                      ["post", "put", "patch", "delete", "request"].includes(method)
                  ) {
                      result.errors.push(
                          `${path}:${line}: mutation-capable call is forbidden: ${callee}`
                      );
                  }
                  if (callee === "Reflect.get") {
                      const objectName = resolveName(
                          dottedName(node.arguments[0]),
                          result,
                      );
                      const property = stringValue(node.arguments[1]);
                      if (
                          objectName === "api"
                          || objectName.startsWith("api.")
                          || objectName === "axios"
                          || objectName.startsWith("axios.")
                          || objectName.endsWith("navigator")
                          || ["fetch", "sendBeacon", ...forbiddenConstructors]
                              .includes(property)
                      ) {
                          result.errors.push(
                              `${path}:${line}: reflective network lookup is forbidden`
                          );
                      }
                  }
                  if (callee === "Reflect.apply") {
                      const targetName = resolveName(
                          dottedName(node.arguments[0]),
                          result,
                      );
                      if (
                          targetName === "api"
                          || targetName.startsWith("api.")
                          || networkKind(targetName)
                      ) {
                          result.errors.push(
                              `${path}:${line}: reflective network call is forbidden`
                          );
                      }
                  }
                  if (networkKind(callee)) {
                      result.errors.push(
                          `${path}:${line}: frontend network call is forbidden: ${callee}`
                      );
                  }
              }

              if (node.type === "NewExpression") {
                  const constructor = resolveName(
                      dottedName(node.callee),
                      result,
                  );
                  if (
                      forbiddenConstructors.has(
                          constructor.split(".").pop(),
                      )
                  ) {
                      result.errors.push(
                          `${path}:${line}: network constructor is forbidden: ${constructor}`
                      );
                  }
              }

              for (const [key, child] of Object.entries(node)) {
                  if (key === "loc" || key === "start" || key === "end") continue;
                  if (Array.isArray(child)) {
                      child.forEach((item) => inspect(path, item, result, node));
                  } else if (child && typeof child === "object") {
                      inspect(path, child, result, node);
                  }
              }
          }

          function scanSource(path, source) {
              const tree = parser.parse(source, {
                  sourceType: "module",
                  plugins: ["jsx"],
              });
              const result = {
                  errors: [],
                  allowedApiGetCount: 0,
                  aliases: new Map(),
              };
              inspect(path, tree, result);
              return result;
          }

          const errors = [];
          const negativeCases = [
              ['api.request({ method: "POST", url: "/x" })', "api.request"],
              ['const client = api; client.post("/x")', "aliased api.post"],
              ['const read = api.get; read("/ads-manager/overview")', "aliased api.get"],
              ['Reflect.apply(api.post, api, ["/x"])', "Reflect.apply api.post"],
              ['((client) => client.post("/x"))(api)', "IIFE api.post"],
              ['api.get("https://provider.invalid/data")', "external api.get"],
              ['navigator.sendBeacon("/x", "payload")', "sendBeacon"],
              ['const send = window.navigator.sendBeacon; send("/x", "payload")', "aliased sendBeacon"],
              ['Reflect.get(window.navigator, "sendBeacon")("/x", "payload")', "Reflect.get sendBeacon"],
              ['new EventSource("/events")', "EventSource"],
              ['new WebSocket("wss:" + "//provider.invalid")', "WebSocket"],
              ['new globalThis.WebSocket("/events")', "qualified WebSocket"],
              ['fetch("/x")', "fetch"],
              ['const send = fetch; send("/x")', "aliased fetch"],
              ['axios.post("/x")', "axios"],
          ];
          for (const [source, label] of negativeCases) {
              if (scanSource(`self-test:${label}`, source).errors.length === 0) {
                  errors.push(`guard self-test failed to reject ${label}`);
              }
          }
          const positiveCase = scanSource(
              "self-test:approved-get",
              'api.get("/ads-manager/overview", { params: {} })',
          );
          if (
              positiveCase.errors.length !== 0
              || positiveCase.allowedApiGetCount !== 1
          ) {
              errors.push("guard self-test rejected the approved GET");
          }

          let allowedApiGetCount = 0;
          for (const path of files) {
              const source = fs.readFileSync(path, "utf8");
              const result = scanSource(path, source);
              errors.push(...result.errors);
              allowedApiGetCount += result.allowedApiGetCount;
          }

          if (allowedApiGetCount !== 1) {
              errors.push(
                  `expected exactly one approved api.get call; found ${allowedApiGetCount}`
              );
          }
          if (errors.length) {
              console.error("Read-only frontend AST guard failed:");
              errors.forEach((error) => console.error(` - ${error}`));
              process.exit(1);
          }
          console.log("Read-only frontend AST guard passed.");
          JS
      - name: Build frontend
        run: CI=false yarn build
