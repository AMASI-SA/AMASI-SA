name: Review Pending Salla Guard

on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final, codex/review-completion-resumable, codex/review-acceptance-config-guard]
    paths:
      - "backend/shipping_pending_snapshot_recovery.py"
      - "backend/salla_integration/sync.py"
      - "backend/salla_integration/auto_sync.py"
      - "backend/tests/test_shipping_pending_snapshot_recovery.py"
      - "backend/tests/test_salla_sync_component_snapshot.py"
      - "backend/order_review*.py"
      - ".github/workflows/review-pending-guard.yml"
      - "backend/review_local_policy.py"
      - "backend/review_salla_pending_guard.py"
      - "backend/tests/test_review_salla_pending_guard.py"
      - "backend/review_gift_address.py"
      - "backend/tests/test_review_gift_address.py"
      - "backend/preparation_piece_operations.py"
      - "backend/preparation_receipt_status_message.py"
      - "backend/assembly_completion_delivery.py"
      - "backend/assembly_print_completion.py"
      - "backend/tests/test_assembly_print_completion.py"
      - "backend/tests/test_unified_completed_carrier_label.py"
      - "backend/assembly_completion_legacy_readback.py"
      - "backend/assembly_completion_v2_readback.py"
      - "backend/assembly_status_policy.py"
      - "backend/salla_integration/auto_sync.py"
      - "backend/order_engine/shipping_label_service.py"
      - "backend/tests/test_assembly_completion_delivery.py"
      - "backend/tests/test_assembly_completion_legacy_readback.py"
      - "backend/tests/test_assembly_completion_v2_readback.py"
      - "backend/tests/test_assembly_completion_status_transition.py"
      - "backend/tests/test_assembly_completion_readback_routes.py"
      - "backend/tests/test_shipping_saved_label_print.py"
      - "backend/tests/test_assembly_search_instruction_batch.py"
      - "backend/tests/test_preparation_receiving_custody.py"
      - "backend/order_tracking_notes.py"
      - "backend/preparation_route_history.py"
      - "backend/supplier_dispatch_waiting_policy.py"
      - "backend/order_engine/repository.py"
      - "backend/tests/test_review_local_*.py"
      - "backend/tests/review_legacy_contract_fixture.py"
      - "backend/operational_atomic.py"
      - "backend/server.py"
      - "backend/review_acceptance_config_guard.py"
      - "backend/tests/test_review_acceptance_config_guard.py"
      - "backend/fulfillment_v2_routes.py"
      - "backend/tests/test_review_completion_*.py"
      - "backend/tests/test_g47*.py"
      - ".github/workflows/review-completion-resumable.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-pending-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-mongo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .:tests
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=reviewtest
      BUILD37_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=reviewtest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1 pydantic==2.13.5 pymongo==4.18.2 motor==3.7.1
          pytest==9.0.3 pytest-asyncio==1.3.0 httpx==0.28.1
          openpyxl==3.1.5 python-dotenv==1.2.3 cryptography==50.0.0
          bcrypt==4.1.3 PyJWT==2.13.0 python-multipart==0.0.20
          mongomock-motor==0.0.36 reportlab==5.0.1 Pillow==12.3.0
          qrcode==8.2 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 tzdata==2026.4
      - name: Start isolated real Mongo replica set
        run: |
          set -euo pipefail
          docker run -d --name review-rs -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet reviewtest --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec review-rs mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec review-rs mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"reviewtest",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 40); do
            if docker exec review-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec review-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'
      - name: Verify fresh Salla status and actual local approval routes
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short
          tests/test_review_local_completion.py tests/test_review_salla_pending_guard.py
          --asyncio-mode=auto --junitxml="${{ runner.temp }}/review-pending-guard.xml"
      - name: Require both focused suites with no skips or failures
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(Path(os.environ["RUNNER_TEMP"]) / "review-pending-guard.xml").iter("testcase"))
          assert len(cases) >= 38
          assert not any(row.find(tag) is not None for row in cases for tag in ("skipped", "failure", "error"))
          for suite in ("test_review_local_completion", "test_review_salla_pending_guard"):
              assert sum(suite in row.get("classname", "") for row in cases) >= 19
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-pending-guard-${{ github.sha }}
          path: ${{ runner.temp }}/review-pending-guard.xml
      - name: Remove isolated fixture
        if: always()
        run: docker rm --force review-rs
