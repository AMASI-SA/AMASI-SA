name: Salla durable ingress and daily refresh

on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - 'backend/salla_integration/**'
      - 'backend/orders_db.py'
      - 'backend/product_v2_routes.py'
      - 'backend/background_worker_runtime.py'
      - 'backend/integrations_control_center/snapchat_capi_purchases.py'
      - 'backend/tests/test_salla_*'
      - 'backend/tests/test_background_worker_process.py'
      - '.github/workflows/salla-webhook-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salla-webhook-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .:tests
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=sallaRecoveryTest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1 pydantic==2.13.5 pymongo==4.18.2 motor==3.7.1
          pytest==9.0.3 pytest-asyncio==1.3.0 httpx==0.28.1
          openpyxl==3.1.5 python-dotenv==1.2.2 cryptography==50.0.0
          bcrypt==4.1.3 PyJWT==2.13.0 python-multipart==0.0.20 email-validator==2.3.0
          mongomock-motor==0.0.36 reportlab==5.0.1 Pillow==12.3.0
          qrcode==8.2 arabic-reshaper==3.0.1 python-bidi==0.6.11
          PyMuPDF==1.28.2 tzdata==2026.4
      - name: Start disposable loopback Mongo replica set
        run: |
          set -euo pipefail
          docker run -d --name salla-recovery-test -p 127.0.0.1:27018:27018 mongo:7.0.15 --port 27018 --replSet sallaRecoveryTest --bind_ip_all
          python - <<'PY'
          import time
          from pymongo import MongoClient
          c = MongoClient('mongodb://127.0.0.1:27018/?directConnection=true', serverSelectionTimeoutMS=500)
          deadline = time.monotonic() + 40
          while True:
              try:
                  c.admin.command('ping')
                  break
              except Exception:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.2)
          c.admin.command('replSetInitiate', {'_id':'sallaRecoveryTest','members':[{'_id':0,'host':'127.0.0.1:27018'}]})
          while not c.admin.command('hello').get('isWritablePrimary'):
              if time.monotonic() >= deadline:
                  raise RuntimeError('isolated primary unavailable')
              time.sleep(0.2)
          c.close()
          PY
      - name: Verify ingress, process recovery, daily window and update-only invariants
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git rev-parse HEAD 'HEAD^{tree}' > ../evidence/source.txt
          python -m pytest --noconftest -p no:cacheprovider -q --tb=short --asyncio-mode=auto \
            tests/test_salla_webhook_inbox.py \
            tests/test_salla_webhook_inbox_mongo.py \
            tests/test_salla_webhook_ingress_queue.py \
            tests/test_salla_webhook_processing_contract.py \
            tests/test_salla_webhook_deferred_outbox.py \
            tests/test_salla_webhook_monitor_queue.py \
            tests/test_salla_paused_webhook_http.py \
            tests/test_salla_manual_sync_serialization.py \
            tests/test_salla_scheduled_reconciliation.py \
            tests/test_salla_sync_component_snapshot.py \
            tests/test_salla_orders_sync_pagination_evidence.py \
            tests/test_salla_raw_snapshot_preservation.py \
            tests/test_salla_stale_creation_options.py \
            tests/test_cost_option_auto_recovery.py \
            tests/test_salla_abandoned_carts_v1.py \
            tests/test_snapchat_capi_purchases_v3.py \
            tests/test_snapchat_capi_cancellation_v3.py \
            --junitxml=../evidence/salla-recovery.xml | tee ../evidence/salla-recovery.txt
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('../evidence/salla-recovery.xml').getroot()
          assert len(root.findall('.//testcase')) >= 200, 'Focused acceptance cases did not execute'
          assert not root.findall('.//skipped'), 'Real Mongo acceptance must not be skipped'
          assert not root.findall('.//failure') and not root.findall('.//error')
          PY
      - name: Preserve exact-source acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salla-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          retention-days: 14
      - name: Stop only the disposable test database
        if: always()
        run: docker rm -f salla-recovery-test
