name: Apply Snapchat CAPI Privacy Disclosure

on:
  push:
    branches:
      - feat/snapchat-capi-purchase-attribution
    paths:
      - ".github/workflows/_apply-snapchat-capi-privacy-disclosure.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snapchat-capi-purchase-attribution
          fetch-depth: 0

      - name: Add explicit Snapchat CAPI disclosure
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("frontend/src/PublicLegalApp.jsx")
          text = app_path.read_text(encoding="utf-8")
          text = text.replace('const UPDATED_AR = "31 يوليو 2026";', 'const UPDATED_AR = "1 أغسطس 2026";', 1)
          text = text.replace('const UPDATED_EN = "31 July 2026";', 'const UPDATED_EN = "1 August 2026";', 1)
          text = text.replace(
              'intro="توضح هذه السياسة كيف يجمع نظام ميزان البيانات ويستخدمها ويحميها عند تشغيل خدمات المتجر والتكاملات الإعلانية، بما فيها ربط Meta للأصول والحسابات المصرح بها."',
              'intro="توضح هذه السياسة كيف يجمع نظام ميزان البيانات ويستخدمها ويحميها عند تشغيل خدمات المتجر والتكاملات الإعلانية، بما فيها Meta وSnapchat للأصول والحسابات المصرح بها."',
              1,
          )

          data_marker = '''                    <li>\n                        بيانات تكامل Meta والمنصات الإعلانية: معرّفات الأعمال والحسابات الإعلانية، أسماء الحسابات،\n                        العملة والمنطقة الزمنية، الصلاحيات الممنوحة، الحملات والتقارير ومؤشرات الأداء والتحويلات.\n                    </li>\n'''
          data_extra = '''                    <li>\n                        عند تفعيل Snapchat Conversions API صراحةً، قد يُرسل حدث شراء يتضمن رقم الطلب، وقت الحدث،\n                        قيمة الطلب وعملته والمنتجات. يُطبّع البريد الإلكتروني ورقم الهاتف والمدينة والدولة والرمز\n                        البريدي ومعرّف العميل ثم تُرسل قيم SHA-256 بدل النص الأصلي. وقد تُرسل معرّفات الإسناد\n                        <span dir="ltr" className="font-mono">ScCid</span> وSnap cookie إذا كانت موجودة أصلًا.\n                        لا يرسل ميزان عنوان IP أو User-Agent ضمن هذا التكامل.\n                    </li>\n'''
          if data_extra not in text:
              if data_marker not in text:
                  raise SystemExit("privacy data marker missing")
              text = text.replace(data_marker, data_marker + data_extra, 1)

          purpose_old = '''                    <li>تحسين موثوقية النظام دون استخدام بيانات العملاء لتدريب نماذج عامة أو مشاركتها لأغراض إعلانية خارجية.</li>\n'''
          purpose_new = '''                    <li>\n                        تحسين موثوقية النظام دون استخدام بيانات العملاء لتدريب نماذج عامة. ولا تُشارك بيانات\n                        التحويل مع منصة إعلانية إلا عند تفعيل التكامل صراحةً ولغرض القياس والإسناد وتحسين الأداء\n                        الإعلاني المصرح به.\n                    </li>\n'''
          if purpose_old in text:
              text = text.replace(purpose_old, purpose_new, 1)
          elif purpose_new not in text:
              raise SystemExit("privacy purpose marker missing")

          share_old = '''                    <li>للمنصات التي يختار المستخدم ربطها، مثل Meta، لتنفيذ طلب التفويض وجلب البيانات المصرح بها.</li>\n'''
          share_new = '''                    <li>\n                        للمنصات التي يختار المستخدم ربطها، مثل Meta وSnapchat، لتنفيذ التفويض وجلب البيانات\n                        المصرح بها، أو إرسال أحداث التحويل التي فُعّلت صراحةً ضمن الحد الأدنى اللازم.\n                    </li>\n'''
          if share_old in text:
              text = text.replace(share_old, share_new, 1)
          elif share_new not in text:
              raise SystemExit("privacy sharing marker missing")

          retention_marker = '''                <p>عند انتهاء الحاجة، يتم حذف البيانات أو إخفاء هويتها أو إتلافها بطريقة آمنة بحسب طبيعة التخزين.</p>\n'''
          retention_extra = '''                <p>\n                    سجلات Snapchat CAPI المنتظرة لا تحتوي على البريد أو الهاتف بصيغتهما الأصلية، ويُمسح محتوى\n                    الحدث بعد نجاح الإرسال. تُحفظ بيانات الحالة المحدودة لفترة تشغيلية وأمنية ثم تُحذف تلقائيًا.\n                </p>\n'''
          if retention_extra not in text:
              if retention_marker not in text:
                  raise SystemExit("privacy retention marker missing")
              text = text.replace(retention_marker, retention_marker + retention_extra, 1)

          app_path.write_text(text, encoding="utf-8")

          test_path = Path("frontend/src/PublicLegalApp.test.jsx")
          test = test_path.read_text(encoding="utf-8")
          test_marker = '''        expect(markup).toContain("30 يومًا");\n'''
          test_extra = '''        expect(markup).toContain("Snapchat Conversions API");\n        expect(markup).toContain("SHA-256");\n        expect(markup).toContain("لا يرسل ميزان عنوان IP أو User-Agent");\n'''
          if test_extra not in test:
              if test_marker not in test:
                  raise SystemExit("legal test marker missing")
              test = test.replace(test_marker, test_marker + test_extra, 1)
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Verify disclosure and noindex remain present
        run: |
          grep -q 'Snapchat Conversions API' frontend/src/PublicLegalApp.jsx
          grep -q 'SHA-256' frontend/src/PublicLegalApp.jsx
          grep -q 'لا يرسل ميزان عنوان IP أو User-Agent' frontend/src/PublicLegalApp.jsx
          grep -q 'applyPublicLegalNoIndex' frontend/src/index.js

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-snapchat-capi-privacy-disclosure.yml
          git add frontend/src/PublicLegalApp.jsx frontend/src/PublicLegalApp.test.jsx
          git commit -m "docs(privacy): disclose Snapchat CAPI purchase processing"
          git push origin HEAD:feat/snapchat-capi-purchase-attribution
