name: Run Meta V2 Ads Manager Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: meta-v2-ads-manager-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ads-manager-meta-v2-source
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute reviewed patch embedded in the push workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(
              '.github/workflows/tmp-apply-meta-v2-ads-manager.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Compile changed backend files"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('Embedded Meta V2 patch markers are invalid')
          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(block), '<meta-v2-patch>', 'exec'))
          PY

      - name: Compile changed backend files
        run: |
          python -m py_compile \
            backend/ads_manager/service.py \
            backend/tests/test_unified_ads_manager_phase1.py

      - name: Install targeted test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            pytest pytest-asyncio fastapi httpx pydantic

      - name: Run Ads Manager safety suite
        env:
          PYTHONPATH: backend
          MEZAN_ADS_MANAGER_READ_ONLY_ENABLED: 'true'
        run: pytest -q backend/tests/test_unified_ads_manager_phase1.py

      - name: Enforce read-only AST guard
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('backend/ads_manager/service.py').read_text())
          forbidden = {
              'insert_one', 'insert_many', 'update_one', 'update_many',
              'replace_one', 'delete_one', 'delete_many', 'bulk_write',
              'post', 'put', 'patch', 'delete',
          }
          found = sorted({
              node.attr for node in ast.walk(tree)
              if isinstance(node, ast.Attribute) and node.attr in forbidden
          })
          if found:
              raise SystemExit(f'Forbidden Ads Manager operations: {found}')
          print('ADS_MANAGER_META_V2_READ_ONLY_GUARD_OK')
          PY

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/ads_manager/service.py \
                  backend/tests/test_unified_ads_manager_phase1.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'META_V2_ADS_MANAGER_FIX_ALREADY_PRESENT'
            exit 0
          fi
          git commit -m 'fix(ads): read authoritative Meta V2 performance source'
          git push origin HEAD:fix/ads-manager-meta-v2-source
