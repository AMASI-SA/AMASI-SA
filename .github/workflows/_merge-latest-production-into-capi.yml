name: Merge Latest Production Into CAPI Branch

on:
  push:
    branches:
      - feat/snapchat-capi-purchase-attribution
    paths:
      - ".github/workflows/_merge-latest-production-into-capi.yml"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snapchat-capi-purchase-attribution
          fetch-depth: 0

      - name: Merge latest production safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin hotfix/prod-snap-meta-final
          git merge --no-commit --no-ff origin/hotfix/prod-snap-meta-final
          git rm .github/workflows/_merge-latest-production-into-capi.yml
          git commit -m "chore: merge latest production into Snapchat CAPI branch"
          git push origin HEAD:feat/snapchat-capi-purchase-attribution
