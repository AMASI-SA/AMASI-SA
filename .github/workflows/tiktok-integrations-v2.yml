name: TikTok Integrations V2

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/integrations_control_center/tiktok_*.py"
      - "backend/integrations_control_center/catalog.py"
      - "backend/integrations_control_center/__init__.py"
      - "backend/tests/test_tiktok_integrations_v2.py"
      - "backend/tests/test_tiktok_native_reporting.py"
      - "frontend/src/services/tiktokIntegrationsV2.js"
      - "frontend/src/services/tiktokIntegrationsV2.test.js"
      - "frontend/src/components/integrationsV2/ProviderMark.jsx"
      - "frontend/src/components/integrationsV2/IntegrationCard.js"
      - "frontend/src/components/integrationsV2/TikTokReportingSyncControl.jsx"
      - "frontend/src/components/integrationsV2/TikTokReportingSyncControl.test.jsx"
      - "docs/TIKTOK_INTEGRATIONS_V2_SETUP.md"
      - "docs/TIKTOK_NATIVE_V2_IMPLEMENTATION_NOTE.md"
      - ".github/workflows/tiktok-integrations-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: TikTok OAuth and reporting backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          httpx==0.28.1
          pydantic==2.13.4
          pytest==9.0.3
          pytest-asyncio
          cryptography==48.0.0
          openpyxl==3.1.5
      - name: Compile TikTok V2 connector
        run: |
          python -m compileall -q integrations_control_center
          python -m py_compile \
            tests/test_tiktok_integrations_v2.py \
            tests/test_tiktok_native_reporting.py
      - name: Enforce legacy isolation
        run: >-
          python -c
          "from integrations_control_center.tiktok_native_guard import assert_tiktok_v2_is_legacy_independent; assert_tiktok_v2_is_legacy_independent()"
      - name: Run TikTok V2 tests
        run: >-
          python -m pytest
          tests/test_tiktok_integrations_v2.py
          tests/test_tiktok_native_reporting.py
          -q
          --tb=short

  frontend-build:
    name: TikTok frontend test and build
    needs: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Run TikTok frontend tests
        run: >-
          CI=true yarn test
          --watchAll=false
          --runInBand
          src/services/tiktokIntegrationsV2.test.js
          src/components/integrationsV2/TikTokReportingSyncControl.test.jsx
      - name: Build frontend
        run: CI=false yarn build
