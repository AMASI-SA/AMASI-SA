name: TikTok Integrations V2

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/integrations_control_center/tiktok_*.py"
      - "backend/integrations_control_center/catalog.py"
      - "backend/integrations_control_center/__init__.py"
      - "backend/tests/test_tiktok_integrations_v2.py"
      - "frontend/src/services/tiktokIntegrationsV2.js"
      - "frontend/src/components/integrationsV2/ProviderMark.jsx"
      - "docs/TIKTOK_INTEGRATIONS_V2_SETUP.md"
      - ".github/workflows/tiktok-integrations-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: TikTok OAuth backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          httpx==0.28.1
          pydantic==2.13.4
          pytest==9.0.3
          pytest-asyncio
          cryptography==48.0.0
          openpyxl==3.1.5
      - name: Compile TikTok V2 connector
        run: |
          python -m compileall -q integrations_control_center
          python -m py_compile tests/test_tiktok_integrations_v2.py
      - name: Run TikTok V2 tests
        run: >-
          python -m pytest
          tests/test_tiktok_integrations_v2.py
          -q
          --tb=short

  frontend-build:
    name: Frontend build
    needs: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Yarn Classic
        run: corepack enable
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Build frontend
        run: yarn build
