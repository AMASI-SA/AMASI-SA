name: Google namespace prerequisite audit
on:
  push:
    branches: [codex/google-namespace-prerequisites-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_ads_namespace_prerequisites.py
      - backend/tests/test_google_ads_namespace_prerequisites*.py
      - frontend/src/components/marketing/GoogleNamespacePrerequisites*
      - .github/workflows/google-namespace-prerequisites.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-replica-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      GOOGLE_NAMESPACE_TEST_ADMIN_URI: mongodb://namespace_admin:ephemeral_fixture_only@127.0.0.1:27474/?authSource=admin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused production-compatible test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 starlette==1.3.1 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 dnspython==2.9.0 httpx==0.28.1
          python-multipart==0.0.31 cryptography==50.0.0
          PyJWT==2.15.0 bcrypt==4.1.3 python-dotenv==1.2.2
          pillow==13.0.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.0.3 pytest-asyncio==1.4.0
      - name: Start disposable authenticated loopback replica
        shell: bash
        run: |
          set -euo pipefail
          NS_KEY_DIR="$RUNNER_TEMP/namespace-audit-key"
          mkdir -p "$NS_KEY_DIR"
          python - "$NS_KEY_DIR/key" <<'PYCODE'
          import base64,pathlib,secrets,sys
          path=pathlib.Path(sys.argv[1])
          path.write_text(base64.b64encode(secrets.token_bytes(512)).decode())
          path.chmod(0o400)
          PYCODE
          sudo chown 999:999 "$NS_KEY_DIR/key"
          docker run -d --name namespace-audit-rs -p 127.0.0.1:27474:27474 \
            -e MONGO_INITDB_ROOT_USERNAME=namespace_admin -e MONGO_INITDB_ROOT_PASSWORD=ephemeral_fixture_only \
            -v "$NS_KEY_DIR/key:/run/namespace-key:ro" mongo:8.0.26 \
            --port 27474 --replSet namespaceAudit --keyFile /run/namespace-key --bind_ip_all
          python - <<'PYCODE'
          import os,time
          from pymongo import MongoClient
          client=MongoClient(os.environ['GOOGLE_NAMESPACE_TEST_ADMIN_URI'],directConnection=True,serverSelectionTimeoutMS=1000)
          for attempt in range(60):
              try:
                  client.admin.command('ping')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('disposable_authenticated_bootstrap_failed')
          try:
              client.admin.command({'replSetInitiate':{'_id':'namespaceAudit','members':[{'_id':0,'host':'127.0.0.1:27474'}]}})
              for attempt in range(60):
                  try:
                      if client.admin.command('hello').get('isWritablePrimary') is True:break
                  except Exception:pass
                  time.sleep(1)
              else:raise SystemExit('disposable_primary_unproved')
          except Exception:
              raise SystemExit('disposable_replica_initialization_failed') from None
          finally:client.close()
          PYCODE
      - name: Verify read-only prerequisites under restricted real roles
        run: |
          python -m pytest --noconftest -q -W error --tb=short --junitxml=namespace-audit.xml \
            backend/tests/test_google_ads_namespace_prerequisites.py \
            backend/tests/test_google_ads_namespace_prerequisites_mongo.py \
            backend/tests/test_google_ads_automation_policy.py \
            backend/tests/test_google_ads_automation_creation_policy.py
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root=ET.parse('namespace-audit.xml').getroot();cases=root.findall('.//testcase')
          assert len(cases)>=123
          assert sum('prerequisites_mongo' in case.get('classname','') for case in cases)==9
          assert not root.findall('.//failure') and not root.findall('.//error') and not root.findall('.//skipped')
          print({'tests':len(cases),'auth_replica_tests':9,'failures_errors_skips':0})
          PYCODE
      - name: Remove disposable replica
        if: always()
        run: docker rm -f namespace-audit-rs || true
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Governed toolchain
        run: python scripts/frontend_release_toolchain.py ensure
      - name: Frozen install
        run: python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend install --frozen-lockfile --non-interactive
      - name: Test explicit diagnostic and workspace compatibility
        env:
          CI: "true"
        run: >-
          python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/GoogleNamespacePrerequisites.test.jsx
          src/components/marketing/GoogleAdsWorkspace.test.jsx
      - name: Build current reviewed checkout
        env:
          CI: "false"
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REACT_APP_BACKEND_URL: https://mezansalla.com
        run: python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend build
