name: Orders V2 refresh items bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/fix_orders_v2_refresh_items_call.py"
      - ".github/workflows/orders-v2-refresh-items-bootstrap.yml"

permissions:
  contents: write

jobs:
  repair-items-call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orders-v2-address-root-fallback
          fetch-depth: 0
          show-progress: false

      - name: Apply direct Order Items call
        run: python scripts/fix_orders_v2_refresh_items_call.py

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile backend/order_engine/salla_refresh.py backend/tests/test_fulfillment_v2_contract.py
          grep -q '"/orders/items"' backend/order_engine/salla_refresh.py
          ! grep -q '_fetch_salla_order_items' backend/order_engine/salla_refresh.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/order_engine/salla_refresh.py backend/tests/test_fulfillment_v2_contract.py
          git commit -m "fix(orders-v2): own Order Items call in central refresh"
          git push origin HEAD:fix/orders-v2-address-root-fallback
