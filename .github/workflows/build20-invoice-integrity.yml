name: Build20 supplier invoice integrity (no deployment)
on:
  pull_request:
    paths:
      - 'backend/supplier_receiving_routes.py'
      - 'backend/supplier_invoice_integrity.py'
      - 'backend/supplier_invoice_history.py'
      - 'backend/tests/test_supplier_invoice_private_history.py'
      - 'backend/supplier_invoice_pdf.py'
      - 'backend/tests/test_supplier_invoice_financial_integrity.py'
      - '.github/workflows/build20-invoice-integrity.yml'
permissions:
  contents: read
jobs:
  invoice-integrity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      BUILD20_INVOICE_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Start disposable transaction-capable Mongo
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name invoice-test-mongo -p 127.0.0.1:27017:27017 mongo:7.0.16 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do docker exec invoice-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break; sleep 1; done
          docker exec invoice-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 60); do docker exec invoice-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1 && break; sleep 1; done
          docker exec invoice-test-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)'
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor==3.3.1
          httpx==0.28.1 openai==1.99.9 pytest==9.0.2 pytest-asyncio==1.3.0
          openpyxl cryptography reportlab python-multipart arabic-reshaper python-bidi Pillow PyMuPDF qrcode
      - name: HTTP transaction, rollback, idempotence and persisted presentation-source contracts
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/invoice-integrity-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/invoice-integrity-evidence/identity.txt"
          python -m pytest \
            tests/test_supplier_invoice_financial_integrity.py \
            tests/test_supplier_receiving.py \
            tests/test_supplier_invoice_private_history.py \
            tests/test_supplier_multi_supplier_lifecycle.py \
            tests/test_supplier_invoice_live_cost_session.py \
            tests/test_supplier_invoice_service_eligibility.py \
            -v --tb=short --junitxml="$RUNNER_TEMP/invoice-integrity-evidence/pytest.xml" \
            2>&1 | tee "$RUNNER_TEMP/invoice-integrity-evidence/pytest.log"
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          cases = list(ET.parse(pathlib.Path(os.environ['RUNNER_TEMP']) / 'invoice-integrity-evidence/pytest.xml').iter('testcase'))
          new = [c for c in cases if 'test_supplier_invoice_financial_integrity' in c.attrib.get('classname','')]
          assert len(new) >= 28, 'Required transaction and presentation-source cases missing'
          assert all(c.find('skipped') is None for c in cases), 'Skipped coverage is not success'
          PY
      - name: Stop disposable Mongo
        if: always()
        run: docker rm -f invoice-test-mongo || true
      - name: Retain exact-head synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invoice-integrity-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/invoice-integrity-evidence
          retention-days: 30
          if-no-files-found: warn
