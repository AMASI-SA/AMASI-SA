name: EXIT-2C isolated runtime candidate
on:
  push:
    branches: [codex/exit-2c-runtime-candidate]
permissions:
  contents: read
jobs:
  candidate:
    if: contains(github.event.head_commit.message, '[exit2c-test]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/AUDIT/
            !/reports/
            !/test_reports/
            !/memory/
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Exact frontend toolchain and inherited regressions
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(node --version)" = v22.23.2
          test "$(yarn --version)" = 1.22.22
          yarn --cwd frontend install --frozen-lockfile --non-interactive
          yarn --cwd frontend test --watchAll=false --runInBand --runTestsByPath src/context/authBootstrap.test.js src/context/AuthContext.test.jsx src/components/ProtectedRoute.test.jsx src/lib/qoyodUnsentOrdersClient.test.js src/qoyodUnsentHeaderAlert.test.js src/pages/QoyodUnsentOrders.test.jsx
      - name: Real isolated target roles and HTTP acceptance
        run: bash packaging/exit2c/run_linux.sh
