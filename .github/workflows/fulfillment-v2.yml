name: Fulfillment V2

on:
  pull_request:
    paths:
      - "backend/order_review_routes.py"
      - "backend/order_review_image_modes.py"
      - "backend/order_engine/mapper.py"
      - "backend/order_engine/repository.py"
      - "backend/order_engine/routes.py"
      - "backend/order_engine/salla_refresh.py"
      - "backend/tests/test_order_review_stage_one.py"
      - "backend/tests/test_order_engine_mapper.py"
      - "backend/tests/test_order_engine_repository.py"
      - "backend/tests/test_order_engine_salla_refresh.py"
      - "backend/tests/test_fulfillment_v2_contract.py"
      - "tests/test_order_review_image_modes_contract.py"
      - "tests/test_order_review_mezan_image_upload_contract.py"
      - "frontend/src/App.js"
      - "frontend/src/index.js"
      - "frontend/src/reviewMezanImageEnhancer.js"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/components/Sidebar.jsx"
      - "frontend/src/pages/FulfillmentV2.jsx"
      - "frontend/src/pages/FulfillmentV2.test.jsx"
      - "frontend/src/pages/OrderReview.jsx"
      - "frontend/src/pages/OrderReview.test.jsx"
      - "frontend/src/pages/OrderDetailsV2.jsx"
      - "frontend/src/services/orderEngine.js"
      - "frontend/src/services/orderReviewEngine.js"
      - ".github/workflows/fulfillment-v2.yml"
  push:
    branches:
      - main
    paths:
      - "backend/order_review_routes.py"
      - "backend/order_review_image_modes.py"
      - "backend/order_engine/mapper.py"
      - "backend/order_engine/repository.py"
      - "backend/order_engine/routes.py"
      - "backend/order_engine/salla_refresh.py"
      - "backend/tests/test_order_review_stage_one.py"
      - "backend/tests/test_order_engine_mapper.py"
      - "backend/tests/test_order_engine_repository.py"
      - "backend/tests/test_order_engine_salla_refresh.py"
      - "backend/tests/test_fulfillment_v2_contract.py"
      - "tests/test_order_review_image_modes_contract.py"
      - "tests/test_order_review_mezan_image_upload_contract.py"
      - "frontend/src/App.js"
      - "frontend/src/index.js"
      - "frontend/src/reviewMezanImageEnhancer.js"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/components/Sidebar.jsx"
      - "frontend/src/pages/FulfillmentV2.jsx"
      - "frontend/src/pages/FulfillmentV2.test.jsx"
      - "frontend/src/pages/OrderReview.jsx"
      - "frontend/src/pages/OrderReview.test.jsx"
      - "frontend/src/pages/OrderDetailsV2.jsx"
      - "frontend/src/services/orderEngine.js"
      - "frontend/src/services/orderReviewEngine.js"
      - ".github/workflows/fulfillment-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          reportlab
          python-multipart
      - name: Run review and fulfillment contracts
        run: >-
          python -m pytest
          backend/tests/test_order_review_stage_one.py
          backend/tests/test_order_engine_mapper.py
          backend/tests/test_order_engine_repository.py
          backend/tests/test_order_engine_salla_refresh.py
          backend/tests/test_fulfillment_v2_contract.py
          tests/test_order_review_image_modes_contract.py
          tests/test_order_review_mezan_image_upload_contract.py
          -q --tb=short

  frontend-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Run Fulfillment V2 UI contract
        env:
          CI: "true"
        shell: bash
        run: |
          set +e
          yarn test --watchAll=false --runInBand --runTestsByPath src/pages/FulfillmentV2.test.jsx src/pages/OrderReview.test.jsx > /tmp/fulfillment-v2-jest.log 2>&1
          status=$?
          cat /tmp/fulfillment-v2-jest.log
          exit "$status"
      - name: Upload Fulfillment V2 Jest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulfillment-v2-jest-log
          path: /tmp/fulfillment-v2-jest.log
          if-no-files-found: ignore
      - name: Build frontend
        env:
          CI: "false"
        run: yarn build