  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Run backend review and fulfillment tests
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_order_review_stage_one.py
          tests/test_order_review_export_controls.py
          tests/test_order_review_spec_replacements.py
          tests/test_order_review_mezan_image_unlink.py
          tests/test_order_review_customer_waiting.py
          tests/test_reviewed_products_catalog.py
          tests/test_reviewed_preparation_batches.py
          tests/test_preparation_file_registry.py
          tests/test_preparation_piece_operations.py
          tests/test_preparation_supplier_dispatch.py
          tests/test_mezan_supplier_management.py
          tests/test_supplier_receiving.py
          tests/test_order_engine_mapper.py
          tests/test_order_engine_repository.py
          tests/test_order_engine_salla_refresh.py
          tests/test_customer_history.py
          tests/test_customer_history_complete_lookup.py
          tests/test_customer_history_route.py
          tests/test_fulfillment_v2_contract.py
          tests/test_carrier_handoff.py
          tests/test_fulfillment_carrier_label.py
          -q --tb=short
      - name: Run root image-mode contracts
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest
          tests/test_order_review_image_modes_contract.py
          tests/test_order_review_mezan_image_upload_contract.py
          -q --tb=short

  frontend-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Run Fulfillment V2 UI contract
        env:
          CI: "true"
        shell: bash
        run: |
          set +e
          yarn test --watchAll=false --runInBand --runTestsByPath src/pages/FulfillmentV2.test.jsx src/pages/MezanSuppliersV2.test.jsx src/components/GlobalSearch.test.jsx src/components/MezanV2NavigationShell.test.jsx src/components/MezanV2NavigationShell.fulfillment.test.jsx src/components/fulfillment/SupplierReceivingWorkspace.test.jsx src/components/fulfillment/PreparationWorkDashboard.test.jsx src/components/fulfillment/PreparationSupplierDispatchWorkspace.test.jsx src/components/fulfillment/CompletedFulfillmentOrders.test.jsx src/components/fulfillment/ReadyToShipOrders.test.jsx src/components/fulfillment/supplierDispatchPrint.test.js src/pages/OrderReview.test.jsx src/reviewExportControlsEnhancer.test.js src/reviewSpecReplacementEnhancer.test.js src/reviewCompactActionLabels.test.js src/reviewMezanImageEnhancer.test.js src/reviewProductEditMode.test.js src/reviewAutoAdvance.test.js src/reviewManualNavigation.test.js src/reviewCustomerWaiting.test.js src/reviewedProductFilters.test.js src/reviewedPreparationSelection.test.js src/preparationFileRegistryUi.test.js > /tmp/fulfillment-v2-jest.log 2>&1
          status=$?
          cat /tmp/fulfillment-v2-jest.log
          exit "$status"
      - name: Upload Fulfillment V2 Jest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulfillment-v2-jest-log
          path: /tmp/fulfillment-v2-jest.log
          if-no-files-found: ignore
      - name: Build frontend
        env:
          CI: "false"
        run: yarn build
