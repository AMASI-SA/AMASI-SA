name: Mezan Release Readiness

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
  push:
    branches:
      - hotfix/prod-snap-meta-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mezan-release-readiness
  cancel-in-progress: false

jobs:
  backend-preflight:
    name: Backend preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend Python sources
        run: python -m compileall -q backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Build production frontend
        env:
          CI: "false"
        run: yarn build

  release-handoff:
    name: Emergent manual redeploy required
    if: github.event_name == 'push'
    needs:
      - backend-preflight
      - frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Record supported deployment handoff
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Mezan release is CI-ready, not deployed

          Emergent does not pull, sync, webhook, or auto-redeploy this existing project from GitHub.

          A merge to `hotfix/prod-snap-meta-final` **does not update Preview or Production**.

          Mandatory production path from the shared `/app` workspace:
          1. Fast-forward `/app` to `origin/hotfix/prod-snap-meta-final`.
          2. Run `python scripts/production_release_guard.py prepare --actor "<conversation>"`.
          3. Run `python scripts/production_release_guard.py prepublish` immediately before publishing.
          4. In the same project choose **Manage Publishing → Re-publish changes** exactly once.
          5. Wait for an explicit newer `Deployment Succeeded`.
          6. Run `python scripts/production_release_guard.py verify --url https://mezansalla.com`.
          7. Do not perform financial or other irreversible writes until verification returns `verified: true`.

          GitHub is the review/CI/audit source. Emergent Preview is the deployment source for this project.
          EOF
          echo "::notice title=Guarded Emergent redeploy required::CI passed. Use production_release_guard.py prepare + prepublish, deploy once, then require verified=true before production writes."
