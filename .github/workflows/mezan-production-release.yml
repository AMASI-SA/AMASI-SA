name: Mezan Production Release

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
  push:
    branches:
      - hotfix/prod-snap-meta-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mezan-production-release
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://mezansalla.com

jobs:
  backend-preflight:
    name: Backend preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend Python sources
        run: python -m compileall -q backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Build production frontend
        env:
          CI: "false"
        run: yarn build

  production-availability:
    name: Production availability after release
    if: github.event_name == 'push'
    needs:
      - backend-preflight
      - frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Allow continuous deployment to start
        run: sleep 90
      - name: Wait for backend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            http_code="$(curl -sS -o /tmp/mezan-health.json -w '%{http_code}' --max-time 15 "${PRODUCTION_URL}/health" || true)"
            if [ "$http_code" = "200" ] && python - <<'PY'
          import json
          from pathlib import Path

          try:
              payload = json.loads(Path('/tmp/mezan-health.json').read_text())
          except Exception:
              raise SystemExit(1)

          raise SystemExit(0 if payload.get('ok') is True and payload.get('service') == 'backend' else 1)
          PY
            then
              echo "Mezan backend health check passed."
              exit 0
            fi
            echo "Health attempt ${attempt}/30 not ready (HTTP ${http_code})."
            sleep 20
          done
          echo "Mezan backend did not become healthy within the release window."
          exit 1
      - name: Verify public app responds
        run: curl --fail --silent --show-error --location --max-time 20 "${PRODUCTION_URL}/" -o /dev/null
