name: Mezan Release Readiness

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
  push:
    branches:
      - hotfix/prod-snap-meta-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mezan-release-readiness
  cancel-in-progress: false

jobs:
  backend-preflight:
    name: Backend preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend Python sources
        run: python -m compileall -q backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Build production frontend
        env:
          CI: "false"
        run: yarn build

  release-handoff:
    name: Emergent manual redeploy required
    if: github.event_name == 'push'
    needs:
      - backend-preflight
      - frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Record supported deployment handoff
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Mezan release is CI-ready, not deployed

          Emergent does not pull, sync, webhook, or auto-redeploy this existing project from GitHub.

          A merge to `hotfix/prod-snap-meta-final` **does not update Preview or Production**.

          Supported production path:
          1. Apply the reviewed changes in the existing Emergent Preview environment.
          2. Verify Preview.
          3. In the same project open **Manage Publishing / Redeploy**.
          4. Choose **Overview → Re-deploy changes**.
          5. Keep the existing deployment; do not replace the database, domain, or unchanged secrets.

          GitHub is the review/CI/audit source. Emergent Preview is the deployment source for this project.
          EOF
          echo "::notice title=Emergent redeploy required::CI passed. GitHub cannot deploy this existing Emergent project. Apply the reviewed change to Preview, verify it, then use Manage Publishing > Re-deploy changes."
