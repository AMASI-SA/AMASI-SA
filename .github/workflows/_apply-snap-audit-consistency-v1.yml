name: Apply Snapchat Audit Consistency V1

on:
  push:
    branches:
      - fix/prod-snap-audit-consistency-v1

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-snap-audit-consistency-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          audit = 'backend/integrations_control_center/snapchat_order_source_audit.py'
          helper_marker = '\n\ndef build_order_audit_rows(\n'
          helper = '''\n\ndef platform_purchases_for_audit(\n    account_rows: list[dict[str, Any]],\n    campaign_rows: list[dict[str, Any]],\n    *,\n    requested_days: int,\n) -> tuple[int, str]:\n    """Use campaign-grain purchases for the campaign audit when available.\n\n    Account-day projections can trail campaign rows during the current account\n    day. The audit compares campaign attribution, so campaign rows are the\n    authoritative grain. Account rows remain a safe fallback when campaign\n    detail has not arrived yet.\n    """\n    source_rows = campaign_rows or account_rows\n    source = "campaign_rows" if campaign_rows else "account_rows_fallback"\n    summary = manager._aggregate_rows(source_rows, requested_days=requested_days)\n    return int(summary.get("orders") or 0), source\n'''
          replace_once(audit, helper_marker, helper + helper_marker)

          replace_once(
              audit,
              '''    account_rows = [row for row in performance_rows if row.get("entity_type") == "ad_account"]\n    campaign_rows = [row for row in performance_rows if row.get("entity_type") == "campaign"]\n    summary_rows = account_rows or campaign_rows\n    platform_summary = manager._aggregate_rows(summary_rows, requested_days=len(dates))\n    platform_purchases = int(platform_summary.get("orders") or 0)\n''',
              '''    account_rows = [row for row in performance_rows if row.get("entity_type") == "ad_account"]\n    campaign_rows = [row for row in performance_rows if row.get("entity_type") == "campaign"]\n    platform_purchases, platform_purchase_source = platform_purchases_for_audit(\n        account_rows,\n        campaign_rows,\n        requested_days=len(dates),\n    )\n''',
          )
          replace_once(
              audit,
              '''    result = build_order_audit_rows(\n        orders,\n        identities=identities,\n        timezone_name=timezone_name,\n        date_from=date_from_value,\n        date_to=date_to_value,\n        included_statuses=included_statuses,\n        platform_attributed_purchases=platform_purchases,\n    )\n    return {\n''',
              '''    result = build_order_audit_rows(\n        orders,\n        identities=identities,\n        timezone_name=timezone_name,\n        date_from=date_from_value,\n        date_to=date_to_value,\n        included_statuses=included_statuses,\n        platform_attributed_purchases=platform_purchases,\n    )\n    result["summary"]["platform_purchase_source"] = platform_purchase_source\n    return {\n''',
          )
          replace_once(
              audit,
              '''    "classify_order_origin",\n]\n''',
              '''    "classify_order_origin",\n    "platform_purchases_for_audit",\n]\n''',
          )

          backend_test = 'backend/tests/test_snapchat_order_source_audit_v1.py'
          replace_once(
              backend_test,
              '''    build_order_audit_rows,\n    classify_order_origin,\n)\n''',
              '''    build_order_audit_rows,\n    classify_order_origin,\n    platform_purchases_for_audit,\n)\n''',
          )
          test_text = Path(backend_test).read_text(encoding='utf-8')
          test_text += '''\n\ndef test_platform_purchase_audit_prefers_campaign_rows_over_stale_account_row():\n    purchases, source = platform_purchases_for_audit(\n        [{"date": "2026-08-05", "purchases": 11}],\n        [\n            {"date": "2026-08-05", "purchases": 26},\n            {"date": "2026-08-05", "purchases": 13},\n            {"date": "2026-08-05", "purchases": 9},\n        ],\n        requested_days=1,\n    )\n    assert purchases == 48\n    assert source == "campaign_rows"\n\n\ndef test_platform_purchase_audit_falls_back_to_account_rows_without_campaign_detail():\n    purchases, source = platform_purchases_for_audit(\n        [{"date": "2026-08-05", "purchases": 11}],\n        [],\n        requested_days=1,\n    )\n    assert purchases == 11\n    assert source == "account_rows_fallback"\n'''
          Path(backend_test).write_text(test_text, encoding='utf-8')

          page = 'frontend/src/pages/MarketingPlatformWorkspace.jsx'
          replace_once(
              page,
              'import { useCallback, useEffect, useState } from "react";\n',
              'import { useCallback, useEffect, useRef, useState } from "react";\n',
          )
          replace_once(
              page,
              '''    const [adSquadLoading, setAdSquadLoading] = useState(false);\n    const [adSquadError, setAdSquadError] = useState("");\n\n    const load = useCallback(async ({ silent = false } = {}) => {\n        if (silent) setRefreshing(true);\n        else setLoading(true);\n        setError("");\n        try {\n            const result = await getMarketingPerformance({\n                platform,\n                dateFrom: appliedRange.dateFrom,\n                dateTo: appliedRange.dateTo,\n                campaignQuery: appliedQuery,\n                page,\n                limit: 25,\n                activeCampaignsOnly,\n            });\n            setData(result);\n        } catch (loadError) {\n            const detail = loadError?.response?.data?.detail;\n            setError(\n                typeof detail === "string"\n                    ? detail\n                    : detail?.message || "تعذر تحميل تقرير المنصة الإعلانية.",\n            );\n        } finally {\n            setLoading(false);\n            setRefreshing(false);\n        }\n    }, [activeCampaignsOnly, appliedQuery, appliedRange, page, platform]);\n''',
              '''    const [adSquadLoading, setAdSquadLoading] = useState(false);\n    const [adSquadError, setAdSquadError] = useState("");\n    const loadSequenceRef = useRef(0);\n\n    const load = useCallback(async ({ silent = false } = {}) => {\n        const requestId = ++loadSequenceRef.current;\n        if (silent) setRefreshing(true);\n        else setLoading(true);\n        setError("");\n        try {\n            const result = await getMarketingPerformance({\n                platform,\n                dateFrom: appliedRange.dateFrom,\n                dateTo: appliedRange.dateTo,\n                campaignQuery: appliedQuery,\n                page,\n                limit: 25,\n                activeCampaignsOnly,\n            });\n            if (requestId !== loadSequenceRef.current) return;\n            setData(result);\n            setError("");\n        } catch (loadError) {\n            if (requestId !== loadSequenceRef.current) return;\n            const detail = loadError?.response?.data?.detail;\n            setError(\n                typeof detail === "string"\n                    ? detail\n                    : detail?.message || "تعذر تحميل تقرير المنصة الإعلانية.",\n            );\n        } finally {\n            if (requestId === loadSequenceRef.current) {\n                setLoading(false);\n                setRefreshing(false);\n            }\n        }\n    }, [activeCampaignsOnly, appliedQuery, appliedRange, page, platform]);\n''',
          )

          component = 'frontend/src/components/marketing/SnapchatOrderSourceAudit.jsx'
          replace_once(
              component,
              '''                            title="طلبات الحملات المؤكدة"\n                            value={summary.campaign_matched_orders}\n                            note="مطابقة دقيقة بمعرف الحملة أو اسم Snapchat الفريد"\n''',
              '''                            title="طلبات كل الحملات المؤكدة"\n                            value={summary.campaign_matched_orders}\n                            note="يشمل الحملات النشطة والمتوقفة؛ قد يختلف عن جدول النشطة فقط"\n''',
          )
          replace_once(
              component,
              '''                            note="إسناد المنصة، وليس سجل الطلبات المحاسبي"\n''',
              '''                            note="مجموع صفوف حملات Snapchat، وليس سجل الطلبات المحاسبي"\n''',
          )

          component_test = 'frontend/src/components/marketing/SnapchatOrderSourceAudit.test.jsx'
          test_text = Path(component_test).read_text(encoding='utf-8')
          marker = '        expect(container.textContent).toContain("48");\n'
          replacement = marker + '        expect(container.textContent).toContain("طلبات كل الحملات المؤكدة");\n        expect(container.textContent).toContain("قد يختلف عن جدول النشطة فقط");\n'
          if marker not in test_text:
              raise SystemExit('component test marker missing')
          Path(component_test).write_text(test_text.replace(marker, replacement, 1), encoding='utf-8')

          page_test = Path('frontend/src/pages/MarketingPlatformWorkspaceLatestRequest.test.js')
          page_test.write_text('''const fs = require("fs");\nconst path = require("path");\n\ntest("ignores stale report success, error and completion state", () => {\n    const source = fs.readFileSync(\n        path.join(__dirname, "MarketingPlatformWorkspace.jsx"),\n        "utf8",\n    );\n    expect(source).toContain("const loadSequenceRef = useRef(0);");\n    expect(source).toContain("const requestId = ++loadSequenceRef.current;");\n    expect(source.match(/requestId !== loadSequenceRef\\.current/g)?.length).toBeGreaterThanOrEqual(2);\n    expect(source).toContain("if (requestId === loadSequenceRef.current)");\n    expect(source).toContain("setData(result);");\n    expect(source).toContain("setError(\\\"\\\");");\n});\n''', encoding='utf-8')

          workflow = '.github/workflows/prod-snap-order-source-audit-v1.yml'
          text = Path(workflow).read_text(encoding='utf-8')
          text = text.replace(
              '      - "frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx"\n',
              '      - "frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx"\n      - "frontend/src/pages/MarketingPlatformWorkspace.jsx"\n      - "frontend/src/pages/MarketingPlatformWorkspaceLatestRequest.test.js"\n',
              1,
          )
          text = text.replace(
              '          src/components/marketing/AdsEntityLevelWorkspace.test.jsx\n',
              '          src/components/marketing/AdsEntityLevelWorkspace.test.jsx\n          src/pages/MarketingPlatformWorkspaceLatestRequest.test.js\n',
              1,
          )
          text = text.replace(
              '          grep -q \'auditAccountId={selectedAccountId}\' "$PAGE"\n',
              '          grep -q \'auditAccountId={selectedAccountId}\' "$PAGE"\n          grep -q \'loadSequenceRef = useRef(0)\' "$PAGE"\n          grep -q \'requestId !== loadSequenceRef.current\' "$PAGE"\n',
              1,
          )
          Path(workflow).write_text(text, encoding='utf-8')
          PY
      - name: Install focused backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0
          httpx pytest pytest-asyncio openpyxl cryptography reportlab
          python-multipart bcrypt PyJWT
      - name: Test Backend audit
        working-directory: backend
        run: python -m pytest tests/test_snapchat_order_source_audit_v1.py -q --tb=short
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive
      - name: Test frontend contracts
        working-directory: frontend
        env:
          CI: 'true'
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/SnapchatOrderSourceAudit.test.jsx
          src/pages/MarketingPlatformWorkspaceLatestRequest.test.js
      - name: Build Production frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build
      - name: Commit focused fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/integrations_control_center/snapchat_order_source_audit.py \
            backend/tests/test_snapchat_order_source_audit_v1.py \
            frontend/src/pages/MarketingPlatformWorkspace.jsx \
            frontend/src/pages/MarketingPlatformWorkspaceLatestRequest.test.js \
            frontend/src/components/marketing/SnapchatOrderSourceAudit.jsx \
            frontend/src/components/marketing/SnapchatOrderSourceAudit.test.jsx \
            .github/workflows/prod-snap-order-source-audit-v1.yml
          git commit -m "fix(prod-snap): align audit totals and ignore stale report errors"
          git push origin HEAD:fix/prod-snap-audit-consistency-v1
