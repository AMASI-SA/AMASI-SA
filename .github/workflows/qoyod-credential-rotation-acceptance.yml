name: Qoyod Credential Rotation Acceptance

on:
  push:
    branches:
      - codex/qoyod-restore-sending-1
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations/qoyod/credentials.py"
      - "backend/integrations/qoyod/models.py"
      - "backend/integrations/qoyod/routes.py"
      - "backend/integrations_control_center/legacy_readers.py"
      - "backend/tests/qoyod_credentials_process_app.py"
      - "backend/tests/test_qoyod_credentials_real_mongo.py"
      - "backend/tests/test_qoyod_credentials_rotation_http.py"
      - "backend/tests/test_mezan_integrations_v2.py"
      - "frontend/src/pages/QoyodSettings.jsx"
      - "frontend/src/pages/QoyodSettings.credentials.test.jsx"
      - ".github/workflows/qoyod-credential-rotation-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qoyod-credential-rotation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  backend-http-mongo:
    name: Backend HTTP and real Mongo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      QOYOD_TEST_MONGO_URL: mongodb://127.0.0.1:27017
      QOYOD_API_BASE: https://synthetic.invalid
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install repository and isolated test dependencies
        shell: bash
        run: |
          sed '/^emergentintegrations==/d' requirements.txt > /tmp/qoyod-credentials-requirements.txt
          python -m pip install -q -r /tmp/qoyod-credentials-requirements.txt
          python -m pip install -q pytest-asyncio mongomock-motor
      - name: Generate an isolated credential-encryption key
        shell: bash
        run: |
          python - <<'PY'
          import os
          from cryptography.fernet import Fernet

          key = Fernet.generate_key().decode("ascii")
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("QOYOD_TOKEN_ENC_KEY=" + key + "\n")
          PY
      - name: Compile credential source and acceptance tests
        run: >-
          python -m compileall -q
          integrations/qoyod/credentials.py
          integrations/qoyod/models.py
          integrations/qoyod/routes.py
          integrations_control_center/legacy_readers.py
          tests/qoyod_credentials_process_app.py
          tests/test_qoyod_credentials_real_mongo.py
          tests/test_qoyod_credentials_rotation_http.py
          tests/test_mezan_integrations_v2.py
      - name: Run credential, consumer, and real-Mongo acceptance
        env:
          QOYOD_RESULTS_FILE: ${{ runner.temp }}/qoyod-credential-results.xml
        run: >-
          python -m pytest -q --tb=short
          --junitxml "$QOYOD_RESULTS_FILE"
          tests/test_qoyod_credentials_rotation_http.py
          tests/test_qoyod_credentials_real_mongo.py
          tests/test_mezan_integrations_v2.py
          tests/test_plan_b_payment_path_fix.py::test_qoyod_invoices_written_only_after_payment
          tests/test_qoyod_manual_send_plan_b.py::test_send_refuses_when_already_sent
      - name: Require both real-Mongo acceptance cases
        if: always()
        env:
          QOYOD_RESULTS_FILE: ${{ runner.temp }}/qoyod-credential-results.xml
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          results_path = Path(os.environ["QOYOD_RESULTS_FILE"])
          if not results_path.is_file():
              raise SystemExit("acceptance results are missing")

          required = {
              "test_saved_credential_survives_real_process_restart_and_is_used",
              "test_real_mongo_rejects_verification_after_concurrent_rotation",
          }
          cases = {}
          for case in ET.parse(results_path).getroot().iter("testcase"):
              name = case.attrib.get("name")
              if name in required:
                  cases.setdefault(name, []).append(case)

          for name in sorted(required):
              matches = cases.get(name, [])
              if len(matches) != 1:
                  raise SystemExit(f"required real-Mongo result count for {name}: {len(matches)}")
              outcome = matches[0]
              blocked = [tag for tag in ("skipped", "failure", "error") if outcome.find(tag) is not None]
              if blocked:
                  raise SystemExit(f"required real-Mongo test {name} was not passed: {','.join(blocked)}")
              print(f"REAL_MONGO_TEST_PASS {name}")
          PY
      - name: Clean and verify isolated test resources
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          python - <<'PY'
          import os
          from pymongo import MongoClient

          client = MongoClient(os.environ["QOYOD_TEST_MONGO_URL"], serverSelectionTimeoutMS=5000)
          prefixes = ("qoyod_credentials_restart_", "qoyod_credentials_concurrency_")
          leftovers = [name for name in client.list_database_names() if name.startswith(prefixes)]
          for name in leftovers:
              client.drop_database(name)
          client.close()
          if leftovers:
              raise SystemExit(f"removed {len(leftovers)} leaked isolated test database(s)")
          print("ISOLATION_CLEANUP databases=clean")
          PY
          if [[ $? -ne 0 ]]; then
            cleanup_failed=1
          fi

          mapfile -t leaked_pids < <(pgrep -f "[u]vicorn tests.qoyod_credentials_process_app:app" || true)
          if (( ${#leaked_pids[@]} > 0 )); then
            kill "${leaked_pids[@]}" 2>/dev/null || true
            cleanup_failed=1
            echo "ISOLATION_CLEANUP removed_test_processes=${#leaked_pids[@]}"
          else
            echo "ISOLATION_CLEANUP processes=clean"
          fi
          exit "$cleanup_failed"

  frontend-settings:
    name: Qoyod settings UI and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_BACKEND_URL: https://mezansalla.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable repository Yarn version
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run the Qoyod credential settings suite
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand
          --testMatch '**/QoyodSettings.credentials.test.jsx'
      - name: Compile the current GitHub source
        env:
          CI: "false"
        run: yarn build
