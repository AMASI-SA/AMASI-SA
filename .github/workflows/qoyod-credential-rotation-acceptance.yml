name: Qoyod Credential Rotation Acceptance

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations/qoyod/credentials.py"
      - "backend/integrations/qoyod/models.py"
      - "backend/integrations/qoyod/routes.py"
      - "backend/integrations_control_center/legacy_readers.py"
      - "backend/tests/qoyod_credentials_process_app.py"
      - "backend/tests/test_qoyod_credentials_real_mongo.py"
      - "backend/tests/test_qoyod_credentials_rotation_http.py"
      - "backend/tests/test_mezan_integrations_v2.py"
      - "frontend/src/pages/QoyodSettings.jsx"
      - "frontend/src/pages/QoyodSettings.credentials.test.jsx"
      - ".github/workflows/qoyod-credential-rotation-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qoyod-credential-rotation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  backend-http-mongo:
    name: Backend HTTP and real Mongo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      QOYOD_TEST_MONGO_URL: mongodb://127.0.0.1:27017
      QOYOD_API_BASE: https://synthetic.invalid
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install repository and isolated test dependencies
        shell: bash
        run: |
          sed '/^emergentintegrations==/d' requirements.txt > /tmp/qoyod-credentials-requirements.txt
          python -m pip install -q -r /tmp/qoyod-credentials-requirements.txt
          python -m pip install -q pytest-asyncio mongomock-motor
      - name: Generate an isolated credential-encryption key
        shell: bash
        run: |
          python - <<'PY'
          import os
          from cryptography.fernet import Fernet

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(
                  "QOYOD_TOKEN_ENC_KEY="
                  + Fernet.generate_key().decode("ascii")
                  + "\n"
              )
          PY
      - name: Compile credential source and acceptance tests
        run: >-
          python -m compileall -q
          integrations/qoyod/credentials.py
          integrations/qoyod/models.py
          integrations/qoyod/routes.py
          integrations_control_center/legacy_readers.py
          tests/qoyod_credentials_process_app.py
          tests/test_qoyod_credentials_real_mongo.py
          tests/test_qoyod_credentials_rotation_http.py
          tests/test_mezan_integrations_v2.py
      - name: Run credential, consumer, and real-Mongo acceptance
        run: >-
          python -m pytest -q --tb=short
          tests/test_qoyod_credentials_rotation_http.py
          tests/test_qoyod_credentials_real_mongo.py
          tests/test_mezan_integrations_v2.py
          tests/test_plan_b_payment_path_fix.py::test_qoyod_invoices_written_only_after_payment
          tests/test_qoyod_manual_send_plan_b.py::test_send_refuses_when_already_sent

  frontend-settings:
    name: Qoyod settings UI and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_BACKEND_URL: https://mezansalla.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable repository Yarn version
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run the Qoyod credential settings suite
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand
          --testMatch '**/QoyodSettings.credentials.test.jsx'
      - name: Compile the current GitHub source
        env:
          CI: "false"
        run: yarn build
