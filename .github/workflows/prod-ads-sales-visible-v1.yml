name: Production Ads Native Spend and Sales V2

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "frontend/src/index.js"
      - "frontend/src/components/marketing/CampaignManagerTable.jsx"
      - "frontend/src/components/marketing/CampaignManagerTable.test.jsx"
      - "frontend/src/components/marketing/AdSquadManagerTable.jsx"
      - "frontend/src/components/marketing/AdSquadManagerTable.test.jsx"
      - "frontend/src/components/marketing/AdManagerTable.jsx"
      - "frontend/src/components/marketing/AdManagerTable.test.jsx"
      - ".github/workflows/prod-ads-sales-visible-v1.yml"

permissions:
  contents: read

jobs:
  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test native spend and sales columns
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/CampaignManagerTable.test.jsx
          src/components/marketing/AdSquadManagerTable.test.jsx
          src/components/marketing/AdManagerTable.test.jsx
          src/marketingAdsTableUXEnhancer.test.js
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce separate spend and sales cells
        working-directory: .
        run: |
          INDEX=frontend/src/index.js
          CAMPAIGNS=frontend/src/components/marketing/CampaignManagerTable.jsx
          SQUADS=frontend/src/components/marketing/AdSquadManagerTable.jsx
          ADS=frontend/src/components/marketing/AdManagerTable.jsx
          ! grep -q 'marketingAdsSalesVisibilityFix' "$INDEX"
          ! grep -q 'marketingCampaignColumnOrder' "$INDEX"
          grep -q 'CAMPAIGN_MANAGER_NATIVE_COLUMN_ORDER' "$CAMPAIGNS"
          grep -q 'data-column-id={column.id}' "$CAMPAIGNS"
          grep -q 'data-column-id="spend"' "$SQUADS"
          grep -q 'data-column-id="sales"' "$SQUADS"
          grep -q 'data-column-id="spend"' "$ADS"
          grep -q 'data-column-id="sales"' "$ADS"
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('frontend/src/components/marketing/CampaignManagerTable.jsx').read_text()
          start = text.index('CAMPAIGN_MANAGER_DEFAULT_COLUMNS')
          block = text[start:text.index(']);', start)]
          ids = re.findall(r'"([a-z_]+)"', block)
          assert ids.index('spend') + 1 == ids.index('sales'), ids
          PY
          ! grep -R -q 'data-mezan-sales-with-spend' "$CAMPAIGNS" "$SQUADS" "$ADS"
          ! grep -R -q 'data-mezan-folded-spend-cell' "$CAMPAIGNS" "$SQUADS" "$ADS"
