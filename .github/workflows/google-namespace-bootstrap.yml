name: Google namespace bootstrap capabilities
on:
  push:
    branches: [codex/google-namespace-bootstrap-wip-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_namespace_bootstrap*.py
      - backend/tests/test_google_namespace_bootstrap*.py
      - .github/workflows/google-namespace-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-replica-capabilities:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      GOOGLE_NAMESPACE_BOOTSTRAP_TEST_ADMIN_URI: mongodb://namespace_admin:ephemeral_fixture_only@127.0.0.1:27483/?authSource=admin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capability-only dependencies
        run: >-
          python -m pip install motor==3.7.1 pymongo==4.18.3 dnspython==2.9.0
          pytest==9.0.3 pytest-asyncio==1.4.0
      - name: Start disposable authenticated loopback replica
        shell: bash
        run: |
          set -euo pipefail
          NS_BOOTSTRAP_KEY_DIR="$RUNNER_TEMP/namespace-bootstrap-key"
          mkdir -p "$NS_BOOTSTRAP_KEY_DIR"
          python - "$NS_BOOTSTRAP_KEY_DIR/key" <<'PYCODE'
          import base64,pathlib,secrets,sys
          path=pathlib.Path(sys.argv[1])
          path.write_text(base64.b64encode(secrets.token_bytes(512)).decode())
          path.chmod(0o400)
          PYCODE
          sudo chown 999:999 "$NS_BOOTSTRAP_KEY_DIR/key"
          docker run -d --name namespace-bootstrap-rs -p 127.0.0.1:27483:27483 \
            -e MONGO_INITDB_ROOT_USERNAME=namespace_admin -e MONGO_INITDB_ROOT_PASSWORD=ephemeral_fixture_only \
            -v "$NS_BOOTSTRAP_KEY_DIR/key:/run/namespace-key:ro" mongo:8.0.26 \
            --port 27483 --replSet namespaceBootstrap --keyFile /run/namespace-key --bind_ip_all
          python - <<'PYCODE'
          import os,time
          from pymongo import MongoClient
          client=MongoClient(os.environ['GOOGLE_NAMESPACE_BOOTSTRAP_TEST_ADMIN_URI'],directConnection=True,serverSelectionTimeoutMS=1000)
          for attempt in range(60):
              try:
                  client.admin.command('ping')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('disposable_authenticated_bootstrap_failed')
          try:
              client.admin.command({'replSetInitiate':{'_id':'namespaceBootstrap','members':[{'_id':0,'host':'127.0.0.1:27483'}]}})
              for attempt in range(60):
                  try:
                      if client.admin.command('hello').get('isWritablePrimary') is True:break
                  except Exception:pass
                  time.sleep(1)
              else:raise SystemExit('disposable_primary_unproved')
          except Exception:
              raise SystemExit('disposable_replica_initialization_failed') from None
          finally:client.close()
          PYCODE
      - name: Prove DDL and restricted permissions before production implementation
        run: |
          python -m pytest --noconftest -q -W error --tb=short --junitxml=namespace-bootstrap.xml \
            backend/tests/test_google_namespace_bootstrap_capabilities_mongo.py
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root=ET.parse('namespace-bootstrap.xml').getroot();cases=root.findall('.//testcase')
          assert len(cases)==19, len(cases)
          assert all('bootstrap_capabilities_mongo' in c.get('classname','') for c in cases)
          assert not root.findall('.//failure') and not root.findall('.//error') and not root.findall('.//skipped')
          required={
              'test_real_local_transaction_creates_all_four_with_required_restricted_privileges',
              'test_real_abort_rolls_back_each_partial_ddl_stage',
              'test_real_snapshot_explicit_ddl_rejected',
              'test_real_existing_empty_collection_cannot_receive_new_index_in_transaction',
              'test_real_raw_create_on_existing_same_options_is_noop',
              'test_real_denied_target_privilege_is_not_replaced_by_broad_role',
              'test_real_catalog_commands_are_not_transaction_snapshot_reads',
              'test_real_foreign_create_race_before_transaction_is_not_silently_indexed',
              'test_real_drop_recreate_changes_uuid_even_when_contract_same',
              'test_real_global_reservation_serializes_independent_clients',
          }
          assert {c.get('name','').split('[')[0] for c in cases}==required
          print('Verified 19 actual authenticated Mongo capability cases, zero skips; no runtime implementation tested')
          PYCODE
      - name: Remove disposable replica
        if: always()
        run: docker rm -f namespace-bootstrap-rs || true
