name: Campaign hover exact source diagnosis
on:
  push:
    branches: [ops/patch-campaign-hover-live-refresh-20261113]
    paths: [.github/workflows/campaign-hover-exact-diagnosis.yml]
permissions:
  contents: write
jobs:
  checkpoint-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_BRANCH: codex/campaign-hover-live-refresh-20261113
      EXPECTED_HEAD: 777ee5fcf1db51454a170d07ea3ec8c2bb129413
      PRODUCTION_BASE: 8d25f7a6fa9a310b319b753c32457e70987f7c51
      PATCH_SOURCE: a18ce6265325a979d3c797c9610c24e9de742e81
      JWT_SECRET: campaign-hover-offline-test-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 777ee5fcf1db51454a170d07ea3ec8c2bb129413
          fetch-depth: 0
      - name: Preserve reviewed WIP only, never production or release intent
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/hotfix/prod-snap-meta-final | cut -f1)" = "$PRODUCTION_BASE"
          test "$(git ls-files '*AGENTS.md')" = AGENTS.md
          git fetch --no-tags origin "$PATCH_SOURCE"
          git show "$PATCH_SOURCE:scripts/ops_patch_campaign_hover_native.py" > "$RUNNER_TEMP/apply.py"
          python -B - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'apply.py'
          text = p.read_text()
          for before, after in (
              ('d144f05257f461a1f4aa35e069102e96aa7f87c680ddf31a50d66e7e0b50c8f6', '51b753e280b85eddb3394eb916d329240344253e18de5599c65c1b9205e69f1d82'),
              ('364bc49055414af677777baf770f65bd6ea43edfde7499cdb949ecd49919860f', '6f30365740ea8690f712b75d99926d0f14da351ad8754f1ca668e7e7a21067048'),
          ):
              assert text.count(before) == 1
              text = text.replace(before, after, 1)
          p.write_text(text)
          PY
          python -B "$RUNNER_TEMP/apply.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/order_engine/campaign_hover.py frontend/src/pages/OrdersV2.jsx frontend/src/pages/AdvancedDashboard.jsx frontend/src/lib/orderCampaignAttribution.js frontend/src/components/CampaignHoverBadge.jsx frontend/src/hooks/useCampaignHover.js
          git commit -m 'WIP: preserve native campaign and Salla-label readers; acceptance still blocked'
          git diff --exit-code "$EXPECTED_HEAD" HEAD -- release/release-intent-v5.json .github
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "WIP_TASK_SOURCE=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install public test dependencies
        run: sed '/^emergentintegrations==/d' backend/requirements.txt | python -m pip install -q -r /dev/stdin pytest-asyncio
      - name: Diagnose exact fixture failures without altering runtime source
        working-directory: backend
        run: |
          python -B - <<'PY'
          import inspect, pytest
          from datetime import datetime, timezone
          from order_engine import campaign_hover as hover
          print('WINDOW_FUNCTION', inspect.getsource(hover._window))
          print('READ_ENTRY', '\n'.join(inspect.getsource(hover.read_campaign_hover).splitlines()[:30]))
          at = datetime(2026, 11, 13, 12, 30, tzinfo=timezone.utc)
          for zone in ('Asia/Riyadh', 'America/Los_Angeles'):
              print('BASE_WINDOW', zone, repr(hover._window(at, zone)))
          class Diagnostic:
              def pytest_exception_interact(self, node, call, report):
                  for entry in call.excinfo.traceback:
                      if str(entry.path).endswith('campaign_hover.py'):
                          frame = entry.frame.f_locals
                          print('FAILED_FRAME', entry.lineno, {k: repr(frame.get(k)) for k in ('now','label_window','labels','windows','start','day','at')})
                  print('WINDOW_AT_FAILURE', inspect.getsource(hover._window))
                  for zone in ('Asia/Riyadh', 'America/Los_Angeles'):
                      print('FAILURE_WINDOW', zone, repr(hover._window(at, zone)))
          raise SystemExit(pytest.main(['-q','-s','--tb=short','tests/test_campaign_hover_native_sources.py'], plugins=[Diagnostic()]))
          PY
