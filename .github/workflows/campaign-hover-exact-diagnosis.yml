name: Campaign hover exact source diagnosis
on:
  push:
    branches: [ops/patch-campaign-hover-live-refresh-20261113]
    paths: [.github/workflows/campaign-hover-exact-diagnosis.yml]
permissions:
  contents: read
jobs:
  export-exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 777ee5fcf1db51454a170d07ea3ec8c2bb129413
          fetch-depth: 1
          persist-credentials: false
      - name: Export pinned tracked source and original proposed patch
        run: |
          test "$(git rev-parse HEAD)" = 777ee5fcf1db51454a170d07ea3ec8c2bb129413
          test "$(git ls-files '*AGENTS.md')" = AGENTS.md
          mkdir -p "$RUNNER_TEMP/hover-diagnosis"
          git archive --format=zip HEAD > "$RUNNER_TEMP/hover-diagnosis/source-777ee5fc.zip"
          git fetch --depth=1 --no-tags origin a18ce6265325a979d3c797c9610c24e9de742e81
          git show a18ce6265325a979d3c797c9610c24e9de742e81:scripts/ops_patch_campaign_hover_native.py > "$RUNNER_TEMP/hover-diagnosis/original-patch.py"
      - name: Capture rejected preparation without treating it as acceptance
        run: |
          set +e
          python -B "$RUNNER_TEMP/hover-diagnosis/original-patch.py" > "$RUNNER_TEMP/hover-diagnosis/preparation.log" 2>&1
          status=$?
          set -e
          echo "PREPARATION_EXIT=$status" >> "$RUNNER_TEMP/hover-diagnosis/preparation.log"
          git diff --binary > "$RUNNER_TEMP/hover-diagnosis/proposed.patch"
          sha256sum backend/order_engine/campaign_hover.py frontend/src/pages/OrdersV2.jsx frontend/src/pages/AdvancedDashboard.jsx frontend/src/lib/orderCampaignAttribution.js frontend/src/components/CampaignHoverBadge.jsx frontend/src/hooks/useCampaignHover.js > "$RUNNER_TEMP/hover-diagnosis/prepared.sha256"
          git diff --exit-code -- release/release-intent-v5.json .github
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hover-exact-source-777ee5fc-review
          path: ${{ runner.temp }}/hover-diagnosis
          if-no-files-found: error
          retention-days: 3
