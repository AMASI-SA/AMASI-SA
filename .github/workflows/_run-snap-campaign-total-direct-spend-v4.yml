name: Run Snapchat Campaign Total Direct Spend V4

on:
  push:
    branches:
      - fix/prod-snap-campaign-total-direct-spend-v4

permissions:
  contents: write

concurrency:
  group: run-snap-campaign-total-direct-spend-v4
  cancel-in-progress: true

jobs:
  apply-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-snap-campaign-total-direct-spend-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply campaign TOTAL repair
        run: python .github/scripts/apply_snap_campaign_total_direct_spend_v4.py

      - name: Add null-display contract and permanent CI
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("frontend/src/components/marketing/AdsPerformanceExplorer.test.jsx")
          text = test_path.read_text(encoding="utf-8")
          marker = '''    test("builds a 24-hour Snapchat input with Arabic hour labels", () => {\n'''
          if "keeps unavailable commercial metrics as null" not in text:
              addition = '''    test("keeps unavailable commercial metrics as null instead of fake zero", () => {\n        const rows = buildAdsChartRows([\n            {\n                date: "2026-08-06",\n                spend_sar: 2973.19,\n                sales_sar: null,\n                orders: null,\n                roas: null,\n            },\n        ]);\n\n        expect(rows[0].spend_raw).toBe(2973.19);\n        expect(rows[0].sales_raw).toBeNull();\n        expect(rows[0].orders_raw).toBeNull();\n        expect(rows[0].roas_raw).toBeNull();\n    });\n\n''' + marker
              if marker not in text:
                  raise SystemExit("AdsPerformanceExplorer test marker missing")
              test_path.write_text(text.replace(marker, addition, 1), encoding="utf-8")
          PY

          cat > .github/workflows/prod-snap-platform-source-isolation-v1.yml <<'YAML'
          name: Production Snapchat Platform Source Isolation V1

          on:
            pull_request:
              branches:
                - hotfix/prod-snap-meta-final
              paths:
                - "backend/integrations_control_center/snapchat_platform_source_integrity.py"
                - "backend/tests/test_snapchat_platform_source_integrity_v1.py"
                - "frontend/src/services/marketingPerformance.js"
                - "frontend/src/services/marketingPerformance.test.js"
                - "frontend/src/components/marketing/AdsPerformanceExplorer.jsx"
                - "frontend/src/components/marketing/AdsPerformanceExplorer.test.jsx"
                - ".github/workflows/prod-snap-platform-source-isolation-v1.yml"
            push:
              branches:
                - hotfix/prod-snap-meta-final
              paths:
                - "backend/integrations_control_center/snapchat_platform_source_integrity.py"
                - "backend/tests/test_snapchat_platform_source_integrity_v1.py"
                - "frontend/src/services/marketingPerformance.js"
                - "frontend/src/services/marketingPerformance.test.js"
                - "frontend/src/components/marketing/AdsPerformanceExplorer.jsx"
                - "frontend/src/components/marketing/AdsPerformanceExplorer.test.jsx"
                - ".github/workflows/prod-snap-platform-source-isolation-v1.yml"

          permissions:
            contents: read

          jobs:
            backend-contract:
              runs-on: ubuntu-22.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                - name: Install focused dependencies
                  run: >-
                    python -m pip install -q
                    fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor
                    httpx pytest pytest-asyncio openpyxl cryptography reportlab
                    python-multipart PyJWT bcrypt
                - name: Compile and test backend contracts
                  working-directory: backend
                  run: |
                    python -m py_compile \
                      integrations_control_center/snapchat_platform_source_integrity.py
                    python -m pytest -q --tb=short \
                      tests/test_snapchat_platform_source_integrity_v1.py \
                      tests/test_snapchat_order_source_audit_v1.py \
                      tests/test_ads_auto_sync_scheduler_v2.py
                - name: Enforce source ownership
                  run: |
                    FILE=backend/integrations_control_center/snapchat_platform_source_integrity.py
                    grep -q 'REQUIRED_ACCOUNT_TOTAL_FIELDS = frozenset({"spend"})' "$FILE"
                    grep -q 'merge_direct_spend_with_campaign_metrics' "$FILE"
                    grep -q 'complete_campaign_breakdown_sum' "$FILE"
                    grep -q 'ADS_MANAGER_ACTION_REPORT_TIME' "$FILE"
                    grep -q 'legacy_hour_conversions_hidden_while_pending' "$FILE"

            frontend-test-and-build:
              runs-on: ubuntu-22.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                - name: Enable Yarn Classic
                  run: corepack enable && corepack prepare yarn@1.22.22 --activate
                - name: Install frontend dependencies
                  working-directory: frontend
                  run: yarn install --non-interactive
                - name: Test source isolation UI
                  working-directory: frontend
                  env:
                    CI: "true"
                  run: >-
                    yarn test --watchAll=false --runInBand --runTestsByPath
                    src/services/marketingPerformance.test.js
                    src/components/marketing/AdsPerformanceExplorer.test.jsx
                    src/marketingCampaignProfitabilityHydration.test.js
                    src/components/marketing/CampaignManagerTable.test.jsx
                    src/components/marketing/SnapchatOrderSourceAudit.test.jsx
                    src/pages/MarketingPlatformWorkspacePlatformSnapshot.test.js
                - name: Build Production frontend
                  working-directory: frontend
                  env:
                    CI: "false"
                  run: yarn build
                - name: Enforce null and snapshot contracts
                  run: |
                    grep -q 'platform_total_snapshot_ready' frontend/src/services/marketingPerformance.js
                    grep -q 'value === null || value === undefined' frontend/src/components/marketing/AdsPerformanceExplorer.jsx
          YAML

      - name: Install backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor
          httpx pytest pytest-asyncio openpyxl cryptography reportlab
          python-multipart PyJWT bcrypt

      - name: Compile and run backend contracts
        working-directory: backend
        run: |
          python -m py_compile integrations_control_center/snapchat_platform_source_integrity.py
          python -m pytest -q --tb=short \
            tests/test_snapchat_platform_source_integrity_v1.py \
            tests/test_snapchat_order_source_audit_v1.py \
            tests/test_ads_auto_sync_scheduler_v2.py

      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Run frontend contracts
        working-directory: frontend
        env:
          CI: 'true'
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/services/marketingPerformance.test.js
          src/components/marketing/AdsPerformanceExplorer.test.jsx
          src/marketingCampaignProfitabilityHydration.test.js
          src/components/marketing/CampaignManagerTable.test.jsx
          src/components/marketing/SnapchatOrderSourceAudit.test.jsx
          src/pages/MarketingPlatformWorkspacePlatformSnapshot.test.js

      - name: Build Production frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build

      - name: Enforce campaign TOTAL contracts
        run: |
          FILE=backend/integrations_control_center/snapchat_platform_source_integrity.py
          grep -q 'REQUIRED_ACCOUNT_TOTAL_FIELDS = frozenset({"spend"})' "$FILE"
          grep -q 'merge_direct_spend_with_campaign_metrics' "$FILE"
          grep -q 'complete_campaign_breakdown_sum' "$FILE"
          grep -q 'platform_total_snapshot_ready' frontend/src/services/marketingPerformance.js
          grep -q 'value === null || value === undefined' frontend/src/components/marketing/AdsPerformanceExplorer.jsx

      - name: Commit tested repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/prod-snap-platform-source-isolation-v1.yml \
            backend/integrations_control_center/snapchat_platform_source_integrity.py \
            backend/tests/test_snapchat_platform_source_integrity_v1.py \
            frontend/src/services/marketingPerformance.js \
            frontend/src/services/marketingPerformance.test.js \
            frontend/src/components/marketing/AdsPerformanceExplorer.jsx \
            frontend/src/components/marketing/AdsPerformanceExplorer.test.jsx
          git commit -m "fix(prod-snap): unlock campaign TOTAL commercial snapshots"
          git push origin HEAD:fix/prod-snap-campaign-total-direct-spend-v4
