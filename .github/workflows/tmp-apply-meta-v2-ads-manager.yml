name: Apply Meta V2 Ads Manager Source Fix

on:
  push:
    branches:
      - fix/ads-manager-meta-v2-source

permissions:
  contents: write

concurrency:
  group: apply-meta-v2-ads-manager-source
  cancel-in-progress: true

jobs:
  apply-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ads-manager-meta-v2-source
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply, verify, and persist outcome
        run: |
          set +e

          python - <<'PY' >/tmp/align.log 2>&1
          from pathlib import Path

          path = Path('scripts/tmp_apply_meta_v2_ads_manager.py')
          text = path.read_text(encoding='utf-8')
          old = '''    provider_source_count = service.count(provider_source_old)
    if provider_source_count != 2:
        raise SystemExit(
            "provider source key: expected two matches, "
            f"found {provider_source_count}"
        )
    service = service.replace(provider_source_old, provider_source_new)
'''
          new = '''    provider_source_count = service.count(provider_source_old)
    if provider_source_count != 1:
        raise SystemExit(
            "provider source key: expected one match, "
            f"found {provider_source_count}"
        )
    service = service.replace(provider_source_old, provider_source_new, 1)
    if provider_source_old in service:
        raise SystemExit("legacy provider source expression remains")
'''
          if text.count(old) != 1:
              raise SystemExit('Temporary patch source-count guard is missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ALIGN_STATUS=$?

          PATCH_STATUS=99
          COMPILE_STATUS=99
          INSTALL_STATUS=99
          TEST_STATUS=99
          AST_STATUS=99

          if [ "$ALIGN_STATUS" -eq 0 ]; then
            python scripts/tmp_apply_meta_v2_ads_manager.py >/tmp/patch.log 2>&1
            PATCH_STATUS=$?
          fi

          if [ "$PATCH_STATUS" -eq 0 ]; then
            python -m py_compile \
              backend/ads_manager/service.py \
              backend/tests/test_unified_ads_manager_phase1.py \
              >/tmp/compile.log 2>&1
            COMPILE_STATUS=$?
          fi

          if [ "$COMPILE_STATUS" -eq 0 ]; then
            python -m pip install --disable-pip-version-check -q \
              pytest pytest-asyncio fastapi httpx pydantic \
              >/tmp/install.log 2>&1
            INSTALL_STATUS=$?
          fi

          if [ "$INSTALL_STATUS" -eq 0 ]; then
            PYTHONPATH=backend \
            MEZAN_ADS_MANAGER_READ_ONLY_ENABLED=true \
            pytest -q backend/tests/test_unified_ads_manager_phase1.py \
              >/tmp/tests.log 2>&1
            TEST_STATUS=$?
          fi

          if [ "$TEST_STATUS" -eq 0 ]; then
            python - <<'PY' >/tmp/ast.log 2>&1
          import ast
          from pathlib import Path

          tree = ast.parse(Path('backend/ads_manager/service.py').read_text())
          forbidden = {
              'insert_one', 'insert_many', 'update_one', 'update_many',
              'replace_one', 'delete_one', 'delete_many', 'bulk_write',
              'post', 'put', 'patch', 'delete',
          }
          found = sorted({
              node.attr for node in ast.walk(tree)
              if isinstance(node, ast.Attribute) and node.attr in forbidden
          })
          if found:
              raise SystemExit(f'Forbidden Ads Manager operations: {found}')
          print('ADS_MANAGER_META_V2_READ_ONLY_GUARD_OK')
          PY
            AST_STATUS=$?
          fi

          mkdir -p scripts
          {
            echo "ALIGN_STATUS=$ALIGN_STATUS"
            echo "PATCH_STATUS=$PATCH_STATUS"
            echo "COMPILE_STATUS=$COMPILE_STATUS"
            echo "INSTALL_STATUS=$INSTALL_STATUS"
            echo "TEST_STATUS=$TEST_STATUS"
            echo "AST_STATUS=$AST_STATUS"
            echo
            for log in align patch compile install tests ast; do
              echo "=== $log ==="
              if [ -f "/tmp/$log.log" ]; then
                tail -n 80 "/tmp/$log.log"
              else
                echo "not_run"
              fi
              echo
            done
          } > scripts/tmp_meta_v2_status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$ALIGN_STATUS" -eq 0 ] \
            && [ "$PATCH_STATUS" -eq 0 ] \
            && [ "$COMPILE_STATUS" -eq 0 ] \
            && [ "$INSTALL_STATUS" -eq 0 ] \
            && [ "$TEST_STATUS" -eq 0 ] \
            && [ "$AST_STATUS" -eq 0 ]; then
            git add backend/ads_manager/service.py \
                    backend/tests/test_unified_ads_manager_phase1.py
            git diff --cached --check
            git commit -m 'fix(ads): read authoritative Meta V2 performance source'
          else
            git restore backend/ads_manager/service.py \
                        backend/tests/test_unified_ads_manager_phase1.py
            git add scripts/tmp_meta_v2_status.txt
            git commit -m 'ci: record Meta V2 source verification failure'
          fi

          git push origin HEAD:fix/ads-manager-meta-v2-source
          exit 0
