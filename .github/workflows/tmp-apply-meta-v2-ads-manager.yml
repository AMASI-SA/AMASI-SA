name: Apply Meta V2 Ads Manager Source Fix

on:
  push:
    branches:
      - fix/ads-manager-meta-v2-source

permissions:
  contents: write

concurrency:
  group: apply-meta-v2-ads-manager-source
  cancel-in-progress: true

jobs:
  apply-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ads-manager-meta-v2-source
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align deterministic patch with current source shape
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/tmp_apply_meta_v2_ads_manager.py')
          text = path.read_text(encoding='utf-8')
          old = '''    provider_source_count = service.count(provider_source_old)
    if provider_source_count != 2:
        raise SystemExit(
            "provider source key: expected two matches, "
            f"found {provider_source_count}"
        )
    service = service.replace(provider_source_old, provider_source_new)
'''
          new = '''    provider_source_count = service.count(provider_source_old)
    if provider_source_count != 1:
        raise SystemExit(
            "provider source key: expected one match, "
            f"found {provider_source_count}"
        )
    service = service.replace(provider_source_old, provider_source_new, 1)
    if provider_source_old in service:
        raise SystemExit("legacy provider source expression remains")
'''
          if text.count(old) != 1:
              raise SystemExit('Temporary patch source-count guard is missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply reviewed Meta V2 source patch
        run: python scripts/tmp_apply_meta_v2_ads_manager.py

      - name: Compile changed backend files
        run: |
          python -m py_compile \
            backend/ads_manager/service.py \
            backend/tests/test_unified_ads_manager_phase1.py

      - name: Install targeted test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            pytest pytest-asyncio fastapi httpx pydantic

      - name: Run Ads Manager safety suite
        env:
          PYTHONPATH: backend
          MEZAN_ADS_MANAGER_READ_ONLY_ENABLED: 'true'
        run: pytest -q backend/tests/test_unified_ads_manager_phase1.py

      - name: Enforce read-only AST guard
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('backend/ads_manager/service.py').read_text())
          forbidden = {
              'insert_one', 'insert_many', 'update_one', 'update_many',
              'replace_one', 'delete_one', 'delete_many', 'bulk_write',
              'post', 'put', 'patch', 'delete',
          }
          found = sorted({
              node.attr for node in ast.walk(tree)
              if isinstance(node, ast.Attribute) and node.attr in forbidden
          })
          if found:
              raise SystemExit(f'Forbidden Ads Manager operations: {found}')
          print('ADS_MANAGER_META_V2_READ_ONLY_GUARD_OK')
          PY

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/ads_manager/service.py \
                  backend/tests/test_unified_ads_manager_phase1.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'META_V2_ADS_MANAGER_FIX_ALREADY_PRESENT'
            exit 0
          fi
          git commit -m 'fix(ads): read authoritative Meta V2 performance source'
          git push origin HEAD:fix/ads-manager-meta-v2-source
