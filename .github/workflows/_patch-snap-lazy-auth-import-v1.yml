name: Patch Snapchat Lazy Auth Import V1

on:
  push:
    branches:
      - fix/prod-snap-platform-source-isolation-v1

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-snap-platform-source-isolation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move auth dependency behind the Salla execution path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "backend/integrations_control_center/"
              "snapchat_campaign_created_order_semantics.py"
          )
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from auth import ensure_user_settings\n",
              "",
              1,
          )
          marker = (
              '    """Build fixed acquisition counts and current financial '
              'outcomes together."""\n'
          )
          replacement = marker + "    from auth import ensure_user_settings\n\n"
          if replacement not in text:
              if marker not in text:
                  raise SystemExit("created-order function marker missing")
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path(
              "backend/tests/test_snapchat_platform_source_integrity_v1.py"
          )
          test_text = test_path.read_text(encoding="utf-8")
          test_name = "test_created_order_auth_import_is_lazy"
          if test_name not in test_text:
              test_text += '''


def test_created_order_auth_import_is_lazy():
    source = Path(
        "integrations_control_center/snapchat_campaign_created_order_semantics.py"
    ).read_text(encoding="utf-8")
    assert "\\nfrom auth import ensure_user_settings\\n" not in source
    function_start = source.index("async def build_created_and_financial_outcomes")
    function_body = source[function_start:function_start + 1000]
    assert "from auth import ensure_user_settings" in function_body
'''
          test_path.write_text(test_text, encoding="utf-8")
          PY
      - name: Install focused dependencies without bcrypt
        run: >-
          python -m pip install -q
          pytest pytest-asyncio fastapi "pydantic>=2" httpx pymongo motor
          cryptography openpyxl python-multipart
      - name: Compile affected modules
        run: >-
          python -m py_compile
          backend/integrations_control_center/snapchat_campaign_created_order_semantics.py
          backend/integrations_control_center/snapchat_platform_source_integrity.py
          backend/integrations_control_center/__init__.py
      - name: Run import-sensitive contracts
        working-directory: backend
        run: >-
          python -m pytest -q --tb=short
          tests/test_snapchat_platform_source_integrity_v1.py
          tests/test_snapchat_capi_purchases_v3.py
          tests/test_snapchat_capi_cancellation_v3.py
          tests/test_ads_auto_sync_scheduler_v2.py
      - name: Commit lazy import fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/integrations_control_center/snapchat_campaign_created_order_semantics.py \
            backend/tests/test_snapchat_platform_source_integrity_v1.py
          git commit -m "fix(prod-snap): keep Salla auth dependency lazy"
          git push origin HEAD:fix/prod-snap-platform-source-isolation-v1
