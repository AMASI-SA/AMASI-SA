name: Review Readback V2 Candidate Acceptance

on:
  push:
    branches: [codex/readback-v2-backend-candidate, codex/build44-real-backend-integration]

permissions:
  contents: read
  actions: read

concurrency:
  group: review-readback-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
      - name: Verify candidate source before installing test dependencies
        id: dependencies
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          python scripts/run_review_v2_acceptance.py environment
          python scripts/run_review_v2_acceptance.py requirements --output "$RUNNER_TEMP/review-v2-requirements.txt"
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/review-v2-requirements.txt"
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          (cd frontend && yarn install --frozen-lockfile --ignore-scripts --non-interactive)
      - name: Start disposable Mongo 8.0.12 with loopback only
        id: mongo
        shell: bash
        run: |
          set -euo pipefail
          docker pull mongo:8.0.12
          fixture_owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          container_id=$(docker create --name review-v2-rs --network none \
            --label "amasi.review-v2.owner=$fixture_owner" \
            mongo:8.0.12 --port 27589 --replSet readbackV2Candidate --bind_ip 127.0.0.1)
          echo "container-id=$container_id" >> "$GITHUB_OUTPUT"
          docker start "$container_id"
          for attempt in $(seq 1 40); do
            if docker exec review-v2-rs mongosh --port 27589 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec review-v2-rs mongosh --port 27589 --quiet --eval \
            'rs.initiate({_id:"readbackV2Candidate",members:[{_id:0,host:"127.0.0.1:27589"}]})'
          for attempt in $(seq 1 40); do
            if docker exec review-v2-rs mongosh --port 27589 --quiet --eval \
              'if(db.version()!=="8.0.12"||!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec review-v2-rs mongosh --port 27589 --quiet --eval \
            'if(db.version()!=="8.0.12"||!db.hello().isWritablePrimary){quit(1)}'
          test "$(docker inspect "$container_id" --format '{{.HostConfig.NetworkMode}}')" = none
          docker inspect "$container_id" --format '{{json .HostConfig.PortBindings}}' | \
            python -c 'import json,sys; assert json.load(sys.stdin) in (None, {})'
          docker inspect "$container_id" --format 'image={{.Image}} network={{.HostConfig.NetworkMode}} ports={{json .NetworkSettings.Ports}}'
      - name: Run the two affected Web contracts once
        id: web
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_review_v2_acceptance.py web --directory "$RUNNER_TEMP/review-v2-web"
      - name: Run affected source contracts once on the exact candidate
        id: acceptance
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.mongo.outcome == 'success' }}
        shell: bash
        env:
          OWN_CONTAINER_ID: ${{ steps.mongo.outputs.container-id }}
        run: |
          set -euo pipefail
          test "$(docker inspect "$OWN_CONTAINER_ID" --format '{{index .Config.Labels "amasi.review-v2.owner"}}')" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(docker inspect "$OWN_CONTAINER_ID" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$OWN_CONTAINER_ID" --format '{{.HostConfig.NetworkMode}}')" = none
          mongo_pid=$(docker inspect "$OWN_CONTAINER_ID" --format '{{.State.Pid}}')
          test "$mongo_pid" -gt 1
          target_namespace=$(sudo --non-interactive readlink "/proc/$mongo_pid/ns/net")
          host_namespace=$(readlink /proc/self/ns/net)
          test "$target_namespace" != "$host_namespace"
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          test "$runner_uid" -ne 0
          python_binary=$(command -v python)
          sudo --non-interactive nsenter --target "$mongo_pid" --net --setgid "$runner_gid" --setuid "$runner_uid" \
            -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 PYTHON_DOTENV_DISABLED=1 \
            "$python_binary" scripts/run_review_v2_acceptance.py test \
            --directory "$RUNNER_TEMP/review-v2-evidence" --web-directory "$RUNNER_TEMP/review-v2-web" \
            --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --network-namespace "$target_namespace" --host-network-namespace "$host_namespace" \
            --runner-uid "$runner_uid" --runner-gid "$runner_gid"
      - name: Seal source and all results, including failures
        id: evidence-seal
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_review_v2_acceptance.py seal \
            --directory "$RUNNER_TEMP/review-v2-evidence" \
            --payload "$RUNNER_TEMP/review-v2-package/evidence.zip" \
            --output "$GITHUB_OUTPUT"
      - name: Mandatory Evidence Capacity and Upload
        id: evidence-upload
        if: ${{ !cancelled() && steps.evidence-seal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-readback-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-v2-package/evidence.zip
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          compression-level: 0
      - name: Download the Artifact ID returned by this upload
        id: evidence-download
        if: ${{ !cancelled() && steps.evidence-upload.outcome == 'success' && steps.evidence-upload.outputs.artifact-id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.evidence-upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/review-v2-readback
          merge-multiple: true
      - name: Mandatory archive, file, source, run and outcome readback
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.acceptance.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
          SEAL_OUTCOME: ${{ steps.evidence-seal.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.evidence-download.outcome }}
          EVIDENCE_SHA256: ${{ steps.evidence-seal.outputs.sha256 }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence-upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if ! { test "$SEAL_OUTCOME" = success && test "$UPLOAD_OUTCOME" = success && test "$DOWNLOAD_OUTCOME" = success; }; then
            echo '::error::EVIDENCE_TRANSPORT_INCOMPLETE: inspect quota, service, permission or fixture failure; no automatic rerun.'
            exit 1
          fi
          python scripts/run_review_v2_acceptance.py verify \
            --payload "$RUNNER_TEMP/review-v2-readback/evidence.zip" \
            --sha256 "$EVIDENCE_SHA256" --artifact-id "$EVIDENCE_ARTIFACT_ID"
          test "$TEST_OUTCOME" = success
          test "$WEB_OUTCOME" = success
      - name: Remove only this job's synthetic Mongo fixture
        if: always()
        shell: bash
        env:
          OWN_CONTAINER_ID: ${{ steps.mongo.outputs.container-id }}
        run: |
          set -euo pipefail
          fixture_owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if test -n "$OWN_CONTAINER_ID"; then
            test "$(docker inspect "$OWN_CONTAINER_ID" --format '{{index .Config.Labels "amasi.review-v2.owner"}}')" = "$fixture_owner"
            docker rm --force "$OWN_CONTAINER_ID"
          fi
