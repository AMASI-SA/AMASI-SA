name: Campaign hover native reader source acceptance
on:
  push:
    branches: [ops/patch-campaign-hover-live-refresh-20261113]
    paths: [.github/workflows/campaign-hover-native-reader-patch.yml]
permissions:
  contents: write
concurrency:
  group: campaign-hover-native-reader-task-only
  cancel-in-progress: false
jobs:
  patch-test-task-only:
    if: github.repository == 'AMASI-SA/AMASI-SA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: codex/campaign-hover-live-refresh-20261113
      EXPECTED_HEAD: 5c08685d42811c1642a7acb2459d5225b5c27620
      PATCH_SOURCE: a18ce6265325a979d3c797c9610c24e9de742e81
      FINALIZE_SOURCE: 442f2596635915edc604f36c58690d211a58a5db
      PYTHONDONTWRITEBYTECODE: '1'
      JWT_SECRET: campaign-hover-offline-test-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c08685d42811c1642a7acb2459d5225b5c27620
          fetch-depth: 1
      - name: Prepare exact reviewed source and render correction
        id: prepare
        run: |
          mkdir -p "$RUNNER_TEMP/hover-results"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-files '*AGENTS.md')" = AGENTS.md
          git fetch --depth=1 --no-tags origin "$PATCH_SOURCE"
          git show "$PATCH_SOURCE:scripts/ops_patch_campaign_hover_native.py" > "$RUNNER_TEMP/apply-native-hover.py"
          python -B "$RUNNER_TEMP/apply-native-hover.py"
          git fetch --depth=1 --no-tags origin "$FINALIZE_SOURCE"
          git show "$FINALIZE_SOURCE:scripts/ops_finalize_campaign_hover_native.py" > "$RUNNER_TEMP/finalize-hover.py"
          python -B "$RUNNER_TEMP/finalize-hover.py"
          git diff --exit-code -- release/release-intent-v5.json
          git diff --check
          git diff --binary > "$RUNNER_TEMP/hover-results/proposed.patch"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: sed '/^emergentintegrations==/d' backend/requirements.txt | python -m pip install -q -r /dev/stdin pytest-asyncio
      - name: Backend acceptance
        working-directory: backend
        run: |
          python -m pytest -q --tb=short tests/test_snapchat_hourly_response_coverage.py tests/test_snapchat_account_local_campaign_day.py tests/test_campaign_hover_daily.py tests/test_campaign_hover_refresh.py tests/test_campaign_hover_native_sources.py > "$RUNNER_TEMP/hover-results/backend.log" 2>&1 || { tail -100 "$RUNNER_TEMP/hover-results/backend.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/hover-results/backend.log"
      - uses: actions/setup-node@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          node-version: '22.23.2'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install pinned frontend dependencies
        id: frontend_install
        if: always() && steps.prepare.outcome == 'success'
        run: |
          corepack enable && corepack prepare yarn@1.22.22 --activate
          yarn --cwd frontend install --frozen-lockfile --non-interactive
      - name: Focused frontend acceptance including actual OrdersV2 render
        if: always() && steps.frontend_install.outcome == 'success'
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          yarn test --watchAll=false --runInBand --runTestsByPath src/components/CampaignHoverBadge.test.jsx src/components/CampaignHoverNativeSources.test.jsx src/pages/AdvancedDashboard.campaignHover.test.js src/services/campaignHover.test.js src/hooks/useCampaignHover.test.jsx src/lib/orderCampaignAttribution.test.js src/lib/campaignHoverScopes.test.js src/pages/OrdersV2.navigation.test.jsx > "$RUNNER_TEMP/hover-results/frontend-focused.log" 2>&1 || { tail -100 "$RUNNER_TEMP/hover-results/frontend-focused.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/hover-results/frontend-focused.log"
      - name: Full frontend regression
        if: always() && steps.frontend_install.outcome == 'success'
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          set +e
          yarn test --watchAll=false --runInBand --json --outputFile="$RUNNER_TEMP/hover-results/frontend-full.json" > "$RUNNER_TEMP/hover-results/frontend-full.log" 2>&1
          status=$?
          set -e
          tail -12 "$RUNNER_TEMP/hover-results/frontend-full.log"
          exit "$status"
      - name: Checkpoint task source only after all acceptance passes
        run: |
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/order_engine/campaign_hover.py frontend/src/pages/OrdersV2.jsx frontend/src/pages/AdvancedDashboard.jsx frontend/src/lib/orderCampaignAttribution.js frontend/src/components/CampaignHoverBadge.jsx frontend/src/hooks/useCampaignHover.js frontend/src/hooks/useCampaignHover.test.jsx frontend/src/lib/campaignHoverScopes.test.js .github/workflows/campaign-hover-source-acceptance.yml
          git commit -m 'fix: wire native campaign snapshots and canonical order refresh without polling'
          git diff --exit-code "$EXPECTED_HEAD" HEAD -- release/release-intent-v5.json
          git show --stat --oneline HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/hover-results/tested-task-source.txt"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-hover-native-final-acceptance-results
          path: ${{ runner.temp }}/hover-results
          if-no-files-found: error
          retention-days: 3
