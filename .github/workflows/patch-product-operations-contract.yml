name: Patch Product Operations Contract

on:
  push:
    branches:
      - fix/product-cost-category-completion
    paths:
      - scripts/patch_product_operations_contract.py
      - .github/workflows/patch-product-operations-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-cost-category-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/patch_product_operations_contract.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/products/ProductOperationsEditor.jsx
          git commit -m "fix(products): preserve inline group contract markers"
          git push origin HEAD:fix/product-cost-category-completion
