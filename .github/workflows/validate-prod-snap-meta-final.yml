name: Validate Production Snap Meta

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-prod-snap-meta-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Snap Meta isolated production validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/prod-snap-meta-final
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          httpx==0.28.1
          motor==3.3.1
          pydantic==2.13.4
          pymongo==4.5.0
          pytest==9.0.3
          pytest-asyncio
          cryptography==48.0.0
          openpyxl==3.1.5
      - name: Compile isolated backend
        working-directory: backend
        run: |
          python -m compileall -q integrations_control_center
          python -m py_compile \
            tests/test_meta_native_integrations_v2.py \
            tests/test_meta_native_reporting.py \
            tests/test_snapchat_integrations_v2.py
      - name: Enforce provider isolation
        working-directory: backend
        run: |
          python -c "from integrations_control_center.meta_native_guard import assert_meta_v2_is_legacy_independent; assert_meta_v2_is_legacy_independent()"
          python -c "from integrations_control_center.snapchat_native_guard import assert_snapchat_v2_is_legacy_independent; assert_snapchat_v2_is_legacy_independent()"
      - name: Run Meta and Snapchat backend tests
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_meta_native_integrations_v2.py
          tests/test_meta_native_reporting.py
          tests/test_snapchat_integrations_v2.py
          -q
          --tb=short
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive
      - name: Run Meta and Snapchat frontend tests
        working-directory: frontend
        run: >-
          CI=true yarn test
          --watchAll=false
          --runInBand
          src/services/metaIntegrationsV2.test.js
          src/components/integrationsV2/MetaReportingControl.test.jsx
          src/services/snapchatIntegrationsV2.test.js
      - name: Build isolated production frontend
        working-directory: frontend
        run: CI=false yarn build
