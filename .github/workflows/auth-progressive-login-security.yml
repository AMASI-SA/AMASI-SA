name: Auth Progressive Login Security

on:
  pull_request:
    paths:
      - "backend/auth.py"
      - "backend/login_security.py"
      - "backend/progressive_login_security.py"
      - "backend/tests/test_progressive_login_security_v1.py"
      - ".github/workflows/auth-progressive-login-security.yml"

permissions:
  contents: read

jobs:
  progressive-login-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused auth dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest==9.0.3" \
            "openpyxl==3.1.5" \
            "pymongo==4.5.0" \
            "starlette==0.37.2"
      - name: Compile progressive auth modules
        run: |
          python -m py_compile backend/login_security.py backend/progressive_login_security.py backend/auth.py
      - name: Run progressive login policy contracts
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_progressive_login_security_v1.py
