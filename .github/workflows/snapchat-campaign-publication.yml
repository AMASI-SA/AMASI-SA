name: Snapchat Direct Active Publication

on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: snapchat-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.paths.outputs.applicable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          watched = {
              "backend/integrations_control_center/snapchat_campaign_publication.py",
              "backend/integrations_control_center/snapchat_campaign_management.py",
              "backend/integrations_control_center/snapchat_media_upload.py",
              "backend/integrations_control_center/__init__.py",
              "backend/tests/test_snapchat_campaign_publication.py",
              "backend/tests/test_snapchat_campaign_publication_mongo.py",
              "frontend/src/components/marketing/SnapchatCampaignPublicationPanel.jsx",
              "frontend/src/components/marketing/SnapchatCampaignPublicationPanel.test.jsx",
              "frontend/src/components/marketing/SnapchatCampaignManagementPanel.jsx",
              "frontend/src/services/snapchatCampaignPublication.js",
              "frontend/src/services/snapchatCampaignPublication.test.js",
              ".github/workflows/snapchat-campaign-publication.yml",
              "docs/operations/SNAP-COMPLETION-20261025/PUBLICATION.md",
          }
          names = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", "--no-renames",
               os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]]
          ).decode().split("\0")
          applicable = bool(watched.intersection(names))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("applicable=" + str(applicable).lower() + "\n")
          PY

  backend:
    name: Publication backend and existing write guards
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: snapchat-publication-ci-only-secret
      PYTHONDONTWRITEBYTECODE: "1"
      MEZAN_ATTRIBUTION_SIGNING_SECRET: snapchat-publication-ci-only-signing-secret
      SNAPCHAT_PUBLICATION_TEST_MONGO_URL: mongodb://127.0.0.1:27017
      REQUIRE_SNAPCHAT_PUBLICATION_MONGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install
          fastapi==0.110.1 httpx==0.28.1 pydantic==2.13.4
          pytest==9.0.3 pytest-asyncio pymongo==4.6.3 motor==3.3.1 bcrypt==4.1.3
          PyJWT==2.13.0 openai==1.99.9 cryptography==48.0.0 openpyxl==3.1.5
          reportlab python-multipart python-dotenv email-validator pymupdf pillow qrcode arabic-reshaper python-bidi
      - run: >-
          python -m pytest -q --tb=short
          tests/test_snapchat_campaign_publication.py
          tests/test_snapchat_campaign_publication_mongo.py
          tests/test_snapchat_media_upload.py
          tests/test_snapchat_campaign_management_v1.py
          tests/test_snapchat_management_execution_hardening_v1.py
          tests/test_snapchat_management_safety_regressions_v1.py

  frontend:
    name: Publication frontend and existing media flow
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: >-
          CI=true yarn test --watchAll=false --runInBand
          src/services/snapchatCampaignPublication.test.js
          src/components/marketing/SnapchatCampaignPublicationPanel.test.jsx
          src/services/snapchatMediaUpload.test.js
          src/components/marketing/SnapchatMediaUploadPanel.test.jsx
          src/components/marketing/SnapchatCampaignManagementPanel.test.jsx
      - run: CI=false yarn build

