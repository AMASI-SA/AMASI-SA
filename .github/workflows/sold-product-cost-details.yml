name: Sold product cost details
on:
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - 'frontend/src/pages/SoldProducts*'
      - 'frontend/src/pages/AdvancedDashboard*'
      - 'frontend/src/pages/OrderDetailsV2*'
      - 'frontend/src/components/orders/OrderProfitabilityCard*'
      - 'backend/order_profitability_summary.py'
      - 'backend/tests/test_order_profitability_summary.py'
      - 'backend/tests/test_fulfillment_replay_retirement.py'
      - 'backend/fulfillment_experiment_routes.py'
      - 'frontend/src/components/ProductTrafficSources.jsx'
      - 'backend/product_traffic_sources.py'
      - 'backend/tests/test_product_traffic_sources.py'
      - 'backend/sold_product*'
      - 'backend/order_cost_authority.py'
      - 'backend/current_bundle_reporting_estimate.py'
      - 'backend/tests/test_sold_product*'
      - 'backend/tests/test_current_bundle_cost_details.py'
      - '.github/workflows/sold-product-cost-details.yml'
permissions:
  contents: read
jobs:
  details:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn --cwd frontend install --frozen-lockfile --non-interactive
      - name: Verify accordion, refresh all filtered products and both print views
        env:
          CI: 'true'
        run: >-
          yarn --cwd frontend test --watchAll=false --runInBand --resetMocks=false --runTestsByPath
          src/pages/SoldProducts.test.jsx src/pages/AdvancedDashboard.latestOrders.test.jsx
          src/pages/OrderDetailsV2.layout.test.jsx src/pages/OrderDetailsV2.shippingIdentity.test.jsx
          src/components/orders/OrderProfitabilityCard.test.jsx
      - run: >-
          python -m pip install pytest==9.1.1 pytest-asyncio==1.3.0 fastapi==0.142.2
          pydantic==2.13.5 httpx==0.28.1 motor==3.7.1 pymongo==4.18.2
          python-multipart==0.0.32 cryptography==50.0.0 reportlab==4.5.1
          PyMuPDF==1.28.2 qrcode==8.2 bcrypt==4.1.3 PyJWT==2.15.0
          mongomock==4.3.0 mongomock-motor==0.0.36 openpyxl==3.1.5
          python-dotenv==1.2.1
      - name: Verify costing evidence and independent business examples
        env:
          PYTHONPATH: backend:backend/tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m pytest -q
          backend/tests/test_product_traffic_sources.py
          backend/tests/test_sold_product_cost_details.py
          backend/tests/test_sold_products_report_v2.py
          backend/tests/test_order_cost_authority.py
          backend/tests/test_current_bundle_cost_details.py
          backend/tests/test_report_option_identity.py
          backend/tests/test_report_raw_option_recovery.py
          backend/tests/test_dashboard_bundle_cost_authority.py
          backend/tests/test_order_profitability_summary.py
          backend/tests/test_fulfillment_replay_retirement.py
          backend/tests/test_fulfillment_experiment_routes.py
