name: CodeQL

on:
  push:
    branches:
      - hotfix/prod-snap-meta-final
      - codex/codeql-exact-head-1281-diagnostic
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
      - chatgpt/mz2-ad-financial-accounts-opening-balances-20260922
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c65ea1d4e728b001f4076977337e5b48ef97bfd5
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Checkout SHA: ${actual_sha}"
          echo "TREE SHA: $(git rev-parse 'HEAD^{tree}')"
          test "${actual_sha}" = "c65ea1d4e728b001f4076977337e5b48ef97bfd5"
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
