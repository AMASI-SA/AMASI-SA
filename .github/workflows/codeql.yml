name: CodeQL

on:
  push:
    branches:
      - codex/codeql-exact-head-1287-diagnostic
      - hotfix/prod-snap-meta-final
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
      - chatgpt/mz2-ad-financial-accounts-opening-balances-20260922
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d9a283cfac681b1671d341da7773b2d357ec93e2
      - name: Verify exact approved candidate HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "actual checkout SHA = $actual_sha"
          test "$actual_sha" = "d9a283cfac681b1671d341da7773b2d357ec93e2"
          git rev-parse 'HEAD^{tree}'
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
