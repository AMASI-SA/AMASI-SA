name: Temporary Wire Mezan2 Ad Cost Settings

on:
  push:
    branches:
      - feat/prod-mezan2-ad-cost-settings-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prod-mezan2-ad-cost-settings-v1
          fetch-depth: 0

      - name: Patch routes and Mezan 2 navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("frontend/src/App.js")
          text = app.read_text(encoding="utf-8")
          old_import = 'import AdsCurrencySettings from "./pages/AdsCurrencySettings";'
          new_import = 'import AdsCostSettingsV2 from "./pages/AdsCostSettingsV2";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit("Ads currency settings import anchor missing")

          old_route = '<Route path="/settings/ads-currencies" element={<ProtectedRoute><Layout><AdsCurrencySettings /></Layout></ProtectedRoute>} />'
          new_route = '<Route path="/settings/ads-currencies" element={<ProtectedRoute><Navigate to="/ads-cost-settings-v2" replace /></ProtectedRoute>} />'
          if old_route in text:
              text = text.replace(old_route, new_route, 1)
          elif new_route not in text:
              raise SystemExit("legacy ads currency route anchor missing")

          ads_block = '''            <Route
                path="/ads-manager"
                element={
                    <ProtectedRoute>
                        <OwnerOnlyRoute>
                            <Layout><AdsManager /></Layout>
                        </OwnerOnlyRoute>
                    </ProtectedRoute>
                }
            />'''
          new_block = ads_block + '''
            <Route
                path="/ads-cost-settings-v2"
                element={
                    <ProtectedRoute>
                        <OwnerOnlyRoute>
                            <Layout><AdsCostSettingsV2 /></Layout>
                        </OwnerOnlyRoute>
                    </ProtectedRoute>
                }
            />'''
          if 'path="/ads-cost-settings-v2"' not in text:
              if ads_block not in text:
                  raise SystemExit("ads manager route anchor missing")
              text = text.replace(ads_block, new_block, 1)
          app.write_text(text, encoding="utf-8")

          nav = Path("frontend/src/components/MezanV2NavigationShell.jsx")
          text = nav.read_text(encoding="utf-8")
          google = '            { to: "/ads-manager?provider=google", label: "إعلانات Google" },'
          costs = '            { to: "/ads-cost-settings-v2", label: "العمولات وسعر الصرف", exactSearch: true },'
          if costs not in text:
              if google not in text:
                  raise SystemExit("marketing navigation anchor missing")
              text = text.replace(google, google + "\n" + costs, 1)
          path_anchor = '    "/ads-manager",'
          path_line = '    "/ads-cost-settings-v2",'
          if path_line not in text:
              if path_anchor not in text:
                  raise SystemExit("Mezan V2 path anchor missing")
              text = text.replace(path_anchor, path_anchor + "\n" + path_line, 1)
          nav.write_text(text, encoding="utf-8")
          PY

      - name: Commit route wiring once
        run: |
          if git diff --quiet -- frontend/src/App.js frontend/src/components/MezanV2NavigationShell.jsx; then
            echo "PATCH_ALREADY_PRESENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.js frontend/src/components/MezanV2NavigationShell.jsx
          git commit -m "feat(marketing): wire Mezan 2 ad cost settings route"
          git push origin HEAD:feat/prod-mezan2-ad-cost-settings-v1
