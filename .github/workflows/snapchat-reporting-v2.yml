name: Snapchat Reporting V2 Shadow

on:
  pull_request:
    branches:
      - main
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/snapchat_v2/**"
      - "backend/integrations_control_center/snapchat_native_tracking_routes.py"
      - "backend/tests/test_snapchat_reporting_v2_foundation.py"
      - ".github/workflows/snapchat-reporting-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporting-v2-tests:
    name: Snapchat reporting V2 foundation
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: snapchat-reporting-v2-test-secret
      SNAPCHAT_TOKEN_ENC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Compile reporting V2
        run: |
          python -m compileall -q snapchat_v2
          python -m py_compile integrations_control_center/snapchat_native_tracking_routes.py
          python -m py_compile tests/test_snapchat_reporting_v2_foundation.py
      - name: Run reporting V2 tests
        run: >-
          python -m pytest
          tests/test_snapchat_reporting_v2_foundation.py
          -q
          --tb=short
