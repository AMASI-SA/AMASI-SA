name: Operational Balance Web

on:
  push:
    branches: [codex/operational-balance-system-20261005, codex/operational-app-20261006]
  pull_request:
    branches: [hotfix/prod-snap-meta-final, codex/operational-balance-system-20261005, codex/operational-physical-stock-writer-20261010]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-balance-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Operational Balance Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: backend:backend/tests
      PYTHON_DOTENV_DISABLED: '1'
      OPERATIONAL_TEST_MONGO_URI: mongodb://127.0.0.1:27305/?replicaSet=operationalprojection
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27305/?replicaSet=operationalprojection
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        # App authorization exercises existing route guards and owner management,
        # which import PDF/crypto/auth helpers even though no external API is used.
        run: >-
          python -m pip install pytest==9.1.1 pytest-asyncio==1.3.0 fastapi==0.142.2 pydantic==2.13.5
          httpx==0.28.1 motor==3.7.1 pymongo==4.18.2 python-multipart==0.0.32
          cryptography==50.0.0 reportlab==4.5.1 PyMuPDF==1.28.2 qrcode==8.2
          bcrypt==4.1.3 PyJWT==2.15.0 mongomock==4.3.0
          mongomock-motor==0.0.36 openpyxl==3.1.5 email-validator==2.3.0
      - name: Start isolated projection Replica Set
        run: |
          set -euo pipefail
          docker run -d --name operational-projection-rs -p 127.0.0.1:27305:27305 mongo:8.0.12 --port 27305 --replSet operationalprojection --bind_ip_all --wiredTigerCacheSizeGB 1
          for attempt in $(seq 1 40); do
            if docker exec operational-projection-rs mongosh --port 27305 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec operational-projection-rs mongosh --port 27305 --quiet --eval 'rs.initiate({_id:"operationalprojection",members:[{_id:0,host:"127.0.0.1:27305"}]})'
          for attempt in $(seq 1 40); do
            if docker exec operational-projection-rs mongosh --port 27305 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec operational-projection-rs mongosh --port 27305 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'
      - name: Record exact tested source
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git rev-parse HEAD > operational-source-sha.txt
          git rev-parse HEAD^{tree} > operational-source-tree.txt
      - name: Run operational contracts
        run: >-
          python -B -m pytest --noconftest -q
          backend/tests/test_operational_balance*.py
          backend/tests/test_operational_completed_shipping*.py
          backend/tests/test_operational_read_runtime.py
          backend/tests/test_operational_financial_review_groups.py
          backend/tests/test_operational_open_cost_exposure.py
          backend/tests/test_operational_bundle_cost_projection.py
          backend/tests/test_operational_supplier_invoice_cutover.py
          backend/tests/test_store_delivery_noncash_review.py
          backend/tests/test_operational_driver_review_mongo.py
          backend/tests/test_operational_driver_review_packed_state.py
          backend/tests/test_provider_fee_source_terms.py
          backend/tests/test_provider_fee_runtime_binding.py
          backend/tests/test_bnpl_fee_completeness_boundaries.py
          --asyncio-mode=auto --tb=short --junitxml=operational-backend.xml
      - name: Preserve shipping summary and calculator contracts
        run: python -B -m pytest --noconftest -q backend/tests/test_dashboard_shipping_ssot.py backend/tests/test_mz2_shipping_calculator.py --tb=short
      - name: Reject missing or skipped tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('operational-backend.xml').findall('.//testcase')
          assert len(cases) >= 3500, 'Operational test collection incomplete'
          assert any('test_operational_open_cost_exposure' in c.get('classname', '') for c in cases), 'Historical open-cost tests were not collected'
          bundle_cases = [c for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_operational_bundle_cost_projection']
          assert len(bundle_cases) >= 67, 'Remaining-product bundle projection tests missing or incomplete'
          remaining_cases = [c for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_operational_balance_remaining_products']
          assert len(remaining_cases) >= 50, 'Real-Mongo remaining-product source/report cases missing'
          for required, minimum in (('test_operational_balance_bundle_legacy_receipts', 30),
                                    ('test_operational_balance_native_purchase_link', 39),
                                    ('test_operational_balance_native_purchase_link_mongo', 18)):
              found = [c for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == required]
              assert len(found) >= minimum, required + ' mapping acceptance missing'
          assert any('test_operational_balance_cost_completeness' in c.get('classname', '') for c in cases), 'Scoped cost completeness cases missing'
          assert len([c for c in cases if 'test_operational_balance_mapping_combined' in c.get('classname', '')]) >= 4, 'Combined R03/R05 Mongo and bounded financial reads missing'
          assert len([c for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_operational_balance_native_purchase_review']) >= 72, 'Native purchase proof cases missing'
          assert len([c for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == 'test_operational_balance_external_advances']) >= 28, 'External loan Mongo cases missing'
          for suite in ('test_operational_supplier_invoice_cutover',
                        'test_operational_balance_invoice_flow',
                        'test_operational_balance_supplier_final_cost',
                        'test_operational_balance_unified_supplier_payment',
                        'test_operational_balance_provider_settlement_guard'):
              assert any(suite in c.get('classname', '') for c in cases), suite + ' not collected'
          assert len([c for c in cases if 'test_operational_balance_salary_start_mongo' in c.get('classname', '')]) == 5
          assert len([c for c in cases if 'test_operational_driver_review_mongo' in c.get('classname', '')]) == 16
          for suite, minimum in (
              ('test_operational_completed_shipping_admission', 23),
              ('test_operational_completed_shipping_expansion', 10),
              ('test_operational_completed_shipping_integration', 16),
              ('test_operational_completed_shipping_preview_lifetime', 1),
              ('test_operational_completed_shipping_producers', 14),
              ('test_operational_completed_shipping_review', 10),
              ('test_operational_completed_shipping_review_index', 10),
              ('test_operational_read_runtime', 10),
              ('test_operational_financial_review_groups', 1),
              ('test_operational_driver_review_packed_state', 3),
          ):
              found = [c for c in cases if c.get('classname', '').rsplit('.', 1)[-1] == suite]
              assert len(found) >= minimum, suite + ' demand-only/completeness coverage missing'
          assert not any(c.find(tag) is not None for c in cases for tag in ('skipped', 'failure', 'error'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-backend-results
          path: |
            operational-backend.xml
            operational-source-sha.txt
            operational-source-tree.txt
          if-no-files-found: error

      - name: Remove this job's isolated Mongo fixture
        if: always()
        run: docker rm --force operational-projection-rs

  frontend:
    name: Operational Balance Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Enable project Yarn version
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run operational Web contracts
        run: >-
          node node_modules/react-scripts/bin/react-scripts.js test --watch=false --runInBand --resetMocks=false
          --testMatch '**/src/pages/operational/**/*.test.{js,jsx,ts,tsx}'
          '**/MezanV2NavigationShell.employees.test.jsx'
          '**/MezanV2NavigationShell.test.jsx'
          '**/MezanV2NavigationShell.accountingFirstRun.test.jsx'
          '**/OrderDetailsV2.shippingIdentity.test.jsx'
          '**/ProviderFeeCompleteness.test.jsx'
          '**/ShippingCompanySettings.test.jsx'
          '**/MezanSuppliersV2.test.jsx'
          '**/EmployeesV2Management.test.jsx'
          '**/OperationalSupplierAccount.test.jsx'
          '**/mezanSuppliersV2.test.js'
          '**/SupplierPaymentWorkspace.test.jsx'
          --json --outputFile=operational-frontend.json
      - name: Reject missing or skipped tests
        run: |
          node - <<'JS'
          const r = require('./operational-frontend.json');
          if (!r.success || r.numPassedTests < 289 || r.numPassedTestSuites < 23 ||
              r.numFailedTests || r.numFailedTestSuites || r.numPendingTests ||
              r.numPendingTestSuites || r.numTodoTests) process.exit(1);
          for (const suffix of ['SalaryStart.test.jsx', 'EmployeesV2Management.test.jsx', 'OperationalSupplierAccount.test.jsx',
                                'OperationalFinancialPosition.test.jsx', 'DriverPaymentReview.test.jsx',
                                'NativePurchaseReview.test.jsx', 'nativePurchaseLinkApi.test.js',
                                'ExternalOperationControls.test.jsx', 'ProviderFeeSetup.test.jsx',
                                'ProviderFeeCompleteness.test.jsx', 'OrderDetailsV2.shippingIdentity.test.jsx']) {
            const suite = r.testResults.find(s => s.name.endsWith('/' + suffix));
            if (!suite || !suite.assertionResults.length || suite.assertionResults.some(t => t.status !== 'passed'))
              throw Error('Combined UI suite missing or incomplete: ' + suffix);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-frontend-results
          path: frontend/operational-frontend.json
          if-no-files-found: error

  background-demand-only:
    name: Canonical worker excludes operational balance jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: backend:backend/tests
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      QOYOD_TEST_MONGO_URI: mongodb://127.0.0.1:27305/?replicaSet=operationalworker
      QOYOD_API_BASE: https://qoyod.invalid/2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the canonical runtime public dependency closure
        # The real child imports the canonical server, unlike the focused
        # projection job. This matches the existing background-worker gate.
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          public = [line for line in Path('backend/requirements.txt').read_text().splitlines()
                    if not line.strip().startswith('emergentintegrations==')]
          (Path(os.environ['RUNNER_TEMP']) / 'operational-runtime-requirements.txt').write_text('\n'.join(public) + '\n')
          PY
          python -m pip install -r "$RUNNER_TEMP/operational-runtime-requirements.txt"
          python -m pip install pytest-asyncio==1.3.0 mongomock-motor==0.0.36
      - name: Start this job's isolated empty Mongo replica set
        run: |
          set -euo pipefail
          docker run -d --name operational-worker-rs -p 127.0.0.1:27305:27305 mongo:8.0.12 --port 27305 --replSet operationalworker --bind_ip_all --wiredTigerCacheSizeGB 1
          for attempt in $(seq 1 40); do
            if docker exec operational-worker-rs mongosh --port 27305 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec operational-worker-rs mongosh --port 27305 --quiet --eval 'rs.initiate({_id:"operationalworker",members:[{_id:0,host:"127.0.0.1:27305"}]})'
          for attempt in $(seq 1 40); do
            if docker exec operational-worker-rs mongosh --port 27305 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
          docker exec operational-worker-rs mongosh --port 27305 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'
      - name: Prove the exact source's canonical child boots and drains
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git rev-parse HEAD 'HEAD^{tree}' > operational-worker-source.txt
          python -B -m pytest --noconftest -q --asyncio-mode=auto --tb=short \
            backend/tests/test_background_worker_process.py \
            --junitxml=operational-worker.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('operational-worker.xml').iter('testcase'))
          assert len(cases) == 4, 'Canonical worker process cases missing'
          assert any(c.get('name') == 'test_canonical_runtime_boots_against_empty_isolated_database_and_drains' for c in cases)
          assert not any(c.find(tag) is not None for c in cases for tag in ('skipped', 'failure', 'error'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-worker-results
          path: |
            operational-worker-source.txt
            operational-worker.xml
          if-no-files-found: error
      - name: Remove only this job's isolated Mongo fixture
        if: always()
        run: docker rm --force operational-worker-rs

  browser-acceptance:
    name: Operational balances browser, mobile and visibility acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      OPERATIONAL_BALANCE_UAT_OUTPUT: ${{ runner.temp }}/operational-balances-browser
      PLAYWRIGHT_MODULE: ${{ runner.temp }}/operational-playwright/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install synthetic report and locked component dependencies
        run: |
          python -m pip install pytest==9.1.1 pytest-asyncio==1.3.0 fastapi==0.142.2 pydantic==2.13.5 \
            httpx==0.28.1 motor==3.7.1 pymongo==4.18.2 python-multipart==0.0.32 \
            cryptography==50.0.0 reportlab==4.5.1 PyMuPDF==1.28.2 qrcode==8.2 \
            bcrypt==4.1.3 PyJWT==2.15.0 mongomock==4.3.0 \
            mongomock-motor==0.0.36 openpyxl==3.1.5 email-validator==2.3.0
          corepack enable && corepack prepare yarn@1.22.22 --activate
          yarn --cwd frontend install --frozen-lockfile --non-interactive
          npm install --prefix "$RUNNER_TEMP/operational-playwright" --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/operational-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run the real report and pending-order dialog in sandboxed Chromium
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p "$OPERATIONAL_BALANCE_UAT_OUTPUT"
          git rev-parse HEAD 'HEAD^{tree}' > "$OPERATIONAL_BALANCE_UAT_OUTPUT/git-source.txt"
          python scripts/testing/operational_balances_demand/fixture.py "$OPERATIONAL_BALANCE_UAT_OUTPUT"
          node scripts/testing/operational_balances_demand/build.cjs
          node scripts/testing/operational_balances_demand/browser.cjs
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = process.env.OPERATIONAL_BALANCE_UAT_OUTPUT;
          const evidence = JSON.parse(fs.readFileSync(path.join(out, 'browser-evidence.json')));
          if (evidence.synthetic_only !== true || evidence.results.length !== 6 ||
              evidence.results.some(result => result.status !== 'PASS') || evidence.errors.length) {
            throw Error('All six browser acceptance scenarios must execute and pass');
          }
          for (const file of ['source-manifest.json', 'pending-orders-desktop.png', 'pending-orders-mobile.png']) {
            if (!fs.statSync(path.join(out, file)).size) throw Error('Missing browser evidence: ' + file);
          }
          JS
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-balances-browser-results
          path: |
            ${{ runner.temp }}/operational-balances-browser/git-source.txt
            ${{ runner.temp }}/operational-balances-browser/source-manifest.json
            ${{ runner.temp }}/operational-balances-browser/browser-evidence.json
            ${{ runner.temp }}/operational-balances-browser/pending-orders-desktop.png
            ${{ runner.temp }}/operational-balances-browser/pending-orders-mobile.png
          if-no-files-found: error
