name: Page and operational read performance

on:
  pull_request:
    paths:
      - "backend/fulfillment_v2_routes.py"
      - "backend/preparation_piece_operations.py"
      - "backend/purchase_invoices_routes.py"
      - "backend/purchase_receiving_service.py"
      - "backend/tests/test_fulfillment_read_performance.py"
      - "backend/tests/test_purchase_invoice_read_performance.py"
      - "frontend/src/components/Layout.jsx"
      - "frontend/src/components/Layout.deferredWorkspaces.test.jsx"
      - "frontend/src/components/fulfillment/PreparationWorkDashboard*"
      - "frontend/src/pages/FulfillmentV2*"
      - "frontend/src/pages/AdvancedDashboard*"
      - ".github/workflows/page-performance-regressions.yml"

permissions:
  contents: read

jobs:
  backend-query-budgets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.6.3
          mongomock-motor==0.0.36 bcrypt==4.1.3 PyJWT httpx
          pytest pytest-asyncio openpyxl cryptography reportlab
          python-multipart pymupdf pillow qrcode arabic-reshaper
          python-bidi python-dotenv tzdata
      - name: Verify query counts, permissions, balances and index initialization
        working-directory: backend
        run: >-
          python -m pytest -q --tb=short
          tests/test_fulfillment_read_performance.py
          tests/test_purchase_invoice_read_performance.py
          tests/test_completed_current_shipment_display.py
          tests/test_order_engine_repository.py
          tests/test_g47_purchase_receiving.py

  frontend-route-loading:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Verify deferred routes and visible reads
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/Layout.deferredWorkspaces.test.jsx
          src/components/PageContentBoundary.test.jsx
          src/components/ProtectedRoute.test.jsx
          src/pages/FulfillmentV2.test.jsx
          src/components/fulfillment/PreparationWorkDashboard.test.jsx
          src/components/fulfillment/PreparationWorkDashboard.loading.test.jsx
          src/pages/AdvancedDashboard.cartFreeze.test.jsx
          src/pages/AdvancedDashboard.firstLoad.test.jsx
          src/pages/AdvancedDashboard.manualRefresh.test.jsx
          src/components/DashboardPanel.test.jsx
          src/components/DashboardAdsSpendCard.test.jsx
          src/pages/AdvancedDashboard.latestOrders.test.jsx
          src/pages/AdvancedDashboard.mobile.test.jsx
          src/defaultDashboardRoute.test.js
          src/lib/dashboardLiveRefresh.test.js
          src/lib/dashboardFetchAdmission.test.js
          src/lib/dashboardLatestResponseBroker.test.js
          src/lib/dashboardPlatformSpendMerge.test.js
          src/lib/dashboardPlatformSpendClient.test.js
          src/dashboardExecutivePlatformSpendInterceptor.test.js
          src/services/dashboardAdsSpend.test.js
          src/components/DashboardAnalyticsPlacement.test.js
