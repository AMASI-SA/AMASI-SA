name: Backend performance PR1
on:
  pull_request:
    paths:
      - 'backend/preparation_piece_operations.py'
      - 'backend/dashboard_v2_routes.py'
      - 'backend/tests/test_assembly_board_batch_equivalence.py'
      - 'backend/tests/test_dashboard_stage_timings.py'
      - 'backend/tests/test_backend_performance_board_mongo.py'
      - '.github/workflows/backend-performance-pr1.yml'
  push:
    branches: ['codex/backend-performance-pr1-ad-20261008']
permissions:
  contents: read
jobs:
  equivalence-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:tests'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      JWT_SECRET: 'isolated-performance-pr1-ci-only'
      MZ2_TEST_MONGO_URI: 'mongodb://127.0.0.1:27450/?replicaSet=performancepr1'
      PERF_EVIDENCE_PATH: '${{ github.workspace }}/performance-evidence.json'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: >-
          python -m pip install fastapi==0.110.1 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.1 pytest pytest-asyncio httpx
          mongomock-motor openpyxl cryptography reportlab python-multipart
          pymupdf pillow qrcode arabic-reshaper python-bidi python-dotenv
          PyJWT bcrypt email-validator
      - name: Start isolated MongoDB 8.0.12 replica set
        run: |
          docker run -d --name performance-pr1 --network host mongo:8.0.12 --replSet performancepr1 --bind_ip 127.0.0.1 --port 27450
          for attempt in $(seq 1 30); do
            if docker exec performance-pr1 mongosh --port 27450 --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec performance-pr1 mongosh --port 27450 --quiet --eval 'rs.initiate({_id:"performancepr1",members:[{_id:0,host:"127.0.0.1:27450"}]})'
          for attempt in $(seq 1 30); do
            if docker exec performance-pr1 mongosh --port 27450 --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' ; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Regression, JSON equivalence, query counts and timings
        working-directory: backend
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -q
          tests/test_assembly_board_batch_equivalence.py
          tests/test_dashboard_stage_timings.py
          tests/test_backend_performance_board_mongo.py
          tests/test_preparation_piece_operations.py
          tests/test_dashboard_memory_admission.py
          tests/test_resource_governor.py
          tests/test_order_engine_repository.py
          tests/test_order_engine_service.py
          tests/test_order_engine_mapper.py
          tests/test_dashboard_v2_product_cost.py
          tests/test_dashboard_v2_arabic_status_normalization.py
          tests/test_dashboard_v2_salla_ads_executive.py
          tests/test_dashboard_v2_ad_account_costs.py
          tests/test_dashboard_v2_unified_shadow_observer.py
          --junitxml=../performance-tests.xml
      - name: Require zero skipped tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('performance-tests.xml').getroot()
          assert not root.findall('.//skipped'), 'Skipped tests are not acceptance evidence'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-performance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            performance-evidence.json
            performance-tests.xml
