name: Apply Mezan AI Operational Context V2

on:
  push:
    branches:
      - feat/mezan-ai-operational-context-v2
    paths:
      - ".github/workflows/apply-operational-context-v2.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mezan-ai-operational-context-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply reviewed backend and frontend integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          route_path = Path("backend/ai_analysis_routes.py")
          route = route_path.read_text(encoding="utf-8")

          route = route.replace(
              "from fastapi import APIRouter, BackgroundTasks, Depends, HTTPException",
              "from fastapi import APIRouter, BackgroundTasks, Depends, HTTPException, Query",
          )
          route = route.replace(
              "from ai_provider_status import openai_runtime_status\n",
              "from ai_operational_context_v2 import (\n"
              "    DEFAULT_ORDER_SAMPLE_LIMIT,\n"
              "    MAX_ORDER_SAMPLE_LIMIT,\n"
              "    build_orders_v2_operational_context,\n"
              ")\n"
              "from ai_provider_status import openai_runtime_status\n",
          )
          route = route.replace(
              '    "recommendations",\n}',
              '    "recommendations",\n    "operational_context_v2",\n}',
          )
          route = route.replace("    if depth > 4:\n", "    if depth > 7:\n", 1)

          instruction_start = route.index("                instructions=(")
          instruction_end = route.index("                input=json.dumps(", instruction_start)
          instructions = '''                instructions=(
                    "أنت العقل التشغيلي التحليلي داخل Mezan OS. أجب بالعربية "
                    "وبالاعتماد حصراً على السياق المرسل، ولا تدّعي تنفيذ أي "
                    "تعديل. إذا وجد operational_context_v2 فاعتبره المصدر "
                    "المرجعي لحقائق الطلبات؛ فهو عينة آمنة من نفس عقد Orders "
                    "V2 وعناصر الطلب الذي تستخدمه واجهة ميزان 2. استنتج بنفسك "
                    "المفاهيم التجارية مثل الإجمالي والضريبة والخصم والشحن "
                    "والدفع وربط الحملات من المسارات والقيم والعلاقات، ولا تعتمد "
                    "على أسماء حقول متوقعة أو أحكام coverage/gates القديمة. لا "
                    "تعتبر المفهوم مفقوداً لمجرد غياب اسم حقل واحد؛ قارن ملخص "
                    "الطلب مع سطور المنتجات وابحث عن المسارات البديلة. اذكر في "
                    "كل دليل المسارات التي اكتشفتها والقيم أو العلاقات الداعمة. "
                    "رتّب المشاكل حسب الأثر، واجعل safe_to_act=false إذا كانت "
                    "العينة أو الأدلة غير كافية. اقترح خطوات تحقق قابلة للقياس "
                    "وقراءة فقط، ولا تطلب بيانات شخصية أو أسراراً."
                ),
'''
          route = route[:instruction_start] + instructions + route[instruction_end:]

          route_marker = '    @router.post("/analyze")\n'
          if route_marker not in route:
              raise SystemExit("AI analyze route marker not found")
          context_route = '''    @router.get("/operational-context-v2")
    async def operational_context_v2(
        sample_limit: int = Query(
            default=DEFAULT_ORDER_SAMPLE_LIMIT,
            ge=1,
            le=MAX_ORDER_SAMPLE_LIMIT,
        ),
        user: dict = Depends(current_user),
    ) -> dict[str, Any]:
        return await build_orders_v2_operational_context(
            job_db_factory(),
            user_id=_user_id(user),
            sample_limit=sample_limit,
        )

'''
          route = route.replace(route_marker, context_route + route_marker, 1)
          route_path.write_text(route, encoding="utf-8")

          page_path = Path("frontend/src/pages/AIControlCenter.jsx")
          page = page_path.read_text(encoding="utf-8")
          page = page.replace(
              '["orders", `/orders${buildQuery({ ...range, page: 1, limit: 500 })}`],',
              '["orders", "/orders-v2?limit=50"],',
          )
          page = page.replace(
              'const [aiResult, setAiResult] = useState(null);',
              'const [aiResult, setAiResult] = useState(null);\n    const [aiContextInfo, setAiContextInfo] = useState(null);',
          )
          run_start = page.index("    const runAiAnalysis = async () => {")
          run_end = page.index("\n\n    return (", run_start)
          new_run = '''    const runAiAnalysis = async () => {
        setAiLoading(true);
        try {
            const operationalContextResponse = await api.get(
                "/ai/operational-context-v2",
                { params: { sample_limit: 8 } },
            );
            const operationalContext = operationalContextResponse.data;
            setAiContextInfo({
                sampleCount: Number(operationalContext?.sample_count || 0),
                source: operationalContext?.source || "mezan_orders_v2_canonical",
            });
            const context = {
                period: { from_date: fromDate, to_date: toDate },
                operational_context_v2: operationalContext,
                metrics: {
                    dashboard_orders: Number(model.dashboardSummary.total_orders || 0),
                    total_sales: Number(model.dashboardSummary.total_sales || 0),
                    ad_spend: Number(model.dashboardSummary.daily_ads_total || model.adsBreakdown.total_amount || 0),
                    qoyod_failed: Number(model.qoyodStats?.stats?.failed || model.qoyodStats?.failed || 0),
                },
                errors: Object.entries(data)
                    .filter(([, result]) => !result?.ok)
                    .map(([source, result]) => ({ source, message: result?.error || "فشل المصدر" })),
            };
            const response = await api.post("/ai/analyze", { question: aiQuestion, context });
            setAiResult(response.data?.analysis || null);
            toast.success("اكتمل التحليل من بيانات طلبات ميزان 2 بالقراءة فقط");
        } catch (error) {
            const detail = error?.response?.data?.detail;
            toast.error(
                typeof detail === "string"
                    ? detail
                    : detail?.message || "تعذر تشغيل محلل ميزان",
            );
        } finally {
            setAiLoading(false);
        }
    };'''
          page = page[:run_start] + new_run + page[run_end:]
          page = page.replace(
              "تفحص الصفحة اكتمال البيانات وتكشف الفروقات، ثم يقرأ محلل ميزان النتائج ويشرح السبب والخطوة التالية دون تعديل أو إرسال أي بيانات.",
              "يقرأ محلل ميزان عينة آمنة من نفس بيانات طلبات ميزان 2 وعناصرها، ويستنتج الحقول والعلاقات بنفسه دون الاعتماد على أسماء حقول ثابتة أو إرسال بيانات العملاء.",
          )
          page = page.replace(
              '<Kpi title="طلبات API" value={fmtInt(data.orders?.data?.total || model.orders.length)} />',
              '<Kpi title="عينة Orders V2" value={fmtInt(model.orders.length)} />',
          )
          page = page.replace(
              'amount: getAny(order, ["total_amount", "amount", "total"]) || 0',
              'amount: getAny(order, ["totals.total"]) || 0',
          )
          page = page.replace(
              '<p className="text-sm text-slate-600 mt-1">OpenAI · قراءة وتحليل فقط · لا يملك أدوات تعديل أو إرسال إلى قيود</p>',
              '<p className="text-sm text-slate-600 mt-1">OpenAI · يكتشف عقد Orders V2 ديناميكياً · قراءة فقط · لا يملك أدوات تعديل أو إرسال إلى قيود</p>',
          )
          context_info_marker = '            {result && (\n'
          context_info = '''            {aiContextInfo && (
                <p className="mt-3 text-xs text-slate-500">
                    المصدر: Orders V2 canonical · العينة الآمنة: {aiContextInfo.sampleCount} طلبات · دون أسماء أو جوالات أو عناوين
                </p>
            )}
'''
          page = page.replace(context_info_marker, context_info + context_info_marker, 1)
          page = page.replace(
              "function AIAnalyst({ question, setQuestion, loading, result, onAnalyze }) {",
              "function AIAnalyst({ question, setQuestion, loading, result, onAnalyze, aiContextInfo }) {",
          )
          page = page.replace(
              "                onAnalyze={runAiAnalysis}\n            />",
              "                onAnalyze={runAiAnalysis}\n                aiContextInfo={aiContextInfo}\n            />",
          )
          readiness_old = '{tab === "readiness" && <div className="space-y-5"><div className="grid grid-cols-1 md:grid-cols-2 gap-4">{model.gates.map((gate) => <Gate key={gate.title} gate={gate} />)}</div><CoverageTable rows={model.coverage} /><Recommendations items={model.recommendations} /></div>}'
          readiness_new = '''{tab === "readiness" && <div className="space-y-5"><div className="rounded-xl border border-violet-200 bg-violet-50 p-4 text-sm leading-7 text-violet-900"><strong>ملاحظة:</strong> جدول الجاهزية فحص حتمي سريع لعقد Orders V2، لكنه ليس دليلاً يلقّن OpenAI. محلل ميزان يقرأ العينة الآمنة ويستنتج الضريبة والخصومات والشحن والعلاقات المالية بنفسه.</div><div className="grid grid-cols-1 md:grid-cols-2 gap-4">{model.gates.map((gate) => <Gate key={gate.title} gate={gate} />)}</div><CoverageTable rows={model.coverage} /><Recommendations items={model.recommendations} /></div>}'''
          if readiness_old in page:
              page = page.replace(readiness_old, readiness_new, 1)
          page_path.write_text(page, encoding="utf-8")

          workflow_path = Path(".github/workflows/mezan-ai-analysis.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace(
              '      - "backend/ai_analysis_routes.py"\n',
              '      - "backend/ai_analysis_routes.py"\n      - "backend/ai_operational_context_v2.py"\n',
          )
          workflow = workflow.replace(
              '      - "backend/tests/test_ai_analysis_async_routes.py"\n',
              '      - "backend/tests/test_ai_analysis_async_routes.py"\n      - "backend/tests/test_ai_operational_context_v2.py"\n      - "frontend/src/pages/AIControlCenter.jsx"\n      - "frontend/src/pages/aiControl/fields.js"\n',
          )
          workflow = workflow.replace(
              "          ai_analysis_routes.py\n",
              "          ai_analysis_routes.py\n          ai_operational_context_v2.py\n",
          )
          workflow = workflow.replace(
              "          tests/test_ai_analysis_async_routes.py\n",
              "          tests/test_ai_analysis_async_routes.py\n          tests/test_ai_operational_context_v2.py\n",
          )
          workflow = workflow.replace(
              "          tests/test_ai_analysis_async_routes.py\n          -q",
              "          tests/test_ai_analysis_async_routes.py\n          tests/test_ai_operational_context_v2.py\n          -q",
          )
          workflow = workflow.replace(
              "          src/lib/aiAnalysisAsync.test.js\n",
              "          src/lib/aiAnalysisAsync.test.js\n      - name: Build AI control center\n        run: yarn build\n",
          )
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

          rm .github/workflows/apply-operational-context-v2.yml
          git diff --check
      - name: Install backend test dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          httpx==0.28.1
          motor==3.3.1
          openai==1.99.9
          openpyxl==3.1.5
          pydantic==2.13.4
          pymongo==4.5.0
          pytest==9.0.3
          pytest-asyncio
      - name: Run backend regression suite
        working-directory: backend
        run: |
          python -m py_compile ai_analysis_routes.py ai_operational_context_v2.py
          python -m pytest \
            tests/test_ai_analysis_routes.py \
            tests/test_ai_analysis_async_routes.py \
            tests/test_ai_operational_context_v2.py \
            -q --tb=short
      - name: Run frontend regression and build
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --non-interactive
          CI=true yarn test --watchAll=false --runInBand src/lib/aiAnalysisAsync.test.js
          yarn build
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): derive analysis from privacy-safe Orders V2 context"
          git push origin HEAD:feat/mezan-ai-operational-context-v2
