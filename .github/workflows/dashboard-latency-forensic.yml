name: Dashboard pinned-source latency forensic
on:
  push:
    branches: [codex/dashboard-memory-bound]
    paths:
      - .github/workflows/dashboard-latency-forensic.yml
      - docs/operations/dashboard-memory-bound/MULTITENANT-FORENSIC.py
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .:backend:backend/tests
      DASHBOARD_TEST_MONGO_URI: mongodb://127.0.0.1:27261
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve diagnostic harness and pin application source
        run: |
          cp docs/operations/dashboard-memory-bound/MULTITENANT-FORENSIC.py "$RUNNER_TEMP/MULTITENANT-FORENSIC.py"
          git checkout --detach bd8e1a4c377e61544b5cfe0f71f573c71abca89f
          test "$(git rev-parse HEAD)" = bd8e1a4c377e61544b5cfe0f71f573c71abca89f
          mkdir "$RUNNER_TEMP/forensic-results"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/forensic-results/source.txt"
          git status --porcelain >> "$RUNNER_TEMP/forensic-results/source.txt"
          lscpu > "$RUNNER_TEMP/forensic-results/cpu.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: >-
          python -m pip install fastapi==0.141.1 pydantic==2.13.5
          pymongo==4.18.1 motor==3.7.1 pytest==9.0.3 pytest-asyncio==1.3.0
          httpx==0.28.1 openpyxl==3.1.5 python-dotenv==1.2.3
          cryptography==50.0.0 bcrypt==4.1.3 PyJWT==2.13.0
          python-multipart==0.0.20 reportlab==5.0.1 tzdata==2026.4
      - name: Start disposable loopback Mongo
        run: |
          set -euo pipefail
          docker run -d --name dashboard-memory-mongo -p 127.0.0.1:27261:27261 mongo:8.0.12 --port 27261 --bind_ip_all
          for attempt in $(seq 1 40); do
            if docker exec dashboard-memory-mongo mongosh --port 27261 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec dashboard-memory-mongo mongosh --port 27261 --quiet --eval 'db.adminCommand({ping:1})'
          echo "FORENSIC_MONGO_PID=$(docker inspect -f '{{.State.Pid}}' dashboard-memory-mongo)" >> "$GITHUB_ENV"
      - name: Same-run uncontended independent tenant measurements
        run: python "$RUNNER_TEMP/MULTITENANT-FORENSIC.py" suite --count 100000 --out "$RUNNER_TEMP/forensic-results" | tee "$RUNNER_TEMP/forensic-results/console.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-pinned-bd8-forensic
          path: ${{ runner.temp }}/forensic-results
          if-no-files-found: error
