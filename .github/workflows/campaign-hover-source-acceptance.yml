name: Campaign hover source coverage
on:
  pull_request:
    branches: [main, hotfix/prod-snap-meta-final]
    paths:
      - backend/order_engine/campaign_hover.py
      - backend/order_engine/campaign_hover_native_sources.py
      - backend/order_engine/campaign_enrichment.py
      - backend/tests/test_campaign_hover_native_sources.py
      - backend/tests/test_order_engine_campaign_enrichment.py
      - backend/integrations_control_center/snapchat_native_account_day.py
      - backend/integrations_control_center/snapchat_native_performance_sync.py
      - backend/tests/test_campaign_hover_daily.py
      - backend/tests/test_campaign_hover_refresh.py
      - backend/tests/test_snapchat_account_local_campaign_day.py
      - backend/tests/test_snapchat_hourly_response_coverage.py
      - frontend/src/components/CampaignHoverBadge.jsx
      - frontend/src/components/CampaignHoverBadge.test.jsx
      - frontend/src/components/CampaignHoverNativeSources.test.jsx
      - frontend/src/lib/orderCampaignAttribution.js
      - frontend/src/lib/orderCampaignAttribution.test.js
      - frontend/src/lib/campaignHoverScopes.test.js
      - frontend/src/pages/OrdersV2.navigation.test.jsx
      - frontend/src/hooks/useCampaignHover.js
      - frontend/src/hooks/useCampaignHover.test.jsx
      - frontend/src/pages/OrdersV2.jsx
      - frontend/src/pages/AdvancedDashboard.jsx
      - frontend/src/pages/AdvancedDashboard.campaignHover.test.js
      - frontend/src/services/campaignHover.js
      - frontend/src/services/campaignHover.test.js
      - .github/workflows/campaign-hover-source-acceptance.yml
permissions:
  contents: read
jobs:
  source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: campaign-hover-offline-test-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public test dependencies
        run: |
          sed '/^emergentintegrations==/d' requirements.txt | python -m pip install -q -r /dev/stdin pytest-asyncio
      - name: Test provider response coverage and independent Salla metrics
        run: >-
          python -m pytest -q --tb=short
          tests/test_snapchat_hourly_response_coverage.py
          tests/test_snapchat_account_local_campaign_day.py
          tests/test_campaign_hover_daily.py
          tests/test_campaign_hover_refresh.py
          tests/test_campaign_hover_native_sources.py
          tests/test_order_engine_campaign_enrichment.py

  frontend-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test campaign hover amounts, warnings and no hover fetching
        run: >-
          CI=true yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/CampaignHoverBadge.test.jsx
          src/pages/AdvancedDashboard.campaignHover.test.js
          src/services/campaignHover.test.js
          src/hooks/useCampaignHover.test.jsx
          src/components/CampaignHoverNativeSources.test.jsx
          src/lib/orderCampaignAttribution.test.js
          src/lib/campaignHoverScopes.test.js
          src/pages/OrdersV2.navigation.test.jsx
