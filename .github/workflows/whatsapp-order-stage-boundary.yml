name: WhatsApp verified order-stage boundary checks
on:
  pull_request:
    paths:
      - 'backend/order_engine/whatsapp_stage_*.py'
      - 'backend/order_engine/test_whatsapp_stage_*.py'
      - '.github/workflows/whatsapp-order-stage-boundary.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'fastapi>=0.100,<1' 'httpx>=0.24,<1' 'pydantic>=2,<3' 'pytest>=8,<10'
      - name: Synthetic order-stage tests only
        run: |
          PYTHONPATH=. python -m pytest -q \
            order_engine/test_whatsapp_stage_service_auth.py \
            order_engine/test_whatsapp_stage_projection.py \
            order_engine/test_whatsapp_stage_route.py
