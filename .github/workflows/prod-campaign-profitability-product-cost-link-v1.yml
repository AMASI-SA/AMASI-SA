name: Production Campaign Profitability Product Cost Link V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "frontend/src/index.js"
      - "frontend/src/campaignProfitabilityProductCostLink.js"
      - "frontend/src/campaignProfitabilityProductCostLink.test.js"
      - ".github/workflows/prod-campaign-profitability-product-cost-link-v1.yml"

permissions:
  contents: read

jobs:
  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test profitability product links
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/campaignProfitabilityProductCostLink.test.js
          src/lib/mezanV2CostLinks.test.js
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce cost deep-link contract
        working-directory: .
        run: |
          INDEX=frontend/src/index.js
          LINK=frontend/src/campaignProfitabilityProductCostLink.js
          grep -q 'campaignProfitabilityProductCostLink' "$INDEX"
          grep -q 'فتح المنتج وإضافة التكلفة' "$LINK"
          grep -q 'lookup_sku' "$LINK"
          grep -q 'listWorkspaceProducts' "$LINK"
          grep -q 'syncRecentProductsV2' "$LINK"
          grep -q 'searchParams.set("product"' "$LINK"
          grep -q 'searchParams.set("focus", "cost")' "$LINK"
          ! grep -Eq '(api|axios)\.(post|put|patch|delete)\(' "$LINK"
