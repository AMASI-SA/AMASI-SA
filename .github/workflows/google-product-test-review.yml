name: Google product test review
on:
  push:
    branches: [codex/google-product-test-review-wip-20261029, codex/google-product-review-release-20261030]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_product_season_review.py
      - backend/integrations_control_center/google_product_test_review*.py
      - backend/tests/test_google_product_test_review*.py
      - .github/workflows/google-product-test-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1 cryptography==50.0.2
          python-multipart==0.0.32 PyJWT==2.15.1 bcrypt==4.1.3
          python-dotenv==1.2.4 pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable loopback replica
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name google-product-test-review-rs -p 127.0.0.1:27482:27482 mongo:8.0.26 --port 27482 --replSet gProductTestReview --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-product-test-review-rs mongosh --port 27482 --quiet --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-product-test-review-rs mongosh --port 27482 --quiet --eval 'if(rs.initiate({_id:"gProductTestReview",members:[{_id:0,host:"127.0.0.1:27482"}]}).ok !== 1) quit(1)'
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-product-test-review-rs mongosh --port 27482 --quiet --eval 'const h=db.hello(); if(h.setName !== "gProductTestReview" || h.isWritablePrimary !== true || !Number.isInteger(h.logicalSessionTimeoutMinutes)) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Test product review against replica
        env:
          GOOGLE_PRODUCT_TEST_REVIEW_MONGO_URI: mongodb://127.0.0.1:27482/
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q -Werror --junitxml=product-test-review-results.xml backend/tests/test_google_product_test_review.py backend/tests/test_google_product_test_review_routes.py backend/tests/test_google_product_test_review_admission.py backend/tests/test_google_store_product_observations.py backend/tests/test_google_prior_season_observations.py backend/tests/test_google_prior_season_context.py backend/tests/test_google_commercial_plan.py backend/tests/test_google_product_test_review_mongo.py
          python - <<'PYGATE'
          import xml.etree.ElementTree as ET
          cases=ET.parse('product-test-review-results.xml').getroot().findall('.//testcase')
          replica=[c for c in cases if c.attrib.get('classname','').endswith('test_google_product_test_review_mongo')]
          assert len(cases)==152 and len(replica)==30
          assert sum(c.attrib.get('name','').startswith('test_actual_owner_plan_review_connection_races_reject_output') for c in replica)==9
          assert sum(c.attrib.get('name','').startswith('test_actual_projection_rejected_orders_never_become_positive_demand') for c in replica)==3
          assert any(c.attrib.get('name')=='test_actual_http_writer_fit_and_real_order_projection_support_review_not_profit' for c in replica)
          assert any(c.attrib.get('name')=='test_actual_review_cas_concurrent_writers_keep_one_winner_no_overwrite' for c in replica)
          assert any(c.attrib.get('name')=='test_actual_committed_campaign_writers_keep_two_products_one_context' for c in replica)
          assert sum(c.attrib.get('name','').startswith('test_actual_owner_drift_during_final_review_read_never_escapes') for c in replica)==6
          assert any(c.attrib.get('name')=='test_actual_meta_tiktok_association_writers_preserve_native_field_gaps_without_performance_claim' for c in replica)
          assert sum(c.attrib.get('name','').startswith('test_actual_duplicate_plan_without_unique_index_fails_closed_before_provider_or_review_write') for c in replica)==3
          assert not [c for c in cases if any(c.find(x) is not None for x in ('skipped','failure','error'))]
          print('Verified',len(cases),'tests including',len(replica),'real Mongo replica tests, zero skips')
          PYGATE
      - name: Remove disposable replica
        if: always()
        run: docker rm -f google-product-test-review-rs
