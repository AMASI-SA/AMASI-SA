name: Production Snapchat TOTAL Breakdown Validation

on:
  pull_request:
    branches:
      - ci/prod-snapchat-total-breakdown-5m-validation

permissions:
  contents: write

concurrency:
  group: prod-snap-total-breakdown-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-snapchat-total-breakdown-5m
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebase staged candidate onto latest Production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/hotfix/prod-snap-meta-final

      - name: Apply staged TOTAL breakdown fix
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/apply_snapchat_total_breakdown_5m.py ]]; then
            python tools/apply_snapchat_total_breakdown_5m.py
            rm tools/apply_snapchat_total_breakdown_5m.py
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.patch.outputs.applied }}" == "true" ]]; then
            git diff --name-only origin/hotfix/prod-snap-meta-final -- | sort > /tmp/changed.txt
          else
            git diff --name-only origin/hotfix/prod-snap-meta-final...HEAD | sort > /tmp/changed.txt
          fi
          cat > /tmp/expected.txt <<'EOF'
          backend/integrations_control_center/snapchat_account_hourly_refresh.py
          backend/integrations_control_center/snapchat_native_performance_sync.py
          backend/tests/test_snapchat_account_hourly_refresh_v2.py
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          echo SNAPCHAT_TOTAL_BREAKDOWN_SCOPE_OK

      - name: Install targeted backend dependencies
        shell: bash
        run: |
          python -m pip install -q \
            fastapi==0.110.1 \
            httpx==0.28.1 \
            pydantic==2.13.4 \
            'pymongo>=4.8,<5' \
            'motor>=3.5,<4' \
            cryptography==48.0.0 \
            openpyxl==3.1.5 \
            email-validator \
            python-jose \
            passlib \
            bcrypt \
            pytest==9.0.3 \
            pytest-asyncio

      - name: Compile changed backend modules
        run: |
          python -m py_compile \
            backend/integrations_control_center/snapchat_account_hourly_refresh.py \
            backend/integrations_control_center/snapchat_native_performance_sync.py \
            backend/tests/test_snapchat_account_hourly_refresh_v2.py

      - name: Run Snapchat and scheduler contracts
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q --tb=short \
            backend/tests/test_snapchat_account_hourly_refresh_v2.py \
            backend/tests/test_ads_auto_sync_scheduler_v2.py \
            backend/tests/test_snapchat_native_data_sync_v2.py::test_native_sync_reads_v2_and_writes_only_native_analytics \
            backend/tests/test_snapchat_native_data_sync_v2.py::test_executor_audits_native_provenance_and_safe_contract

      - name: Enforce provider contract and read-only safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          account = Path('backend/integrations_control_center/snapchat_account_hourly_refresh.py')
          source = account.read_text(encoding='utf-8')
          required = (
              '"granularity": PROVIDER_GRANULARITY',
              'PROVIDER_GRANULARITY = "TOTAL"',
              '"breakdown": PROVIDER_BREAKDOWN',
              'PROVIDER_BREAKDOWN = "campaign"',
              'payload.get("total_stats")',
              'breakdown.get(PROVIDER_BREAKDOWN)',
              'snapchat_account_total_campaign_breakdown_riyadh_refresh_v2',
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(f'Missing TOTAL breakdown markers: {missing}')
          forbidden = (
              '"granularity": "HOUR"',
              'payload.get("timeseries_stats")',
          )
          found = [marker for marker in forbidden if marker in source]
          if found:
              raise SystemExit(f'Obsolete account refresh markers remain: {found}')

          tree = ast.parse(source, filename=str(account))
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  if node.func.attr in {'post', 'put', 'patch', 'delete'}:
                      raise SystemExit(
                          f'Provider mutation method found: {node.func.attr} '
                          f'line {node.lineno}'
                      )
          print('SNAPCHAT_TOTAL_BREAKDOWN_SOURCE_ONLY_OK')
          PY
          git diff --check

      - name: Publish clean candidate commit
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            backend/integrations_control_center/snapchat_account_hourly_refresh.py \
            backend/integrations_control_center/snapchat_native_performance_sync.py \
            backend/tests/test_snapchat_account_hourly_refresh_v2.py \
            tools/apply_snapchat_total_breakdown_5m.py
          git commit -m "fix(prod-snap): poll TOTAL campaign breakdown every five minutes"
          git push --force-with-lease origin HEAD:fix/prod-snapchat-total-breakdown-5m
          echo SNAPCHAT_TOTAL_BREAKDOWN_CLEAN_COMMIT_PUSHED
