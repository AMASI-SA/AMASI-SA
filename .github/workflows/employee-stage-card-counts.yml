name: Employee stage badge counts (metadata-only)
on:
  pull_request:
    paths:
      - "backend/preparation_stage_card_counts.py"
      - "backend/preparation_progress_counts.py"
      - "backend/preparation_section_reads.py"
      - "backend/preparation_supplier_dispatch.py"
      - "backend/mobile_employee_monitoring_workspace_routes.py"
      - "backend/tests/test_preparation_stage_card_counts.py"
      - ".github/workflows/employee-stage-card-counts.yml"
permissions:
  contents: read
jobs:
  read-counts:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'" --health-interval 10s --health-timeout 5s --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install fastapi==0.110.1 pydantic==2.13.4
          pymongo==4.6.3 motor==3.3.2 mongomock-motor==0.0.36 bcrypt==4.1.3
          PyJWT httpx pytest pytest-asyncio openpyxl cryptography reportlab
          python-multipart pymupdf pillow qrcode arabic-reshaper python-bidi
          python-dotenv tzdata email-validator==2.3.0
      - run: >-
          python -m py_compile backend/preparation_stage_card_counts.py
          backend/preparation_progress_counts.py
          backend/preparation_supplier_dispatch.py
          backend/mobile_employee_monitoring_workspace_routes.py
      - name: Verify stage badges do not hydrate products
        working-directory: backend
        env:
          TEST_PROGRESS_MONGO_URI: mongodb://127.0.0.1:27017
        run: python -m pytest -q --tb=short tests/test_preparation_stage_card_counts.py tests/test_preparation_progress_counts.py
