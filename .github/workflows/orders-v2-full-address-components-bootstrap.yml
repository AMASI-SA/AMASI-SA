name: Orders V2 full address components bootstrap

on:
  push:
    branches:
      - fix/orders-v2-district-street-from-order-details
    paths:
      - "scripts/patch_orders_v2_full_address_components.py"
      - ".github/workflows/orders-v2-full-address-components-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply-address-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orders-v2-district-street-from-order-details
          fetch-depth: 0
          show-progress: false

      - name: Apply complete Order Details address mapping
        run: python scripts/patch_orders_v2_full_address_components.py

      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile \
            backend/order_engine/salla_refresh.py \
            backend/tests/test_order_engine_salla_refresh.py
          grep -q 'def _first_named' backend/order_engine/salla_refresh.py
          grep -q 'order.shipments\[0\].ship_to' backend/order_engine/salla_refresh.py
          grep -q 'REFRESH_ENDPOINT_FIELD: "GET /orders/{id} + GET /orders/items"' backend/order_engine/salla_refresh.py
          ! grep -q 'params={"format": "light"}' backend/order_engine/salla_refresh.py
          grep -q 'test_full_order_details_uses_embedded_ship_to_and_skips_numeric_ids' backend/tests/test_order_engine_salla_refresh.py

      - name: Run targeted Orders V2 tests
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pip install -q \
            fastapi==0.110.1 \
            pydantic==2.13.4 \
            pymongo==4.5.0 \
            httpx \
            pytest \
            pytest-asyncio \
            openpyxl \
            cryptography \
            reportlab \
            python-multipart
          python -m pytest \
            tests/test_order_engine_salla_refresh.py \
            tests/test_order_engine_repository.py \
            tests/test_order_engine_mapper.py \
            -q --tb=short

      - name: Commit permanent source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Address component fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/order_engine/salla_refresh.py \
            backend/tests/test_order_engine_salla_refresh.py
          git commit -m "fix(orders-v2): map district and street from Order Details"
          git push origin HEAD:fix/orders-v2-district-street-from-order-details
