          python -m py_compile integrations_control_center/snapchat_active_campaign_filtering.py integrations_control_center/snapchat_account_timezone_manager.py integrations_control_center/snapchat_adsquad_performance.py integrations_control_center/snapchat_ad_performance.py
          python -m pytest -q --tb=short tests/test_snapchat_active_campaign_entity_filters_v1.py tests/test_snapchat_adsquad_performance_v1.py tests/test_snapchat_ad_performance_v1.py

      - name: Verify frontend
        working-directory: frontend
        env:
