          replace_once(path,
              '    }, [adSquadPage, appliedQuery, appliedRange, platform, selectedAccountId]);\n',
              '    }, [activeCampaignsOnly, adSquadPage, adSquadSort, appliedQuery, appliedRange, platform, selectedAccountId]);\n',
