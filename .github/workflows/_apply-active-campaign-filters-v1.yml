          replace_once(path,
              '        setEntityLevel("campaigns");\n        setAdSquadReport(null);\n',
              '        setEntityLevel("campaigns");\n        setActiveCampaignsOnly(true);\n        setAdSquadSort("orders");\n        setAdSquadReport(null);\n',
          )
          replace_once(path,
              '                    readOnly={data?.policy?.mutations_allowed !== true}\n                    adSquadReport={adSquadReport}\n',
              '                    readOnly={data?.policy?.mutations_allowed !== true}\n                    activeCampaignsOnly={activeCampaignsOnly}\n                    onActiveCampaignsOnlyChange={(value) => {\n                        setPage(1);\n                        setAdSquadPage(1);\n                        setActiveCampaignsOnly(value);\n                    }}\n                    adSquadSort={adSquadSort}\n                    onAdSquadSortChange={(value) => {\n                        setAdSquadPage(1);\n                        setAdSquadSort(value);\n                    }}\n                    adSquadReport={adSquadReport}\n',
          )

          # Ad Squad local rendering understands orders mode and controlled server sort.
          path = 'frontend/src/components/marketing/AdSquadManagerTable.jsx'
          replace_once(path,
              'const VALID_SORTS = new Set(["newest", "spend", "active"]);\n',
              'const VALID_SORTS = new Set(["orders", "newest", "spend", "active"]);\n',
          )
          replace_once(path,
              '    const normalized = VALID_SORTS.has(mode) ? mode : "newest";\n',
              '    const normalized = VALID_SORTS.has(mode) ? mode : "orders";\n',
