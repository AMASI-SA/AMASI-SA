                    grep -q 'active_campaigns_only: bool = Query(default=True)' backend/integrations_control_center/snapchat_adsquad_performance.py
                    grep -q 'active_campaigns_only: bool = Query(default=True)' backend/integrations_control_center/snapchat_ad_performance.py
                    grep -q 'filtered_totals = aggregate_entity_rows(rows)' backend/integrations_control_center/snapchat_adsquad_performance.py
                    grep -q 'filtered_totals = aggregate_entity_rows(rows)' backend/integrations_control_center/snapchat_ad_performance.py
                    ! grep -Eq 'provider_write_reached.*True|campaign_write_reached.*True|accounting_write_reached.*True|qoyod_write_reached.*True' backend/integrations_control_center/snapchat_active_campaign_filtering.py

            frontend-test-and-build:
              runs-on: ubuntu-24.04
              defaults:
                run:
                  working-directory: frontend
