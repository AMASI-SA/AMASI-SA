              '    const effectiveSort = VALID_SORTS.has(sortMode) ? sortMode : preferredSort;\n    const sorted = useMemo(() => {\n        const preferred = sortAdSquadRows(rows, effectiveSort);\n',
          )
          replace_once(path,
              '    }, [rows, preferredSort, columnSort]);\n',
              '    }, [rows, effectiveSort, columnSort]);\n',
          )
          replace_once(path,
              '            data-sort-mode={preferredSort}\n',
              '            data-sort-mode={effectiveSort}\n',
