          replace_once(path,
              '                limit: 25,\n            });\n            setAdSquadReport(result);\n',
              '                limit: 25,\n                activeCampaignsOnly,\n                sortBy: adSquadSort,\n            });\n            setAdSquadReport(result);\n',
