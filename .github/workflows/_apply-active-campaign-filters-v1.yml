name: Apply Active Campaign Entity Filters V1

on:
  push:
    branches:
      - fix/prod-active-campaign-entity-filters-v1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-active-campaign-entity-filters-v1
          fetch-depth: 0

      - name: Apply native active-campaign filtering and global sorting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, content):
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f'{path}: expected one match, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, flags=0):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise AssertionError(f'{path}: expected one regex match, found {count}: {pattern!r}')
              write(path, updated)

          helper = '''"""Shared active-Campaign filtering and global entity sorting for Snapchat Ads Manager."""
          from __future__ import annotations

          from datetime import datetime, timezone
          from typing import Any, Iterable

          ACTIVE_PROVIDER_STATUSES = frozenset({"ACTIVE", "ENABLED", "DELIVERING"})
          VALID_ENTITY_SORTS = frozenset({"orders", "spend", "newest", "active"})


          def _text(value: Any) -> str:
              return str(value or "").strip()


          def _number(value: Any) -> float | None:
              if value is None or isinstance(value, bool):
                  return None
              try:
                  parsed = float(value)
              except (TypeError, ValueError, OverflowError):
                  return None
              return parsed if parsed == parsed and abs(parsed) != float("inf") else None


          def _ratio(numerator: float | None, denominator: float | None, scale: float = 1.0) -> float | None:
              if numerator is None or denominator is None or denominator == 0:
                  return None
              return round(float(numerator) / float(denominator) * scale, 6)


          def is_active_provider_status(value: Any) -> bool:
              return _text(value).upper() in ACTIVE_PROVIDER_STATUSES


          def normalize_entity_sort(value: Any, default: str = "orders") -> str:
              normalized = _text(value).lower()
              return normalized if normalized in VALID_ENTITY_SORTS else default


          def _timestamp(row: dict[str, Any], fields: Iterable[str]) -> float:
              for field in fields:
                  raw = _text(row.get(field))
                  if not raw:
                      continue
                  try:
                      parsed = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return parsed.timestamp()
              return 0.0


          def sort_entity_rows(
              rows: list[dict[str, Any]],
              mode: str,
              *,
              name_field: str,
              status_field: str = "status",
              created_fields: tuple[str, ...] = (
                  "created_at_provider",
                  "start_time",
                  "updated_at_provider",
              ),
          ) -> list[dict[str, Any]]:
              normalized = normalize_entity_sort(mode)

              def key(row: dict[str, Any]):
                  orders = _number(row.get("orders")) or 0.0
                  spend = _number(row.get("spend_sar")) or 0.0
                  active = 1 if is_active_provider_status(row.get(status_field)) else 0
                  created = _timestamp(row, created_fields)
                  name = _text(row.get(name_field)).casefold()
                  if normalized == "spend":
                      return (-spend, -orders, -created, name)
                  if normalized == "newest":
                      return (-created, -spend, -orders, name)
                  if normalized == "active":
                      return (-active, -orders, -spend, -created, name)
                  return (-orders, -spend, -created, name)

              return sorted((dict(row) for row in rows), key=key)


          def aggregate_entity_rows(rows: list[dict[str, Any]]) -> dict[str, Any]:
              numeric_fields = (
                  "spend_sar",
                  "spend_native",
                  "sales_sar",
                  "sales_native",
                  "orders",
                  "impressions",
                  "swipes",
                  "video_views",
              )
              totals: dict[str, float | None] = {}
              for field in numeric_fields:
                  values = [number for row in rows if (number := _number(row.get(field))) is not None]
                  totals[field] = round(sum(values), 6) if values else None
              orders = totals.get("orders")
              impressions = totals.get("impressions")
              swipes = totals.get("swipes")
              spend_sar = totals.get("spend_sar")
              spend_native = totals.get("spend_native")
              sales_sar = totals.get("sales_sar")
              totals.update({
                  "orders": int(round(orders)) if orders is not None else None,
                  "impressions": int(round(impressions)) if impressions is not None else None,
                  "swipes": int(round(swipes)) if swipes is not None else None,
                  "video_views": int(round(totals["video_views"])) if totals.get("video_views") is not None else None,
                  "roas": _ratio(sales_sar, spend_sar),
                  "cpa_sar": _ratio(spend_sar, orders),
                  "cpa_native": _ratio(spend_native, orders),
                  "cpc_sar": _ratio(spend_sar, swipes),
                  "cpc_native": _ratio(spend_native, swipes),
                  "cpm_sar": _ratio(spend_sar, impressions, 1000.0),
                  "cpm_native": _ratio(spend_native, impressions, 1000.0),
                  "ctr_pct": _ratio(swipes, impressions, 100.0),
                  "observed_days": max((int(row.get("observed_days") or 0) for row in rows), default=0),
                  "source_rows": sum(int(row.get("source_rows") or 0) for row in rows),
                  "data_complete": bool(rows) and all(row.get("data_complete") is not False for row in rows),
              })
              return totals


          __all__ = [
              "ACTIVE_PROVIDER_STATUSES",
              "VALID_ENTITY_SORTS",
              "aggregate_entity_rows",
              "is_active_provider_status",
              "normalize_entity_sort",
              "sort_entity_rows",
          ]
          '''
          write('backend/integrations_control_center/snapchat_active_campaign_filtering.py', helper)

          # Campaign report: filter active campaigns before search/pagination.
          path = 'backend/integrations_control_center/snapchat_account_timezone_manager.py'
          replace_once(path,
              'from .snapchat_account_selection import _load_selected_accounts\n',
              'from .snapchat_account_selection import _load_selected_accounts\nfrom .snapchat_active_campaign_filtering import is_active_provider_status\n',
          )
          replace_once(path,
              '    result_source: str,\n    now: Callable[[], datetime] = _utcnow,\n',
              '    result_source: str,\n    active_campaigns_only: bool = False,\n    now: Callable[[], datetime] = _utcnow,\n',
          )
          replace_once(path,
              '    campaigns_query = _text(campaign_query).casefold()[:120]\n',
              '    for campaign in campaigns:\n        campaign["campaign_active"] = is_active_provider_status(campaign.get("status"))\n    if active_campaigns_only:\n        campaigns = [campaign for campaign in campaigns if campaign.get("campaign_active") is True]\n\n    campaigns_query = _text(campaign_query).casefold()[:120]\n',
          )
          replace_once(path,
              '        "supported_result_sources": list(SUPPORTED_RESULT_SOURCES),\n',
              '        "supported_result_sources": list(SUPPORTED_RESULT_SOURCES),\n        "active_campaigns_only": bool(active_campaigns_only),\n',
          )
          replace_once(path,
              '        result_source: str = Query(default=RESULT_SOURCE_SALLA, pattern="^(salla|platform)$"),\n        user: dict = Depends(current_user),\n',
              '        result_source: str = Query(default=RESULT_SOURCE_SALLA, pattern="^(salla|platform)$"),\n        active_campaigns_only: bool = Query(default=True),\n        user: dict = Depends(current_user),\n',
          )
          replace_once(path,
              '                result_source=result_source,\n            )\n',
              '                result_source=result_source,\n                active_campaigns_only=active_campaigns_only,\n            )\n',
          )

          # Ad Squad report: parent Campaign status, active filter, server-side sorting, filtered totals.
          path = 'backend/integrations_control_center/snapchat_adsquad_performance.py'
          replace_once(path,
              'from .snapchat_account_selection import _load_selected_accounts\n',
              'from .snapchat_account_selection import _load_selected_accounts\nfrom .snapchat_active_campaign_filtering import (\n    aggregate_entity_rows,\n    is_active_provider_status,\n    normalize_entity_sort,\n    sort_entity_rows,\n)\n',
          )
          replace_once(path,
              '    limit: int,\n    now: Callable[[], datetime] = _utcnow,\n',
              '    limit: int,\n    active_campaigns_only: bool = False,\n    sort_by: str = "orders",\n    now: Callable[[], datetime] = _utcnow,\n',
          )
          replace_once(path,
              '            "campaign_name": (\n                _text(campaign.get("display_name"))\n                or campaign_id\n                or "حملة غير معروفة"\n            ),\n            "status": entity.get("status") or "unknown",\n',
              '            "campaign_name": (\n                _text(campaign.get("display_name"))\n                or campaign_id\n                or "حملة غير معروفة"\n            ),\n            "campaign_status": campaign.get("status") or "unknown",\n            "campaign_active": is_active_provider_status(campaign.get("status")),\n            "status": entity.get("status") or "unknown",\n            "created_at_provider": entity.get("created_at_provider"),\n            "updated_at_provider": entity.get("updated_at_provider"),\n',
          )
          replace_once(path,
              '    rows.sort(key=lambda item: (\n        -(float(item.get("spend_sar") or 0)),\n        _text(item.get("ad_squad_name")).casefold(),\n    ))\n    total = len(rows)\n',
              '    if active_campaigns_only:\n        rows = [item for item in rows if item.get("campaign_active") is True]\n    sort_mode = normalize_entity_sort(sort_by)\n    rows = sort_entity_rows(\n        rows,\n        sort_mode,\n        name_field="ad_squad_name",\n        status_field="status",\n    )\n    filtered_totals = aggregate_entity_rows(rows)\n    total = len(rows)\n',
          )
          replace_once(path,
              '    totals = _aggregate_rows(\n        performance_rows,\n        requested_days=requested_days,\n    )\n',
              '    totals = filtered_totals\n',
          )
          replace_once(path,
              '        "supported_result_sources": ["platform"],\n',
              '        "supported_result_sources": ["platform"],\n        "active_campaigns_only": bool(active_campaigns_only),\n        "sort_by": sort_mode,\n',
          )
          replace_once(path,
              '        limit: int = Query(default=25, ge=10, le=100),\n        user: dict = Depends(current_user),\n',
              '        limit: int = Query(default=25, ge=10, le=100),\n        active_campaigns_only: bool = Query(default=True),\n        sort_by: str = Query(default="orders", pattern="^(orders|spend|newest|active)$"),\n        user: dict = Depends(current_user),\n',
          )
          replace_once(path,
              '                limit=limit,\n            )\n',
              '                limit=limit,\n                active_campaigns_only=active_campaigns_only,\n                sort_by=sort_by,\n            )\n',
          )

          # Ad report: same parent Campaign filter and global sort before pagination.
          path = 'backend/integrations_control_center/snapchat_ad_performance.py'
          replace_once(path,
              'from .snapchat_account_selection import _load_selected_accounts\n',
              'from .snapchat_account_selection import _load_selected_accounts\nfrom .snapchat_active_campaign_filtering import (\n    aggregate_entity_rows,\n    is_active_provider_status,\n    normalize_entity_sort,\n    sort_entity_rows,\n)\n',
          )
          replace_once(path,
              '    limit: int,\n    now: Callable[[], datetime] = _utcnow,\n',
              '    limit: int,\n    active_campaigns_only: bool = False,\n    sort_by: str = "orders",\n    now: Callable[[], datetime] = _utcnow,\n',
          )
          replace_once(path,
              '        limit=100,\n        now=lambda: current,\n',
              '        limit=100,\n        active_campaigns_only=False,\n        sort_by="spend",\n        now=lambda: current,\n',
          )
          replace_once(path,
              '            "campaign_name": _text(campaign.get("display_name")) or campaign_id or "حملة غير معروفة",\n            "status": delivery["configured_status"],\n',
              '            "campaign_name": _text(campaign.get("display_name")) or campaign_id or "حملة غير معروفة",\n            "campaign_status": campaign.get("status") or "unknown",\n            "campaign_active": is_active_provider_status(campaign.get("status")),\n            "ad_squad_status": squad.get("status") or "unknown",\n            "status": delivery["configured_status"],\n',
          )
          regex_once(path,
              r'    rows\.sort\(key=lambda item: \(\n        -\(float\(item\.get\("spend_sar"\) or 0\)\),\n        -\(\n            _parse_datetime\(item\.get\("created_at_provider"\)\)\.timestamp\(\)\n            if _parse_datetime\(item\.get\("created_at_provider"\)\) else 0\n        \),\n        _text\(item\.get\("ad_name"\)\)\.casefold\(\),\n    \)\)\n    total = len\(rows\)\n',
              '    if active_campaigns_only:\n        rows = [item for item in rows if item.get("campaign_active") is True]\n    sort_mode = normalize_entity_sort(sort_by)\n    rows = sort_entity_rows(\n        rows,\n        sort_mode,\n        name_field="ad_name",\n        status_field="status",\n    )\n    filtered_totals = aggregate_entity_rows(rows)\n    total = len(rows)\n',
          )
          replace_once(path,
              '    totals = _aggregate_rows(performance_rows, requested_days=requested_days)\n',
              '    totals = filtered_totals\n',
          )
          replace_once(path,
              '        "supported_result_sources": ["platform"],\n',
              '        "supported_result_sources": ["platform"],\n        "active_campaigns_only": bool(active_campaigns_only),\n        "sort_by": sort_mode,\n',
          )
          replace_once(path,
              '        limit: int = Query(default=100, ge=10, le=100),\n        user: dict = Depends(current_user),\n',
              '        limit: int = Query(default=100, ge=10, le=100),\n        active_campaigns_only: bool = Query(default=True),\n        sort_by: str = Query(default="orders", pattern="^(orders|spend|newest|active)$"),\n        user: dict = Depends(current_user),\n',
          )
          replace_once(path,
              '                limit=limit,\n            )\n',
              '                limit=limit,\n                active_campaigns_only=active_campaigns_only,\n                sort_by=sort_by,\n            )\n',
          )

          # Frontend Campaign API filter.
          path = 'frontend/src/services/marketingPerformance.js'
          replace_once(path,
              '        status: text(value.status, "unknown"),\n',
              '        status: text(value.status, "unknown"),\n        campaign_active: value.campaign_active === true,\n',
          )
          replace_once(path,
              '    limit = 25,\n} = {}) {\n',
              '    limit = 25,\n    activeCampaignsOnly = true,\n} = {}) {\n',
          )
          replace_once(path,
              '                    limit,\n                },\n',
              '                    limit,\n                    active_campaigns_only: activeCampaignsOnly,\n                },\n',
          )

          # Frontend Ad Squad service.
          path = 'frontend/src/services/snapchatAdSquadPerformance.js'
          replace_once(path,
              '        campaign_name: text(value.campaign_name, value.campaign_id || "حملة غير معروفة"),\n',
              '        campaign_name: text(value.campaign_name, value.campaign_id || "حملة غير معروفة"),\n        campaign_status: text(value.campaign_status, "unknown"),\n        campaign_active: value.campaign_active === true,\n',
          )
          replace_once(path,
              '    limit = 25,\n} = {}) {\n',
              '    limit = 25,\n    activeCampaignsOnly = true,\n    sortBy = "orders",\n} = {}) {\n',
          )
          replace_once(path,
              '            limit,\n        },\n',
              '            limit,\n            active_campaigns_only: activeCampaignsOnly,\n            sort_by: sortBy,\n        },\n',
          )

          # Frontend Ad service.
          path = 'frontend/src/services/snapchatAdPerformance.js'
          replace_once(path,
              '        campaign_name: text(value.campaign_name, value.campaign_id || "حملة غير معروفة"),\n',
              '        campaign_name: text(value.campaign_name, value.campaign_id || "حملة غير معروفة"),\n        campaign_status: text(value.campaign_status, "unknown"),\n        campaign_active: value.campaign_active === true,\n        ad_squad_status: text(value.ad_squad_status, "unknown"),\n',
          )
          replace_once(path,
              '    limit = 100,\n} = {}) {\n',
              '    limit = 100,\n    activeCampaignsOnly = true,\n    sortBy = "orders",\n} = {}) {\n',
          )
          replace_once(path,
              '            limit,\n        },\n',
              '            limit,\n            active_campaigns_only: activeCampaignsOnly,\n            sort_by: sortBy,\n        },\n',
          )

          # Controlled native Ad Squad sort controls: orders/spend/newest.
          controls = '''import { useEffect, useState } from "react";

          export const AD_SQUAD_SORT_STORAGE_KEY = "mezan-snapchat-adsquad-sort-v2";
          export const AD_SQUAD_SORT_EVENT = "mezan:snapchat-adsquad-sort-updated";
          export const AD_SQUAD_SORT_OPTIONS = Object.freeze([
              { id: "orders", label: "الأكثر طلبًا" },
              { id: "spend", label: "الأكثر صرفًا" },
              { id: "newest", label: "الأحدث أولًا" },
          ]);
          const VALID = new Set(AD_SQUAD_SORT_OPTIONS.map((item) => item.id));

          export function readAdSquadSort(storage = typeof window !== "undefined" ? window.localStorage : null) {
              try {
                  const value = String(storage?.getItem(AD_SQUAD_SORT_STORAGE_KEY) || "orders");
                  return VALID.has(value) ? value : "orders";
              } catch {
                  return "orders";
              }
          }

          export function writeAdSquadSort(value, storage = typeof window !== "undefined" ? window.localStorage : null) {
              const normalized = VALID.has(String(value || "")) ? String(value) : "orders";
              try {
                  storage?.setItem(AD_SQUAD_SORT_STORAGE_KEY, normalized);
              } catch {
                  // Controlled state still updates when storage is unavailable.
              }
              if (typeof window !== "undefined") {
                  window.dispatchEvent(new CustomEvent(AD_SQUAD_SORT_EVENT, {
                      detail: { sort_by: normalized, source: "react_controls" },
                  }));
              }
              return normalized;
          }

          export default function AdSquadSortControls({ value: controlledValue = null, onChange }) {
              const [localValue, setLocalValue] = useState(() => readAdSquadSort());
              const value = VALID.has(controlledValue) ? controlledValue : localValue;

              useEffect(() => {
                  if (VALID.has(controlledValue)) setLocalValue(controlledValue);
              }, [controlledValue]);

              function choose(next) {
                  const normalized = writeAdSquadSort(next);
                  setLocalValue(normalized);
                  onChange?.(normalized);
              }

              return (
                  <div
                      className="flex flex-wrap items-center justify-between gap-3 border-x border-t border-slate-200 bg-slate-50 px-4 py-3"
                      data-testid="ad-squad-native-sort-controls"
                      dir="rtl"
                  >
                      <div>
                          <div className="text-sm font-black text-slate-700">ترتيب المجموعات الإعلانية</div>
                          <div className="mt-0.5 text-[11px] font-bold text-slate-400">يطبق الترتيب على جميع النتائج قبل تقسيم الصفحات.</div>
                      </div>
                      <div className="flex flex-wrap gap-2">
                          {AD_SQUAD_SORT_OPTIONS.map((option) => {
                              const active = value === option.id;
                              return (
                                  <button
                                      key={option.id}
                                      type="button"
                                      onClick={() => choose(option.id)}
                                      aria-pressed={active}
                                      data-testid={`ad-squad-sort-${option.id}`}
                                      className={[
                                          "min-h-10 rounded-xl px-4 text-sm font-black transition",
                                          active
                                              ? "bg-slate-950 text-white shadow-sm"
                                              : "border border-slate-200 bg-white text-slate-700 hover:border-slate-300 hover:bg-slate-100",
                                      ].join(" ")}
                                  >
                                      {option.label}
                                  </button>
                              );
                          })}
                      </div>
                  </div>
              );
          }
          '''
          write('frontend/src/components/marketing/AdSquadSortControls.jsx', controls)

          # Shared active-Campaign toggle is native React and controls all levels.
          workspace = '''import CampaignManagerTable from "./CampaignManagerTable";
          import AdSquadManagerTable from "./AdSquadManagerTable";
          import AdSquadSortControls from "./AdSquadSortControls";
          import AdManagerTable from "./AdManagerTable";
          import { hydrateCampaignProfitability } from "../../marketingCampaignProfitabilityHydration";

          function EntityTabs({ platformLabel, entityLevel, onChange, adSquadsEnabled, adsEnabled }) {
              const items = [
                  { id: "campaigns", label: "الحملات", enabled: true },
                  { id: "ad_squads", label: "المجموعات الإعلانية", enabled: adSquadsEnabled },
                  { id: "ads", label: "الإعلانات", enabled: adsEnabled },
              ];
              return (
                  <div className="flex min-h-14 items-end gap-6 overflow-x-auto rounded-t-2xl border border-b-0 border-slate-200 bg-white px-4" data-testid="ads-entity-level-tabs">
                      {items.map((item) => {
                          const active = entityLevel === item.id;
                          return (
                              <button
                                  key={item.id}
                                  type="button"
                                  disabled={!item.enabled}
                                  onClick={() => item.enabled && onChange?.(item.id)}
                                  className={["relative shrink-0 px-1 pb-3 pt-4 text-sm transition", active ? "font-black text-slate-950" : item.enabled ? "font-bold text-slate-600 hover:text-slate-950" : "cursor-not-allowed font-bold text-slate-300"].join(" ")}
                                  aria-pressed={active}
                                  data-testid={`ads-entity-level-${item.id}`}
                              >
                                  {item.label}
                                  {active && <span className="absolute inset-x-0 bottom-0 h-0.5 bg-amber-400" />}
                              </button>
                          );
                      })}
                      <span className="mr-auto pb-3 text-[11px] font-bold text-slate-400">{platformLabel || "المنصة"} · قراءة فقط</span>
                  </div>
              );
          }

          function ActiveCampaignFilter({ checked, onChange, entityLevel }) {
              const entityLabel = entityLevel === "ad_squads" ? "المجموعات" : entityLevel === "ads" ? "الإعلانات" : "الحملات";
              return (
                  <div className="flex flex-wrap items-center justify-between gap-3 border-x border-t border-slate-200 bg-white px-4 py-3" data-testid="active-campaign-filter">
                      <div>
                          <div className="text-sm font-black text-slate-800">{checked ? `${entityLabel} التابعة لحملات نشطة فقط` : `عرض كل ${entityLabel}`}</div>
                          <div className="mt-0.5 text-[11px] font-bold text-slate-400">الفلترة تتم من المصدر قبل Pagination، وليست فلترة للصفحة الحالية.</div>
                      </div>
                      <button
                          type="button"
                          onClick={() => onChange?.(!checked)}
                          aria-pressed={checked}
                          data-testid="active-campaigns-only-toggle"
                          className={`inline-flex min-h-10 items-center gap-2 rounded-xl border px-4 text-sm font-black transition ${checked ? "border-emerald-300 bg-emerald-50 text-emerald-800" : "border-slate-200 bg-white text-slate-700"}`}
                      >
                          <span className={`relative inline-flex h-5 w-9 rounded-full ${checked ? "bg-emerald-500" : "bg-slate-300"}`}>
                              <span className={`absolute top-0.5 h-4 w-4 rounded-full bg-white shadow-sm ${checked ? "right-[18px]" : "right-0.5"}`} />
                          </span>
                          الحملات النشطة فقط
                      </button>
                  </div>
              );
          }

          export default function AdsEntityLevelWorkspace({
              platform,
              platformLabel,
              entityLevel,
              onEntityLevelChange,
              campaigns,
              campaignTotals,
              campaignPagination,
              campaignPage,
              onCampaignPageChange,
              readOnly,
              activeCampaignsOnly = true,
              onActiveCampaignsOnlyChange,
              adSquadSort = "orders",
              onAdSquadSortChange,
              adSquadReport,
              adSquadPage,
              onAdSquadPageChange,
              adSquadLoading,
              adSquadError,
          }) {
              const adSquadsEnabled = platform === "snapchat";
              const adsEnabled = platform === "snapchat";
              const campaignReport = platform === "snapchat"
                  ? hydrateCampaignProfitability(campaigns, campaignTotals)
                  : { campaigns, totals: campaignTotals };

              return (
                  <section data-testid="ads-entity-level-workspace">
                      <style>{`
                          [data-testid="ads-entity-level-workspace"] [data-testid="campaign-manager-table"] > div:first-child { display: none; }
                          [data-testid="ads-entity-level-workspace"] [data-testid="campaign-manager-table"] { border-top-left-radius: 0; border-top-right-radius: 0; }
                      `}</style>
                      <EntityTabs platformLabel={platformLabel} entityLevel={entityLevel} onChange={onEntityLevelChange} adSquadsEnabled={adSquadsEnabled} adsEnabled={adsEnabled} />
                      {platform === "snapchat" && (
                          <ActiveCampaignFilter checked={activeCampaignsOnly} onChange={onActiveCampaignsOnlyChange} entityLevel={entityLevel} />
                      )}
                      {entityLevel === "campaigns" && (
                          <CampaignManagerTable
                              platform={platform}
                              platformLabel={platformLabel}
                              campaigns={campaignReport.campaigns}
                              totals={campaignReport.totals}
                              pagination={campaignPagination}
                              page={campaignPage}
                              onPageChange={onCampaignPageChange}
                              readOnly={readOnly}
                          />
                      )}
                      {entityLevel === "ad_squads" && (
                          <>
                              <AdSquadSortControls value={adSquadSort} onChange={onAdSquadSortChange} />
                              <AdSquadManagerTable
                                  rows={adSquadReport?.ad_squads || []}
                                  totals={adSquadReport?.totals || {}}
                                  pagination={adSquadReport?.pagination || {}}
                                  page={adSquadPage}
                                  onPageChange={onAdSquadPageChange}
                                  loading={adSquadLoading}
                                  error={adSquadError}
                                  sortMode={adSquadSort}
                              />
                          </>
                      )}
                      {entityLevel === "ads" && <AdManagerTable activeCampaignsOnly={activeCampaignsOnly} />}
                  </section>
              );
          }
          '''
          write('frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx', workspace)

          # Top-level state drives server requests and resets pagination.
          path = 'frontend/src/pages/MarketingPlatformWorkspace.jsx'
          replace_once(path,
              '    const [entityLevel, setEntityLevel] = useState("campaigns");\n    const [adSquadPage, setAdSquadPage] = useState(1);\n',
              '    const [entityLevel, setEntityLevel] = useState("campaigns");\n    const [activeCampaignsOnly, setActiveCampaignsOnly] = useState(true);\n    const [adSquadSort, setAdSquadSort] = useState("orders");\n    const [adSquadPage, setAdSquadPage] = useState(1);\n',
          )
          replace_once(path,
              '                limit: 25,\n            });\n',
              '                limit: 25,\n                activeCampaignsOnly,\n            });\n',
