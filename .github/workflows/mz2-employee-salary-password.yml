name: MZ2 Employee Salary and Password

on:
  push:
    branches: [codex/mz2-salary-effective-date-20261005]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  employee-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install fastapi==0.110.1 pydantic==2.13.4 bcrypt==4.1.3 PyJWT==2.13.0 motor==3.3.2 pymongo==4.5.0 pytest==9.0.3 pytest-asyncio==1.3.0 httpx==0.28.1 email-validator==2.3.0 openpyxl==3.1.5
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --cwd frontend install --frozen-lockfile --non-interactive
      - name: Start disposable Mongo replica set
        run: |
          docker run -d --name mz2-employee-test --network host mongo:8.0.12 mongod --replSet salaryfix --port 27465 --bind_ip 127.0.0.1
          for attempt in $(seq 1 60); do
            if docker exec mz2-employee-test mongosh --port 27465 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec mz2-employee-test mongosh --port 27465 --quiet --eval 'rs.initiate({_id:"salaryfix",members:[{_id:0,host:"127.0.0.1:27465"}]})'
          for attempt in $(seq 1 60); do
            if docker exec mz2-employee-test mongosh --port 27465 --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify employee salary and password contracts
        run: |
          python scripts/testing/mz2_salary_effective_date/verify.py --python "$(which python)" --node-modules "$GITHUB_WORKSPACE/frontend/node_modules" --mongo-uri 'mongodb://127.0.0.1:27465/?replicaSet=salaryfix' --output "$RUNNER_TEMP/employee-proof"
          python -c "import json,os; p=json.load(open(os.environ['RUNNER_TEMP']+'/employee-proof/verification.json')); assert p['backend']==dict(tests=127,failures=0,errors=0,skipped=0); assert p['frontend']['numPassedTests']==32 and p['frontend']['numFailedTests']==0 and p['frontend']['numPendingTests']==0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mz2-employee-salary-password-proof
          path: ${{ runner.temp }}/employee-proof
      - name: Stop disposable Mongo
        if: always()
        run: docker stop mz2-employee-test || true
