name: Verify Chatwoot local secret operator (synthetic only)
on:
  push:
    branches: [ops/whatsapp-v5-guarded-prepare-20261128]
    paths:
      - ops/mezan_chatwoot_env_secret_safe.py
      - .github/workflows/verify-chatwoot-secret-operator.yml
permissions:
  contents: read
jobs:
  check-secret-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check private env append on synthetic fixture only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile ops/mezan_chatwoot_env_secret_safe.py
          sudo python3 -B - <<'PY'
          import builtins, importlib.util, stat, tempfile
          from pathlib import Path
          from unittest.mock import patch

          spec = importlib.util.spec_from_file_location("safe", "ops/mezan_chatwoot_env_secret_safe.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert str(module.APP_ENV) == "/app/backend/.env"
          assert module.SECRET_NAME == "AMASI_CHATWOOT_BOT_TOKEN"
          assert module.TOKEN_PATTERN.fullmatch("x"*24)
          assert module.TOKEN_PATTERN.fullmatch("x"*23) is None
          with tempfile.TemporaryDirectory() as root:
              root = Path(root)
              path = root/"backend"/".env"
              path.parent.mkdir()
              original = b"MONGO_URL=mongodb://synthetic.invalid\nAMASI_WHATSAPP_CATALOG_ENABLED=0\nAMASI_WHATSAPP_ORDER_STAGE_ENABLED=0\n"
              path.write_bytes(original)
              path.chmod(0o600)
              module.APP_ENV = path
              module.BACKUP_DIR = root/"private"
              real_open = builtins.open
              def fake_open(name, *args, **kwargs):
                  if name == "/dev/tty":
                      return real_open("/dev/null", *args, **kwargs)
                  return real_open(name, *args, **kwargs)
              with patch("builtins.open", side_effect=fake_open), patch("getpass.getpass", return_value="SYNTHETIC_ONLY_1234567890123"):
                  module.perform()
              assert path.read_bytes().startswith(original)
              assert path.read_bytes().endswith(b"AMASI_CHATWOOT_BOT_TOKEN=SYNTHETIC_ONLY_1234567890123\n")
              assert stat.S_IMODE(path.stat().st_mode) == 0o600
              assert len(list(module.BACKUP_DIR.iterdir())) == 1
              assert list(module.BACKUP_DIR.iterdir())[0].read_bytes() == original
              try:
                  module.check_existing(path.read_bytes())
              except RuntimeError as error:
                  assert "already configured" in str(error)
              else:
                  raise AssertionError("duplicate token must be refused")
              try:
                  module.check_existing(b"AMASI_WHATSAPP_CATALOG_ENABLED=1\n")
              except RuntimeError as error:
                  assert "not OFF" in str(error)
              else:
                  raise AssertionError("enabled WhatsApp flag must be refused")
          print("CHATWOOT_SECRET_OPERATOR_TEST_PASS")
          PY
