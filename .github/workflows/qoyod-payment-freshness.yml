name: Qoyod Payment Freshness

on:
  pull_request:
    paths:
      - "backend/order_engine/__init__.py"
      - "backend/tests/test_qoyod_auto_send_latest_payment.py"
      - ".github/workflows/qoyod-payment-freshness.yml"
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run payment freshness regression
        run: python -m pytest tests/test_qoyod_auto_send_latest_payment.py -q
