name: Qoyod Payment Freshness

on:
  pull_request:
    paths:
      - "backend/order_engine/__init__.py"
      - "backend/tests/test_qoyod_auto_send_latest_payment.py"
      - ".github/workflows/qoyod-payment-freshness.yml"
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify latest-payment invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          bootstrap = Path('order_engine/__init__.py').read_text(encoding='utf-8')
          orders = Path('orders_db.py').read_text(encoding='utf-8')
          assert '_orders_db.CRITICAL_FIELDS.add("payment_method")' in bootstrap
          for field in ('"payment_method"', '"payment_status"', '"paid_amount"', '"remaining_amount"', '"payment_collection_status"'):
              assert field in orders
          print('LATEST_PAYMENT_POLICY_OK')
          PY
