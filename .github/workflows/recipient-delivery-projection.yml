name: Recipient Delivery Projection

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/order_engine/recipient_enrichment.py"
      - "backend/order_engine/mapper.py"
      - "backend/order_engine/shipping_label_service.py"
      - "backend/order_review_routes.py"
      - "backend/tests/test_recipient_delivery_projection.py"
      - ".github/workflows/recipient-delivery-projection.yml"

permissions:
  contents: read

jobs:
  recipient-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          motor==3.3.1
          pytest
          pytest-asyncio
          httpx
          openpyxl
          cryptography
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Compile recipient boundary
        run: >-
          python -m py_compile
          backend/order_engine/recipient_enrichment.py
          backend/order_engine/mapper.py
          backend/order_engine/shipping_label_service.py
          backend/order_review_routes.py
          backend/tests/test_recipient_delivery_projection.py
      - name: Run recipient delivery tests
        run: >-
          python -m pytest -q
          backend/tests/test_recipient_delivery_projection.py
          backend/tests/test_order_review_stage_one.py
          --tb=short
