name: Build20 waiting review contracts (no deployment)

on:
  pull_request:
    paths:
      - 'backend/preparation_supplier_dispatch.py'
      - 'backend/supplier_dispatch_waiting_policy.py'
      - 'backend/tests/test_supplier_dispatch_waiting_current_status.py'
      - '.github/workflows/build20-waiting-review.yml'

permissions:
  contents: read

jobs:
  waiting-review-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0.16
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      WAITING_TEST_MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 motor==3.3.1
          httpx==0.28.1 openai==1.99.9 pytest==9.0.2 pytest-asyncio==1.3.0
          openpyxl cryptography reportlab python-multipart
      - name: Real Mongo HTTP status fence and existing operational regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/waiting-review-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/waiting-review-evidence/identity.txt"
          python -m pytest \
            tests/test_supplier_dispatch_waiting_current_status.py \
            tests/test_preparation_supplier_dispatch.py \
            tests/test_supplier_dispatch_customer_options_guard.py \
            tests/test_supplier_dispatch_split_note_match.py \
            tests/test_supplier_receiving.py \
            tests/test_supplier_multi_supplier_lifecycle.py \
            tests/test_supplier_invoice_live_cost_session.py \
            tests/test_supplier_invoice_service_eligibility.py \
            -v --tb=short \
            --junitxml="$RUNNER_TEMP/waiting-review-evidence/pytest.xml" \
            2>&1 | tee "$RUNNER_TEMP/waiting-review-evidence/pytest.log"
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'waiting-review-evidence/pytest.xml'
          cases = list(ET.parse(report).iter('testcase'))
          required = [c for c in cases if 'test_supplier_dispatch_waiting_current_status' in c.attrib.get('classname', '')]
          assert len(required) >= 55, 'Required status fence cases missing'
          assert all(c.find('skipped') is None for c in cases), 'Skipped coverage is not success'
          PY
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waiting-review-tests-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/waiting-review-evidence
          retention-days: 30
          if-no-files-found: warn
