name: Apply Mezan AI Operational Context V2 on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/apply_operational_context_v2.py"
      - ".github/workflows/apply-operational-context-v2-pr.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'feat/mezan-ai-operational-context-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mezan-ai-operational-context-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply reviewed integration
        run: |
          python .github/scripts/apply_operational_context_v2.py
          rm -f \
            .github/scripts/apply_operational_context_v2.py \
            .github/workflows/apply-operational-context-v2.yml \
            .github/workflows/apply-operational-context-v2-pr.yml
          git diff --check
      - name: Install backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          httpx==0.28.1
          motor==3.3.1
          openai==1.99.9
          openpyxl==3.1.5
          pydantic==2.13.4
          pymongo==4.5.0
          pytest==9.0.3
          pytest-asyncio
      - name: Run backend regression suite
        working-directory: backend
        run: |
          python -m py_compile ai_analysis_routes.py ai_operational_context_v2.py
          python -m pytest \
            tests/test_ai_analysis_routes.py \
            tests/test_ai_analysis_async_routes.py \
            tests/test_ai_operational_context_v2.py \
            -q --tb=short
      - name: Run frontend regression and build
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --non-interactive
          CI=true yarn test --watchAll=false --runInBand src/lib/aiAnalysisAsync.test.js
          yarn build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): derive analysis from privacy-safe Orders V2 context"
          git push origin HEAD:feat/mezan-ai-operational-context-v2
