name: Audit freeze supplier-receiving release intent

on:
  push:
    branches:
      - audit/freeze-supplier-receiving-intent-20260926
    paths:
      - .github/workflows/audit-freeze-supplier-receiving-intent.yml

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 85a9a3e16a92f37d4af4bdfd1965567860afc24a
      SOURCE_BASE_SHA: b414b7fca518147e22ad4c63a8e0f48e789ee978
      REACT_APP_BACKEND_URL: https://mezansalla.com
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout audit trigger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"

      - name: Pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Build exact staged source and freeze intent
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/exact-source"
          git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$source_root"
          git -C "$source_root" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$source_root" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$source_root" merge-base --is-ancestor "$SOURCE_BASE_SHA" "$SOURCE_SHA"
          test -z "$(git -C "$source_root" status --short --untracked-files=all)"

          export GITHUB_SHA="$SOURCE_SHA"
          export GITHUB_WORKSPACE="$source_root"

          corepack enable
          corepack prepare yarn@1.22.22 --activate
          cd "$source_root/frontend"
          yarn install --frozen-lockfile --non-interactive

          export MEZAN_RELEASE_BOOTSTRAP_INTENT=1
          yarn build:release
          unset MEZAN_RELEASE_BOOTSTRAP_INTENT

          python ../scripts/verify_frontend_build.py             --expected-git-sha "$SOURCE_SHA"

          candidate="$RUNNER_TEMP/release-intent-v5.json"
          python ../scripts/emergent_deployment_adapter.py freeze-intent             --source-git-sha "$SOURCE_SHA"             --source-base-git-sha "$SOURCE_BASE_SHA"             --branch hotfix/prod-snap-meta-final             --output "$candidate"             > "$RUNNER_TEMP/release-intent-v5.freeze.log"

          python -m json.tool "$candidate" >/dev/null
          PYTHONPATH=../backend:.. python - "$candidate" <<'PY'
          import os
          import sys
          from pathlib import Path
          from release_protocol_v5 import (
              BACKEND_RUNTIME_SOURCE_SCOPE,
              RELEASE_CONTROL_SOURCE_SCOPE,
              exact_json_equal,
          )
          from scripts.emergent_deployment_adapter import (
              _git_source_manifest,
              load_candidate_release_intent,
          )

          candidate_path = Path(sys.argv[1])
          payload = load_candidate_release_intent(
              candidate_path,
              source_git_sha=os.environ["SOURCE_SHA"],
              source_base_git_sha=os.environ["SOURCE_BASE_SHA"],
          )
          assert payload["schema_version"] == 2
          assert payload["source_git_sha"] == os.environ["SOURCE_SHA"]
          assert payload["source_base_git_sha"] == os.environ["SOURCE_BASE_SHA"]
          for field, scope in (
              ("backend_runtime_source", BACKEND_RUNTIME_SOURCE_SCOPE),
              ("release_control_source", RELEASE_CONTROL_SOURCE_SCOPE),
          ):
              derived = _git_source_manifest(
                  scope=scope,
                  source_git_sha=payload["source_git_sha"],
                  source_base_git_sha=payload["source_base_git_sha"],
              )
              assert payload[field]["file_count"] > 0
              assert exact_json_equal(payload[field], derived), field
          print("EXACT_STAGED_SOURCE_INTENT_VERIFIED")
          PY

          cp "$candidate" "$RUNNER_TEMP/release-intent-reviewed-85a9.json"
          sha256sum "$candidate" | tee "$RUNNER_TEMP/release-intent-SHA256.txt"

      - name: Retain reviewed intent evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supplier-receiving-reviewed-intent-85a9
          path: |
            ${{ runner.temp }}/release-intent-reviewed-85a9.json
            ${{ runner.temp }}/release-intent-SHA256.txt
            ${{ runner.temp }}/release-intent-v5.freeze.log
          if-no-files-found: error
          retention-days: 2
