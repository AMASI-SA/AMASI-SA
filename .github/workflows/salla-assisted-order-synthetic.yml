name: Salla assisted order (synthetic only)

on:
  pull_request:
    paths:
      - 'backend/salla_order_creation/**'
      - 'backend/tests/test_salla_order_creation_*.py'
      - '.github/workflows/salla-assisted-order-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    name: Offline payload + consent + replay tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install 'pytest>=8,<10' 'pydantic>=2.8,<3'
      - name: Run no-network synthetic test suite
        run: PYTHONPATH=backend python -m pytest --noconftest backend/tests/test_salla_order_creation_payload.py backend/tests/test_salla_order_creation_service.py -q
