name: Salla assisted order (synthetic only)

on:
  pull_request:
    paths:
      - 'backend/salla_order_creation/**'
      - 'backend/tests/test_salla_order_creation_*.py'
      - '.github/workflows/salla-assisted-order-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    name: Offline payload + consent + replay tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install 'pytest>=8,<10' 'pydantic>=2.8,<3'
      - name: Syntax check new modules and Mezan entrypoint
        run: python -m compileall -q backend/salla_order_creation backend/server.py
      - name: Run no-network synthetic test suite
        run: PYTHONPATH=backend python -m pytest --noconftest backend/tests/test_salla_order_creation_payload.py backend/tests/test_salla_order_creation_service.py backend/tests/test_salla_order_creation_signature.py backend/tests/test_salla_order_creation_readers.py backend/tests/test_salla_order_creation_confirmation.py backend/tests/test_salla_order_creation_customer_identity.py backend/tests/test_salla_order_creation_catalog_validation.py backend/tests/test_salla_order_creation_http_limits.py backend/tests/test_salla_order_creation_shipping_selection.py backend/tests/test_salla_order_creation_quote_preview.py backend/tests/test_salla_order_creation_personalization.py -q
