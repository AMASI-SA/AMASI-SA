                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nimport re\n",
                  1,
              )

          helper_anchor = "\n\nasync def build_mezan_v2_product_cost("
          helper_block = r'''

AD_EXECUTIVE_PROVIDER_ORDER = ("snapchat", "tiktok", "meta", "google")
AD_EXECUTIVE_PROVIDER_LABELS = {
    "snapchat": "Snapchat",
    "tiktok": "TikTok",
    "meta": "Meta",
    "google": "Google Ads",
}


def _source_fragments(value: Any) -> list[str]:
    if value is None:
        return []
    if isinstance(value, dict):
        fragments: list[str] = []
        for key in (
            "source", "channel", "platform", "name", "value",
            "utm_source", "utm_medium", "utm_campaign",
        ):
            fragments.extend(_source_fragments(value.get(key)))
        return fragments
    if isinstance(value, (list, tuple, set)):
        fragments: list[str] = []
        for item in value:
            fragments.extend(_source_fragments(item))
        return fragments
    candidate = str(value).strip()
    return [candidate] if candidate else []


def resolve_salla_ad_platform(order: dict[str, Any]) -> str | None:
    """Resolve Salla's own traffic attribution to one paid platform.

    This uses only normalized order facts retained in ``unified_orders``.
    Provider conversion reports are intentionally excluded from this decision.
    """
    fragments: list[str] = []
    for key in (
        "source", "utm_source", "utm_medium", "utm_campaign",
        "traffic_source", "marketing_source", "source_native",
        "platform", "channel",
    ):
        fragments.extend(_source_fragments(order.get(key)))
    normalized = " ".join(fragments).replace("_", " ").casefold()
    words = {
        word for word in re.split(r"[^0-9a-z\u0600-\u06ff]+", normalized)
        if word
    }
    if {"snap", "snapchat", "سناب"}.intersection(words) or "سناب شات" in normalized:
        return "snapchat"
    if "tiktok" in words or ({"tik", "tok"}.issubset(words)) or "تيك توك" in normalized:
        return "tiktok"
    if (
        {"meta", "facebook", "instagram", "fb", "ig", "فيسبوك", "انستقرام", "انستغرام"}.intersection(words)
        or "فيس بوك" in normalized
    ):
        return "meta"
    if {"google", "adwords", "gads", "جوجل", "قوقل"}.intersection(words):
        return "google"
    return None


def _salla_order_sales_sar(order: dict[str, Any]) -> float:
    totals = order.get("totals") if isinstance(order.get("totals"), dict) else {}
    amount = order.get("amount") if isinstance(order.get("amount"), dict) else {}
    for candidate in (
        order.get("total_amount"),
        order.get("total"),
        totals.get("total"),
        amount.get("total"),
    ):
        parsed = _number(candidate)
        if parsed is not None:
            return round(max(float(parsed), 0.0), 2)
    return 0.0


def build_salla_ads_executive_breakdown(
    orders: list[dict[str, Any]],
    ads: dict[str, Any],
) -> dict[str, Any]:
    """Combine Salla commerce truth with provider cost truth for the UI.

    - Orders and sales come only from Salla-attributed unified orders.
    - Spend and platform cost per order come only from ad-provider facts.
    - Actual ROAS is Salla sales divided by provider spend.
    """
    salla = {
        provider: {"orders": 0, "sales_sar": 0.0}
        for provider in AD_EXECUTIVE_PROVIDER_ORDER
    }
    unattributed_orders = 0
    unattributed_sales = 0.0
    for order in orders:
        provider = resolve_salla_ad_platform(order)
        sales = _salla_order_sales_sar(order)
        if provider not in salla:
            unattributed_orders += 1
            unattributed_sales += sales
            continue
        salla[provider]["orders"] += 1
        salla[provider]["sales_sar"] += sales

    providers: dict[str, dict[str, Any]] = {}
    total_spend = 0.0
    total_salla_sales = 0.0
    total_salla_orders = 0
    total_platform_orders = 0
    platform_cpa_denominator_complete = True

    for provider in AD_EXECUTIVE_PROVIDER_ORDER:
        breakdown_key = "google_transitional" if provider == "google" else provider
        spend = round(_float((ads.get("breakdown") or {}).get(breakdown_key)), 2)
        provider_metrics = (ads.get("providers") or {}).get(provider) or {}
        platform_orders: int | None
        if provider == "google":
            platform_orders = None
            if spend > 0:
                platform_cpa_denominator_complete = False
        else:
            raw_platform_orders = provider_metrics.get("orders")
            platform_orders = int(round(_float(raw_platform_orders)))
        platform_cpa = (
            round(spend / platform_orders, 2)
            if platform_orders is not None and platform_orders > 0 and spend > 0
            else None
        )
        salla_orders = int(salla[provider]["orders"])
        salla_sales = round(_float(salla[provider]["sales_sar"]), 2)
        actual_roas = round(salla_sales / spend, 2) if spend > 0 else None
        providers[provider] = {
            "provider": provider,
            "label": AD_EXECUTIVE_PROVIDER_LABELS[provider],
            "spend_sar": spend,
            "salla_orders": salla_orders,
            "salla_sales_sar": salla_sales,
            "platform_reported_orders": platform_orders,
            "platform_cost_per_order_sar": platform_cpa,
            "actual_roas": actual_roas,
            "sources": {
                "spend": "ad_platform",
                "cost_per_order": "ad_platform",
                "orders": "salla",
                "sales": "salla",
                "roas": "salla_sales_divided_by_ad_platform_spend",
            },
        }
        total_spend += spend
        total_salla_sales += salla_sales
        total_salla_orders += salla_orders
        if platform_orders is not None:
            total_platform_orders += platform_orders

    total_spend = round(total_spend, 2)
    total_salla_sales = round(total_salla_sales, 2)
    total_platform_cpa = (
        round(total_spend / total_platform_orders, 2)
        if platform_cpa_denominator_complete and total_platform_orders > 0 and total_spend > 0
        else None
    )
    return {
        "providers": providers,
        "total": {
            "spend_sar": total_spend,
            "salla_orders": total_salla_orders,
            "salla_sales_sar": total_salla_sales,
            "platform_reported_orders": (
                total_platform_orders if platform_cpa_denominator_complete else None
            ),
            "platform_cost_per_order_sar": total_platform_cpa,
            "actual_roas": (
                round(total_salla_sales / total_spend, 2)
                if total_spend > 0 else None
            ),
        },
        "coverage": {
            "salla_orders_in_scope": len(orders),
            "salla_attributed_orders": total_salla_orders,
            "salla_unattributed_orders": unattributed_orders,
            "salla_unattributed_sales_sar": round(unattributed_sales, 2),
            "platform_cpa_denominator_complete": platform_cpa_denominator_complete,
        },
        "source_contract": {
            "orders": "unified_orders.source/utm_source:salla",
            "sales": "unified_orders.total_amount:salla",
            "spend": "native_ad_platform_facts_with_mezan2_account_fx",
            "cost_per_order": "ad_platform_spend_divided_by_ad_platform_reported_orders",
            "roas": "salla_sales_divided_by_ad_platform_spend",
            "provider_conversion_sales_excluded": True,
        },
    }
'''
