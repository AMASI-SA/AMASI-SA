name: Mezan Special Orders R6 Writer Control
on:
  push:
    branches: ['feature/mezan-special-orders-core-20260927']
    paths: ['backend/**','frontend/src/**','docs/operations/MZ2-SPECIAL-ORDERS-001/**','.github/workflows/mezan-special-orders-r6-control.yml']
  pull_request:
    paths: ['backend/**','frontend/src/**','docs/operations/MZ2-SPECIAL-ORDERS-001/**','.github/workflows/mezan-special-orders-r6-control.yml']
permissions:
  contents: read
jobs:
  admission-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1cbeccd84d58fb3397dcd42822d5feb92de06275
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify current source without applying historical patches
        run: python docs/operations/MZ2-SPECIAL-ORDERS-001/R6_WRITER_CONTROL/current.py
      - name: Install pinned test prerequisites
        run: |
          python - <<'PY'
          from pathlib import Path
          names={'pydantic','fastapi','httpx','pytest','motor','pymongo','cryptography','requests','reportlab','pillow','python-multipart','python-dotenv','openpyxl','python-dateutil','pyjwt','pandas','pypdf','arabic-reshaper','python-bidi','bcrypt','email-validator','passlib'}
          rows=[r for r in Path('backend/requirements.txt').read_text().splitlines() if r.split('==')[0].casefold() in names]
          assert len(rows)==len(names)
          Path('/tmp/r6-tests.txt').write_text('\n'.join(rows+['pytest-asyncio==1.3.0','PyMuPDF==1.28.2','qrcode==8.2','mongomock-motor==0.0.36','mongomock==4.3.0'])+'\n')
          PY
          python -m pip install -r /tmp/r6-tests.txt
      - name: Start dedicated loopback replica set
        run: |
          docker run -d --rm --name special-test-mongo -p 127.0.0.1:27017:27017 mongo@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca mongod --replSet specialTestRs --bind_ip_all
          python - <<'PY'
          import time
          from pymongo import MongoClient
          c=MongoClient('mongodb://127.0.0.1:27017/?directConnection=true',serverSelectionTimeoutMS=1000)
          for attempt in range(30):
              try: c.admin.command('ping'); break
              except Exception: time.sleep(1)
          else: raise SystemExit('Dedicated Mongo unavailable')
          c.admin.command('replSetInitiate',{'_id':'specialTestRs','members':[{'_id':0,'host':'127.0.0.1:27017'}]})
          for attempt in range(30):
              if c.admin.command('hello').get('isWritablePrimary'): break
              time.sleep(1)
          else: raise SystemExit('Dedicated replica set unavailable')
          c.close()
          PY
      - name: Frozen ordinary-order baseline
        working-directory: baseline/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_order_engine_models.py tests/test_order_engine_mapper.py tests/test_order_engine_repository.py tests/test_order_engine_service.py tests/test_order_item_engine_models.py tests/test_order_item_engine_mapper.py tests/test_order_option_cost_snapshots.py tests/test_product_option_shared_cost_engine.py tests/test_store_delivery_accounting.py tests/test_store_delivery_domain.py tests/test_store_delivery_handover_routes.py tests/test_store_delivery_driver_security.py tests/test_store_delivery_payment_evidence.py --junitxml=../../r6-baseline.xml
      - name: Current committed candidate and native lifecycle regression
        working-directory: backend
        env:
          PYTHONPATH: .
          MEZAN_SPECIAL_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=specialTestRs
          MEZAN_SPECIAL_TEST_REPLICA_URI: mongodb://127.0.0.1:27017/?replicaSet=specialTestRs
        run: |
          python -m compileall -q mezan_special_orders order_engine order_item_engine
          python -m pytest -q mezan_special_orders/tests tests/test_order_engine_models.py tests/test_order_engine_mapper.py tests/test_order_engine_repository.py tests/test_order_engine_service.py tests/test_order_item_engine_models.py tests/test_order_item_engine_mapper.py tests/test_order_option_cost_snapshots.py tests/test_product_option_shared_cost_engine.py tests/test_store_delivery_accounting.py tests/test_store_delivery_domain.py tests/test_store_delivery_handover_routes.py tests/test_store_delivery_driver_security.py tests/test_store_delivery_payment_evidence.py --junitxml=../r6-candidate.xml
      - name: Offline evidence tests and mandatory no-skip assertion
        run: |
          python -m unittest discover -s docs/operations/MZ2-SPECIAL-ORDERS-001/tools -p 'test_*.py' -v
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ('r6-baseline.xml','r6-candidate.xml'):
              suites=list(ET.parse(name).getroot().iter('testsuite'))
              assert suites
              assert not any(int(s.attrib.get(k,0)) for s in suites for k in ('failures','errors','skipped'))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Production and special-order label assertions
        env:
          CI: 'true'
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --cwd frontend install --frozen-lockfile --non-interactive
          yarn --cwd frontend test --watchAll=false --runInBand --runTestsByPath src/lib/storeCourierLabelPrint.test.js src/lib/storeCourierSpecialLabelPrint.test.js src/lib/privateShippingLabel.test.js --json --outputFile=../r6-frontend-tests.json
      - name: Retain exact tested identity and source verification
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          checked=json.loads(subprocess.check_output(['python','docs/operations/MZ2-SPECIAL-ORDERS-001/R6_WRITER_CONTROL/current.py'],text=True))
          Path('r6-tested-identity.json').write_text(json.dumps({'checkout_sha':source,'tree_sha':tree,'source_contract':checked,'applied_patch':False,'deploys':False},indent=2)+'\n')
          subprocess.run(['git','diff','--exit-code'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mezan-special-r6-control-results
          path: |
            r6-baseline.xml
            r6-candidate.xml
            r6-frontend-tests.json
            r6-tested-identity.json
      - name: Stop dedicated test database
        if: always()
        run: docker rm -f special-test-mongo >/dev/null 2>&1 || true
