name: Apply Active Campaign Entity Filters Through PR

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - ".github/workflows/prod-ads-loading-sticky-status-v1.yml"
      - ".github/workflows/_apply-active-campaign-filters-v1.yml"
      - "tmp/trigger-active-campaign-filters-v1"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/prod-active-campaign-entity-filters-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-active-campaign-entity-filters-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Production base
        run: git fetch origin hotfix/prod-snap-meta-final

      - name: Execute embedded refactor script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/_apply-active-campaign-filters-v1.yml').read_text(encoding='utf-8')
          match = re.search(r"          python - <<'PY'\n(.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('embedded refactor script not found')
          script = textwrap.dedent(match.group(1))
          script = script.replace(
              "default=100, ge=10, le=100",
              "default=25, ge=10, le=100",
          )
          ambiguous = """replace_once(path,
              '                limit: 25,\\n            });\\n',
              '                limit: 25,\\n                activeCampaignsOnly,\\n            });\\n',
          )"""
          specific = """replace_once(path,
              '                campaignQuery: appliedQuery,\\n                page,\\n                limit: 25,\\n            });\\n',
              '                campaignQuery: appliedQuery,\\n                page,\\n                limit: 25,\\n                activeCampaignsOnly,\\n            });\\n',
          )"""
          if ambiguous not in script:
              raise SystemExit('ambiguous campaign request replacement not found')
          script = script.replace(ambiguous, specific, 1)
          script = script.replace(
              'jest.mock("../../lib/api", () => ({ get: jest.fn() }));',
              '''jest.mock("../../lib/api", () => ({
              get: jest.fn(),
              interceptors: {
                  request: { use: jest.fn() },
                  response: { use: jest.fn() },
              },
          }));''',
          )
          exec(compile(script, 'active_campaign_filters_embedded.py', 'exec'), {})
          PY

          rm -f tmp/trigger-active-campaign-filters-v1
          git checkout origin/hotfix/prod-snap-meta-final -- .github/workflows/prod-ads-loading-sticky-status-v1.yml

      - name: Verify backend
        working-directory: backend
        run: |
          python -m pip install -q fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0 httpx pytest pytest-asyncio openpyxl cryptography bcrypt PyJWT reportlab python-multipart
          python -m py_compile integrations_control_center/snapchat_active_campaign_filtering.py integrations_control_center/snapchat_account_timezone_manager.py integrations_control_center/snapchat_adsquad_performance.py integrations_control_center/snapchat_ad_performance.py
          python -m pytest -q --tb=short tests/test_snapchat_active_campaign_entity_filters_v1.py tests/test_snapchat_adsquad_performance_v1.py tests/test_snapchat_ad_performance_v1.py

      - name: Verify frontend
        working-directory: frontend
        env:
          CI: "true"
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --non-interactive
          yarn test --watchAll=false --runInBand --runTestsByPath \
            src/components/marketing/ActiveCampaignEntityFilters.test.jsx \
            src/components/marketing/AdSquadManagerTable.test.jsx \
            src/components/marketing/AdManagerTable.test.jsx \
            src/components/marketing/AdsEntityLevelWorkspace.test.jsx \
            src/services/snapchatAdSquadPerformance.test.js \
            src/services/snapchatAdPerformance.test.js
          CI=false yarn build

      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(prod-ads): filter child entities by active campaigns"
          git push origin HEAD:fix/prod-active-campaign-entity-filters-v1
