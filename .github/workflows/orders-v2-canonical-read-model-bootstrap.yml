name: Orders V2 canonical read-model bootstrap

on:
  push:
    branches:
      - fix/orders-v2-canonical-shipping-read-model
    paths:
      - "scripts/patch_orders_v2_canonical_read_model.py"
      - ".github/workflows/orders-v2-canonical-read-model-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orders-v2-canonical-shipping-read-model
          fetch-depth: 0
          show-progress: false

      - name: Apply Orders V2 canonical read-model patch
        run: python scripts/patch_orders_v2_canonical_read_model.py

      - name: Validate source and contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile \
            backend/order_engine/repository.py \
            backend/order_engine/mapper.py \
            backend/order_review_routes.py \
            backend/tests/test_order_review_stage_one.py
          grep -q '_build_v2_read_payload' backend/order_engine/repository.py
          grep -q '_first_nonempty' backend/order_engine/mapper.py
          ! grep -q 'resync_single_order' backend/order_review_routes.py
          grep -q 'test_v2_read_model_restores_durable_shipping_receipt_and_items' backend/tests/test_order_review_stage_one.py

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Canonical read-model fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/order_engine/repository.py \
            backend/order_engine/mapper.py \
            backend/order_review_routes.py \
            backend/tests/test_order_review_stage_one.py
          git commit -m "fix(orders-v2): restore canonical shipping facts without page resync"
          git push origin HEAD:fix/orders-v2-canonical-shipping-read-model
