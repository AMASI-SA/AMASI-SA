name: Production Snapchat Campaign and Ad Squad Catalog V2

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/__init__.py"
      - "backend/integrations_control_center/snapchat_campaign_catalog_refresh.py"
      - "backend/integrations_control_center/snapchat_native_entities_sync.py"
      - "backend/integrations_control_center/snapchat_account_hourly_refresh.py"
      - "backend/tests/test_snapchat_campaign_catalog_refresh_v1.py"
      - "backend/tests/test_snapchat_account_delivery_refresh_v1.py"
      - "backend/tests/test_ads_auto_sync_scheduler_v2.py"
      - ".github/workflows/prod-snapchat-campaign-catalog-refresh-v1.yml"

permissions:
  contents: read

jobs:
  delivery-catalog-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1
          pydantic==2.13.4
          pymongo==4.5.0
          httpx
          pytest
          pytest-asyncio
          openpyxl
          cryptography
          bcrypt
          PyJWT
          reportlab
          python-multipart
          pymupdf
          pillow
          qrcode
          arabic-reshaper
          python-bidi
      - name: Compile Snapchat delivery catalogue refresh
        run: >-
          python -m py_compile
          integrations_control_center/snapchat_campaign_catalog_refresh.py
          integrations_control_center/snapchat_native_entities_sync.py
          integrations_control_center/__init__.py
          tests/test_snapchat_campaign_catalog_refresh_v1.py
      - name: Run focused tests
        run: >-
          python -m pytest
          tests/test_snapchat_campaign_catalog_refresh_v1.py
          tests/test_snapchat_account_delivery_refresh_v1.py
          tests/test_ads_auto_sync_scheduler_v2.py
          tests/test_snapchat_account_timezone_manager_v1.py
          -q --tb=short
      - name: Enforce current Campaign and Ad Squad contract
        working-directory: .
        run: |
          REFRESH=backend/integrations_control_center/snapchat_campaign_catalog_refresh.py
          ENTITIES=backend/integrations_control_center/snapchat_native_entities_sync.py
          INIT=backend/integrations_control_center/__init__.py
          grep -q 'CAMPAIGN_CATALOG_SOURCE_MODE = "snapchat_campaign_adsquad_catalog_5m_v2"' "$REFRESH"
          grep -q '("campaign", "campaigns", "campaign", {})' "$REFRESH"
          grep -q '("ad_squad", "adsquads", "adsquad"' "$REFRESH"
          grep -q 'return_placement_v2' "$REFRESH"
          grep -q 'ad_squad_entities_observed' "$REFRESH"
          grep -q 'install_snapchat_campaign_catalog_refresh' "$INIT"
          grep -q '"display_name": entity.get("name") or external_id' "$ENTITIES"
          grep -q '"status": entity.get("status")' "$ENTITIES"
          grep -q '"delivery_status": entity.get("delivery_status")' "$ENTITIES"
          ! grep -Eq 'client\.(post|put|patch|delete)\(' "$REFRESH" "$ENTITIES"
          ! grep -Eq 'provider_write_reached": True|campaign_write_reached": True|qoyod_write_reached": True' "$REFRESH"
