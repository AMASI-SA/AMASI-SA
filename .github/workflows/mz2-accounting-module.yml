name: MZ2 Accounting Module

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "backend/accounting_module_*.py"
      - "backend/accounting_daily_movements.py"
      - "backend/accounting_employee_finance.py"
      - "backend/accounting_salla_order_evidence.py"
      - "backend/accounting_order_recognition.py"
      - "backend/accounting_bank_transfer_receipts.py"
      - "backend/accounting_shipping_p02.py"
      - "backend/accounting_shipping_settlements.py"
      - "backend/accounting_inventory_p03.py"
      - "backend/accounting_inventory_p03_gate.py"
      - "backend/supplier_receiving_routes.py"
      - "backend/product_inventory_receipt_routes.py"
      - "backend/fulfillment_v2_routes.py"
      - "backend/purchase_invoices_routes.py"
      - "backend/tests/test_mz2_inventory_p03.py"
      - "backend/accounting_mz2_reports.py"
      - "backend/tests/test_mz2_report_isolation.py"
      - "backend/tests/mz2_report_fixtures.py"
      - "backend/accounting_sales_tax*.py"
      - "backend/accounting_receivable*.py"
      - "backend/accounting_atomic.py"
      - "backend/accounting_write_control.py"
      - "backend/accounting_ingress.py"
      - "backend/tests/test_mz2_write_control.py"
      - "backend/tests/test_mz2_daily_movements.py"
      - "backend/tests/test_mz2_employee_finance.py"
      - "backend/tests/test_mz2_salla_order_evidence.py"
      - "backend/tests/test_mz2_order_recognition.py"
      - "backend/tests/test_mz2_bank_transfer_receipts.py"
      - "backend/tests/test_mz2_shipping_p02.py"
      - "backend/accounting_receipt_service.py"
      - "backend/accounting_customer_refund*.py"
      - "backend/accounting_refund_drafts.py"
      - "backend/accounting_refund_entitlements.py"
      - "backend/tests/test_mz2_refund_entitlements.py"
      - "backend/accounting_order_refunds.py"
      - "backend/tests/test_mz2_daily_refunds.py"
      - "backend/tests/test_mz2_order_refunds.py"
      - "backend/tests/test_mz2_receipt_intake.py"
      - "backend/tests/test_mz2_atomic_recovery.py"
      - "backend/accounting_recognition_evidence.py"
      - "backend/bnpl/ledger_bridge.py"
      - "backend/tests/test_mz2_sales_tax*.py"
      - "backend/tests/test_mz2_receivable_workflow.py"
      - "backend/accounting_settlement_*.py"
      - "backend/accounting_courier_bank_routes.py"
      - "backend/financial_provider_apps*.py"
      - "backend/tests/test_mz2_accounting_module.py"
      - "backend/tests/test_mz2_settlement*_p01.py"
      - "backend/tests/test_mz2_courier_bank_bindings_p01.py"
      - "frontend/src/pages/accounting/**"
      - "frontend/src/pages/FinancialProviderApps*.jsx"
      - "frontend/src/components/MezanV2NavigationShell*.jsx"
      - "frontend/src/components/OwnerOnlyRoute*.jsx"
      - "frontend/src/services/accountingModule.js"
      - ".github/workflows/mz2-accounting-module.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-recognition-contract:
    name: Manual tax and atomic recovery (real isolated Mongo)
    runs-on: ubuntu-latest
    env:
      MZ2_TEST_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=mz2test
      MZ2_TEST_STANDALONE_URI: mongodb://127.0.0.1:27019/?directConnection=true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1 pydantic==2.13.5 pymongo==4.18.1
          mongomock-motor==0.0.36 httpx==0.28.1
          bcrypt==4.1.3 PyJWT==2.13.0 openpyxl==3.1.5
          python-multipart==0.0.20 python-dotenv==1.2.3
          cryptography==50.0.0
      - name: Start dedicated real Mongo fixtures
        run: |
          docker run -d --name mz2-atomic-rs -p 127.0.0.1:27018:27018 mongo:8.0.12 --port 27018 --replSet mz2test --bind_ip_all --setParameter transactionLifetimeLimitSeconds=5
          docker run -d --name mz2-atomic-standalone -p 127.0.0.1:27019:27019 mongo:8.0.12 --port 27019 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec mz2-atomic-rs mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec mz2-atomic-rs mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"mz2test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if docker exec mz2-atomic-rs mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary){quit(1)}'; then break; fi
            sleep 1
          done
      - name: Test manual tax calculations and immutable policy
        run: python -m unittest discover -s tests -p 'test_mz2_sales_tax*.py'
      - name: Test accountant API through bridge and ledger to settlement
        run: python -m unittest discover -s tests -p test_mz2_receivable_workflow.py
      - name: Test process death, restart, concurrent ingress and atomic settlement
        run: python -m unittest discover -s tests -p test_mz2_atomic_recovery.py -v
      - name: Test non-ledger receipts and the authoritative lifecycle
        run: python -m unittest discover -s tests -p test_mz2_receipt_intake.py -v
      - name: Test entitlement settlement and non-financial webhook drafts
        run: python -m unittest discover -s tests -p test_mz2_daily_refunds.py -v
      - name: Test write pause, transaction drain and durable replay
        run: python -m unittest discover -s tests -p test_mz2_write_control.py -v
      - name: Test confirmed refund entitlement and cross-month payment
        run: python -m unittest discover -s tests -p test_mz2_refund_entitlements.py -v
      - name: Test refund notifications and statement reconciliation
        run: python -m unittest discover -s tests -p test_mz2_order_refunds.py -v
      - name: Test MZ2 opening-balance preview, approval and activation
        run: python -m unittest discover -s tests -p test_mz2_opening_balances.py -v
      - name: Test MZ2 bank-statement and daily movement intake
        run: python -m unittest discover -s tests -p test_mz2_daily_movements.py -v
      - name: Test MZ2 payroll advances and custody
        run: python -m unittest discover -s tests -p test_mz2_employee_finance.py -v
      - name: Test MZ2 Salla order evidence intake
        run: python -m unittest discover -s tests -p test_mz2_salla_order_evidence.py -v
      - name: Test MZ2 Salla evidence sale recognition
        run: python -m unittest discover -s tests -p test_mz2_order_recognition.py -v
      - name: Test MZ2 customer bank-transfer receipt review
        run: python -m unittest discover -s tests -p test_mz2_bank_transfer_receipts.py -v
      - name: Test isolated MZ2 shipping and COD accounting
        run: python -m unittest discover -s tests -p test_mz2_shipping_p02.py -v
      - name: Test fail-closed MZ2 P03 inventory and purchases
        run: python -m unittest discover -s tests -p test_mz2_inventory_p03.py -v
      - name: Test historical financial position, closed periods, provider credits and advances
        run: |
          python -m unittest discover -s tests -p test_mz2_report_dates.py -v
          python -m unittest discover -s tests -p test_mz2_historical_position.py -v
          python -m unittest discover -s tests -p test_mz2_closed_periods.py -v
          python -m unittest discover -s tests -p test_mz2_tabby_signed_credits.py -v
          python -m unittest discover -s tests -p test_mz2_customer_advances.py -v
      - name: Test MZ2 report isolation against legacy sentinels
        run: python -m unittest discover -s tests -p test_mz2_report_isolation.py -v
      - name: Test transaction-bound MZ2 write balances and documented execution
        run: python -m unittest discover -s tests -p test_mz2_write_balance_isolation.py -v

  backend-contract:
    name: Accounting backend contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.140.0
          pydantic==2.13.4
          pymongo==4.6.3
          bcrypt==4.1.3
          PyJWT==2.13.0
          openpyxl==3.1.5
          python-multipart==0.0.20
          pytest==9.0.3
          pytest-asyncio
      - name: Compile accounting modules
        run: >-
          python -m py_compile
          accounting_module_*.py
          accounting_daily_movements.py
          accounting_employee_finance.py
          accounting_salla_order_evidence.py
          accounting_order_recognition.py
          accounting_bank_transfer_receipts.py
          accounting_shipping_p02.py
          accounting_shipping_settlements.py
          accounting_inventory_p03.py
          accounting_inventory_p03_gate.py
          purchase_invoices_routes.py
          accounting_settlement_*.py
          accounting_courier_bank_routes.py
          financial_provider_apps.py
          financial_provider_apps_legacy.py
          tests/test_mz2_accounting_module.py
          tests/test_mz2_settlement*_p01.py
          tests/test_mz2_courier_bank_bindings_p01.py
      - name: Run accounting contract tests
        run: >-
          python -m pytest
          tests/test_mz2_accounting_module.py
          tests/test_mz2_settlement*_p01.py
          tests/test_mz2_courier_bank_bindings_p01.py
          -q --tb=short

  frontend-contract:
    name: Accounting frontend contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Run focused accounting tests
        run: >-
          CI=true yarn test
          --watchAll=false
          --runInBand
          src/pages/accounting/AccountingOpeningBalances.test.jsx
          src/pages/accounting/AccountingDailyWorkspace.test.jsx
          src/pages/accounting/AccountingBankTransferReceipts.test.jsx
          src/pages/accounting/AccountingDailyMovements.test.jsx
          src/pages/accounting/AccountingShippingCod.test.jsx
          src/pages/accounting/AccountingInventoryPurchases.test.jsx
          src/pages/accounting/AccountingPayroll.test.jsx
          src/pages/accounting/AccountingWriteControl.test.jsx
          src/pages/accounting/AccountingReports.test.jsx
          src/pages/accounting/AccountingWorkspaceReports.test.jsx
          src/pages/accounting/SettlementJournalDialog.test.jsx
          src/pages/accounting/AccountingPeriods.test.jsx
          src/pages/accounting/AccountingCustomerAdvances.test.jsx
          src/pages/accounting/AccountingCustomerRefunds.test.jsx
          src/pages/accounting/AccountingReceivables.test.jsx
          src/pages/accounting/AccountingBankReceipts.test.jsx
          src/pages/accounting/accountingPages.test.js
          src/pages/accounting/AccountingSettlements.test.jsx
          src/pages/accounting/AccountingSettlementRegister.test.jsx
          src/pages/accounting/AccountingCourierBankBindings.test.jsx
          src/components/OwnerOnlyRoute.test.jsx
          src/components/MezanV2NavigationShell.test.jsx
      - name: Build frontend
        run: CI=false yarn build

