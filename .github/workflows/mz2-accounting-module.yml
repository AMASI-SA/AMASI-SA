name: MZ2 Accounting Module

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
      - codex/mz2-clean-start-safety
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "backend/accounting_module_*.py"
      - "backend/accounting_ledger_v2.py"
      - "backend/accounting_clean_start_guard.py"
      - "backend/accounting_settlement_*.py"
      - "backend/accounting_courier_bank_routes.py"
      - "backend/accounts_routes.py"
      - "backend/ad_account_routes.py"
      - "backend/financial_provider_apps*.py"
      - "backend/ledger_core.py"
      - "backend/ledger_routes.py"
      - "backend/migration_routes.py"
      - "backend/store_delivery_accounting.py"
      - "backend/store_delivery_driver_app_routes.py"
      - "backend/store_delivery_settlement_routes.py"
      - "backend/universal_accounting_routes.py"
      - "backend/tests/test_mz2_accounting_module.py"
      - "backend/tests/test_mz2_clean_start_safety.py"
      - "backend/tests/test_insufficient_funds_iter185.py"
      - "backend/tests/test_mz2_settlement*_p01.py"
      - "backend/tests/test_store_delivery_accounting.py"
      - "backend/tests/test_mz2_courier_bank_bindings_p01.py"
      - "backend/tests/test_accounting_ledger_v2.py"
      - "backend/tests/mongo_replica/**"
      - "backend/scripts/check_accounting_ledger_v2_access.py"
      - "frontend/src/pages/accounting/**"
      - "frontend/src/pages/FinancialProviderApps*.jsx"
      - "frontend/src/App.js"
      - "frontend/src/components/Sidebar.jsx"
      - "frontend/src/components/MezanV2NavigationShell*.jsx"
      - "frontend/src/components/OwnerOnlyRoute*.jsx"
      - "frontend/src/pages/Accounts.jsx"
      - "frontend/src/pages/AdAccounts.jsx"
      - "frontend/src/pages/MigrationWizard.jsx"
      - "frontend/src/pages/ReconciliationReport.jsx"
      - "frontend/src/services/accountingModule.js"
      - ".github/workflows/mz2-accounting-module.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    name: Accounting backend contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused backend dependencies
        run: >-
          python -m pip install -q
          fastapi==0.140.0
          httpx==0.28.1
          motor==3.3.1
          mongomock-motor
          pydantic==2.13.4
          pymongo==4.6.3
          bcrypt==4.1.3
          email-validator==2.3.0
          PyJWT==2.13.0
          openpyxl==3.1.5
          python-multipart==0.0.20
          pytest==9.0.3
          pytest-asyncio
      - name: Compile accounting modules
        run: >-
          python -m py_compile
          accounting_module_*.py
          accounting_ledger_v2.py
          accounting_clean_start_guard.py
          accounting_settlement_*.py
          accounting_courier_bank_routes.py
          accounts_routes.py
          ad_account_routes.py
          financial_provider_apps.py
          financial_provider_apps_legacy.py
          ledger_core.py
          ledger_routes.py
          migration_routes.py
          store_delivery_accounting.py
          store_delivery_driver_app_routes.py
          store_delivery_settlement_routes.py
          universal_accounting_routes.py
          tests/test_mz2_accounting_module.py
          tests/test_mz2_clean_start_safety.py
          tests/test_insufficient_funds_iter185.py
          tests/test_mz2_settlement*_p01.py
          tests/test_store_delivery_accounting.py
          tests/test_mz2_courier_bank_bindings_p01.py
          tests/test_accounting_ledger_v2.py
          scripts/check_accounting_ledger_v2_access.py
      - name: Enforce Accounting V2 raw-access boundary
        run: python scripts/check_accounting_ledger_v2_access.py
      - name: Run accounting contract tests
        run: >-
          python -m pytest
          tests/test_mz2_accounting_module.py
          tests/test_mz2_clean_start_safety.py
          tests/test_mz2_settlement*_p01.py
          tests/test_store_delivery_accounting.py
          tests/test_mz2_courier_bank_bindings_p01.py
          tests/test_accounting_ledger_v2.py
          -q --tb=short

  mongo-replica-contract:
    name: Accounting Mongo replica transaction contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      MZ2_MONGO_REPLICA_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install replica contract dependencies
        run: >-
          python -m pip install -q
          fastapi==0.140.0
          motor==3.3.1
          openpyxl==3.1.5
          pydantic==2.13.4
          pymongo==4.6.3
          pytest==9.0.3
          pytest-asyncio==1.4.0
      - name: Smoke import sealed Accounting V2 core
        run: python -c "import accounting_ledger_v2"
      - name: Start pinned MongoDB 7 replica set on loopback
        working-directory: .
        run: |
          docker run --detach \
            --name accounting-mongo-rs \
            --publish 127.0.0.1:27017:27017 \
            mongo:7.0.32-jammy@sha256:777884dc3872279a2e4d2e0872c71e452cb86ffcb5c2364ae9643b5c36eb5e45 \
            mongod \
              --replSet rs0 \
              --bind_ip_all \
              --port 27017 \
              --setParameter enableTestCommands=1

          for attempt in {1..60}; do
            if docker exec accounting-mongo-rs mongosh --quiet \
              --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs accounting-mongo-rs
              exit 1
            fi
            sleep 1
          done

          docker exec accounting-mongo-rs mongosh --quiet --eval '
            const result = rs.initiate({
              _id: "rs0",
              members: [{_id: 0, host: "localhost:27017"}]
            });
            if (result.ok !== 1 && result.codeName !== "AlreadyInitialized") {
              printjson(result);
              quit(1);
            }
          '

          for attempt in {1..60}; do
            if docker exec accounting-mongo-rs mongosh --quiet \
              --eval 'quit(db.hello().isWritablePrimary === true ? 0 : 1)'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs accounting-mongo-rs
              exit 1
            fi
            sleep 1
          done
      - name: Run real Mongo transaction contracts serially
        run: >-
          python -m pytest
          tests/mongo_replica/test_accounting_ledger_v2_mongo_replica.py
          -m mongo_replica
          -q --tb=short
      - name: Capture MongoDB logs
        if: always()
        working-directory: .
        run: docker logs accounting-mongo-rs

  frontend-contract:
    name: Accounting frontend contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Run focused accounting tests
        run: >-
          CI=true yarn test
          --watchAll=false
          --runInBand
          src/pages/accounting/accountingPages.test.js
          src/pages/accounting/LegacyOpeningEntrypoints.test.js
          src/pages/accounting/AccountingSettlements.test.jsx
          src/pages/accounting/AccountingSettlementRegister.test.jsx
          src/pages/accounting/AccountingCourierBankBindings.test.jsx
          src/components/OwnerOnlyRoute.test.jsx
          src/components/MezanV2NavigationShell.test.jsx
      - name: Build frontend
        run: CI=false yarn build
