name: Emkan provider statement evidence-only intake
on:
  pull_request:
    paths:
      - "backend/operational_provider_statement_intake.py"
      - "backend/operational_provider_statement_reconciliation.py"
      - "backend/operational_provider_statement_routes.py"
      - "backend/provider_statement_access.py"
      - "backend/operational_web_page_policy.py"
      - "backend/tests/test_operational_balance_statement_intake.py"
      - "frontend/src/pages/operational/ProviderStatements.jsx"
      - "frontend/src/pages/operational/providerStatementPresentation.js"
      - ".github/workflows/emkan-statement-evidence.yml"
permissions:
  contents: read
jobs:
  evidence-intake:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser test dependencies
        run: python -m pip install -q openpyxl pytest pytest-asyncio
      - name: Compile financial intake
        run: python -m py_compile operational_provider_statement_intake.py provider_statement_access.py operational_provider_statement_reconciliation.py operational_provider_statement_routes.py
      - name: Original providers and Emkan review-only evidence fixtures
        run: python -m pytest -q tests/test_operational_balance_statement_intake.py --tb=short
