name: Google store product observations
on:
  push:
    branches: [codex/google-store-observations-20261029]
  pull_request:
    branches: [hotfix/prod-snap-meta-final]
    paths:
      - backend/integrations_control_center/google_store_product_observations.py
      - backend/integrations_control_center/google_plan_store_observations.py
      - backend/integrations_control_center/google_order_*evidence.py
      - backend/integrations_control_center/google_order_source_binding.py
      - frontend/src/components/marketing/GoogleStoreProductObservations*
      - frontend/src/services/googleStoreProductObservations*
      - backend/integrations_control_center/google_ads_routes.py
      - backend/tests/test_google_store_product_observations*.py
      - backend/tests/test_google_plan_store_observations.py
      - backend/tests/test_google_order_timestamp_evidence.py
      - backend/tests/test_google_order_source_binding.py
      - .github/workflows/google-store-product-observations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1 cryptography==50.0.2
          python-multipart==0.0.32 PyJWT==2.15.1 bcrypt==4.1.3
          python-dotenv==1.2.4 pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable loopback replica
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name google-store-observation-rs -p 127.0.0.1:27475:27475 mongo:8.0.26 --port 27475 --replSet gStoreObservations --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-store-observation-rs mongosh --port 27475 --quiet --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-store-observation-rs mongosh --port 27475 --quiet --eval 'if(rs.initiate({_id:"gStoreObservations",members:[{_id:0,host:"127.0.0.1:27475"}]}).ok !== 1) quit(1)'
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec google-store-observation-rs mongosh --port 27475 --quiet --eval 'const h=db.hello(); if(h.setName !== "gStoreObservations" || h.isWritablePrimary !== true || !Number.isInteger(h.logicalSessionTimeoutMinutes)) quit(1)'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Test scoped product observations against replica
        env:
          GOOGLE_STORE_OBSERVATIONS_TEST_MONGO_URI: mongodb://127.0.0.1:27475/
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m pytest --noconftest -q --junitxml=store-observation-results.xml backend/tests/test_google_store_product_observations.py backend/tests/test_google_plan_store_observations.py backend/tests/test_google_store_product_observations_mongo.py backend/tests/test_google_order_timestamp_evidence.py backend/tests/test_google_order_source_binding.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases=ET.parse('store-observation-results.xml').getroot().findall('.//testcase')
          replica=[c for c in cases if c.attrib.get('classname','').endswith('test_google_store_product_observations_mongo')]
          assert len(cases) >= 89 and len(replica) == 13
          assert any(c.attrib.get('name') == 'test_real_leading_zero_alias_cannot_add_second_observation' for c in replica)
          assert sum(c.attrib.get('name','').startswith('test_real_refund_projection_rejects_known_or_ambiguous_refund') for c in replica) == 3
          assert sum(c.attrib.get('name','').startswith('test_real_malformed_refund_containers_cannot_disappear_into_eligible_projection') for c in replica) == 4
          assert not [c for c in cases if any(c.find(x) is not None for x in ('skipped','failure','error'))]
          print('Verified',len(cases),'tests including',len(replica),'real Mongo replica tests, zero skips')
          PY
      - name: Remove disposable replica
        if: always()
        run: docker rm -f google-store-observation-rs
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare governed toolchain
        run: python scripts/frontend_release_toolchain.py ensure
      - name: Frozen frontend install
        run: python scripts/frontend_release_toolchain.py exec -- yarn --cwd frontend install --frozen-lockfile --non-interactive
      - name: Test read-only owner observations
        env:
          CI: 'true'
        run: >-
          python scripts/frontend_release_toolchain.py exec --
          yarn --cwd frontend test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/GoogleStoreProductObservations.test.jsx
