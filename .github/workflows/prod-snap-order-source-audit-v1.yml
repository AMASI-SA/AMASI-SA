name: Production Snapchat Order Source Audit V1

on:
  pull_request:
    branches:
      - hotfix/prod-snap-meta-final
    paths:
      - "backend/integrations_control_center/snapchat_order_source_audit.py"
      - "backend/integrations_control_center/snapchat_native_tracking_routes.py"
      - "backend/tests/test_snapchat_order_source_audit_v1.py"
      - "frontend/src/components/marketing/SnapchatOrderSourceAudit.jsx"
      - "frontend/src/components/marketing/SnapchatOrderSourceAudit.test.jsx"
      - "frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx"
      - "frontend/src/pages/MarketingPlatformWorkspace.jsx"
      - "frontend/src/services/snapchatOrderSourceAudit.js"
      - ".github/workflows/prod-snap-order-source-audit-v1.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install -q
          fastapi==0.110.1 pydantic==2.13.4 pymongo==4.5.0
          httpx pytest pytest-asyncio openpyxl cryptography reportlab
          python-multipart bcrypt PyJWT
      - name: Compile audit modules
        run: >-
          python -m py_compile
          integrations_control_center/snapchat_order_source_audit.py
          integrations_control_center/snapchat_native_tracking_routes.py
          tests/test_snapchat_order_source_audit_v1.py
      - name: Test order-source audit
        run: >-
          python -m pytest
          tests/test_snapchat_order_source_audit_v1.py
          -q --tb=short
      - name: Enforce read-only attribution contract
        working-directory: .
        run: |
          AUDIT=backend/integrations_control_center/snapchat_order_source_audit.py
          ROUTES=backend/integrations_control_center/snapchat_native_tracking_routes.py
          grep -q 'non_campaign_distribution_allowed.*False' "$AUDIT"
          grep -q 'campaign_attribution_policy' "$AUDIT"
          grep -q 'order-source-audit' "$ROUTES"
          ! grep -Eq '(update_one|update_many|insert_one|delete_one|find_one_and_update)' "$AUDIT"
          ! grep -Eq 'httpx\.(post|put|patch|delete)' "$AUDIT" "$ROUTES"

  frontend-test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --non-interactive
      - name: Test source summary and audit dialog
        env:
          CI: "true"
        run: >-
          yarn test --watchAll=false --runInBand --runTestsByPath
          src/components/marketing/SnapchatOrderSourceAudit.test.jsx
          src/components/marketing/AdsEntityLevelWorkspace.test.jsx
      - name: Build Production frontend
        env:
          CI: "false"
        run: yarn build
      - name: Enforce native React audit controls
        working-directory: .
        run: |
          COMPONENT=frontend/src/components/marketing/SnapchatOrderSourceAudit.jsx
          WORKSPACE=frontend/src/components/marketing/AdsEntityLevelWorkspace.jsx
          PAGE=frontend/src/pages/MarketingPlatformWorkspace.jsx
          grep -q 'snapchat-order-source-summary' "$COMPONENT"
          grep -q 'snapchat-order-audit-dialog' "$COMPONENT"
          grep -q 'SnapchatOrderSourceAudit' "$WORKSPACE"
          grep -q 'auditAccountId={selectedAccountId}' "$PAGE"
          ! grep -Eq '(MutationObserver|querySelector|insertAdjacent|appendChild)' "$COMPONENT"
