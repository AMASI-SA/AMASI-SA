      - .github/workflows/google-ads-budget-guard-standing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replica-transactions:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      GOOGLE_ADS_TEST_MONGO_URI: mongodb://127.0.0.1:27472/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused production-compatible test dependencies
        run: >-
          python -m pip install fastapi==0.140.0 pydantic==2.13.4
          motor==3.7.1 pymongo==4.18.3 httpx==0.28.1
          python-multipart==0.0.32 cryptography==50.0.2
          PyJWT==2.15.1 bcrypt==4.1.3 python-dotenv==1.2.4
          pillow==12.3.0 openai==1.99.9 google-ads==33.0.0
          pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Start disposable loopback-only Mongo replica set
        shell: bash
        run: |
          set -euo pipefail
          uname -r
          docker run -d --name google-budget-guard-rs \
            -p 127.0.0.1:27472:27472 mongo:8.0.26 \
            --port 27472 --replSet gBudgetGuard --bind_ip_all --setParameter enableTestCommands=1
          ready=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-budget-guard-rs)" != true ]; then
              docker logs google-budget-guard-rs
              exit 1
            fi
            if docker exec google-budget-guard-rs mongosh --port 27472 --quiet \
              --eval 'if(db.adminCommand({ping:1}).ok !== 1) quit(1)'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec google-budget-guard-rs mongosh --port 27472 --quiet \
            --eval 'const result=rs.initiate({_id:"gBudgetGuard",members:[{_id:0,host:"127.0.0.1:27472"}]}); if(result.ok !== 1) quit(1)'
          primary=0
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' google-budget-guard-rs)" != true ]; then
              docker logs google-budget-guard-rs
              exit 1
            fi
            if docker exec google-budget-guard-rs mongosh --port 27472 --quiet \
              --eval 'const hello=db.hello(); if(hello.setName !== "gBudgetGuard" || hello.isWritablePrimary !== true || !Number.isInteger(hello.logicalSessionTimeoutMinutes)) quit(1)'; then
              primary=1
              break
            fi
            sleep 1
          done
          test "$primary" -eq 1
      - name: Prove policy races and uncertain commit holds on real transactions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/google-budget-guard-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/google-budget-guard-proof/source-sha.txt"
          python -m pytest --noconftest -p no:cacheprovider -q -s --durations=5 -W error --tb=short \
            backend/tests/test_google_ads_funded_creation_grants.py \
            backend/tests/test_google_ads_funded_creation_authority.py \
            backend/tests/test_google_ads_funded_storage_mongo.py \
            backend/tests/test_google_ads_automation_authority_mongo.py \
            backend/tests/test_google_ads_budget_guard_lifecycle.py \
            backend/tests/test_google_ads_budget_guard_lifecycle_mongo.py \
            backend/tests/test_google_ads_budget_guard_probe.py \
            backend/tests/test_google_ads_budget_guard_probe_mongo.py \
            backend/tests/test_google_ads_automation_budget_guard.py \
            backend/tests/test_google_ads_automation_budget_guard_mongo.py \
            backend/tests/test_google_ads_budget_guard_standing.py \
            backend/tests/test_google_ads_guard_integration.py \
            backend/tests/test_google_ads_guard_integration_mongo.py \
            backend/tests/test_google_ads_legacy_budget_settlement.py \
            backend/tests/test_google_ads_legacy_budget_settlement_mongo.py \
            backend/tests/test_google_ads_standing_dispatch_floor.py \
            backend/tests/test_google_ads_standing_dispatch_floor_mongo.py \
            backend/tests/test_google_ads_paused_dispatch_floor.py \
            backend/tests/test_google_ads_paused_dispatch_floor_mongo.py \
            backend/tests/test_google_ads_paused_creation_budget_mongo.py \
            --junitxml="$RUNNER_TEMP/google-budget-guard-proof/junit.xml"
      - name: Reject missing tests, skips, or partial transaction evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          output = Path(os.environ['RUNNER_TEMP']) / 'google-budget-guard-proof'
          root = ET.parse(output / 'junit.xml').getroot()
          cases = list(root.iter('testcase'))
          mongo = [case for case in cases if case.get('classname', '').endswith(('test_google_ads_automation_budget_guard_mongo', 'test_google_ads_guard_integration_mongo', 'test_google_ads_legacy_budget_settlement_mongo', 'test_google_ads_budget_guard_probe_mongo', 'test_google_ads_budget_guard_lifecycle_mongo', 'test_google_ads_automation_authority_mongo', 'test_google_ads_paused_creation_budget_mongo', 'test_google_ads_paused_dispatch_floor_mongo', 'test_google_ads_standing_dispatch_floor_mongo'))]
          errors = [case for case in cases if any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped'))]
          proof = {'tests': len(cases), 'replica_mongo_tests': len(mongo), 'failures_errors_or_skips': len(errors),
                   'source_sha': (output / 'source-sha.txt').read_text().strip(),
                   'provider_calls': 0, 'runtime_enabled_by_workflow': False}
          (output / 'summary.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof, indent=2))
          assert len(cases) >= 175
          assert len(mongo) == 53
          funded = [case for case in cases if case.get('classname','').endswith(('test_google_ads_funded_creation_grants','test_google_ads_funded_creation_authority'))]
          funded_mongo = [case for case in cases if case.get('classname','').endswith('test_google_ads_funded_storage_mongo')]
          assert len(funded) == 42
          assert len(funded_mongo) == 14
          print(json.dumps({'new_funded_units':len(funded),'new_actual_mongo':len(funded_mongo)}))
          assert not errors, 'Any failure, error or skipped test invalidates transaction evidence'
          PY
      - name: Preserve bounded Mongo diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/google-budget-guard-proof"
          docker logs --tail 150 google-budget-guard-rs > "$RUNNER_TEMP/google-budget-guard-proof/mongo.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-budget-guard-replica-proof
          path: ${{ runner.temp }}/google-budget-guard-proof
          if-no-files-found: error
      - name: Remove disposable replica container
        if: always()
        run: docker rm -f google-budget-guard-rs
